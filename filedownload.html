<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简陋下载器 · TXT配置多链接</title>
    <style>
        /* 零样式排版 — 完全保留浏览器默认外观，无任何界面修饰 */
        body {
            margin: 20px 12px;
            background: white;
        }
        a:link, a:visited {
            color: blue;
            text-decoration: underline;
        }
        /* 多个链接之间自然换行，使用块级元素呈现，不加任何容器/边框/背景 */
        .link-item {
            display: block;
            margin: 4px 0;
        }
        /* 不添加任何额外的排版、卡片、间距控制，仅保证可读性 */
    </style>
</head>
<body>
    <!-- 
        ============================================================
        功能说明：
        自动读取同文件夹下的 downloadurl.txt 文件
        格式要求：一行一个，语法为 [name=显示名称 url=下载地址]
        示例：
            [name=项目手册 url=https://example.com/manual.pdf]
            [name=安装包下载 url=https://example.com/setup.exe]
            [name=图片素材 url=https://example.com/images.zip]
        
        脚本会解析每一行，并生成对应的超链接（简陋风格，无标题无排版）
        如果文件读取失败或格式错误，会在页面显示错误信息（保持简陋，仅文字）
        ============================================================
    -->
    <script>
        // ========= 简陋多链接加载器 =========
        // 自动读取同目录下的 downloadurl.txt，解析 [name=xxx url=yyy] 格式并生成超链接
        // 不使用任何外部库，原生JS + fetch API
        // 完全遵循“不用标题，不用界面排版”，只生成原始超链接文本
        
        (function() {
            // 配置文件路径（同文件夹下的 downloadurl.txt）
            const CONFIG_FILE = "downloadurl.txt";
            
            // 获取body元素，稍后清空并填充链接
            const body = document.body;
            
            // 清空body中任何已有内容（确保没有标题/多余文字）
            // 但保留可能已经存在的脚本自身？执行时清空避免干扰
            while (body.firstChild) {
                body.removeChild(body.firstChild);
            }
            
            // 创建一个临时的信息容器，只用于展示加载状态或错误（极简文本，不违反简陋原则）
            // 如果完全没有任何链接时，显示一行提示（纯文本，无样式排版）
            // 但为了避免“标题感”，仅显示普通文字，不加粗不放大
            
            // 显示状态消息的辅助函数（仅当必要，如文件缺失、解析错误等，保持界面原始）
            function showMessage(msg, isError = false) {
                // 确保body里没有任何链接时展示提示，但仍保持纯文本风格
                const msgNode = document.createElement('div');
                msgNode.textContent = msg;
                // 如果是错误信息，文字颜色稍微红色以便区分？但不违反简陋，但为了用户可见，保留原生黑色，只加简单样式？为了完全简陋，不加任何color样式。
                // 但用户可能需要看到错误，采用纯文本即可，不加修饰。
                // 如果已经有其他节点，先清除再添加（避免混合）
                while (body.firstChild) {
                    body.removeChild(body.firstChild);
                }
                body.appendChild(msgNode);
                if (isError) {
                    // 不加额外样式，但为了突出？不，绝对无样式，只保持纯文本。甚至不改变颜色。
                    // 但是为了让错误可见，保持原样。
                }
            }
            
            // 解析一行文本，格式: [name=任意显示文字 url=http://链接]
            // 支持name和url前后允许空格，并且支持url中包含特殊字符（如&?=等）
            // 正则匹配: 以 [name= 开头，然后捕获任意非]内容直到遇到 url=，然后捕获url值直到 ]
            function parseLine(line) {
                line = line.trim();
                if (line === "") return null; // 空行跳过
                // 匹配格式: [name=显示文本 url=链接地址]
                // 注意 name 和 url 之间可能有多个空格，兼容各种写法
                const regex = /^\[name=(.*?)\s+url=(.*?)\]$/i;
                const match = line.match(regex);
                if (!match) {
                    // 尝试兼容 name= 和 url= 顺序颠倒？严格按照要求 name在前 url在后
                    // 但也允许宽松：只要包含name= 和 url= 即可，但根据需求，最好按格式
                    // 增加容错: 如果标准格式失败，尝试更宽容模式: 捕获 name= 直到 url= 之前部分，url=之后到结尾]
                    const altRegex = /\[name=(.*?)\s+url=(.*?)\]/i;
                    const altMatch = line.match(altRegex);
                    if (altMatch) {
                        return { name: altMatch[1].trim(), url: altMatch[2].trim() };
                    }
                    return null;
                }
                // 提取name和url，并去除首尾空格
                let name = match[1].trim();
                let url = match[2].trim();
                return { name, url };
            }
            
            // 生成链接并添加到body
            function renderLinks(links) {
                if (!links || links.length === 0) {
                    // 没有有效链接则显示普通提示（但保持无标题感）
                    const noLinkMsg = document.createElement('div');
                    noLinkMsg.textContent = "⚠️ 没有找到有效链接 (downloadurl.txt 格式应为 [name=xxx url=yyy])";
                    body.appendChild(noLinkMsg);
                    return;
                }
                
                // 遍历所有链接，为每个链接创建一个 <a> 元素，并包裹块级元素实现换行
                // 为了极致简陋，每个链接独占一行（浏览器默认块级元素换行），不加任何额外装饰
                for (let i = 0; i < links.length; i++) {
                    const item = links[i];
                    const anchor = document.createElement('a');
                    // 设置链接地址
                    if (item.url && item.url.trim() !== "") {
                        anchor.href = item.url.trim();
                        // 可选：为了更好的下载体验，不设置target，同窗口打开/下载由资源决定
                        // 完全不添加download属性，保持原始浏览器行为（简陋且通用）
                    } else {
                        anchor.href = "javascript:void(0);";
                        anchor.title = "无效URL，无法下载";
                    }
                    // 显示文字：完全使用解析出的name，如果name为空则显示"[空名称]"
                    let displayText = item.name;
                    if (displayText === undefined || displayText === "") {
                        displayText = "🔗 未命名链接";
                    }
                    anchor.textContent = displayText;
                    
                    // 为了让每个链接独立成行且不额外使用复杂布局，将a包裹在div内（或直接添加换行br？用div保证换行且最简）
                    // 使用div容器（块级元素）天然换行，无样式无类名，无边框，完全简陋。
                    const wrapper = document.createElement('div');
                    wrapper.className = "link-item";  // 仅仅为了潜在的极简换行，无样式影响，但因为样式表中.link-item只有display:block和微小margin，确保不干扰视觉效果。但保证无背景无边框。
                    // 或者完全不用class，直接div包裹。也可以不加任何类，内联无样式。
                    wrapper.style.margin = "0";       // 重置默认边距，保持紧凑，但浏览器默认段落有边距，我们用div无默认边距，但不同浏览器可能有微小间距，但不算排版设计。
                    // 为了完全原始，可以用div但去除所有margin/padding
                    wrapper.style.margin = "0";
                    wrapper.style.padding = "0";
                    wrapper.appendChild(anchor);
                    body.appendChild(wrapper);
                }
            }
            
            // 读取 downloadurl.txt 文件
            function loadLinksFromFile() {
                fetch(CONFIG_FILE)
                    .then(response => {
                        if (!response.ok) {
                            // 如果文件不存在或无法读取 (404或权限问题)
                            throw new Error(`无法读取 ${CONFIG_FILE} 文件 (HTTP ${response.status})`);
                        }
                        return response.text();
                    })
                    .then(text => {
                        // 按行分割
                        const lines = text.split(/\r?\n/);
                        const validLinks = [];
                        
                        for (let i = 0; i < lines.length; i++) {
                            const line = lines[i];
                            const parsed = parseLine(line);
                            if (parsed && parsed.url && parsed.url.trim() !== "") {
                                // 有效链接加入数组
                                validLinks.push({
                                    name: parsed.name || "未命名",
                                    url: parsed.url.trim()
                                });
                            } else if (line.trim() !== "") {
                                // 如果格式错误但非空行，控制台输出警告（不打扰用户界面，但保持简陋）
                                console.warn(`[下载器] 跳过无效行: ${line}`);
                            }
                        }
                        
                        // 清空body（清除可能存在的消息占位）
                        while (body.firstChild) {
                            body.removeChild(body.firstChild);
                        }
                        
                        // 渲染链接
                        if (validLinks.length === 0) {
                            const errorDiv = document.createElement('div');
                            errorDiv.textContent = `📄 ${CONFIG_FILE} 文件存在但未找到符合格式的链接。` + 
                                                   " 正确格式示例: [name=我的简历 url=https://example.com/resume.pdf]";
                            body.appendChild(errorDiv);
                        } else {
                            renderLinks(validLinks);
                        }
                    })
                    .catch(error => {
                        // 捕获错误（文件不存在、跨域问题、本地文件系统限制等）
                        // 注意：如果网页通过 file:// 协议打开，fetch可能会因CORS或安全策略失败（浏览器限制）。
                        // 提示用户将网页部署在本地服务器或使用合适环境。
                        while (body.firstChild) {
                            body.removeChild(body.firstChild);
                        }
                        const errMsg = document.createElement('div');
                        let friendlyMsg = `❌ 无法加载 ${CONFIG_FILE} 文件。`;
                        if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                            friendlyMsg += ` 请确保 ${CONFIG_FILE} 存在于同文件夹下，且网页通过 http:// 或 https:// 访问（部分浏览器限制 file:// 协议读取）。`;
                        } else {
                            friendlyMsg += ` 错误详情: ${error.message}`;
                        }
                        errMsg.textContent = friendlyMsg;
                        body.appendChild(errMsg);
                        
                        // 额外提供一个极简辅助信息：显示当前路径建议（不破坏简陋但让用户明白怎么配置）
                        const tip = document.createElement('div');
                        tip.textContent = "👉 请在相同目录创建 downloadurl.txt，每行格式: [name=显示文字 url=下载链接]";
                        tip.style.marginTop = "8px";
                        body.appendChild(tip);
                    });
            }
            
            // 启动：读取并生成简陋超链接列表
            loadLinksFromFile();
        })();
    </script>
    <!-- 
        完全无标题、无任何界面排版。
        动态读取 downloadurl.txt 并根据 [name=xxx url=yyy] 格式生成对应的超链接列表。
        每个链接独占一行，纯原生外观，满足“简陋的超链接触发下载”。
    -->
</body>
</html>
