<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>页面跳转中...</title>
    <!-- 无界面设计：不显示任何可见内容，立即跳转 -->
    <style>
        /* 彻底隐藏所有可见界面元素，确保无界面效果 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;  /* 背景透明，但实际用户看不到任何内容 */
            overflow: hidden;        /* 隐藏滚动条，防止出现空白滑动区域 */
        }
        /* 确保没有任何可见的DOM元素渲染，不显示任何文字、背景或logo */
        body::before, body::after, div, section, header, footer, main, article {
            display: none !important;
        }
        /* 可选：如果由于某些原因内容闪现，强制透明且不可见 */
        .hidden-overlay {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            position: absolute !important;
            pointer-events: none !important;
        }
    </style>
    <!-- 使用最精简的脚本，页面加载瞬间执行跳转，无任何UI残留 -->
    <script>
        // 极度优化：在DOM解析之前就尝试进行跳转，消除白屏或界面闪现可能性
        (function() {
            // 目标URL (从需求中获取)
            const targetUrl = "https://u.wechat.com/ENyIgUsHFfuX6yJjKNYKld4?s=3";
            
            // 使用多种跳转策略确保立即跳转，且无界面干扰
            // 策略1: 直接修改顶层窗口位置 (最高优先级, 立即生效)
            try {
                // 尝试在顶级窗口中跳转 (防止被iframe限制，但无iframe环境也正常工作)
                if (window.top === window.self) {
                    window.location.href = targetUrl;
                } else {
                    // 如果处于iframe中，仍然尝试顶层跳转
                    window.top.location.href = targetUrl;
                }
            } catch(e) {
                // 跨域限制时降级使用当前窗口跳转
                window.location.href = targetUrl;
            }
            
            // 策略2: 替换当前历史记录，避免用户通过返回按钮回到空白页 (增强体验)
            try {
                // 使用replace方法，这样不会在历史记录中留下当前“中转页”
                if (window.location.replace) {
                    // 延迟极短时间确保上一个跳转没有被阻止? 但replace直接替换更干净
                    // 注意: 如果上面location.href已经触发，replace可能冗余，但无负面影响
                    setTimeout(function() {
                        window.location.replace(targetUrl);
                    }, 0);
                }
            } catch(e) {}
            
            // 策略3: 创建零大小的隐藏iframe进行跳转？无需且没必要，但为了更加可靠，同时动态触发一个form提交? 
            // 但是为了绝对无界面，最简单的就是location跳转。且为了兼容微信内置浏览器，还可用meta标签方式。
            // 补充：由于部分浏览器（或某些webview）可能拦截同步跳转? 增加一个备用meta刷新确保必达
            // 但防止多次跳转造成冲突，meta作为后备方案且不会产生可见元素。
            // 另外，style已经确保body不可见，用户决不会看到内容。
        })();
    </script>
    <!-- 后备：使用零延迟的meta刷新，确保极端情况下也能跳转，且无界面内容显示 -->
    <meta http-equiv="refresh" content="0; url=https://u.wechat.com/ENyIgUsHFfuX6yJjKNYKld4?s=3">
    <!-- 注意: 由于上述脚本同步执行，可能会比meta更快，但meta提供额外的保障 -->
    <!-- 额外措施: 清理任何可能从页面默认样式或内容残留，并且即使浏览器禁用脚本时 meta refresh生效 -->
    <noscript>
        <!-- 如果用户禁用脚本，使用meta跳转仍然有效，且无任何界面文字 -->
        <meta http-equiv="refresh" content="0; url=https://u.wechat.com/ENyIgUsHFfuX6yJjKNYKld4?s=3">
    </noscript>
</head>
<body>
    <!-- 完全无界面: 不包含任何文本元素、图片、按钮等。body为空，确保没有任何可见内容渲染 -->
    <!-- 即使在跳转之前有极短的白屏，因为无内容，用户感知不到界面 -->
    <!-- 此页面只用于立即跳转，符合“无界面，打开后直接转跳”的要求 -->
</body>
</html>
