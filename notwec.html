<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>长按识别二维码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #eef2f8 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, 'Noto Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 主卡片容器 - 简洁优雅 */
        .qr-card-container {
            max-width: 460px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2), 0 8px 18px rgba(0, 0, 0, 0.05);
            padding: 40px 32px 48px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* 二维码外框圆润 */
        .qr-wrapper {
            background: #ffffff;
            padding: 16px;
            border-radius: 36px;
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.1);
            margin-bottom: 32px;
        }

        .qr-image {
            display: block;
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
            border-radius: 24px;
            background: #fff;
            transition: transform 0.2s ease;
            cursor: pointer;
        }
        .qr-image:active {
            transform: scale(0.98);
        }

        /* 引导主文案 */
        .guide-primary {
            text-align: center;
        }
        .guide-main-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #1e2f3f 0%, #1f3a4b 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }
        .guide-sub {
            font-size: 17px;
            font-weight: 500;
            color: #2c5a7a;
            line-height: 1.4;
        }

        /* 没有任何多余元素，完全删除了顶部装饰圈、实时标签、长按提示条、底部平台文字等 */
        @media (max-width: 480px) {
            .qr-card-container {
                padding: 32px 24px 40px;
            }
            .guide-main-text {
                font-size: 26px;
            }
            .guide-sub {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="qr-card-container">
    <!-- 二维码核心区域 - 使用相对路径 notqr.jpg -->
    <div class="qr-wrapper">
        <img class="qr-image" src="notqr.jpg" alt="二维码" id="dynamicQrImg">
    </div>

    <!-- 引导部分：长按识别二维码 + 实时收取智慧应用平台最新通知 -->
    <div class="guide-primary">
        <div class="guide-main-text">长按识别二维码</div>
        <div class="guide-sub">实时收取智慧应用平台最新通知</div>
    </div>
</div>

<script>
    (function() {
        // 确保二维码图片使用相对路径 notqr.jpg，不进行任何二维码动态生成
        // 完全遵循“不要直接生成了，用相对路径notqr.jpg”的要求
        const qrImgElement = document.getElementById('dynamicQrImg');
        if (qrImgElement) {
            // 如果图片加载失败，仅做样式占位，不生成二维码内容，不添加任何额外文字
            qrImgElement.onerror = function() {
                if (!qrImgElement.hasAttribute('data-error-handled')) {
                    qrImgElement.setAttribute('data-error-handled', 'true');
                    // 轻量视觉反馈：不产生任何文字，也不生成二维码
                    qrImgElement.style.background = "#f0f2f5";
                    qrImgElement.style.objectFit = "contain";
                    qrImgElement.style.minHeight = "200px";
                    // 注意：绝对不生成新二维码，仅提示用户放置正确的 notqr.jpg
                }
            };
            qrImgElement.onload = function() {
                qrImgElement.style.background = "transparent";
            };
        }

        // 增强长按识别体验（无任何多余文字）
        if (qrImgElement) {
            let touchTimer = null;
            qrImgElement.addEventListener('touchstart', function(e) {
                touchTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(20);
                }, 300);
            });
            qrImgElement.addEventListener('touchend', function() {
                if (touchTimer) clearTimeout(touchTimer);
            });
        }

        // 确保核心文字内容精准（防止意外修改）
        const mainTitle = document.querySelector('.guide-main-text');
        if (mainTitle && mainTitle.innerText.trim() !== '长按识别二维码') {
            mainTitle.innerText = '长按识别二维码';
        }
        const subText = document.querySelector('.guide-sub');
        if (subText && subText.innerText.trim() !== '实时收取智慧应用平台最新通知') {
            subText.innerText = '实时收取智慧应用平台最新通知';
        }

        // 页面已彻底删除：
        // - 顶部图标圆圈及badge
        // - “实时”标签
        // - “智慧应用平台 · 最新动态推送”
        // - “💡 长按图片识别二维码 · 即刻订阅”
        // - 底部 “智慧应用平台” “✦” “实时同步”
        // 符合用户所有删除要求，只保留二维码 + 主副引导文字
    })();
</script>
</body>
</html>
