    <script>
        // ========== 订阅通知弹窗 ==========
        function checkAndShowSubscribeModal() {
            const noRemind = localStorage.getItem('subscribe_no_remind');
            if (noRemind === 'true') return;
            const modal = document.getElementById('subscribeModal');
            if (!modal) return;
            const subscribeBtn = document.getElementById('subscribeBtn');
            const cancelBtn = document.getElementById('cancelSubscribeBtn');
            const noRemindContainer = document.getElementById('noRemindContainer');
            const noRemindCheckbox = document.getElementById('noRemindCheckbox');
            if (noRemindCheckbox) noRemindCheckbox.checked = false;
            if (localStorage.getItem('has_clicked_subscribe') === 'true') {
                if (noRemindContainer) noRemindContainer.style.display = 'block';
            } else {
                if (noRemindContainer) noRemindContainer.style.display = 'none';
            }
            setTimeout(() => modal.classList.add('show'), 500);
            subscribeBtn.onclick = () => { localStorage.setItem('has_clicked_subscribe', 'true'); window.location.href = 'notwec'; };
            cancelBtn.onclick = () => modal.classList.remove('show');
            modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('show'); };
            if (noRemindCheckbox) {
                noRemindCheckbox.onchange = (e) => {
                    if (e.target.checked) localStorage.setItem('subscribe_no_remind', 'true');
                    else localStorage.removeItem('subscribe_no_remind');
                };
            }
        }

        // ========== 设备兼容性检测 ==========
        (function() {
            const ua = navigator.userAgent;
            const isIOS = /iPhone|iPad|iPod/i.test(ua);
            const isMac = /Macintosh/i.test(ua) && !isIOS;
            const modal = document.getElementById('deviceWarningModal');
            const icon = document.getElementById('deviceWarningIcon');
            const msg = document.getElementById('deviceWarningMessage');
            const closeBtn = document.getElementById('deviceWarningCloseBtn');
            let wm = null;
            if (isIOS) { wm = '当前设备访问本平台可能出现问题，建议更换安卓或鸿蒙设备访问'; icon.textContent = '⚠️'; }
            else if (isMac) { wm = '当前设备访问本平台可能出现问题，建议更换Windows或Linux设备访问'; icon.textContent = '⚠️'; }
            if (wm && modal && msg) {
                msg.textContent = wm; modal.classList.add('show');
                closeBtn.addEventListener('click', () => modal.classList.remove('show'));
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
            }
        })();

        // ========== 配置 ==========
        const CONFIG_URL = 'https://cdn.jsdelivr.net/gh/bloxorz671/createsoft@main/5app.txt';
        const GITHUB_OWNER = 'bloxorz671';
        const GITHUB_REPO = 'createsoft';
        const GITHUB_PATH = '5app.txt';
        const NAME_FILE_URL = 'https://luckynum.top/5name.txt';
        const INTEGRAL_FILE_URL = 'https://cdn.jsdelivr.net/gh/bloxorz671/5class-system@main/student-integral.txt';
        const JFFI_FILE_URL = 'https://cdn.jsdelivr.net/gh/bloxorz671/5class-system@main/jffi.txt';

        const TARGET_UA = 'ClassApp/1.0 (Grade8Class5)';
        const isTargetDevice = navigator.userAgent === TARGET_UA;

        let slidesData = [], appItems = [], groupOrder = ['其他应用'];
        let currentIndex = 0, autoInterval = null, totalSlides = 0;
        let isEditMode = false, currentToken = null, fileSha = null;
        let currentStudentId = null;
        let nameMapping = {}, integralMapping = {};
        let isAddingApp = false, isAddingCarousel = false;
        let scanCodeReader = null, scanningActive = false, lastScanTime = 0;
        const SCAN_COOLDOWN = 1000;
        let defaultCameraId = null;
        let draggedGroupIndex = null, draggedAppData = null;
        let cachedFileList = null, fileListLoading = false;

        const RATING_CONFIG = [
            { min: 12, max: Infinity, name: '夯爆了', colorClass: 'level-0' },
            { min: 9, max: 11, name: '顶级', colorClass: 'level-1' },
            { min: 5, max: 8, name: '人上人', colorClass: 'level-2' },
            { min: 1, max: 4, name: 'Npc', colorClass: 'level-3' },
            { min: -Infinity, max: 0, name: '拉完了', colorClass: 'level-4' }
        ];

        function getRatingByIntegral(integral) {
            const score = parseInt(integral);
            if (isNaN(score)) return RATING_CONFIG[4];
            for (let c of RATING_CONFIG) if (score >= c.min && score <= c.max) return c;
            return RATING_CONFIG[4];
        }

        function saveStudentId(id) {
            if (!id) return;
            try { localStorage.setItem('studentId', id); } catch(e) {}
            try { sessionStorage.setItem('studentId', id); } catch(e) {}
            try { document.cookie = `studentId=${id}; path=/; max-age=${7*24*60*60}`; } catch(e) {}
        }

        function getStudentId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get('p');
            if (id && /^\d{5}$/.test(id)) { saveStudentId(id); return id; }
            try { id = localStorage.getItem('studentId'); if (id && /^\d{5}$/.test(id)) return id; } catch(e) {}
            try { id = sessionStorage.getItem('studentId'); if (id && /^\d{5}$/.test(id)) return id; } catch(e) {}
            try { const m = document.cookie.match(/studentId=([^;]+)/); if (m && /^\d{5}$/.test(m[1])) return m[1]; } catch(e) {}
            return null;
        }

        function clearStudentId() {
            try { localStorage.removeItem('studentId'); } catch(e) {}
            try { sessionStorage.removeItem('studentId'); } catch(e) {}
            try { document.cookie = 'studentId=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT'; } catch(e) {}
            currentStudentId = null;
        }

        function saveDefaultCamera(deviceId) { if(deviceId){ try{localStorage.setItem('scan_defaultCameraId',deviceId);}catch(e){} defaultCameraId=deviceId; } }
        function loadDefaultCamera() { try{defaultCameraId=localStorage.getItem('scan_defaultCameraId');}catch(e){} return defaultCameraId; }

        let audioContext = null;
        function playBeep() {
            try {
                if(!audioContext) audioContext = new (window.AudioContext||window.webkitAudioContext)();
                if(audioContext.state==='suspended') audioContext.resume().then(()=>playBeepSound());
                else playBeepSound();
            } catch(e){}
        }
        function playBeepSound() {
            try {
                const now=audioContext.currentTime;
                const osc=audioContext.createOscillator(), gain=audioContext.createGain();
                osc.connect(gain); gain.connect(audioContext.destination);
                osc.frequency.value=600; osc.type='square';
                gain.gain.setValueAtTime(0.4,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.12);
                osc.start(now); osc.stop(now+0.12);
            } catch(e){}
        }

        function extractLastFiveDigits(fullCode) {
            const nums=fullCode.match(/\d/g);
            if(nums&&nums.length>=5) return nums.slice(-5).join('');
            const last5=fullCode.slice(-5);
            if(/^\d{5}$/.test(last5)) return last5;
            return fullCode;
        }

        function onScanSuccess(fullCode) {
            const now=Date.now();
            if(now-lastScanTime<SCAN_COOLDOWN) return;
            lastScanTime=now;
            playBeep();
            const sid=extractLastFiveDigits(fullCode);
            if(/^\d{5}$/.test(sid)) {
                saveStudentId(sid);
                stopScanCamera();
                document.getElementById('scanModal').classList.remove('show');
                window.location.href=`?p=${sid}`;
            } else {
                document.getElementById('scanStatus').textContent='识别失败，请重试';
                setTimeout(()=>{const s=document.getElementById('scanStatus');if(s)s.textContent='扫描中...';},2000);
            }
        }

        async function startScanCamera() {
            if(!scanCodeReader){try{scanCodeReader=new ZXing.BrowserMultiFormatReader();}catch(e){document.getElementById('scanStatus').textContent='扫码库加载失败';return;}}
            if(document.getElementById('scanVideo').srcObject) try{stopScanCamera();}catch(e){}
            document.getElementById('scanStatus').textContent='获取摄像头列表...';
            scanningActive=true;
            try {
                let devices=[];
                try{devices=await scanCodeReader.listVideoInputDevices();}catch(e){const ts=await navigator.mediaDevices.getUserMedia({video:true});ts.getTracks().forEach(t=>t.stop());devices=await scanCodeReader.listVideoInputDevices();}
                if(devices.length===0) throw new Error('未找到摄像头');
                let selectedId=loadDefaultCamera();
                if(!selectedId||!devices.find(d=>d.deviceId===selectedId)){const bc=devices.find(d=>(d.label||'').toLowerCase().includes('back')||(d.label||'').toLowerCase().includes('rear')||(d.label||'').includes('后置')||(d.label||'').includes('environment'));selectedId=bc?bc.deviceId:devices[0].deviceId;saveDefaultCamera(selectedId);}
                const sel=devices.find(d=>d.deviceId===selectedId);
                document.getElementById('scanStatus').textContent=`使用: ${sel?.label?.slice(0,30)||'摄像头'}`;
                await scanCodeReader.decodeFromVideoDevice(selectedId,'scanVideo',(result,err)=>{if(result&&scanningActive)onScanSuccess(result.getText());if(err&&!(err instanceof ZXing.NotFoundException))console.warn(err);});
            } catch(err){document.getElementById('scanStatus').textContent='摄像头启动失败';console.error(err);}
        }

        function stopScanCamera() {
            scanningActive=false;
            if(scanCodeReader) try{scanCodeReader.reset();}catch(e){}
            const v=document.getElementById('scanVideo');
            if(v&&v.srcObject){try{const s=v.srcObject;if(s&&s.getTracks)s.getTracks().forEach(t=>t.stop());v.srcObject=null;}catch(e){}}
        }

        async function scanFromImage(file) {
            if(!file) return;
            document.getElementById('scanStatus').textContent='处理图片中...';
            try {
                if(scanCodeReader) try{scanCodeReader.reset();}catch(e){}
                const v=document.getElementById('scanVideo');
                if(v&&v.srcObject){const os=v.srcObject;if(os&&os.getTracks)os.getTracks().forEach(t=>t.stop());v.srcObject=null;}
                const img=new Image();
                const iurl=URL.createObjectURL(file);
                await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=iurl;});
                const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
                const ctx=c.getContext('2d');ctx.drawImage(img,0,0,img.width,img.height);
                URL.revokeObjectURL(iurl);
                v.srcObject=c.captureStream(30);await v.play();await new Promise(r=>setTimeout(r,200));
                document.getElementById('scanStatus').textContent='识别中...';
                let tr=null;
                try{tr=new ZXing.BrowserMultiFormatReader();}catch(e){document.getElementById('scanStatus').textContent='扫码库加载失败';alert('扫码库加载失败');startScanCamera();return;}
                const result=await tr.decodeFromVideoElement(v);
                if(result&&result.text){playBeep();const sid=extractLastFiveDigits(result.text);if(/^\d{5}$/.test(sid)){saveStudentId(sid);stopScanCamera();document.getElementById('scanModal').classList.remove('show');window.location.href=`?p=${sid}`;}else{document.getElementById('scanStatus').textContent='未识别到有效学号';alert(`识别到的内容不是5位数学号：${sid}`);startScanCamera();}}
                else {document.getElementById('scanStatus').textContent='未识别到二维码';alert('未识别到二维码');startScanCamera();}
            } catch(err){console.error(err);document.getElementById('scanStatus').textContent='识别失败';alert('识别失败');startScanCamera();}
        }

        function showScanModalFunc() { document.getElementById('scanModal').classList.add('show'); setTimeout(()=>startScanCamera(),100); }
        function closeScanModalFunc() { stopScanCamera(); document.getElementById('scanModal').classList.remove('show'); }

        function copyShareLink(appName) {
            let u=window.location.origin+window.location.pathname;
            if(appName) u+=`?app=${encodeURIComponent(appName)}`;
            navigator.clipboard.writeText(u).then(()=>{const t=document.createElement('div');t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:12px 24px;border-radius:30px;z-index:30000;font-size:14px;text-align:center;';t.textContent='✅ 网址已复制';document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}).catch(()=>alert('复制失败'));
        }

        function downloadFile(url, fileName) { const a=document.createElement('a');a.href=url;a.download=fileName.split('?')[0];a.target='_blank';a.click(); }

        // ========== 文档预览器 ==========
        function openDocumentViewer(url, fileName) {
            const overlay=document.createElement('div');overlay.className='doc-viewer-overlay';
            const ext=fileName.split('.').pop().toLowerCase();
            const supported=['pdf','docx','xlsx','txt'];
            const isSupported=supported.includes(ext);
            const header=document.createElement('div');header.className='doc-viewer-header';
            const titleDiv=document.createElement('div');titleDiv.className='doc-title';titleDiv.textContent=fileName;
            const actionsDiv=document.createElement('div');actionsDiv.className='doc-actions';
            const copyBtn=document.createElement('button');copyBtn.textContent='复制链接';copyBtn.onclick=()=>{navigator.clipboard.writeText(url).then(()=>{const t=document.createElement('div');t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:12px 24px;border-radius:30px;z-index:60000;font-size:14px;';t.textContent='✅ 链接已复制';document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}).catch(()=>alert('复制失败'));};
            const downloadBtn=document.createElement('button');downloadBtn.textContent='下载文件';downloadBtn.onclick=()=>downloadFile(url,fileName);
            const closeBtn=document.createElement('button');closeBtn.className='close-btn';closeBtn.textContent='关闭';closeBtn.onclick=()=>overlay.remove();
            actionsDiv.appendChild(copyBtn);actionsDiv.appendChild(downloadBtn);actionsDiv.appendChild(closeBtn);
            header.appendChild(titleDiv);header.appendChild(actionsDiv);overlay.appendChild(header);
            const body=document.createElement('div');body.className='doc-viewer-body';
            const contentDiv=document.createElement('div');contentDiv.className='doc-content';
            if(!isSupported) {
                contentDiv.innerHTML=`<div class="unsupported-content"><div class="icon">📄</div><p>该文件类型（.${ext}）不支持预览</p><button onclick="downloadFile('${escapeHtml(url)}','${escapeHtml(fileName)}')">📥 立即下载</button></div>`;
            } else {
                contentDiv.innerHTML='<div style="text-align:center;padding:40px;color:#666;">⏳ 加载文档中...</div>';
                fetch(url).then(r=>{if(!r.ok)throw new Error('网络请求失败');return r.blob();}).then(blob=>{
                    if(ext==='pdf') loadPDF(blob,contentDiv);
                    else if(ext==='docx') loadDOCX(blob,contentDiv);
                    else if(ext==='xlsx') loadXLSX(blob,contentDiv);
                    else if(ext==='txt') loadTXT(blob,contentDiv);
                }).catch(err=>{contentDiv.innerHTML=`<div class="unsupported-content"><div class="icon">❌</div><p>加载失败: ${escapeHtml(err.message)}</p><button onclick="downloadFile('${escapeHtml(url)}','${escapeHtml(fileName)}')">📥 立即下载</button></div>`;});
            }
            body.appendChild(contentDiv);overlay.appendChild(body);document.body.appendChild(overlay);
        }

        // ----- PDF 加载 -----
        function loadPDF(blob, container) {
            const reader=new FileReader();
            reader.onload=function(e){
                const data=new Uint8Array(e.target.result);
                const pdfjsLib=window.pdfjsLib;
                if(!pdfjsLib){container.innerHTML='<div class="unsupported-content"><div class="icon">❌</div><p>PDF.js 库未加载</p></div>';return;}
                pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
                let currentPage=1,pdfDoc=null;
                const renderPage=(pageNum)=>{pdfDoc.getPage(pageNum).then(page=>{const viewport=page.getViewport({scale:1.5});const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;canvas.style.width='100%';canvas.style.height='auto';const ctx=canvas.getContext('2d');page.render({canvasContext:ctx,viewport:viewport});container.innerHTML='';const controls=document.createElement('div');controls.className='pdf-controls';controls.innerHTML=`<button id="pdfPrevBtn">◀ 上一页</button><span id="pdfPageInfo">${pageNum} / ${pdfDoc.numPages}</span><button id="pdfNextBtn">下一页 ▶</button><span style="font-size:0.8rem;color:#999;margin-left:8px;">${pdfDoc.numPages} 页</span>`;container.appendChild(controls);container.appendChild(canvas);document.getElementById('pdfPrevBtn').onclick=()=>{if(currentPage>1){currentPage--;renderPage(currentPage);}};document.getElementById('pdfNextBtn').onclick=()=>{if(currentPage<pdfDoc.numPages){currentPage++;renderPage(currentPage);}};}).catch(()=>{container.innerHTML='<div class="unsupported-content"><div class="icon">❌</div><p>渲染页面失败</p></div>';});};
                pdfjsLib.getDocument({data:data}).promise.then(doc=>{pdfDoc=doc;renderPage(1);}).catch(err=>{container.innerHTML=`<div class="unsupported-content"><div class="icon">❌</div><p>PDF 加载失败: ${escapeHtml(err.message)}</p></div>`;});
            };
            reader.readAsArrayBuffer(blob);
        }

        // ----- DOCX 加载 -----
        function loadDOCX(blob, container) {
            const reader=new FileReader();
            reader.onload=function(e){if(typeof mammoth==='undefined'){container.innerHTML='<div class="unsupported-content"><div class="icon">❌</div><p>mammoth.js 库未加载</p></div>';return;}mammoth.convertToHtml({arrayBuffer:e.target.result}).then(result=>{container.innerHTML=result.value||'<p style="color:#999;">（文档内容为空）</p>';}).catch(err=>{container.innerHTML=`<div class="unsupported-content"><div class="icon">❌</div><p>DOCX 解析失败: ${escapeHtml(err.message)}</p></div>`;});};
            reader.readAsArrayBuffer(blob);
        }

        // ----- XLSX 加载（完整修改版 - 修复单元格尺寸和边框显示） -----
        function loadXLSX(blob, container) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                if (typeof XLSX === 'undefined') {
                    container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>XLSX 库未加载</p></div>';
                    return;
                }
                try {
                    // 使用更完整的选项读取，包含单元格样式、日期、数字格式、空单元格存根
                    const workbook = XLSX.read(data, { 
                        type: 'array',
                        cellStyles: true,
                        cellDates: true,
                        cellNF: true,
                        sheetStubs: true  // 关键：保留空单元格的占位符
                    });
                    
                    // 创建缩放控制栏
                    const zoomControls = document.createElement('div');
                    zoomControls.className = 'xlsx-zoom-controls';
                    zoomControls.innerHTML = `
                        <button id="xlsxZoomOut" class="xlsx-zoom-btn">−</button>
                        <span id="xlsxZoomLevel" style="margin: 0 8px; font-size: 0.9rem; color: #666;">100%</span>
                        <button id="xlsxZoomIn" class="xlsx-zoom-btn">+</button>
                        <button id="xlsxZoomReset" class="xlsx-zoom-btn" style="margin-left: 8px; width: auto; padding: 0 12px; border-radius: 16px;">⟳ 重置</button>
                    `;
                    
                    // 创建表格容器
                    const tableWrapper = document.createElement('div');
                    tableWrapper.className = 'xlsx-table-wrapper';
                    
                    let currentZoom = 1;
                    let allTablesHtml = '';
                    
                    workbook.SheetNames.forEach(sheetName => {
                        const sheet = workbook.Sheets[sheetName];
                        if (!sheet || !sheet['!ref']) return;
                        
                        // 获取工作表范围
                        const range = XLSX.utils.decode_range(sheet['!ref']);
                        
                        // 获取合并单元格信息
                        const merges = sheet['!merges'] || [];
                        
                        // 获取列宽和行高信息
                        const colWidths = sheet['!cols'] || [];
                        const rowHeights = sheet['!rows'] || [];
                        
                        // 创建合并单元格映射
                        const mergeMap = {};
                        const mergeSpanMap = {};
                        merges.forEach(merge => {
                            const key = `${merge.s.r},${merge.s.c}`;
                            mergeSpanMap[key] = {
                                rowspan: merge.e.r - merge.s.r + 1,
                                colspan: merge.e.c - merge.s.c + 1
                            };
                            for (let r = merge.s.r; r <= merge.e.r; r++) {
                                for (let c = merge.s.c; c <= merge.e.c; c++) {
                                    if (r === merge.s.r && c === merge.s.c) continue;
                                    mergeMap[`${r},${c}`] = true;
                                }
                            }
                        });
                        
                        // 判断单元格是否有内容或边框（用于计算有效范围）
                        const cellHasContentOrBorder = (r, c) => {
                            const cellRef = XLSX.utils.encode_cell({ r, c });
                            const cell = sheet[cellRef];
                            if (!cell) return false;
                            // 有值
                            if (cell.v !== undefined && cell.v !== null && cell.v !== '') return true;
                            // 有边框
                            if (cell.s && cell.s.border) {
                                const border = cell.s.border;
                                if (border.top || border.bottom || border.left || border.right) return true;
                            }
                            return false;
                        };
                        
                        // 使用完整范围（包括空单元格），确保所有设置了边框的单元格都显示
                        const minRow = range.s.r;
                        const maxRow = range.e.r;
                        const minCol = range.s.c;
                        const maxCol = range.e.c;
                        
                        // 添加工作表标题
                        allTablesHtml += `<h4 style="margin:16px 0 8px 0;color:#1e3c72;padding:0 8px;">📊 ${escapeHtml(sheetName)}</h4>`;
                        allTablesHtml += '<div class="xlsx-table-container"><table class="xlsx-table">';
                        
                        // 生成列宽
                        let colgroup = '<colgroup>';
                        for (let c = minCol; c <= maxCol; c++) {
                            const colInfo = colWidths[c];
                            let width = 100; // 默认宽度
                            if (colInfo && colInfo.wpx) {
                                width = colInfo.wpx;
                            } else if (colInfo && colInfo.wch) {
                                // 字符宽度转换为像素（近似）
                                width = Math.max(colInfo.wch * 7.5, 40);
                            }
                            colgroup += `<col style="width:${Math.max(width, 40)}px;min-width:${Math.max(width, 40)}px;">`;
                        }
                        colgroup += '</colgroup>';
                        allTablesHtml += colgroup;
                        
                        // 生成表格内容
                        for (let r = minRow; r <= maxRow; r++) {
                            // 获取行高信息
                            const rowInfo = rowHeights[r];
                            let rowStyle = '';
                            if (rowInfo && rowInfo.hpx) {
                                rowStyle = ` style="height:${rowInfo.hpx}px;"`;
                            } else if (rowInfo && rowInfo.hpt) {
                                rowStyle = ` style="height:${rowInfo.hpt * 1.33}px;"`;
                            }
                            
                            allTablesHtml += `<tr${rowStyle}>`;
                            for (let c = minCol; c <= maxCol; c++) {
                                // 跳过被合并的单元格
                                if (mergeMap[`${r},${c}`]) continue;
                                
                                const cellRef = XLSX.utils.encode_cell({ r, c });
                                const cell = sheet[cellRef];
                                
                                // 获取合并信息
                                const mergeKey = `${r},${c}`;
                                const mergeInfo = mergeSpanMap[mergeKey] || { rowspan: 1, colspan: 1 };
                                
                                // 获取单元格值和样式
                                let cellValue = '';
                                let cellStyle = '';
                                let borderStyle = 'border:1px solid #d0d0d0;';
                                
                                if (cell) {
                                    // 获取值
                                    if (cell.t === 'n') {
                                        // 数字类型，检查日期格式
                                        if (cell.z && (cell.z.includes('yy') || cell.z.includes('dd') || cell.z.includes('mm') || cell.z.includes('YY') || cell.z.includes('DD') || cell.z.includes('MM'))) {
                                            try {
                                                const date = XLSX.SSF.parse_date_code(cell.v);
                                                if (date) {
                                                    cellValue = `${date.y}-${String(date.m).padStart(2,'0')}-${String(date.d).padStart(2,'0')}`;
                                                } else {
                                                    cellValue = cell.v;
                                                }
                                            } catch(ex) {
                                                cellValue = cell.v;
                                            }
                                        } else if (cell.z && cell.z.includes('%')) {
                                            cellValue = (cell.v * 100).toFixed(2) + '%';
                                        } else {
                                            // 保留数字格式
                                            if (cell.z && cell.z !== 'General') {
                                                try {
                                                    cellValue = XLSX.SSF.format(cell.z, cell.v);
                                                } catch(ex) {
                                                    cellValue = cell.v;
                                                }
                                            } else {
                                                cellValue = cell.v;
                                            }
                                        }
                                    } else if (cell.t === 's') {
                                        cellValue = cell.v || '';
                                    } else if (cell.t === 'b') {
                                        cellValue = cell.v ? 'TRUE' : 'FALSE';
                                    } else if (cell.t === 'd') {
                                        // 日期对象
                                        if (cell.v instanceof Date) {
                                            cellValue = cell.v.toLocaleDateString('zh-CN');
                                        } else {
                                            cellValue = cell.v;
                                        }
                                    } else {
                                        cellValue = cell.v !== undefined ? cell.v : '';
                                    }
                                    
                                    // 获取字体样式
                                    const styles = [];
                                    if (cell.s) {
                                        // 字体
                                        if (cell.s.font) {
                                            if (cell.s.font.bold) styles.push('font-weight:bold');
                                            if (cell.s.font.italic) styles.push('font-style:italic');
                                            if (cell.s.font.underline) styles.push('text-decoration:underline');
                                            if (cell.s.font.color && cell.s.font.color.rgb) {
                                                styles.push(`color:#${cell.s.font.color.rgb}`);
                                            }
                                            if (cell.s.font.sz) {
                                                styles.push(`font-size:${cell.s.font.sz}pt`);
                                            }
                                            if (cell.s.font.name) {
                                                styles.push(`font-family:"${cell.s.font.name}",sans-serif`);
                                            }
                                        }
                                        // 填充色
                                        if (cell.s.fill && cell.s.fill.fgColor && cell.s.fill.fgColor.rgb) {
                                            const rgb = cell.s.fill.fgColor.rgb;
                                            if (rgb !== '00000000' && rgb !== 'FFFFFF') {
                                                styles.push(`background-color:#${rgb}`);
                                            }
                                        }
                                        // 对齐
                                        if (cell.s.alignment) {
                                            if (cell.s.alignment.horizontal) {
                                                const hMap = { left: 'left', center: 'center', right: 'right', justify: 'justify' };
                                                styles.push(`text-align:${hMap[cell.s.alignment.horizontal] || 'left'}`);
                                            }
                                            if (cell.s.alignment.vertical) {
                                                const vMap = { top: 'top', center: 'middle', bottom: 'bottom' };
                                                styles.push(`vertical-align:${vMap[cell.s.alignment.vertical] || 'middle'}`);
                                            }
                                            if (cell.s.alignment.wrapText) {
                                                styles.push('white-space:normal;word-wrap:break-word;');
                                            }
                                        }
                                        // 边框 - 使用更精确的边框样式
                                        if (cell.s.border) {
                                            const border = cell.s.border;
                                            const bStyles = [];
                                            if (border.top && border.top.style) bStyles.push(`border-top:${border.top.style} solid #${border.top.color?.rgb || '000000'}`);
                                            if (border.bottom && border.bottom.style) bStyles.push(`border-bottom:${border.bottom.style} solid #${border.bottom.color?.rgb || '000000'}`);
                                            if (border.left && border.left.style) bStyles.push(`border-left:${border.left.style} solid #${border.left.color?.rgb || '000000'}`);
                                            if (border.right && border.right.style) bStyles.push(`border-right:${border.right.style} solid #${border.right.color?.rgb || '000000'}`);
                                            if (bStyles.length > 0) {
                                                borderStyle = bStyles.join(';') + ';';
                                            }
                                        }
                                    }
                                    
                                    if (styles.length > 0) {
                                        cellStyle = ` style="${styles.join(';')};${borderStyle}"`;
                                    } else {
                                        cellStyle = ` style="${borderStyle}"`;
                                    }
                                } else {
                                    // 空单元格也应用默认边框
                                    cellStyle = ` style="${borderStyle}"`;
                                }
                                
                                const rowspanAttr = mergeInfo.rowspan > 1 ? ` rowspan="${mergeInfo.rowspan}"` : '';
                                const colspanAttr = mergeInfo.colspan > 1 ? ` colspan="${mergeInfo.colspan}"` : '';
                                
                                allTablesHtml += `<td${rowspanAttr}${colspanAttr}${cellStyle}>${escapeHtml(String(cellValue))}</td>`;
                            }
                            allTablesHtml += '</tr>';
                        }
                        
                        allTablesHtml += '</table></div>';
                    });
                    
                    // 设置初始内容
                    tableWrapper.innerHTML = allTablesHtml || '<p style="text-align:center;color:#999;padding:40px;">（表格内容为空）</p>';
                    
                    // 缩放函数
                    const applyZoom = (zoom) => {
                        const containers = tableWrapper.querySelectorAll('.xlsx-table-container');
                        containers.forEach(cont => {
                            const table = cont.querySelector('.xlsx-table');
                            if (table) {
                                table.style.transform = `scale(${zoom})`;
                                table.style.transformOrigin = 'top left';
                                table.style.transition = 'transform 0.2s ease';
                            }
                        });
                        const levelEl = document.getElementById('xlsxZoomLevel');
                        if (levelEl) levelEl.textContent = Math.round(zoom * 100) + '%';
                        
                        // 调整容器高度以适应缩放后的表格
                        containers.forEach(cont => {
                            const table = cont.querySelector('.xlsx-table');
                            if (table) {
                                const originalHeight = table.getBoundingClientRect().height / (currentZoom || 1);
                                cont.style.minHeight = (originalHeight * zoom) + 'px';
                            }
                        });
                    };
                    
                    // 清空容器并重新组装
                    container.innerHTML = '';
                    container.appendChild(zoomControls);
                    container.appendChild(tableWrapper);
                    
                    // 绑定缩放按钮事件
                    document.getElementById('xlsxZoomIn').onclick = () => {
                        currentZoom = Math.min(currentZoom + 0.1, 3);
                        applyZoom(currentZoom);
                    };
                    document.getElementById('xlsxZoomOut').onclick = () => {
                        currentZoom = Math.max(currentZoom - 0.1, 0.3);
                        applyZoom(currentZoom);
                    };
                    document.getElementById('xlsxZoomReset').onclick = () => {
                        currentZoom = 1;
                        applyZoom(currentZoom);
                    };
                    
                    // 支持滚轮缩放（按住Ctrl键）
                    tableWrapper.addEventListener('wheel', (e) => {
                        if (e.ctrlKey) {
                            e.preventDefault();
                            if (e.deltaY < 0) {
                                currentZoom = Math.min(currentZoom + 0.05, 3);
                            } else {
                                currentZoom = Math.max(currentZoom - 0.05, 0.3);
                            }
                            applyZoom(currentZoom);
                        }
                    }, { passive: false });
                    
                    // 支持触摸缩放
                    let initialPinchDistance = 0;
                    let initialPinchZoom = 1;
                    
                    tableWrapper.addEventListener('touchstart', (e) => {
                        if (e.touches.length === 2) {
                            initialPinchDistance = Math.hypot(
                                e.touches[0].clientX - e.touches[1].clientX,
                                e.touches[0].clientY - e.touches[1].clientY
                            );
                            initialPinchZoom = currentZoom;
                        }
                    });
                    
                    tableWrapper.addEventListener('touchmove', (e) => {
                        if (e.touches.length === 2) {
                            const newDistance = Math.hypot(
                                e.touches[0].clientX - e.touches[1].clientX,
                                e.touches[0].clientY - e.touches[1].clientY
                            );
                            const scale = newDistance / initialPinchDistance;
                            currentZoom = Math.min(Math.max(initialPinchZoom * scale, 0.3), 3);
                            applyZoom(currentZoom);
                        }
                    });
                    
                } catch (err) {
                    container.innerHTML = `<div class="unsupported-content"><div class="icon">❌</div><p>XLSX 解析失败: ${escapeHtml(err.message)}</p></div>`;
                }
            };
            reader.readAsArrayBuffer(blob);
        }

        // ----- TXT 加载 -----
        function loadTXT(blob, container) {
            const reader = new FileReader();
            reader.onload = function(e) { container.innerHTML = `<div class="txt-content">${escapeHtml(e.target.result)}</div>`; };
            reader.readAsText(blob);
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

        // ========== 文件类型判断 ==========
        function getFileTypeFromUrl(url) {
            if (!url) return 'link';
            const fileName = url.split('/').pop().split('?')[0];
            const ext = fileName.split('.').pop().toLowerCase();
            if (['jpg','jpeg','png','gif','webp','bmp','svg','ico'].includes(ext)) return 'image';
            if (['mp4','webm','ogg','mov','avi','mkv'].includes(ext)) return 'video';
            if (['mp3','m4a','wav','flac','aac'].includes(ext)) return 'audio';
            if (['pdf','docx','xlsx','txt'].includes(ext)) return 'document';
            return 'unsupported';
        }

        function isFileUrl(url) {
            if (!url) return false;
            const fileName = url.split('/').pop().split('?')[0];
            const ext = fileName.split('.').pop().toLowerCase();
            const fileExts = ['jpg','jpeg','png','gif','webp','bmp','svg','ico','mp4','webm','ogg','mov','avi','mkv','mp3','m4a','wav','flac','aac','pdf','docx','xlsx','txt','apk','zip','rar','7z','exe','msi','dmg','pkg','iso','bin','dat','db','sqlite','log','ini','cfg','xml','json','yaml','yml','toml','csv','tsv','md','markdown','rst','tex','bib','sty','ppt','pptx','odt','ods','odp','rtf'];
            return fileExts.includes(ext);
        }

        async function fetchFileList() {
            if (cachedFileList) return cachedFileList;
            if (fileListLoading) { await new Promise(r => setTimeout(r, 500)); return cachedFileList; }
            fileListLoading = true;
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`);
                if (res.ok) { const items = await res.json(); cachedFileList = items.filter(i => i.type === 'file').map(i => i.name); }
                else { cachedFileList = []; }
            } catch(e) { cachedFileList = []; }
            fileListLoading = false;
            return cachedFileList;
        }

        function parseEpisodeInfo(fileName) {
            const match = fileName.match(/^(.+?)-(\d+)-(.+?)\.([^.]+)$/);
            if (match) return { seriesName: match[1], episode: parseInt(match[2]), episodeName: match[3], ext: match[4] };
            return null;
        }

        async function findSeriesFiles(currentFileName, allowedExts = ['mp3','m4a','wav','flac','aac','mp4','webm','ogg','mov','avi','mkv']) {
            const fileList = await fetchFileList();
            if (!fileList || fileList.length === 0) return [];
            let seriesName = null;
            const currentInfo = parseEpisodeInfo(currentFileName);
            if (currentInfo) { seriesName = currentInfo.seriesName; }
            else { seriesName = currentFileName.replace(/\.(mp3|m4a|wav|flac|aac|mp4|webm|ogg|mov|avi|mkv)$/i, ''); }
            if (!seriesName) return [{ fileName: currentFileName, episode: 0, displayName: currentFileName, url: `https://luckynum.top/${currentFileName}` }];
            const seriesFiles = [];
            for (const fn of fileList) {
                const info = parseEpisodeInfo(fn);
                if (info && info.seriesName === seriesName && allowedExts.includes(info.ext)) {

        }

        function createZoomableImage(url, fileName) {
            const container = document.createElement('div'); container.className = 'image-container';
            const img = document.createElement('img'); img.src = url; img.className = 'zoomable-image';
            img.style.transform = 'translate(0px, 0px) scale(1)'; container.appendChild(img);
            let scale = 1, translateX = 0, translateY = 0;
            const updateTransform = () => { img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; };
            const clampTranslate = () => { const rect = img.getBoundingClientRect(); const crect = container.getBoundingClientRect(); const maxX = Math.max(0, (rect.width * scale - crect.width) / 2); const maxY = Math.max(0, (rect.height * scale - crect.height) / 2); translateX = Math.min(maxX, Math.max(-maxX, translateX)); translateY = Math.min(maxY, Math.max(-maxY, translateY)); };
            const zoomIn = () => { scale = Math.min(scale + 0.25, 4); clampTranslate(); updateTransform(); };
            const zoomOut = () => { scale = Math.max(scale - 0.25, 1); if (scale === 1) { translateX = 0; translateY = 0; } else clampTranslate(); updateTransform(); };
            const resetZoom = () => { scale = 1; translateX = 0; translateY = 0; updateTransform(); };
            img.addEventListener('wheel', (e) => { e.preventDefault(); e.deltaY < 0 ? zoomIn() : zoomOut(); });
            let isDragging = false, dragStartX = 0, dragStartY = 0, startTranslateX = 0, startTranslateY = 0;
            img.addEventListener('mousedown', (e) => { if (scale > 1) { isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY; startTranslateX = translateX; startTranslateY = translateY; img.style.cursor = 'grabbing'; e.preventDefault(); } });
            document.addEventListener('mousemove', (e) => { if (isDragging && scale > 1) { translateX = startTranslateX + (e.clientX - dragStartX); translateY = startTranslateY + (e.clientY - dragStartY); clampTranslate(); updateTransform(); } });
            document.addEventListener('mouseup', () => { isDragging = false; if (scale > 1) img.style.cursor = 'grab'; });
            const getDistance = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
            let initialDistance = 0, initialScale = 1, lastTouchX = 0, lastTouchY = 0, isPanning = false;
            container.addEventListener('touchstart', (e) => { e.preventDefault(); const touches = Array.from(e.touches); if (touches.length === 1) { isPanning = true; lastTouchX = touches[0].clientX; lastTouchY = touches[0].clientY; } else if (touches.length === 2) { initialDistance = getDistance(touches); initialScale = scale; const c = { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 }; lastTouchX = c.x; lastTouchY = c.y; } });
            container.addEventListener('touchmove', (e) => { e.preventDefault(); const touches = Array.from(e.touches); if (touches.length === 1 && isPanning && scale > 1) { translateX += touches[0].clientX - lastTouchX; translateY += touches[0].clientY - lastTouchY; clampTranslate(); updateTransform(); lastTouchX = touches[0].clientX; lastTouchY = touches[0].clientY; } else if (touches.length === 2) { const nd = getDistance(touches); const ns = initialScale * (nd / initialDistance); scale = Math.min(Math.max(ns, 1), 4); if (scale === 1) { translateX = 0; translateY = 0; } else { const nc = { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 }; translateX += nc.x - lastTouchX; translateY += nc.y - lastTouchY; clampTranslate(); lastTouchX = nc.x; lastTouchY = nc.y; } updateTransform(); initialDistance = nd; initialScale = scale; } });
            container.addEventListener('touchend', () => { isPanning = false; });
            img.onerror = () => { container.innerHTML = `<div class="unsupported-view"><h2>🖼️ 图片加载失败</h2><button class="fallback-download">📥 立即下载</button></div>`; container.querySelector('.fallback-download').onclick = () => downloadFile(url, fileName); };
            return { container, zoomIn, zoomOut, resetZoom };
        }

        async function handleAppClick(link, name) {
            let fullUrl = link;

            if (isFileUrl(link)) {
                const fileName = link.split('/').pop().split('?')[0];
                const fileType = getFileTypeFromUrl(link);
                if (fileType === 'image') { openImageViewer(fullUrl, name); return; }
                if (fileType === 'video') { const sf = await findSeriesFiles(fileName, ['mp4','webm','ogg','mov','avi','mkv']); openVideoViewer(fullUrl, name, sf); return; }
                if (fileType === 'audio') { const sf = await findSeriesFiles(fileName, ['mp3','m4a','wav','flac','aac']); openAudioViewer(fullUrl, name, sf); return; }
                if (fileType === 'document') { openDocumentViewer(fullUrl, fileName); return; }
                showUnsupportedDialog(fullUrl, name); return;
            }
            window.open(fullUrl, '_blank');
        }

        async function handleUrlAppParameter() {
            const params = new URLSearchParams(window.location.search);
            let appParam = params.get('app');
            if (!appParam) return;
            try { appParam = decodeURIComponent(appParam); } catch(e) {}
            let rc = 0;
            while (appItems.length === 0 && rc < 30) { await new Promise(r => setTimeout(r, 200)); rc++; }
            let targetApp = appItems.find(a => a.name === appParam);
            if (!targetApp) targetApp = appItems.find(a => a.name.toLowerCase().includes(appParam.toLowerCase()));
            if (targetApp) { setTimeout(() => handleAppClick(targetApp.link, targetApp.name), 500); return; }
            if (isFileUrl(appParam)) {
                const ft = getFileTypeFromUrl(appParam);
                const fn = appParam.split('/').pop();
                let fu = appParam;
                if (!fu.startsWith('http')) fu = `https://luckynum.top/${fu}`;
                if (ft === 'image') { openImageViewer(fu, fn); return; }
                if (ft === 'video') { const sf = await findSeriesFiles(fn, ['mp4','webm','ogg','mov','avi','mkv']); openVideoViewer(fu, fn, sf); return; }
                if (ft === 'audio') { const sf = await findSeriesFiles(fn, ['mp3','m4a','wav','flac','aac']); openAudioViewer(fu, fn, sf); return; }
                if (ft === 'document') { openDocumentViewer(fu, fn); return; }
                showUnsupportedDialog(fu, fn); return;
            }
            alert(`❌ 应用/文件不存在或已被删除\n\n"${appParam}"`);
        }

        function parseAppTxt(raw) {
            const lines = raw.split(/\r?\n/);
            let mode = null;
            let groups = [], pics = [], apps = [];
            for (let line of lines) {
                line = line.trim();
                if (line === '') continue;
                if (line.toLowerCase() === 'group') { mode = 'group'; continue; }
                if (line.toLowerCase() === 'pic') { mode = 'pic'; continue; }
                if (line.toLowerCase() === 'app') { mode = 'app'; continue; }
                if (mode === 'group') { let m = line.match(/\[g=([^\]]+)\]/); if (m) groups.push(m[1].trim()); }
                else if (mode === 'pic') { let m = line.match(/\[p=([^\s\]]+)\s+l=([^\s\]]+)\]/); if (m) pics.push({ imgUrl: m[1].trim(), linkUrl: m[2].trim() }); }
                else if (mode === 'app') { let m = line.match(/\[n=([^\s\]]+)\s+p=([^\s\]]+)\s+l=([^\s\]]+)(?:\s+g=([^\s\]]+))?\]/); if (!m) m = line.match(/\[n=(.+?)\s+p=(.+?)\s+l=(.+?)(?:\s+g=(.+?))?\]/); if (m) apps.push({ name: m[1].trim(), icon: m[2].trim(), link: m[3].trim(), group: m[4] ? m[4].trim() : null }); }
            }
            groupOrder = groups.length ? groups : ['其他应用'];
            slidesData = pics; appItems = apps;
            renderGroups();
            if (slidesData.length) { renderCarousel(); startAutoSlide(); } else { document.getElementById('carouselSection').style.display = 'none'; }
            document.getElementById('warningBanner').style.display = 'none';
            handleUrlAppParameter();
        }

                let g = app.group || '其他应用';
                if (!appsByGroup[g]) appsByGroup[g] = [];
                appsByGroup[g].push(app);

            let html = '';
            for (let i = 0; i < groupOrder.length; i++) {

                html += `<div class="group-section" data-group-index="${i}"><div class="group-header${isEditMode?' draggable':''}" data-group="${escapeHtml(gn)}"><span class="group-title">${escapeHtml(gn)}</span>${isEditMode?`<div><button onclick="editGroup('${escapeHtml(gn)}')">✎</button><button onclick="deleteGroup('${escapeHtml(gn)}')">🗑</button></div>`:''}</div><div class="apps-grid" data-group="${escapeHtml(gn)}" data-group-index="${i}">`;
                if (apps.length === 0) html += '<div class="empty-group">暂无应用</div>';
                else for (let app of apps) {

                    html += `<div class="app-card" data-app-name="${escapeHtml(app.name)}" data-app-link="${escapeHtml(app.link)}" data-app-icon="${escapeHtml(app.icon)}" data-app-group="${escapeHtml(gn)}">${isEditMode?`<button class="edit-app-btn" onclick="editApp('${escapeHtml(app.name)}','${escapeHtml(app.link)}','${escapeHtml(app.icon)}','${escapeHtml(gn)}')">✎</button><button class="delete-btn" onclick="deleteApp('${escapeHtml(app.name)}','${escapeHtml(app.link)}')">✕</button><div class="drag-handle" draggable="true">⋮⋮</div>`:''}<img class="app-icon" src="${escapeHtml(icon)}" onerror="this.src='${fallback}'"><span class="app-name">${escapeHtml(app.name)}</span></div>`;
                }

            gc.innerHTML = html;
            document.querySelectorAll('.app-card').forEach(card => {

        function initDragSort() {
            document.querySelectorAll('.group-header.draggable').forEach(header => {
                header.setAttribute('draggable', 'true');
                header.ondragstart = (e) => { const gd = header.closest('.group-section'); draggedGroupIndex = parseInt(gd.dataset.groupIndex); e.dataTransfer.setData('text/plain', draggedGroupIndex); e.dataTransfer.effectAllowed = 'move'; };
                header.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
                header.ondrop = async (e) => { e.preventDefault(); const tg = header.closest('.group-section'); const ti = parseInt(tg.dataset.groupIndex); if (draggedGroupIndex !== null && draggedGroupIndex !== ti) { const mg = groupOrder[draggedGroupIndex]; groupOrder.splice(draggedGroupIndex, 1); groupOrder.splice(ti, 0, mg); if (await saveToGitHub(generateFileContent())) renderGroups(); } draggedGroupIndex = null; };
            });
            document.querySelectorAll('.app-card .drag-handle').forEach(handle => {
                handle.setAttribute('draggable', 'true');
                handle.ondragstart = (e) => { const card = handle.closest('.app-card'); draggedAppData = { name: card.dataset.appName, link: card.dataset.appLink, icon: card.dataset.appIcon, group: card.dataset.appGroup }; e.dataTransfer.setData('text/plain', JSON.stringify(draggedAppData)); e.dataTransfer.effectAllowed = 'move'; card.classList.add('dragging'); };
                handle.ondragend = (e) => { e.target.closest('.app-card').classList.remove('dragging'); draggedAppData = null; };
            });
            document.querySelectorAll('.apps-grid').forEach(grid => {
                grid.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
                grid.ondrop = async (e) => { e.preventDefault(); if (draggedAppData) { const tg = grid.dataset.group; const app = appItems.find(a => a.name === draggedAppData.name && a.link === draggedAppData.link); if (app && app.group !== tg) { app.group = tg; if (await saveToGitHub(generateFileContent())) renderGroups(); } draggedAppData = null; } };
            });
        }

        async function loadPointsRecords(studentId) {
            try {
                const res = await fetch(JFFI_FILE_URL + '?t=' + Date.now());
                if (!res.ok) return { records: [], total: 0 };
                const text = await res.text();
                const lines = text.split(/\r?\n/);
                const records = [];
                let total = 0;
                for (let line of lines) {
                    line = line.trim();
                    if (line === '') continue;
                    const regex = /^(\d{4}\/\d{2}\/\d{2})\s+(\d{2}:\d{2})\s+(\d{5})\s+(.+?)\s+([+-]\d+)$/;
                    const match = line.match(regex);
                    if (match) {
                        const [_, date, time, sid, event, scoreStr] = match;
                        const score = parseInt(scoreStr);
                        if (sid === studentId) {
                            records.push({ datetime: `${date} ${time}`, event, score, isPlus: score > 0 });
                            total += score;
                        }
                    }
                }
                records.sort((a, b) => new Date(b.datetime) - new Date(a.datetime));
                return { records, total };
            } catch(e) { return { records: [], total: 0 }; }
        }

            if (!currentStudentId) { pc.innerHTML = '<div class="login-prompt"><p>👤 您还未登录</p><button class="login-btn" onclick="showLoginOptions()">立即登录</button></div>'; return; }
            const sn = nameMapping[currentStudentId] || currentStudentId;
            const ct = integralMapping[currentStudentId] || 0;
            pc.innerHTML = `<div class="profile-card"><img class="avatar" id="profileAvatar" src="41.jpg" alt="头像"><div class="profile-info"><div class="profile-name">${escapeHtml(sn)}</div><div class="profile-student-id">学号：${currentStudentId}</div><div class="profile-student-id" style="margin-top:4px;">⭐ 当前积分：${ct}</div></div><button class="profile-logout" id="profileLogoutBtn">退出登录</button></div><div class="menu-section"><div class="menu-item" id="pointsMenuItem"><div class="menu-left"><span class="menu-icon">📊</span><span class="menu-title">积分明细</span></div><span class="menu-arrow">›</span></div><div class="menu-item" id="rankMenuItem"><div class="menu-left"><span class="menu-icon">🏆</span><span class="menu-title">积分排行榜</span></div><span class="menu-arrow">›</span></div></div>`;
            const av = document.getElementById('profileAvatar');
            if (av && currentStudentId) { setAvatarImage(av, currentStudentId); av.onclick = () => { window.location.href = 'https://wj.qq.com/s2/26860993/0922/'; }; }
            document.getElementById('profileLogoutBtn').onclick = () => { clearStudentId(); window.location.href = window.location.pathname; };
            document.getElementById('pointsMenuItem').onclick = () => showPointsDetail();
            document.getElementById('rankMenuItem').onclick = () => { window.location.href = '/5pm'; };
        }

        function showHome() { document.getElementById('homePage').classList.add('active'); document.getElementById('profilePage').classList.remove('active'); document.getElementById('navHomeBtn').classList.add('active'); document.getElementById('navProfileBtn').classList.remove('active'); }
        async function showProfile() { document.getElementById('homePage').classList.remove('active'); document.getElementById('profilePage').classList.add('active'); document.getElementById('navProfileBtn').classList.add('active'); document.getElementById('navHomeBtn').classList.remove('active'); await renderProfilePage(); }

        async function loadNameMapping() {
            try {
                const res = await fetch(NAME_FILE_URL + '?t=' + Date.now());
                if (res.ok) { const text = await res.text(); nameMapping = {}; text.split(/\r?\n/).forEach(line => { line = line.trim(); if (!line) return; const sp = line.indexOf(' '); if (sp !== -1) nameMapping[line.substring(0, sp)] = line.substring(sp + 1).trim(); }); return true; }
            } catch(e) {}
            return false;
        }

        async function loadIntegralData() {
            try {
                const res = await fetch(INTEGRAL_FILE_URL + '?t=' + Date.now());
                if (res.ok) { const text = await res.text(); integralMapping = {}; text.split(/\r?\n/).forEach(line => { line = line.trim(); if (!line) return; const parts = line.split(/\s+/); if (parts.length >= 2) integralMapping[parts[0].trim()] = parts[1].trim(); }); return true; }
            } catch(e) {}
            return false;
        }

        async function showGreeting() {
            currentStudentId = getStudentId();
            const gc = document.getElementById('greetingContainer');
            const uc = document.getElementById('unloggedContainer');
            if (!currentStudentId) { if (gc) gc.style.display = 'none'; if (uc) uc.style.display = 'block'; return; }
            if (uc) uc.style.display = 'none';
            const te = gc?.querySelector('.greeting-text');
            if (Object.keys(nameMapping).length === 0) await loadNameMapping();
            const sn = nameMapping[currentStudentId] || currentStudentId;
            if (gc && te) {
                te.textContent = sn; gc.style.display = 'block';
                if (Object.keys(integralMapping).length === 0) await loadIntegralData();
                const rc = document.getElementById('ratingContainer');
                if (integralMapping[currentStudentId]) {
                    const integral = integralMapping[currentStudentId];
                    const rating = getRatingByIntegral(integral);
                    rc.innerHTML = '';
                    const rb = document.createElement('div'); rb.className = `rating-box ${rating.colorClass}`; rb.textContent = rating.name;
                    const sw = document.createElement('div'); sw.className = 'score-wrapper'; sw.innerHTML = `<span class="score-label">分数</span><span class="score-number">${integral}</span>`;
                    rc.appendChild(rb); rc.appendChild(sw); rc.style.display = 'inline-flex';
                } else rc.style.display = 'none';
            }
            const lb = document.getElementById('logoutBtn');
            if (lb) { lb.style.display = 'inline-block'; lb.onclick = () => { clearStudentId(); window.location.href = window.location.pathname; }; }
            const gw = document.getElementById('greetingWrapper');
            if (gw) { gw.style.cursor = 'pointer'; gw.onclick = (e) => { if (e.target === lb || lb?.contains(e.target)) return; window.location.href = '/5pm'; }; }
        }

        function showStudentIdPrompt() {
            return new Promise((resolve) => {
                const modal = document.createElement('div'); modal.className = 'modal-overlay student-id-modal';
                modal.innerHTML = '<div class="modal-content"><h3>🔐 初二五班专用系统</h3><div class="subtitle">请验证身份以继续使用</div><input type="number" id="studentIdInput" placeholder="请输入5位数学号" maxlength="5" autocomplete="off"><div class="warning-text" id="warningText">❌ 学号必须是5位数字</div><div class="modal-buttons"><button class="confirm-btn" id="confirmBtn">确定</button><button class="cancel-btn" id="cancelBtn">取消</button></div></div>';
                document.body.appendChild(modal); modal.classList.add('show');
                const input = modal.querySelector('#studentIdInput'); input.focus();
                const wt = modal.querySelector('#warningText');
                const hc = () => { const v = input.value.trim(); if (/^\d{5}$/.test(v)) { modal.remove(); resolve(v); } else { wt.style.display = 'block'; input.style.borderColor = '#e74c3c'; input.value = ''; input.focus(); } };
                modal.querySelector('#confirmBtn').onclick = hc;
                modal.querySelector('#cancelBtn').onclick = () => { modal.remove(); resolve(null); };
                input.onkeypress = (e) => { if (e.key === 'Enter') hc(); };
                modal.onclick = (e) => { if (e.target === modal) { modal.remove(); resolve(null); } };
            });
        }

        async function checkUserAgentAndPrompt() {
            if (!isTargetDevice) return;
            let existingId = getStudentId();
            if (existingId) { currentStudentId = existingId; await showGreeting(); return; }
            const sid = await showStudentIdPrompt();
            if (sid) { saveStudentId(sid); window.location.href = `?p=${sid}`; }
            else { const wb = document.getElementById('warningBanner'); wb.style.display = 'block'; wb.innerHTML = '⚠️ 请输入学号以使用完整功能 | <span style="text-decoration:underline;cursor:pointer" onclick="location.reload()">点击重试</span>'; }
        }

        function showLoginOptions() { document.getElementById('loginOptionsModal').classList.add('show'); }
        function hideLoginOptions() { document.getElementById('loginOptionsModal').classList.remove('show'); }
        function showManualIdInput() { hideLoginOptions(); showStudentIdPrompt().then(sid => { if (sid) { saveStudentId(sid); window.location.href = `?p=${sid}`; } }); }

        document.getElementById('showLoginOptionsBtn').onclick = isTargetDevice ? () => { showStudentIdPrompt().then(sid => { if (sid) { saveStudentId(sid); window.location.href = `?p=${sid}`; } }); } : showLoginOptions;
        document.getElementById('scanLoginOptionBtn').onclick = () => { hideLoginOptions(); showScanModalFunc(); };
        document.getElementById('inputIdLoginOptionBtn').onclick = () => { hideLoginOptions(); showManualIdInput(); };
        document.getElementById('cancelLoginOptionBtn').onclick = hideLoginOptions;
        document.getElementById('loginOptionsModal').onclick = (e) => { if (e.target === document.getElementById('loginOptionsModal')) hideLoginOptions(); };

        let clickCount = 0, clickTimer = null;
        document.getElementById('titleClickTarget').addEventListener('click', () => {
            clickCount++;
            if (clickTimer) clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            if (clickCount === 3) { clickCount = 0; if (isEditMode) { alert('编辑模式已开启'); return; } showTokenModal(); }
        });

        function showTokenModal() {
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = '<div class="modal-content"><h3>验证Token</h3><input type="password" id="tokenInput" placeholder="GitHub Token" autocomplete="off"><div class="modal-buttons"><button class="confirm-btn" id="confirmBtn">验证</button><button class="cancel-btn" id="cancelBtn">取消</button></div></div>';
            document.body.appendChild(modal); modal.classList.add('show');
            modal.querySelector('#confirmBtn').onclick = async () => {
                const token = modal.querySelector('#tokenInput').value.trim();
                if (!token) { alert('请输入Token'); return; }
                const btn = modal.querySelector('#confirmBtn'); btn.disabled = true; btn.textContent = '验证中...';
                try {
                    const tr = await fetch('https://api.github.com/user', { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!tr.ok) throw new Error('Token无效');
                    currentToken = token; isEditMode = true;
                    document.body.classList.add('edit-mode');
                    document.getElementById('fabGroup').style.display = 'flex';
                    renderGroups(); renderCarousel(); modal.remove();
                    alert('✅ 编辑模式已启用！');
                } catch(e) { alert('❌ Token验证失败：' + e.message); btn.disabled = false; btn.textContent = '验证'; }
            };
            modal.querySelector('#cancelBtn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }

        window.deleteSlide = function(idx) { if (!isEditMode) { alert('请先开启编辑模式'); return; } if (confirm('确定删除？')) { slidesData.splice(idx, 1); renderCarousel(); saveToGitHub(generateFileContent()); } };
        window.editGroup = function(gn) { if (!isEditMode) { alert('请先开启编辑模式'); return; } const nn = prompt('新名称', gn); if (nn && nn !== gn) { const i = groupOrder.indexOf(gn); if (i !== -1) { groupOrder[i] = nn; appItems.forEach(a => { if (a.group === gn) a.group = nn; }); saveToGitHub(generateFileContent()).then(() => renderGroups()); } } };
        window.deleteGroup = function(gn) { if (!isEditMode) { alert('请先开启编辑模式'); return; } if (gn === '其他应用') { alert('不能删除'); return; } if (confirm(`确定删除"${gn}"？`)) { const i = groupOrder.indexOf(gn); if (i !== -1) { groupOrder.splice(i, 1); appItems.forEach(a => { if (a.group === gn) a.group = '其他应用'; }); saveToGitHub(generateFileContent()).then(() => renderGroups()); } } };
        window.editApp = function(name, link, icon, group) {
            if (!isEditMode) { alert('请先开启编辑模式'); return; }
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-content"><h3>编辑应用</h3><label>名称</label><input id="appName" value="${escapeHtml(name)}"><label>图标</label><input id="appIcon" value="${escapeHtml(icon)}"><label>链接</label><input id="appLink" value="${escapeHtml(link)}"><label>分组</label><select id="appGroup">${groupOrder.map(g=>`<option value="${escapeHtml(g)}"${g===group?' selected':''}>${escapeHtml(g)}</option>`).join('')}</select><div class="modal-buttons"><button class="confirm-btn">保存</button><button class="cancel-btn">取消</button></div></div>`;
            document.body.appendChild(modal); modal.classList.add('show');
            modal.querySelector('.confirm-btn').onclick = async () => {
                const nn = modal.querySelector('#appName').value.trim();
                const ni = modal.querySelector('#appIcon').value.trim() || 'null.jpg';
                const nl = modal.querySelector('#appLink').value.trim();
                const ng = modal.querySelector('#appGroup').value;
                if (!nn || !nl) { alert('请填写完整'); return; }
                const app = appItems.find(a => a.name === name && a.link === link);
                if (app) { app.name = nn; app.icon = ni; app.link = nl; app.group = ng; if (await saveToGitHub(generateFileContent())) renderGroups(); modal.remove(); }
            };
            modal.querySelector('.cancel-btn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        };
        window.deleteApp = async function(name, link) { if (!isEditMode) { alert('请先开启编辑模式'); return; } if (confirm('确定删除？')) { const i = appItems.findIndex(a => a.name === name && a.link === link); if (i !== -1) appItems.splice(i, 1); if (await saveToGitHub(generateFileContent())) renderGroups(); } };

        function addApp() {
            if (!isEditMode) { alert('请先开启编辑模式'); return; }
            if (isAddingApp) { alert('请稍候'); return; }
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-content"><h3>添加应用</h3><input id="appName" placeholder="名称"><input id="iconUrl" placeholder="图标链接"><input id="appLink" placeholder="https://..."><select id="appGroup">${groupOrder.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}</select><div class="modal-buttons"><button class="confirm-btn">添加</button><button class="cancel-btn">取消</button></div></div>`;
            document.body.appendChild(modal); modal.classList.add('show');
            const cb = modal.querySelector('.confirm-btn');
            cb.onclick = async () => {
                const n = modal.querySelector('#appName').value.trim();
                const i = modal.querySelector('#iconUrl').value.trim() || 'null.jpg';
                const l = modal.querySelector('#appLink').value.trim();
                const g = modal.querySelector('#appGroup').value;
                if (!n || !l) { alert('请填写完整'); return; }
                isAddingApp = true; cb.disabled = true; cb.textContent = '保存中...';
                appItems.push({ name: n, icon: i, link: l, group: g }); renderGroups();
                const s = await saveToGitHub(generateFileContent());
                if (s) { modal.remove(); } else { appItems.pop(); renderGroups(); alert('保存失败'); }
                isAddingApp = false; cb.disabled = false;
            };
            modal.querySelector('.cancel-btn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }

        function addCarousel() {
            if (!isEditMode) { alert('请先开启编辑模式'); return; }
            if (isAddingCarousel) { alert('请稍候'); return; }
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = '<div class="modal-content"><h3>添加轮播图</h3><input id="imgUrl" placeholder="图片链接"><input id="linkUrl" placeholder="跳转链接"><div class="modal-buttons"><button class="confirm-btn">添加</button><button class="cancel-btn">取消</button></div></div>';
            document.body.appendChild(modal); modal.classList.add('show');
            const cb = modal.querySelector('.confirm-btn');
            cb.onclick = async () => {
                const img = modal.querySelector('#imgUrl').value.trim();
                const link = modal.querySelector('#linkUrl').value.trim();
                if (!img) { alert('请填写图片链接'); return; }
                isAddingCarousel = true; cb.disabled = true; cb.textContent = '保存中...';
                slidesData.push({ imgUrl: img, linkUrl: link }); renderCarousel();
                const s = await saveToGitHub(generateFileContent());
                if (s) { modal.remove(); } else { slidesData.pop(); renderCarousel(); alert('保存失败'); }
                isAddingCarousel = false; cb.disabled = false;
            };
            modal.querySelector('.cancel-btn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }

        function addGroup() { if (!isEditMode) { alert('请先开启编辑模式'); return; } const nn = prompt('分组名称'); if (nn && !groupOrder.includes(nn)) { groupOrder.push(nn); saveToGitHub(generateFileContent()).then(() => renderGroups()); } else if (nn) alert('已存在'); }

        function generateFileContent() { let c = 'group\n'; for (let g of groupOrder) c += `[g=${g}]\n`; c += 'pic\n'; for (let s of slidesData) c += `[p=${s.imgUrl} l=${s.linkUrl}]\n`; c += 'app\n'; for (let a of appItems) c += `[n=${a.name} p=${a.icon} l=${a.link}${a.group?` g=${a.group}`:''}]\n`; return c; }

        async function saveToGitHub(content) {
            if (!currentToken) { alert('请先输入Token'); return false; }
            try {
                let sha = fileSha;
                if (!sha) { const cr = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, { headers: { 'Authorization': `Bearer ${currentToken}` } }); if (cr.ok) sha = (await cr.json()).sha; }
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${currentToken}` }, body: JSON.stringify({ message: '更新配置', content: btoa(unescape(encodeURIComponent(content))), branch: 'main', sha }) });
                if (!res.ok) throw new Error();
                fileSha = (await res.json()).content.sha;
                alert('保存成功！'); return true;
            } catch(e) { alert('保存失败: ' + e.message); return false; }
        }

        async function uploadToRoot(file) {
            if (!currentToken) { alert('请先输入Token'); return null; }
            try {
                const reader = new FileReader();
                const base64 = await new Promise(r => { reader.onload = e => r(e.target.result.split(',')[1]); reader.readAsDataURL(file); });
                const fn = file.name;
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fn}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${currentToken}` }, body: JSON.stringify({ message: `上传 ${fn}`, content: base64, branch: 'main' }) });
                if (!res.ok) throw new Error();
                alert(`✅ 上传成功：${fn}`); return fn;
            } catch(e) { alert('上传失败'); return null; }
        }

        function uploadFileToRoot() { if (!isEditMode) { alert('请先开启编辑模式'); return; } const inp = document.createElement('input'); inp.type = 'file'; inp.onchange = async (e) => { if (e.target.files[0]) await uploadToRoot(e.target.files[0]); }; inp.click(); }

        async function openFileManager() {
            if (!isEditMode) { alert('请先开启编辑模式'); return; }
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = '<div class="modal-content" style="max-width:500px;"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>📁 文件管理器</h3><button class="cancel-btn" id="closeFileManagerBtn" style="width:auto;padding:5px 15px;">关闭</button></div><div class="current-path" id="currentPath">/</div><div id="fileList" style="max-height:400px;overflow-y:auto;"></div></div>';
            document.body.appendChild(modal); modal.classList.add('show');
            await loadFileList(modal);
            modal.querySelector('#closeFileManagerBtn').onclick = () => modal.remove();
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }

        async function loadFileList(modal) {
            const fld = modal.querySelector('#fileList');
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                if (!res.ok) throw new Error();
                const items = await res.json();
                let html = '';
                for (let item of items) {
                    if (item.type !== 'dir' && item.name.toLowerCase().endsWith('.html')) continue;
                    html += `<div class="file-item ${item.type==='dir'?'folder':'file'}"><span>${escapeHtml(item.name)}</span><div class="file-actions"><button class="file-action-btn" onclick="copyFileLink('${item.name}')">🔗</button><button class="file-action-btn delete" onclick="deleteFile('${item.name}')">🗑</button></div></div>`;
                }
                fld.innerHTML = html;
            } catch(e) { fld.innerHTML = '<div class="error-tip">加载失败</div>'; }
        }

        window.copyFileLink = function(fn) { navigator.clipboard.writeText(`/${fn}\nhttps://luckynum.top/${fn}`); alert('已复制链接'); };
        window.deleteFile = async function(fn) {
            if (!confirm(`确定删除 ${fn} 吗？`)) return;
            try {
                const cr = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fn}`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                const data = await cr.json();
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fn}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${currentToken}` }, body: JSON.stringify({ message: `删除 ${fn}`, sha: data.sha, branch: 'main' }) });
                if (res.ok) { alert('删除成功'); const m = document.querySelector('.modal-overlay'); if (m) loadFileList(m); } else alert('删除失败');
            } catch(e) { alert('删除失败'); }
        };

        document.getElementById('addAppFab')?.addEventListener('click', addApp);
        document.getElementById('addCarouselFab')?.addEventListener('click', addCarousel);
        document.getElementById('uploadOnlyBtn')?.addEventListener('click', uploadFileToRoot);
        document.getElementById('fileManagerBtn')?.addEventListener('click', openFileManager);
        document.getElementById('addGroupFab')?.addEventListener('click', addGroup);
        document.getElementById('closeScanModal')?.addEventListener('click', closeScanModalFunc);
        document.getElementById('scanAlbumBtn')?.addEventListener('click', () => document.getElementById('scanAlbumInput')?.click());
        document.getElementById('scanAlbumInput')?.addEventListener('change', (e) => { if (e.target.files?.[0]) { scanFromImage(e.target.files[0]); e.target.value = ''; } });
        document.getElementById('navHomeBtn')?.addEventListener('click', showHome);
        document.getElementById('navProfileBtn')?.addEventListener('click', showProfile);
        document.getElementById('closePointsModal')?.addEventListener('click', closePointsModalFunc);
        document.getElementById('pointsModal')?.addEventListener('click', (e) => { if (e.target === document.getElementById('pointsModal')) closePointsModalFunc(); });

        async function init() {
            await Promise.all([loadConfigFile(), loadNameMapping(), loadIntegralData()]);
            if (isTargetDevice) { await checkUserAgentAndPrompt(); await showGreeting(); }
            else { await showGreeting(); }
            showHome();
            checkAndShowSubscribeModal();
        }
        init();
    </script>
</body>
</html>
