<script>
    // ========== 获取URL参数 ==========
    function getUrlParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }
    
    // ========== 从5name.txt读取姓名映射 ==========
    let nameMapping = {};
    
    async function loadNameMapping() {
        try {
            const response = await fetch('/5name.txt');
            if (response.ok) {
                const text = await response.text();
                const lines = text.split(/\r?\n/);
                for (let line of lines) {
                    line = line.trim();
                    if (line === '') continue;
                    // 按空格分割，第一个是参数，后面的是姓名（可能包含空格）
                    const firstSpace = line.indexOf(' ');
                    if (firstSpace !== -1) {
                        const param = line.substring(0, firstSpace).trim();
                        const name = line.substring(firstSpace + 1).trim();
                        if (param && name) {
                            nameMapping[param] = name;
                        }
                    }
                }
                console.log('姓名映射加载成功，共', Object.keys(nameMapping).length, '条');
            }
        } catch (e) {
            console.log('无法加载5name.txt，使用默认问候语');
        }
    }
    
    // ========== 显示问候语 ==========
    function showGreeting(greetingText) {
        const greetingContainer = document.getElementById('greetingContainer');
        const greetingTextElem = greetingContainer.querySelector('.greeting-text');
        if (greetingContainer && greetingTextElem) {
            greetingTextElem.textContent = greetingText;
            greetingContainer.style.display = 'block';
        }
    }
    
    // ========== 处理问候语逻辑 ==========
    async function initGreeting() {
        // 优先从5name.txt读取
        await loadNameMapping();
        
        const urlParam = getUrlParam('p');
        if (urlParam && nameMapping[urlParam]) {
            // 找到了对应的姓名
            showGreeting(`${nameMapping[urlParam]}同学你好`);
            return true;
        }
        
        // 其次从localStorage读取zhiriData
        try {
            const zhiriDataStr = localStorage.getItem('zhiriData');
            if (zhiriDataStr) {
                const zhiriData = JSON.parse(zhiriDataStr);
                const now = Date.now();
                if (zhiriData && zhiriData.timestamp && (now - zhiriData.timestamp <= 60000)) {
                    const studentName = zhiriData.value || '同学';
                    showGreeting(`${studentName}同学你好`);
                    localStorage.removeItem('zhiriData');
                    return true;
                }
                localStorage.removeItem('zhiriData');
            }
        } catch (e) {
            console.error('读取zhiriData失败:', e);
            localStorage.removeItem('zhiriData');
        }
        
        return false;
    }
    
    // ========== 标题点击3次触发Token输入 ==========
    let clickCount = 0;
    let clickTimer = null;
    const titleElement = document.getElementById('titleClickTarget');
    
    titleElement.addEventListener('click', () => {
        clickCount++;
        if (clickTimer) clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
        
        if (clickCount === 3) {
            clickCount = 0;
            showTokenInputModal();
        }
    });
    
    function showTokenInputModal() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>验证Token</h3>
                <input type="password" id="tokenInput" placeholder="输入 GitHub Personal Access Token" style="width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
                <div class="modal-buttons">
                    <button class="confirm-btn" id="tokenConfirmBtn">验证</button>
                    <button class="cancel-btn" id="tokenCancelBtn">取消</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        modal.querySelector('#tokenConfirmBtn').onclick = async () => {
            const token = modal.querySelector('#tokenInput').value.trim();
            if (!token) return;
            modal.querySelector('#tokenConfirmBtn').disabled = true;
            modal.querySelector('#tokenConfirmBtn').textContent = '验证中...';
            
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Token无效');
                
                currentToken = token;
                isEditMode = true;
                document.body.classList.add('edit-mode');
                addAppTextBtn.style.display = 'inline-block';
                fabGroup.style.display = 'flex';
                if (slidesData.length) renderCarousel();
                renderApps(appItems);
                
                modal.remove();
            } catch (e) {
                alert('Token验证失败');
                modal.querySelector('#tokenConfirmBtn').disabled = false;
                modal.querySelector('#tokenConfirmBtn').textContent = '验证';
            }
        };
        
        modal.querySelector('#tokenCancelBtn').onclick = () => modal.remove();
    }
    
    // ========== 配置 ==========
    const CONFIG_URL = 'https://luckynum.top/5app.txt';
    const GITHUB_OWNER = 'bloxorz671';
    const GITHUB_REPO = 'createsoft';
    const GITHUB_PATH = '5app.txt';
    
    let slidesData = [], appItems = [], currentIndex = 0, autoInterval = null, totalSlides = 0;
    let isEditMode = false, currentToken = null, fileSha = null;
    let draggedIndex = null;
    
    const carouselSection = document.getElementById('carouselSection'), carouselTrack = document.getElementById('carouselTrack');
    const dotsContainer = document.getElementById('carouselDots'), appsGrid = document.getElementById('appsGrid');
    const appsHeader = document.getElementById('appsHeader');
    const addAppTextBtn = document.getElementById('addAppTextBtn');
    const fabGroup = document.getElementById('fabGroup');
    const addAppFab = document.getElementById('addAppFab');
    const addCarouselFab = document.getElementById('addCarouselFab');
    const uploadOnlyBtn = document.getElementById('uploadOnlyBtn');
    
    // ========== 判断是否为文件 ==========
    function isFileUrl(url) {
        if (!url || url.startsWith('javascript:') || url.startsWith('mailto:') || url.startsWith('#')) return false;
        const path = url.split('?')[0].split('#')[0];
        const lastDot = path.lastIndexOf('.');
        if (lastDot === -1 || lastDot === path.length - 1) return false;
        const ext = path.substring(lastDot + 1).toLowerCase();
        const webExts = ['html', 'htm', 'php', 'asp', 'aspx', 'jsp', 'do', 'action', 'cfm', 'cgi', 'pl'];
        if (webExts.includes(ext)) return false;
        return true;
    }
    
    function getFileType(url) {
        const path = url.split('?')[0].split('#')[0];
        const ext = path.split('.').pop().toLowerCase();
        if (['jpg','jpeg','png','gif','webp','bmp','svg','ico'].includes(ext)) return 'image';
        if (['mp4','webm','ogg','mov','avi','mkv','flv'].includes(ext)) return 'video';
        if (ext === 'pdf') return 'pdf';
        return 'file';
    }
    
    function downloadFile(url, fileName) {
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName.split('?')[0];
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
    
    // ========== 图片缩放和拖拽功能 ==========
    function createZoomableImage(url, fileName) {
        const container = document.createElement('div');
        container.className = 'image-container';
        
        const img = document.createElement('img');
        img.src = url;
        img.className = 'zoomable-image';
        img.style.transform = 'translate(0px, 0px) scale(1)';
        container.appendChild(img);
        
        let scale = 1;
        let translateX = 0, translateY = 0;
        let initialDistance = 0;
        let initialScale = 1;
        let lastTouchX = 0, lastTouchY = 0;
        let isPanning = false;
        
        const updateTransform = () => {
            img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        };
        
        const clampTranslate = () => {
            const rect = img.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const maxX = Math.max(0, (rect.width * scale - containerRect.width) / 2);
            const maxY = Math.max(0, (rect.height * scale - containerRect.height) / 2);
            translateX = Math.min(maxX, Math.max(-maxX, translateX));
            translateY = Math.min(maxY, Math.max(-maxY, translateY));
        };
        
        const zoomIn = () => {
            scale = Math.min(scale + 0.25, 4);
            clampTranslate();
            updateTransform();
        };
        
        const zoomOut = () => {
            scale = Math.max(scale - 0.25, 1);
            if (scale === 1) {
                translateX = 0;
                translateY = 0;
            } else {
                clampTranslate();
            }
            updateTransform();
        };
        
        const resetZoom = () => {
            scale = 1;
            translateX = 0;
            translateY = 0;
            updateTransform();
        };
        
        img.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) zoomIn();
            else zoomOut();
        });
        
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let startTranslateX = 0, startTranslateY = 0;
        
        img.addEventListener('mousedown', (e) => {
            if (scale > 1) {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                startTranslateX = translateX;
                startTranslateY = translateY;
                img.style.cursor = 'grabbing';
                e.preventDefault();
            }
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging && scale > 1) {
                translateX = startTranslateX + (e.clientX - dragStartX);
                translateY = startTranslateY + (e.clientY - dragStartY);
                clampTranslate();
                updateTransform();
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
            if (scale > 1) img.style.cursor = 'grab';
        });
        
        let initialTouches = [];
        const getDistance = (touches) => Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
        const getCenter = (touches) => ({ x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 });
        
        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touches = Array.from(e.touches);
            initialTouches = touches;
            if (touches.length === 1) {
                isPanning = true;
                lastTouchX = touches[0].clientX;
                lastTouchY = touches[0].clientY;
            } else if (touches.length === 2) {
                initialDistance = getDistance(touches);
                initialScale = scale;
                const center = getCenter(touches);
                lastTouchX = center.x;
                lastTouchY = center.y;
            }
        });
        
        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touches = Array.from(e.touches);
            if (touches.length === 1 && isPanning && scale > 1) {
                const deltaX = touches[0].clientX - lastTouchX;
                const deltaY = touches[0].clientY - lastTouchY;
                translateX += deltaX;
                translateY += deltaY;
                clampTranslate();
                updateTransform();
                lastTouchX = touches[0].clientX;
                lastTouchY = touches[0].clientY;
            } else if (touches.length === 2) {
                const newDistance = getDistance(touches);
                const newScale = initialScale * (newDistance / initialDistance);
                scale = Math.min(Math.max(newScale, 1), 4);
                if (scale === 1) {
                    translateX = 0;
                    translateY = 0;
                } else {
                    const newCenter = getCenter(touches);
                    const deltaX = newCenter.x - lastTouchX;
                    const deltaY = newCenter.y - lastTouchY;
                    translateX += deltaX;
                    translateY += deltaY;
                    clampTranslate();
                    lastTouchX = newCenter.x;
                    lastTouchY = newCenter.y;
                }
                updateTransform();
                initialDistance = newDistance;
                initialScale = scale;
            }
        });
        
        container.addEventListener('touchend', () => { isPanning = false; initialTouches = []; });
        
        img.onerror = () => {
            container.innerHTML = `<div class="unsupported-view"><h2>🖼️ 图片加载失败</h2><p>该图片无法显示</p><button class="fallback-download">📥 立即下载</button></div>`;
            const btn = container.querySelector('.fallback-download');
            if (btn) btn.onclick = () => downloadFile(url, fileName);
        };
        
        return { container, zoomIn, zoomOut, resetZoom };
    }

    function openFileViewer(url, fileName) {
        const fileType = getFileType(url);
        
        const overlay = document.createElement('div');
        overlay.className = 'file-viewer-overlay';
        
        const header = document.createElement('div');
        header.className = 'viewer-header';
        header.innerHTML = `
            <div class="viewer-title">${escapeHtml(fileName)}</div>
            <div class="viewer-controls">
                <div id="zoomControls" style="display: none; gap: 8px;"></div>
                <button class="viewer-btn download-btn">📥 下载</button>
                <button class="viewer-btn close-btn">✕ 关闭</button>
            </div>
        `;
        
        const content = document.createElement('div');
        content.className = 'viewer-content';
        
        overlay.appendChild(header);
        overlay.appendChild(content);
        document.body.appendChild(overlay);
        
        let zoomInFn = null, zoomOutFn = null, resetZoomFn = null;
        
        if (fileType === 'image') {
            const { container, zoomIn, zoomOut, resetZoom } = createZoomableImage(url, fileName);
            content.appendChild(container);
            zoomInFn = zoomIn;
            zoomOutFn = zoomOut;
            resetZoomFn = resetZoom;
            
            const zoomControls = header.querySelector('#zoomControls');
            zoomControls.style.display = 'flex';
            zoomControls.innerHTML = `
                <button class="zoom-btn" id="zoomOutBtn">−</button>
                <button class="zoom-btn" id="resetZoomBtn">⟳</button>
                <button class="zoom-btn" id="zoomInBtn">+</button>
            `;
            zoomControls.querySelector('#zoomInBtn').onclick = () => zoomInFn();
            zoomControls.querySelector('#zoomOutBtn').onclick = () => zoomOutFn();
            zoomControls.querySelector('#resetZoomBtn').onclick = () => resetZoomFn();
            
        } else if (fileType === 'video') {
            const video = document.createElement('video');
            video.controls = true;
            video.autoplay = false;
            video.style.maxWidth = '100%';
            video.style.maxHeight = '100%';
            video.style.objectFit = 'contain';
            const source = document.createElement('source');
            source.src = url;
            video.appendChild(source);
            video.onerror = () => {
                content.innerHTML = `<div class="unsupported-view"><h2>🎬 视频加载失败</h2><p>该视频无法播放</p><button class="fallback-download">📥 立即下载</button></div>`;
                const btn = content.querySelector('.fallback-download');
                if (btn) btn.onclick = () => downloadFile(url, fileName);
            };
            content.appendChild(video);
            
        } else if (fileType === 'pdf') {
            const pdfContainerDiv = document.createElement('div');
            pdfContainerDiv.className = 'pdf-viewer-container';
            const controls = document.createElement('div');
            controls.className = 'pdf-controls';
            controls.innerHTML = `
                <button id="pdfPrevBtn">◀ 上一页</button>
                <span id="pdfPageInfo">第 1 / ? 页</span>
                <button id="pdfNextBtn">下一页 ▶</button>
                <div class="pdf-zoom-controls">
                    <button id="pdfZoomOutBtn">−</button>
                    <span id="pdfZoomLevel">100%</span>
                    <button id="pdfZoomInBtn">+</button>
                    <button id="pdfResetZoomBtn">⟳</button>
                </div>
                <button id="pdfDownloadBtn" style="margin-left:15px;">📥 下载</button>
            `;
            pdfContainerDiv.appendChild(controls);
            const pdfCanvasContainer = document.createElement('div');
            pdfCanvasContainer.className = 'pdf-canvas-container';
            pdfContainerDiv.appendChild(pdfCanvasContainer);
            content.appendChild(pdfContainerDiv);
            
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
            pdfjsLib.getDocument(url).promise.then(pdf => {
                let currentPage = 1;
                let currentScale = 1.2;
                const totalPages = pdf.numPages;
                const renderPage = () => {
                    pdf.getPage(currentPage).then(page => {
                        const viewport = page.getViewport({ scale: currentScale });
                        const canvas = document.createElement('canvas');
                        canvas.className = 'pdf-canvas';
                        const context = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        page.render({ canvasContext: context, viewport }).promise.then(() => {
                            pdfCanvasContainer.innerHTML = '';
                            pdfCanvasContainer.appendChild(canvas);
                            document.getElementById('pdfPageInfo').innerHTML = `第 ${currentPage} / ${totalPages} 页`;
                        });
                    });
                };
                renderPage();
                
                document.getElementById('pdfPrevBtn').onclick = () => { if (currentPage > 1) { currentPage--; renderPage(); } };
                document.getElementById('pdfNextBtn').onclick = () => { if (currentPage < totalPages) { currentPage++; renderPage(); } };
                document.getElementById('pdfZoomInBtn').onclick = () => { currentScale = Math.min(currentScale + 0.2, 3); renderPage(); };
                document.getElementById('pdfZoomOutBtn').onclick = () => { currentScale = Math.max(currentScale - 0.2, 0.6); renderPage(); };
                document.getElementById('pdfResetZoomBtn').onclick = () => { currentScale = 1.2; renderPage(); };
                document.getElementById('pdfDownloadBtn').onclick = () => downloadFile(url, fileName);
            }).catch(() => {
                pdfContainerDiv.innerHTML = `<div class="unsupported-view"><h2>📄 PDF加载失败</h2><p>文件可能无法访问</p><button class="fallback-download">📥 立即下载</button></div>`;
                const btn = pdfContainerDiv.querySelector('.fallback-download');
                if (btn) btn.onclick = () => downloadFile(url, fileName);
            });
            
        } else {
            content.innerHTML = `
                <div class="unsupported-view">
                    <h2>📄 该文件不支持预览</h2>
                    <p>${escapeHtml(fileName)}</p>
                    <button class="fallback-download">📥 立即下载</button>
                </div>
            `;
            const btn = content.querySelector('.fallback-download');
            if (btn) btn.onclick = () => downloadFile(url, fileName);
        }
        
        const downloadBtn = header.querySelector('.download-btn');
        if (downloadBtn) downloadBtn.onclick = () => downloadFile(url, fileName);
        
        header.querySelector('.close-btn').onclick = () => overlay.remove();
        
        const escHandler = (e) => { if (e.key === 'Escape') overlay.remove(); };
        document.addEventListener('keydown', escHandler);
        overlay._escHandler = escHandler;
        overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    function utf8ToBase64(str) { const bytes = new TextEncoder().encode(str); let binary = ''; for(let b of bytes) binary += String.fromCharCode(b); return btoa(binary); }
    function generateFileContent() { let c='pic\n'; for(let s of slidesData) c+=`[p=${s.imgUrl} l=${s.linkUrl}]\n`; c+='app\n'; for(let a of appItems) c+=`[n=${a.name} p=${a.icon} l=${a.link}]\n`; return c; }
    
    async function uploadImageToGitHub(file) {
        if (!currentToken) return null;

            const reader = new FileReader();
            const base64 = await new Promise(r => { reader.onload = e => r(e.target.result.split(',')[1]); reader.readAsDataURL(file); });
            const fileName = `images/${Date.now()}_${file.name}`;
            const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fileName}`, {
                method: 'PUT', headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `上传 ${file.name}`, content: base64, branch: 'main' })
            });
            if (!res.ok) throw new Error();
            return `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@main/${fileName}`;
        } catch(e) { alert('上传失败'); return null; }
    }

    async function saveToGitHub(content) {
        if (!currentToken) { alert('请先输入Token'); return false; }
        try {
            let sha = fileSha;
            if (!sha) {
                const check = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, { headers: { 'Authorization': `Bearer ${currentToken}` } });
                if (check.ok) sha = (await check.json()).sha;
            }
            const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, {
                method: 'PUT', headers: { 'Authorization': `Bearer ${currentToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: '更新配置', content: utf8ToBase64(content), branch: 'main', sha })
            });
            if (!res.ok) throw new Error();
            fileSha = (await res.json()).content.sha;
            alert('保存成功');
            return true;
        } catch(e) { alert('保存失败'); return false; }
    }
    
    function initDragSort() {
        const cards = document.querySelectorAll('.app-card');
        cards.forEach((card, idx) => {
            card.setAttribute('data-index', idx);
            card.draggable = isEditMode;
            card.ondragstart = (e) => {
                if (!isEditMode) return false;
                draggedIndex = parseInt(card.getAttribute('data-index'));
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', draggedIndex);
                card.classList.add('dragging');
            };
            card.ondragend = (e) => { card.classList.remove('dragging'); draggedIndex = null; };
            card.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
            card.ondragenter = (e) => { if (isEditMode) card.classList.add('drag-over'); };
            card.ondragleave = (e) => { card.classList.remove('drag-over'); };
            card.ondrop = async (e) => {
                e.preventDefault();
                card.classList.remove('drag-over');
                if (!isEditMode || draggedIndex === null) return;
                const targetIndex = parseInt(card.getAttribute('data-index'));
                if (draggedIndex === targetIndex) return;
                const moved = appItems[draggedIndex];
                appItems.splice(draggedIndex, 1);
                appItems.splice(targetIndex, 0, moved);
                if (await saveToGitHub(generateFileContent())) renderApps(appItems);
                else location.reload();
            };
        });
    }

    function updateCarouselPosition() { if(carouselTrack) carouselTrack.style.transform = `translateX(${-currentIndex*100}%)`; }
    function updateDotsActive() { document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===currentIndex)); }
    function nextSlide() { if(totalSlides) { currentIndex = (currentIndex+1)%totalSlides; updateCarouselPosition(); updateDotsActive(); } }
    function prevSlide() { if(totalSlides) { currentIndex = (currentIndex-1+totalSlides)%totalSlides; updateCarouselPosition(); updateDotsActive(); } }
    function startAutoSlide() { if(autoInterval) clearInterval(autoInterval); if(totalSlides>1) autoInterval = setInterval(nextSlide,5000); }
    function resetAutoSlide() { startAutoSlide(); }
    
    function initSwipe() {
        if(!carouselTrack) return;
        const wrapper = carouselTrack.parentElement;
        if(!wrapper) return;
        let startX = 0, isSwiping = false, startTransform = 0;
        const onTouchStart = (e) => { if(totalSlides <= 1) return; startX = e.touches[0].clientX; isSwiping = true; startTransform = currentIndex; carouselTrack.style.transition = 'none'; if(autoInterval) clearInterval(autoInterval); };
        const onTouchMove = (e) => { if(!isSwiping) return; const diffX = e.touches[0].clientX - startX; const percent = (diffX / wrapper.clientWidth) * 100; let newPercent = -startTransform * 100 + percent; if(startTransform === 0 && diffX > 0) newPercent *= 0.3; if(startTransform === totalSlides - 1 && diffX < 0) newPercent = -startTransform * 100 + percent * 0.3; carouselTrack.style.transform = `translateX(${newPercent}%)`; };
        const onTouchEnd = (e) => { if(!isSwiping) { carouselTrack.style.transition = ''; resetAutoSlide(); return; } isSwiping = false; const diffX = e.changedTouches[0].clientX - startX; if(Math.abs(diffX) > 35) diffX > 0 ? prevSlide() : nextSlide(); updateCarouselPosition(); carouselTrack.style.transition = ''; resetAutoSlide(); };
        wrapper.addEventListener('touchstart', onTouchStart, { passive: false }); wrapper.addEventListener('touchmove', onTouchMove, { passive: false }); wrapper.addEventListener('touchend', onTouchEnd);
    }
    
    function alignSameRowHeights() {
        const cards = document.querySelectorAll('.app-card');
        if(!cards.length) return;
        const rows = [];
        cards.forEach(card => { const rect = card.getBoundingClientRect(); let added = false; for(let row of rows) { if(Math.abs(rect.top - row[0].top) <= 5) { row.push({ element: card, height: rect.height }); added = true; break; } } if(!added) rows.push([{ element: card, height: rect.height, top: rect.top }]); });
        rows.forEach(row => { if(row.length > 1) { let maxH = Math.max(...row.map(r => r.height)); row.forEach(r => r.element.style.height = maxH + 'px'); } });
    }
    
    function parseAppTxt(raw) {
        const lines = raw.split(/\r?\n/);
        let mode = null, pics = [], apps = [];
        for(let line of lines) {
            line = line.trim(); if(!line) continue;
            if(line.toLowerCase()==='pic') { mode='pic'; continue; }
            if(line.toLowerCase()==='app') { mode='app'; continue; }
            if(mode==='pic') {
                let m = line.match(/\[p=([^\s\]]+)\s+l=([^\s\]]+)\]/);
                if(m) pics.push({ imgUrl: m[1], linkUrl: m[2] });
            } else if(mode==='app') {
                let m = line.match(/\[n=([^\s\]]+)\s+p=([^\s\]]+)\s+l=([^\s\]]+)(?:\s+mode=([^\s\]]+))?\]/);
                if(!m) m = line.match(/\[n=(.+?)\s+p=(.+?)\s+l=(.+?)(?:\s+mode=(.+?))?\]/);
                if(m) apps.push({ name: m[1], icon: m[2], link: m[3] });
            }
        }
        slidesData = pics; appItems = apps;
        if(slidesData.length) { renderCarousel(); initSwipe(); }
        else carouselSection.style.display = 'none';
        if(appItems.length) { if(appsHeader) appsHeader.style.display = 'flex'; renderApps(appItems); }
        else { appsGrid.innerHTML = '<div class="empty-tip">暂无应用数据</div>'; if(appsHeader) appsHeader.style.display = 'flex'; }
    }
    
    addAppFab.addEventListener('click', showAddAppModal);
    addCarouselFab.addEventListener('click', showAddCarouselModal);
    uploadOnlyBtn.addEventListener('click', showUploadOnlyModal);
    addAppTextBtn.addEventListener('click', showAddAppModal);
    
    // 启动：先处理问候语，再加载配置
    initGreeting().then(() => {
        loadConfigFile();
    });
    window.addEventListener('resize', () => setTimeout(alignSameRowHeights, 100));
</script>
