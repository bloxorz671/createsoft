<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>初二五班智慧应用平台 - 值日提醒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fc;
            font-family: system-ui, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 24px 20px 32px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #eef2f8;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #1e3c72;
            margin-bottom: 8px;
        }
        .greeting {
            font-size: 1.6rem;
            font-weight: 600;
            color: #2b4c8a;
            text-align: center;
            padding: 20px 0;
            background: #eef2ff;
            border-radius: 16px;
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1f2937;
            margin: 20px 0 12px 0;
            padding-left: 8px;
            border-left: 4px solid #2b4c8a;
        }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .app-card {
            background: #f9fafc;
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid #eef2f8;
            cursor: pointer;
        }
        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            background: white;
        }
        .app-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .app-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: #333;
        }
        .footer {
            text-align: center;
            font-size: 0.7rem;
            color: #999;
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid #eef2f8;
        }
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .greeting { font-size: 1.3rem; }
            .apps-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>初二五班智慧应用平台</h1>
        <p style="color: #666; font-size: 0.85rem;">值日提醒</p>
    </div>
    
    <div id="greetingArea" class="greeting">加载中...</div>
    
    <div class="section-title">📱 全部应用</div>
    <div class="apps-grid" id="appsGrid"></div>
    
    <div class="footer">初二五班 · 智慧校园</div>
</div>

<script>
    // 从 URL 获取学号（支持多种格式）
    function getStudentId() {
        const params = new URLSearchParams(window.location.search);
        // 直接参数如 ?20517
        for (let [key, value] of params.entries()) {
            if (key.match(/^\d+$/)) return key;
        }
        if (params.get('p')) return params.get('p');
        if (params.get('id')) return params.get('id');
        // 从路径获取如 /zhiri/20517
        const pathMatch = window.location.pathname.match(/\/(\d+)$/);
        if (pathMatch) return pathMatch[1];
        return null;
    }
    
    // 从 5name.txt 加载姓名映射
    let nameMapping = {};
    
    async function loadNameMapping() {
        try {
            const response = await fetch('https://luckynum.top/5name.txt');
            if (response.ok) {
                const text = await response.text();
                const lines = text.split(/\r?\n/);
                for (let line of lines) {
                    line = line.trim();
                    if (line === '') continue;
                    const firstSpace = line.indexOf(' ');
                    if (firstSpace !== -1) {
                        const id = line.substring(0, firstSpace).trim();
                        const name = line.substring(firstSpace + 1).trim();
                        if (id && name) nameMapping[id] = name;
                    }
                }
            }
        } catch (e) { console.log('无法加载5name.txt'); }
    }
    
    // 显示问候语
    function showGreeting(studentId) {
        const area = document.getElementById('greetingArea');
        if (studentId && nameMapping[studentId]) {
            area.innerHTML = `${nameMapping[studentId]}同学你好`;
        } else if (studentId) {
            area.innerHTML = `${studentId}同学你好`;
        } else {
            area.innerHTML = `同学你好`;
        }
    }
    
    // 应用数据
    const appList = [
        { name: "3月27日作业", icon: "327.jpg", link: "327.jpg" },
        { name: "本周调课", icon: "327调课.jpg", link: "327调课.jpg" },
        { name: "作业提交平台", icon: "homeworkapp.jpg", link: "homeworkapp" },
        { name: "电子值日码", icon: "ezr.jpg", link: "ezr" },
        { name: "生物资料下载", icon: "docx.jpg", link: "【学生】2025学年第二学期八年级总复习生物学练习题.docx" }
    ];
    
    // 渲染应用列表
    function renderApps() {
        const container = document.getElementById('appsGrid');
        if (!container) return;
        
        let html = '';
        for (let app of appList) {
            let iconUrl = app.icon;
            if (iconUrl && !iconUrl.startsWith('http')) {
                iconUrl = `https://luckynum.top/${iconUrl}`;
            }
            let linkUrl = app.link;
            if (linkUrl && !linkUrl.startsWith('http')) {
                linkUrl = `https://luckynum.top/${linkUrl}`;
            }
            html += `
                <div class="app-card" data-link="${escapeHtml(linkUrl)}">
                    <img class="app-icon" src="${escapeHtml(iconUrl)}" onerror="this.src='https://luckynum.top/null.jpg'">
                    <div class="app-name">${escapeHtml(app.name)}</div>
                </div>
            `;
        }
        container.innerHTML = html;
        
        document.querySelectorAll('.app-card').forEach(card => {
            card.addEventListener('click', () => {
                window.open(card.dataset.link, '_blank');
            });
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    // 初始化
    async function init() {
        const studentId = getStudentId();
        await loadNameMapping();
        showGreeting(studentId);
        renderApps();
    }
    
    init();
</script>
</body>
</html>
