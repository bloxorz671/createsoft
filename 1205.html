    var audioContext=null;
    function playBeep() { try{if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume().then(function(){playBeepSound();});else playBeepSound();}catch(e){} }
    function playBeepSound() { try{var n=audioContext.currentTime;var o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.value=600;o.type='square';g.gain.setValueAtTime(0.4,n);g.gain.exponentialRampToValueAtTime(0.001,n+0.12);o.start(n);o.stop(n+0.12);}catch(e){} }

    function extractLastFiveDigits(fc) { var n=fc.match(/\d/g); if(n&&n.length>=5) return n.slice(-5).join(''); var l=fc.slice(-5); if(/^\d{5}$/.test(l)) return l; return fc; }

    function onScanSuccess(fc) { var n=Date.now(); if(n-lastScanTime<SCAN_COOLDOWN) return; lastScanTime=n; playBeep(); var sid=extractLastFiveDigits(fc); if(/^\d{5}$/.test(sid)){saveStudentId(sid);stopScanCamera();document.getElementById('scanModal').classList.remove('show');window.location.href='?p='+sid;}else{document.getElementById('scanStatus').textContent='识别失败，请重试';setTimeout(function(){var s=document.getElementById('scanStatus');if(s)s.textContent='扫描中...';},2000);} }

    async function startScanCamera() {
        if(!scanCodeReader){try{scanCodeReader=new ZXing.BrowserMultiFormatReader();}catch(e){document.getElementById('scanStatus').textContent='扫码库加载失败';return;}}
        if(document.getElementById('scanVideo').srcObject) try{stopScanCamera();}catch(e){}
        document.getElementById('scanStatus').textContent='获取摄像头列表...'; scanningActive=true;
        try{
            var devices=[]; try{devices=await scanCodeReader.listVideoInputDevices();}catch(e){var ts=await navigator.mediaDevices.getUserMedia({video:true});ts.getTracks().forEach(function(t){t.stop();});devices=await scanCodeReader.listVideoInputDevices();}
            if(devices.length===0) throw new Error('未找到摄像头');
            var selectedId=loadDefaultCamera();
            if(!selectedId||!devices.find(function(d){return d.deviceId===selectedId;})){var bc=devices.find(function(d){var l=(d.label||'').toLowerCase();return l.includes('back')||l.includes('rear')||l.includes('后置')||l.includes('environment');});selectedId=bc?bc.deviceId:devices[0].deviceId;saveDefaultCamera(selectedId);}
            var sel=devices.find(function(d){return d.deviceId===selectedId;});
            document.getElementById('scanStatus').textContent='使用: '+(sel?.label?.slice(0,30)||'摄像头');
            await scanCodeReader.decodeFromVideoDevice(selectedId,'scanVideo',function(r,err){if(r&&scanningActive)onScanSuccess(r.getText());if(err&&!(err instanceof ZXing.NotFoundException))console.warn(err);});
        }catch(err){document.getElementById('scanStatus').textContent='摄像头启动失败';console.error(err);}
    }

    function stopScanCamera() { scanningActive=false; if(scanCodeReader) try{scanCodeReader.reset();}catch(e){} var v=document.getElementById('scanVideo'); if(v&&v.srcObject){try{var s=v.srcObject;if(s&&s.getTracks)s.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}catch(e){}} }

    async function scanFromImage(file) {
        if(!file) return; document.getElementById('scanStatus').textContent='处理图片中...';
        try{
            if(scanCodeReader) try{scanCodeReader.reset();}catch(e){}
            var v=document.getElementById('scanVideo'); if(v&&v.srcObject){var os=v.srcObject;if(os&&os.getTracks)os.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}
            var img=new Image(); var iurl=URL.createObjectURL(file);
            await new Promise(function(r,rej){img.onload=r;img.onerror=rej;img.src=iurl;});
            var c=document.createElement('canvas');c.width=img.width;c.height=img.height;
            c.getContext('2d').drawImage(img,0,0,img.width,img.height); URL.revokeObjectURL(iurl);
            v.srcObject=c.captureStream(30); await v.play(); await new Promise(function(r){setTimeout(r,200);});
            document.getElementById('scanStatus').textContent='识别中...';
            var tr=null; try{tr=new ZXing.BrowserMultiFormatReader();}catch(e){document.getElementById('scanStatus').textContent='扫码库加载失败';alert('扫码库加载失败');startScanCamera();return;}
            var result=await tr.decodeFromVideoElement(v);
            if(result&&result.text){playBeep();var sid=extractLastFiveDigits(result.text);if(/^\d{5}$/.test(sid)){saveStudentId(sid);stopScanCamera();document.getElementById('scanModal').classList.remove('show');window.location.href='?p='+sid;}else{document.getElementById('scanStatus').textContent='未识别到有效学号';alert('识别到的内容不是5位数学号：'+sid);startScanCamera();}}
            else{document.getElementById('scanStatus').textContent='未识别到二维码';alert('未识别到二维码');startScanCamera();}
        }catch(err){console.error(err);document.getElementById('scanStatus').textContent='识别失败';alert('识别失败');startScanCamera();}
    }

    // ========== 音频扩展名列表 ==========
    var AUDIO_EXTS = ['mp3','m4a','wav','flac','aac','ogg','wma','opus'];

    // ========== 网页链接扩展名 ==========
    var WEB_EXTS = ['html','htm','php','asp','jsp','aspx','cgi','pl','py','rb','do','action'];

    // ========== 判断是否是网页链接（非文件） ==========
    function isWebLink(url) {
        if(!url) return true;
        // 去掉参数和锚点
        var cleanUrl = url.split('?')[0].split('#')[0];
        // 以 / 结尾 = 目录链接
        if(cleanUrl.endsWith('/')) return true;
        // 提取文件名
        var fn = cleanUrl.split('/').pop();
        // 无扩展名 = 链接
        if(fn.indexOf('.') === -1) return true;
        // 检查扩展名
        var ext = fn.split('.').pop().toLowerCase();
        // 网页后缀 = 链接
        if(WEB_EXTS.indexOf(ext) !== -1) return true;
        // 其他 = 文件
        return false;
    }

    // ========== 判断是否是音频文件 ==========
    function isAudioFile(url) {
        if(!url) return false;
        var fn = url.split('/').pop().split('?')[0];
        var ext = fn.split('.').pop().toLowerCase();
        return AUDIO_EXTS.indexOf(ext) !== -1;
    }

    // ========== 获取文件名 ==========
    function getFileNameFromLink(link) {
        if(!link) return '';
        return link.split('/').pop().split('?')[0];
    }

    // ========== 打开文件：跳转到 filehelper?文件名 ==========
    function openFileWithFilehelper(link) {
        var fileName = getFileNameFromLink(link);
        var encodedFileName = encodeURIComponent(fileName);
        var helperUrl = 'filehelper.html?file=' + encodedFileName;
        console.log('跳转到文件助手:', helperUrl);
        window.location.href = helperUrl;
    }

    // ========== 处理应用点击 ==========
    async function handleAppClick(link, name) {
        var fullUrl = link;
        // 补全相对链接
        if(fullUrl && fullUrl.indexOf('http')!==0 && fullUrl.indexOf('//')!==0) {
            fullUrl = 'https://luckynum.top/' + encodeURIComponent(link);
        }

        // 判断是否是网页链接
        if(isWebLink(link)) {
            // 普通链接 → 新窗口打开
            window.open(fullUrl, '_blank');
            return;
        }

        // 是文件 → 进一步判断
        if(isAudioFile(link)) {
            // 音频 → 内置播放器
            var seriesFiles = await findSeriesFiles(getFileNameFromLink(link), AUDIO_EXTS);
            openAudioViewer(fullUrl, name, seriesFiles);
            return;
        }

        // 所有其他文件 → filehelper
        openFileWithFilehelper(link);
    }

    // ========== 音频查看器 ==========
    function openAudioViewer(url,fileName,seriesFiles) {
        var overlay=document.createElement('div'); overlay.className='file-viewer-overlay';
        var header=document.createElement('div'); header.className='viewer-header';

    // ========== 文件列表相关 ==========
    async function fetchFileList() {
        if(cachedFileList) return cachedFileList;
        if(fileListLoading){ await new Promise(function(r){setTimeout(r,500);}); return cachedFileList; }
        fileListLoading=true;
        try{var r=await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/');if(r.ok){var items=await r.json();cachedFileList=items.filter(function(i){return i.type==='file';}).map(function(i){return i.name;});}else{cachedFileList=[];}}catch(e){cachedFileList=[];}
        fileListLoading=false; return cachedFileList;
    }

    function parseEpisodeInfo(fileName) { var m=fileName.match(/^(.+?)-(\d+)-(.+?)\.([^.]+)$/); if(m) return {seriesName:m[1],episode:parseInt(m[2]),episodeName:m[3],ext:m[4]}; return null; }

    async function findSeriesFiles(currentFileName,allowedExts) {
        if(!allowedExts) allowedExts=['mp3','m4a','wav','flac','aac','mp4','webm','ogg','mov','avi','mkv'];
        var fileList=await fetchFileList(); if(!fileList||fileList.length===0) return [];
        var seriesName=null; var ci=parseEpisodeInfo(currentFileName);
        if(ci) seriesName=ci.seriesName; else seriesName=currentFileName.replace(/\.(mp3|m4a|wav|flac|aac|mp4|webm|ogg|mov|avi|mkv|ogg|wma|opus)$/i,'');
        if(!seriesName) return [{fileName:currentFileName,episode:0,displayName:currentFileName,url:'https://luckynum.top/'+encodeURIComponent(currentFileName)}];
        var sf=[]; fileList.forEach(function(fn){var info=parseEpisodeInfo(fn);if(info&&info.seriesName===seriesName&&allowedExts.indexOf(info.ext)!==-1) sf.push({fileName:fn,episode:info.episode,displayName:info.seriesName+'-'+info.episodeName,url:'https://luckynum.top/'+encodeURIComponent(fn)});});
        sf.sort(function(a,b){return a.episode-b.episode;});
        if(sf.length===0) return [{fileName:currentFileName,episode:0,displayName:currentFileName,url:'https://luckynum.top/'+encodeURIComponent(currentFileName)}];
        return sf;
    }

    // ========== 解析配置文件 ==========
    function parseAppTxt(raw) {
        var lines=raw.split(/\r?\n/); var mode=null; var groups=[],pics=[],apps=[];
        lines.forEach(function(line){
            line=line.trim(); if(!line) return;
            if(line.toLowerCase()==='group'){mode='group';return;}
            if(line.toLowerCase()==='pic'){mode='pic';return;}
            if(line.toLowerCase()==='app'){mode='app';return;}
            if(mode==='group'){var m=line.match(/\[g=([^\]]+)\]/);if(m)groups.push(m[1].trim());}
            else if(mode==='pic'){var m=line.match(/\[p=([^\s\]]+)\s+l=([^\s\]]+)\]/);if(m)pics.push({imgUrl:m[1].trim(),linkUrl:m[2].trim()});}
            else if(mode==='app'){var m=line.match(/\[n=([^\s\]]+)\s+p=([^\s\]]+)\s+l=([^\s\]]+)(?:\s+g=([^\s\]]+))?\]/);if(!m)m=line.match(/\[n=(.+?)\s+p=(.+?)\s+l=(.+?)(?:\s+g=(.+?))?\]/);if(m)apps.push({name:m[1].trim(),icon:m[2].trim(),link:m[3].trim(),group:m[4]?m[4].trim():null});}
        });
        groupOrder=groups.length?groups:['其他应用']; slidesData=pics; appItems=apps;
        renderGroups();
        if(slidesData.length){renderCarousel();startAutoSlide();}else{document.getElementById('carouselSection').style.display='none';}
        document.getElementById('warningBanner').style.display='none';
        handleUrlAppParameter();
    }

        appItems.forEach(function(a){var g=a.group||'其他应用';if(!abg[g])abg[g]=[];abg[g].push(a);});
        var html='';
        for(var i=0;i<groupOrder.length;i++){
            var gn=groupOrder[i]; var apps=abg[gn]||[];
            html+='<div class="group-section" data-group-index="'+i+'"><div class="group-header'+(isEditMode?' draggable':'')+'" data-group="'+escapeHtml(gn)+'"><span class="group-title">'+escapeHtml(gn)+'</span>'+(isEditMode?'<div><button onclick="editGroup(\''+escapeHtml(gn)+'\')">✎</button><button onclick="deleteGroup(\''+escapeHtml(gn)+'\')">🗑</button></div>':'')+'</div><div class="apps-grid" data-group="'+escapeHtml(gn)+'" data-group-index="'+i+'">';
            if(apps.length===0) html+='<div class="empty-group">暂无应用</div>';
            else apps.forEach(function(a){

    async function loadPointsRecords(studentId) {
        try{var r=await fetch(JFFI_FILE_URL+'?t='+Date.now());if(!r.ok)return{records:[],total:0};var t=await r.text();var lines=t.split(/\r?\n/);var recs=[],total=0;
        lines.forEach(function(line){line=line.trim();if(!line)return;var m=line.match(/^(\d{4}\/\d{2}\/\d{2})\s+(\d{2}:\d{2})\s+(\d{5})\s+(.+?)\s+([+-]\d+)$/);if(m){var date=m[1],time=m[2],sid=m[3],event=m[4],scoreStr=m[5];var score=parseInt(scoreStr);if(sid===studentId){recs.push({datetime:date+' '+time,event:event,score:score,isPlus:score>0});total+=score;}}});

    function addApp(){if(!isEditMode){alert('请先开启编辑模式');return;}if(isAddingApp){alert('请稍候...');return;}var m=document.createElement('div');m.className='modal-overlay';var opts=groupOrder.map(function(g){return'<option value="'+escapeHtml(g)+'">'+escapeHtml(g)+'</option>';}).join('');m.innerHTML='<div class="modal-content"><h3>添加新应用</h3><label>应用名称</label><input id="appName" placeholder="应用名称"><label>图标链接</label><input id="iconUrl" placeholder="图标链接"><label>跳转链接</label><input id="appLink" placeholder="https://..."><label>所属分组</label><select id="appGroup">'+opts+'</select><div class="modal-buttons"><button class="confirm-btn">添加</button><button class="cancel-btn">取消</button></div></div>';document.body.appendChild(m);m.classList.add('show');var cb=m.querySelector('.confirm-btn');cb.onclick=async function(){var n=m.querySelector('#appName').value.trim(),i=m.querySelector('#iconUrl').value.trim()||'null.jpg',l=m.querySelector('#appLink').value.trim(),g=m.querySelector('#appGroup').value;if(!n||!l){alert('请填写完整');return;}isAddingApp=true;cb.disabled=true;cb.textContent='保存中...';appItems.push({name:n,icon:i,link:l,group:g});renderGroups();var s=await saveToGitHub(generateFileContent());if(s){m.remove();}else{appItems.pop();renderGroups();alert('保存失败');}isAddingApp=false;cb.disabled=false;};m.querySelector('.cancel-btn').onclick=function(){m.remove();};m.onclick=function(e){if(e.target===m)m.remove();};}

    function addCarousel(){if(!isEditMode){alert('请先开启编辑模式');return;}if(isAddingCarousel){alert('请稍候...');return;}var m=document.createElement('div');m.className='modal-overlay';m.innerHTML='<div class="modal-content"><h3>添加轮播图</h3><input id="imgUrl" placeholder="图片链接"><label>跳转链接</label><input id="linkUrl"><div class="modal-buttons"><button class="confirm-btn">添加</button><button class="cancel-btn">取消</button></div></div>';document.body.appendChild(m);m.classList.add('show');var cb=m.querySelector('.confirm-btn');cb.onclick=async function(){var img=m.querySelector('#imgUrl').value.trim(),link=m.querySelector('#linkUrl').value.trim();if(!img){alert('请填写图片链接');return;}isAddingCarousel=true;cb.disabled=true;cb.textContent='保存中...';slidesData.push({imgUrl:img,linkUrl:link});renderCarousel();var s=await saveToGitHub(generateFileContent());if(s){m.remove();}else{slidesData.pop();renderCarousel();alert('保存失败');}isAddingCarousel=false;cb.disabled=false;};m.querySelector('.cancel-btn').onclick=function(){m.remove();};m.onclick=function(e){if(e.target===m)m.remove();};}

    function addGroup(){if(!isEditMode){alert('请先开启编辑模式');return;}var nn=prompt('请输入分组名称');if(nn&&groupOrder.indexOf(nn)===-1){groupOrder.push(nn);saveToGitHub(generateFileContent()).then(function(){renderGroups();});}else if(nn)alert('分组名称已存在');}

    function generateFileContent(){var c='group\n';for(var i=0;i<groupOrder.length;i++)c+='[g='+groupOrder[i]+']\n';c+='pic\n';for(var i=0;i<slidesData.length;i++)c+='[p='+slidesData[i].imgUrl+' l='+slidesData[i].linkUrl+']\n';c+='app\n';for(var i=0;i<appItems.length;i++)c+='[n='+appItems[i].name+' p='+appItems[i].icon+' l='+appItems[i].link+(appItems[i].group?' g='+appItems[i].group:'')+']\n';return c;}

    async function saveToGitHub(content){if(!currentToken){alert('请先输入Token（点击标题3次）');return false;}try{var sha=fileSha;if(!sha){var cr=await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/'+GITHUB_PATH,{headers:{'Authorization':'Bearer '+currentToken}});if(cr.ok)sha=(await cr.json()).sha;}var r=await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/'+GITHUB_PATH,{method:'PUT',headers:{'Authorization':'Bearer '+currentToken},body:JSON.stringify({message:'更新配置',content:btoa(unescape(encodeURIComponent(content))),branch:'main',sha:sha})});if(!r.ok)throw new Error();fileSha=(await r.json()).content.sha;alert('保存成功！');return true;}catch(e){alert('保存失败: '+e.message);return false;}}

    async function uploadToRoot(file){if(!currentToken){alert('请先输入Token');return null;}try{var reader=new FileReader();var base64=await new Promise(function(r){reader.onload=function(e){r(e.target.result.split(',')[1]);};reader.readAsDataURL(file);});var fn=file.name;var r=await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/'+encodeURIComponent(fn),{method:'PUT',headers:{'Authorization':'Bearer '+currentToken},body:JSON.stringify({message:'上传 '+fn,content:base64,branch:'main'})});if(!r.ok)throw new Error();alert('✅ 上传成功：'+fn);return fn;}catch(e){alert('上传失败');return null;}}

    function uploadFileToRoot(){if(!isEditMode){alert('请先开启编辑模式');return;}var inp=document.createElement('input');inp.type='file';inp.onchange=async function(e){if(e.target.files[0])await uploadToRoot(e.target.files[0]);};inp.click();}

    async function openFileManager(){if(!isEditMode){alert('请先开启编辑模式');return;}var m=document.createElement('div');m.className='modal-overlay';m.innerHTML='<div class="modal-content" style="max-width:500px;"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><h3>📁 文件管理器</h3><button class="cancel-btn" id="closeFileManagerBtn" style="width:auto;padding:5px 15px;">关闭</button></div><div class="current-path" id="currentPath">/</div><div id="fileList" style="max-height:400px;overflow-y:auto;"></div></div>';document.body.appendChild(m);m.classList.add('show');await loadFileList(m);m.querySelector('#closeFileManagerBtn').onclick=function(){m.remove();};m.onclick=function(e){if(e.target===m)m.remove();};}

    async function loadFileList(modal){var fld=modal.querySelector('#fileList');try{var r=await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/',{headers:{'Authorization':'Bearer '+currentToken}});if(!r.ok)throw new Error();var items=await r.json();var html='';for(var i=0;i<items.length;i++){var item=items[i];if(item.type!=='dir'&&item.name.toLowerCase().endsWith('.html'))continue;html+='<div class="file-item '+(item.type==='dir'?'folder':'file')+'"><span>'+escapeHtml(item.name)+'</span><div class="file-actions"><button class="file-action-btn" onclick="copyFileLink(\''+escapeHtml(item.name)+'\')">🔗</button><button class="file-action-btn delete" onclick="deleteFile(\''+escapeHtml(item.name)+'\')">🗑</button></div></div>';}fld.innerHTML=html;}catch(e){fld.innerHTML='<div class="error-tip">加载失败</div>';}}

    window.copyFileLink=function(fn){var ef=encodeURIComponent(fn);navigator.clipboard.writeText('/'+ef+'\nhttps://luckynum.top/'+ef);alert('已复制链接');};
    window.deleteFile=async function(fn){if(!confirm('确定删除 '+fn+' 吗？'))return;try{var cr=await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/'+encodeURIComponent(fn),{headers:{'Authorization':'Bearer '+currentToken}});var d=await cr.json();var r=await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/'+encodeURIComponent(fn),{method:'DELETE',headers:{'Authorization':'Bearer '+currentToken},body:JSON.stringify({message:'删除 '+fn,sha:d.sha,branch:'main'})});if(r.ok){alert('删除成功');var m=document.querySelector('.modal-overlay');if(m)loadFileList(m);}else alert('删除失败');}catch(e){alert('删除失败');}};

    // ========== URL参数处理 ==========
    async function handleUrlAppParameter(){var p=new URLSearchParams(window.location.search);var ap=p.get('app');if(!ap)return;try{ap=decodeURIComponent(ap);}catch(e){}var rc=0;while(appItems.length===0&&rc<30){await new Promise(function(r){setTimeout(r,200);});rc++;}var ta=appItems.find(function(a){return a.name===ap;});if(!ta)ta=appItems.find(function(a){return a.name.toLowerCase().indexOf(ap.toLowerCase())!==-1;});if(ta){setTimeout(function(){handleAppClick(ta.link,ta.name);},500);return;}if(!isWebLink(ap)){if(isAudioFile(ap)){var fu=ap.indexOf('http')===0?ap:'https://luckynum.top/'+ap;var fn=ap.split('/').pop();var sf=await findSeriesFiles(fn);openAudioViewer(fu,fn,sf);return;}openFileWithFilehelper(ap);return;}var fu=ap.indexOf('http')===0?ap:'https://luckynum.top/'+ap;window.open(fu,'_blank');}

    // ========== 事件绑定 ==========
    document.getElementById('refreshBtn').addEventListener('click',refreshConfig);
    document.getElementById('showLoginOptionsBtn').onclick=isTargetDevice?function(){showStudentIdPrompt().then(function(sid){if(sid){saveStudentId(sid);window.location.href='?p='+sid;}});}:showLoginOptions;
    document.getElementById('scanLoginOptionBtn').onclick=function(){hideLoginOptions();showScanModalFunc();};
    document.getElementById('inputIdLoginOptionBtn').onclick=function(){hideLoginOptions();showManualIdInput();};
    document.getElementById('cancelLoginOptionBtn').onclick=hideLoginOptions;
    document.getElementById('loginOptionsModal').onclick=function(e){if(e.target===document.getElementById('loginOptionsModal'))hideLoginOptions();};
    document.getElementById('closeScanModal').addEventListener('click',closeScanModalFunc);
    document.getElementById('scanAlbumBtn').addEventListener('click',function(){document.getElementById('scanAlbumInput').click();});
    document.getElementById('scanAlbumInput').addEventListener('change',function(e){if(e.target.files&&e.target.files[0]){scanFromImage(e.target.files[0]);e.target.value='';}});
    document.getElementById('navHomeBtn').addEventListener('click',showHome);
    document.getElementById('navProfileBtn').addEventListener('click',showProfile);
    document.getElementById('closePointsModal').addEventListener('click',closePointsModalFunc);
    document.getElementById('pointsModal').addEventListener('click',function(e){if(e.target===document.getElementById('pointsModal'))closePointsModalFunc();});
    document.getElementById('addAppFab').addEventListener('click',addApp);
    document.getElementById('addCarouselFab').addEventListener('click',addCarousel);
    document.getElementById('uploadOnlyBtn').addEventListener('click',uploadFileToRoot);
    document.getElementById('fileManagerBtn').addEventListener('click',openFileManager);
    document.getElementById('addGroupFab').addEventListener('click',addGroup);

    var tc=0,tt=null;
    document.getElementById('titleClickTarget').addEventListener('click',function(){tc++;if(tt)clearTimeout(tt);tt=setTimeout(function(){tc=0;},1000);if(tc===3){tc=0;if(isEditMode){alert('编辑模式已开启，无需重复输入Token');return;}showTokenModal();}});

    // ========== 初始化 ==========
    async function init(){await Promise.all([loadConfigFile(),loadNameMapping(),loadIntegralData()]);if(isTargetDevice){await checkUserAgentAndPrompt();await showGreeting();}else{await showGreeting();}showHome();checkAndShowSubscribeModal();}
    init();
    </script>
</body>
