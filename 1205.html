<script>
    // ========== 订阅通知弹窗 ==========
    function checkAndShowSubscribeModal() {
        // 检查是否已经保存了"不再提示"
        const noRemind = localStorage.getItem('subscribe_no_remind');
        if (noRemind === 'true') {
            return;
        }
        
        // 检查用户是否曾经点击过"去订阅"（使用 localStorage 记录）
        const hasClickedSubscribe = localStorage.getItem('has_clicked_subscribe');
        
        const modal = document.getElementById('subscribeModal');
        if (!modal) return;
        
        const subscribeBtn = document.getElementById('subscribeBtn');
        const cancelBtn = document.getElementById('cancelSubscribeBtn');
        const noRemindContainer = document.getElementById('noRemindContainer');
        const noRemindCheckbox = document.getElementById('noRemindCheckbox');
        
        // 重置复选框状态
        if (noRemindCheckbox) noRemindCheckbox.checked = false;
        
        // 如果用户曾经点击过"去订阅"，则显示不再提示选项；否则隐藏
        if (hasClickedSubscribe === 'true') {
            if (noRemindContainer) noRemindContainer.style.display = 'block';
        } else {
            if (noRemindContainer) noRemindContainer.style.display = 'none';
        }
        
        setTimeout(() => {
            modal.classList.add('show');
        }, 500);
        
        // 去订阅 - 记录用户点击过，然后跳转
        subscribeBtn.onclick = () => {
            // 记录用户点击过"去订阅"
            localStorage.setItem('has_clicked_subscribe', 'true');
            // 跳转到订阅页面
            window.location.href = 'notwec';
        };
        
        // 取消 - 直接关闭弹窗
        cancelBtn.onclick = () => {
            modal.classList.remove('show');
        };
        
        // 点击背景关闭
        modal.onclick = (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        };
        
        // 不再提示的复选框变化时保存
        if (noRemindCheckbox) {
            noRemindCheckbox.onchange = (e) => {
                if (e.target.checked) {
                    localStorage.setItem('subscribe_no_remind', 'true');
                } else {
                    localStorage.removeItem('subscribe_no_remind');
                }
            };
        }
    }
    
    // ========== 设备兼容性检测 ==========

    })();
    
    // ========== 配置 ==========
    const CONFIG_URL = 'https://cdn.jsdelivr.net/gh/bloxorz671/createsoft@main/5app.txt';

    let slidesData = [], appItems = [], groupOrder = ['其他应用'], currentIndex = 0, autoInterval = null, totalSlides = 0;

    const RATING_CONFIG = [
        { min: 12, max: Infinity, name: '夯爆了', colorClass: 'level-0' },
        { min: 9, max: 11, name: '顶级', colorClass: 'level-1' },
        { min: 5, max: 8, name: '人上人', colorClass: 'level-2' },
        { min: 1, max: 4, name: 'Npc', colorClass: 'level-3' },
        { min: -Infinity, max: 0, name: '拉完了', colorClass: 'level-4' }
    ];
    
    function getRatingByIntegral(integral) {
        const score = parseInt(integral);
        if (isNaN(score)) return RATING_CONFIG[4];
        for (let config of RATING_CONFIG) {
            if (score >= config.min && score <= config.max) return config;
        }
        return RATING_CONFIG[4];
    }
    
    function saveStudentId(id) {
        if (!id) return;
        try { localStorage.setItem('studentId', id); } catch(e) {}
        try { sessionStorage.setItem('studentId', id); } catch(e) {}
        try { document.cookie = `studentId=${id}; path=/; max-age=${7*24*60*60}`; } catch(e) {}
    }
    
    function getStudentId() {
        const urlParams = new URLSearchParams(window.location.search);
        let id = urlParams.get('p');
        if (id && /^\d{5}$/.test(id)) { saveStudentId(id); return id; }
        try { id = localStorage.getItem('studentId'); if (id && /^\d{5}$/.test(id)) return id; } catch(e) {}
        try { id = sessionStorage.getItem('studentId'); if (id && /^\d{5}$/.test(id)) return id; } catch(e) {}
        try { const match = document.cookie.match(/studentId=([^;]+)/); if (match && /^\d{5}$/.test(match[1])) return match[1]; } catch(e) {}
        return null;
    }
    
    function clearStudentId() {
        try { localStorage.removeItem('studentId'); } catch(e) {}
        try { sessionStorage.removeItem('studentId'); } catch(e) {}
        try { document.cookie = 'studentId=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT'; } catch(e) {}
        currentStudentId = null;
    }
    
    function saveDefaultCamera(deviceId) {
        if (deviceId) {
            try { localStorage.setItem('scan_defaultCameraId', deviceId); } catch(e) {}
            defaultCameraId = deviceId;
        }
    }
    
    function loadDefaultCamera() {
        try { defaultCameraId = localStorage.getItem('scan_defaultCameraId'); } catch(e) {}
        return defaultCameraId;
    }
    
    let audioContext = null;
    function playBeep() {
        try {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume().then(() => playBeepSound());
            else playBeepSound();
        } catch(e) {}
    }
    function playBeepSound() {
        try {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.frequency.value = 600;
            osc.type = 'square';
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } catch(e) {}
    }
    
    function extractLastFiveDigits(fullCode) {
        const numbers = fullCode.match(/\d/g);
        if (numbers && numbers.length >= 5) return numbers.slice(-5).join('');
        const lastFive = fullCode.slice(-5);
        if (/^\d{5}$/.test(lastFive)) return lastFive;
        return fullCode;
    }
    
    function onScanSuccess(fullCode) {
        const now = Date.now();
        if (now - lastScanTime < SCAN_COOLDOWN) return;
        lastScanTime = now;
        playBeep();
        const studentId = extractLastFiveDigits(fullCode);
        if (/^\d{5}$/.test(studentId)) {
            saveStudentId(studentId);
            stopScanCamera();
            scanModal.classList.remove('show');
            window.location.href = `?p=${studentId}`;
        } else {
            scanStatus.textContent = '识别失败，请重试';
            setTimeout(() => { if (scanStatus) scanStatus.textContent = '扫描中...'; }, 2000);
        }
    }
    
    async function startScanCamera() {
        if (!scanCodeReader) {
            try { scanCodeReader = new ZXing.BrowserMultiFormatReader(); } catch(e) {
                scanStatus.textContent = '扫码库加载失败';
                return;
            }
        }
        if (scanVideo && scanVideo.srcObject) { try { stopScanCamera(); } catch(e) {} }
        scanStatus.textContent = '获取摄像头列表...';
        scanningActive = true;
        try {
            let devices = [];
            try { devices = await scanCodeReader.listVideoInputDevices(); } catch(e) {
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                tempStream.getTracks().forEach(t => t.stop());
                devices = await scanCodeReader.listVideoInputDevices();
            }
            if (devices.length === 0) throw new Error('未找到摄像头');
            let selectedId = loadDefaultCamera();
            if (!selectedId || !devices.find(d => d.deviceId === selectedId)) {
                const backCam = devices.find(d => {
                    const label = (d.label || '').toLowerCase();
                    return label.includes('back') || label.includes('rear') || label.includes('后置') || label.includes('environment');
                });
                selectedId = backCam ? backCam.deviceId : devices[0].deviceId;
                saveDefaultCamera(selectedId);
            }
            const selected = devices.find(d => d.deviceId === selectedId);
            scanStatus.textContent = `使用: ${selected?.label?.slice(0, 30) || '摄像头'}`;
            await scanCodeReader.decodeFromVideoDevice(selectedId, 'scanVideo', (result, err) => {
                if (result && scanningActive) onScanSuccess(result.getText());
                if (err && !(err instanceof ZXing.NotFoundException)) console.warn(err);
            });
        } catch(err) {
            scanStatus.textContent = '摄像头启动失败';
            console.error(err);
        }
    }
    
    function stopScanCamera() {
        scanningActive = false;
        if (scanCodeReader) { try { scanCodeReader.reset(); } catch(e) {} }
        if (scanVideo && scanVideo.srcObject) {
            try {
                const stream = scanVideo.srcObject;
                if (stream && stream.getTracks) stream.getTracks().forEach(t => t.stop());
                scanVideo.srcObject = null;
            } catch(e) {}
        }
    }
    
    async function scanFromImage(file) {
        if (!file) return;
        if (scanStatus) scanStatus.textContent = '处理图片中...';
        try {
            if (scanCodeReader) { try { scanCodeReader.reset(); } catch(e) {} }
            if (scanVideo && scanVideo.srcObject) {
                const oldStream = scanVideo.srcObject;
                if (oldStream && oldStream.getTracks) oldStream.getTracks().forEach(t => t.stop());
                scanVideo.srcObject = null;
            }
            const img = new Image();
            const imageUrl = URL.createObjectURL(file);
            await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = imageUrl; });
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, img.width, img.height);
            URL.revokeObjectURL(imageUrl);
            const canvasStream = canvas.captureStream(30);
            scanVideo.srcObject = canvasStream;
            await scanVideo.play();
            await new Promise(r => setTimeout(r, 200));
            if (scanStatus) scanStatus.textContent = '识别中...';
            let tempReader = null;
            try { tempReader = new ZXing.BrowserMultiFormatReader(); } catch(e) {
                scanStatus.textContent = '扫码库加载失败';
                alert('扫码库加载失败，请刷新页面重试');
                startScanCamera();
                return;
            }
            const result = await tempReader.decodeFromVideoElement(scanVideo);
            if (result && result.text) {
                playBeep();

    async function fetchFileList() {
        if (cachedFileList) return cachedFileList;
        if (fileListLoading) {
            await new Promise(r => setTimeout(r, 500));
            return cachedFileList;
        }
        fileListLoading = true;
        try {
            const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`;
            const response = await fetch(url);
            if (response.ok) {
                const items = await response.json();
                cachedFileList = items.filter(item => item.type === 'file').map(item => item.name);
                console.log('获取文件列表成功，共', cachedFileList.length, '个文件');
            } else {
                console.warn('获取文件列表失败，状态码:', response.status);
                cachedFileList = [];
            }
        } catch(e) {
            console.warn('获取文件列表失败:', e);
            cachedFileList = [];
        }
        fileListLoading = false;
        return cachedFileList;
    }
    
    function parseEpisodeInfo(fileName) {
        const match = fileName.match(/^(.+?)-(\d+)-(.+?)\.([^.]+)$/);
        if (match) {
            return { 
                seriesName: match[1],
                episode: parseInt(match[2]),
                episodeName: match[3],
                ext: match[4]
            };
        }
        return null;
    }
    
    async function findSeriesFiles(currentFileName, allowedExts = ['mp3', 'm4a', 'wav', 'flac', 'aac', 'mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv']) {
        const fileList = await fetchFileList();
        if (!fileList || fileList.length === 0) {
            console.log('文件列表为空');
            return [];
        }
        
        let seriesName = null;
        let currentInfo = parseEpisodeInfo(currentFileName);
        
        if (currentInfo) {
            seriesName = currentInfo.seriesName;
            console.log('解析到完整格式，系列名:', seriesName);
        } else {
            let nameWithoutExt = currentFileName.replace(/\.(mp3|m4a|wav|flac|aac|mp4|webm|ogg|mov|avi|mkv)$/i, '');
            seriesName = nameWithoutExt;
            console.log('解析到简单文件名，提取系列名:', seriesName);
        }
        
        if (!seriesName) {
            console.log('无法提取系列名:', currentFileName);
            return [{ fileName: currentFileName, episode: 0, displayName: currentFileName, url: `https://luckynum.top/${currentFileName}` }];
        }
        
        const seriesFiles = [];
        for (const fileName of fileList) {
            const info = parseEpisodeInfo(fileName);
            if (info && info.seriesName === seriesName && allowedExts.includes(info.ext)) {
                seriesFiles.push({
                    fileName: fileName,
                    episode: info.episode,
                    displayName: `${info.seriesName}-${info.episodeName}`,
                    url: `https://luckynum.top/${fileName}`
                });
            }
        }
        seriesFiles.sort((a, b) => a.episode - b.episode);
        
        if (seriesFiles.length === 0) {
            console.log('未找到同系列文件，只显示当前文件');
            return [{ fileName: currentFileName, episode: 0, displayName: currentFileName, url: `https://luckynum.top/${currentFileName}` }];
        }
        
        console.log('找到同系列文件', seriesFiles.length, '个:', seriesFiles);
        return seriesFiles;
    }

    function createZoomableImage(url, fileName) {
        const container = document.createElement('div');
        container.className = 'image-container';
        const img = document.createElement('img');
        img.src = url;
        img.className = 'zoomable-image';
        img.style.transform = 'translate(0px, 0px) scale(1)';
        container.appendChild(img);
        
        let scale = 1, translateX = 0, translateY = 0;
        let initialDistance = 0, initialScale = 1, lastTouchX = 0, lastTouchY = 0, isPanning = false;
        
        const updateTransform = () => { img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; };
        const clampTranslate = () => {
            const rect = img.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const maxX = Math.max(0, (rect.width * scale - containerRect.width) / 2);
            const maxY = Math.max(0, (rect.height * scale - containerRect.height) / 2);
            translateX = Math.min(maxX, Math.max(-maxX, translateX));
            translateY = Math.min(maxY, Math.max(-maxY, translateY));
        };
        const zoomIn = () => { scale = Math.min(scale + 0.25, 4); clampTranslate(); updateTransform(); };
        const zoomOut = () => { scale = Math.max(scale - 0.25, 1); if (scale === 1) { translateX = 0; translateY = 0; } else clampTranslate(); updateTransform(); };
        const resetZoom = () => { scale = 1; translateX = 0; translateY = 0; updateTransform(); };
        
        img.addEventListener('wheel', (e) => { e.preventDefault(); e.deltaY < 0 ? zoomIn() : zoomOut(); });
        
        let isDragging = false, dragStartX = 0, dragStartY = 0, startTranslateX = 0, startTranslateY = 0;
        img.addEventListener('mousedown', (e) => {
            if (scale > 1) {
                isDragging = true;
                dragStartX = e.clientX; dragStartY = e.clientY;
                startTranslateX = translateX; startTranslateY = translateY;
                img.style.cursor = 'grabbing';
                e.preventDefault();
            }
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging && scale > 1) {
                translateX = startTranslateX + (e.clientX - dragStartX);
                translateY = startTranslateY + (e.clientY - dragStartY);
                clampTranslate(); updateTransform();
            }
        });
        document.addEventListener('mouseup', () => { isDragging = false; if (scale > 1) img.style.cursor = 'grab'; });
        
        const getDistance = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        const getCenter = (t) => ({ x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 });
        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touches = Array.from(e.touches);
            if (touches.length === 1) {
                isPanning = true;
                lastTouchX = touches[0].clientX; lastTouchY = touches[0].clientY;
            } else if (touches.length === 2) {
                initialDistance = getDistance(touches);
                initialScale = scale;
                const center = getCenter(touches);
                lastTouchX = center.x; lastTouchY = center.y;
            }
        });
        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touches = Array.from(e.touches);
            if (touches.length === 1 && isPanning && scale > 1) {
                translateX += touches[0].clientX - lastTouchX;
                translateY += touches[0].clientY - lastTouchY;
                clampTranslate(); updateTransform();
                lastTouchX = touches[0].clientX; lastTouchY = touches[0].clientY;
            } else if (touches.length === 2) {
                const newDistance = getDistance(touches);
                const newScale = initialScale * (newDistance / initialDistance);
                scale = Math.min(Math.max(newScale, 1), 4);
                if (scale === 1) { translateX = 0; translateY = 0; } else {
                    const newCenter = getCenter(touches);
                    translateX += newCenter.x - lastTouchX;
                    translateY += newCenter.y - lastTouchY;
                    clampTranslate();
                    lastTouchX = newCenter.x; lastTouchY = newCenter.y;
                }
                updateTransform();
                initialDistance = newDistance; initialScale = scale;
            }
        });
        container.addEventListener('touchend', () => { isPanning = false; });
        
        img.onerror = () => {
            container.innerHTML = `<div class="unsupported-view"><h2>🖼️ 图片加载失败</h2><p>该图片无法显示</p><button class="fallback-download">📥 立即下载</button></div>`;
            container.querySelector('.fallback-download').onclick = () => downloadFile(url, fileName);
        };
        return { container, zoomIn, zoomOut, resetZoom };
    }

    function isFileUrl(url) {
        if (!url) return false;
        let path = url.split('?')[0].split('#')[0];
        let ext = path.split('.').pop().toLowerCase();
        const fileExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico', 'mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv', 'mp3', 'm4a', 'wav', 'flac', 'aac'];
        return fileExts.includes(ext);
    }
    
    function getFileType(url) {
        if (!url) return 'link';
        let ext = url.split('.').pop().toLowerCase();
        if (['jpg','jpeg','png','gif','webp','bmp','svg','ico'].includes(ext)) return 'image';
        if (['mp4','webm','ogg','mov','avi','mkv'].includes(ext)) return 'video';
        if (['mp3','m4a','wav','flac','aac'].includes(ext)) return 'audio';
        return 'file';
    }
    
    async function handleAppClick(link, name) {
        let fullUrl = link;
        if (fullUrl && !fullUrl.startsWith('http') && !fullUrl.startsWith('//')) {
            fullUrl = `https://luckynum.top/${fullUrl}`;
        }
        
        if (isFileUrl(link)) {
            const fileType = getFileType(link);
            const fileName = link.split('/').pop();
            
            if (fileType === 'image') {
                openImageViewer(fullUrl, name);
                return;
            }
            if (fileType === 'video') {
                const seriesFiles = await findSeriesFiles(fileName, ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv']);
                openVideoViewer(fullUrl, name, seriesFiles);
                return;
            }
            if (fileType === 'audio') {
                const seriesFiles = await findSeriesFiles(fileName, ['mp3', 'm4a', 'wav', 'flac', 'aac']);
                openAudioViewer(fullUrl, name, seriesFiles);
                return;
            }
            showUnsupportedDialog(fullUrl, name);
            return;
        }
        window.open(fullUrl, '_blank');
    }
    
    async function handleUrlAppParameter() {
        const urlParams = new URLSearchParams(window.location.search);
        let appParam = urlParams.get('app');
        if (!appParam) return;
        try { appParam = decodeURIComponent(appParam); } catch(e) {}
        let retryCount = 0;
        while (appItems.length === 0 && retryCount < 30) {
            await new Promise(r => setTimeout(r, 200));
            retryCount++;
        }
        let targetApp = appItems.find(app => app.name === appParam);
        if (!targetApp) {
            targetApp = appItems.find(app => app.name.toLowerCase().includes(appParam.toLowerCase()));
        }
        if (targetApp) {
            setTimeout(() => { handleAppClick(targetApp.link, targetApp.name); }, 500);
            return;
        }
        if (isFileUrl(appParam)) {
            const fileType = getFileType(appParam);
            const fileName = appParam.split('/').pop();
            let fullUrl = appParam;
            if (!fullUrl.startsWith('http')) fullUrl = `https://luckynum.top/${fullUrl}`;
            if (fileType === 'image') { openImageViewer(fullUrl, fileName); return; }
            if (fileType === 'video') {
                const seriesFiles = await findSeriesFiles(fileName, ['mp4', 'webm', 'ogg', 'mov', 'avi', 'mkv']);
                openVideoViewer(fullUrl, fileName, seriesFiles);
                return;
            }
            if (fileType === 'audio') {
                const seriesFiles = await findSeriesFiles(fileName, ['mp3', 'm4a', 'wav', 'flac', 'aac']);
                openAudioViewer(fullUrl, fileName, seriesFiles);
                return;
            }
            showUnsupportedDialog(fullUrl, fileName);
            return;
        }
        alert(`❌ 应用/文件不存在或已被删除\n\n"${appParam}"`);
    }
    
    function parseAppTxt(raw) {
        const lines = raw.split(/\r?\n/);
        let mode = null;
        let groups = [], pics = [], apps = [];
        for (let line of lines) {
            line = line.trim();
            if (line === '') continue;
            if (line.toLowerCase() === 'group') { mode = 'group'; continue; }
            if (line.toLowerCase() === 'pic') { mode = 'pic'; continue; }
            if (line.toLowerCase() === 'app') { mode = 'app'; continue; }
            if (mode === 'group') {
                let m = line.match(/\[g=([^\]]+)\]/);
                if (m) groups.push(m[1].trim());
            } else if (mode === 'pic') {
                let m = line.match(/\[p=([^\s\]]+)\s+l=([^\s\]]+)\]/);
                if (m) pics.push({ imgUrl: m[1].trim(), linkUrl: m[2].trim() });
            } else if (mode === 'app') {
                let m = line.match(/\[n=([^\s\]]+)\s+p=([^\s\]]+)\s+l=([^\s\]]+)(?:\s+g=([^\s\]]+))?\]/);
                if (!m) m = line.match(/\[n=(.+?)\s+p=(.+?)\s+l=(.+?)(?:\s+g=(.+?))?\]/);
                if (m) apps.push({ name: m[1].trim(), icon: m[2].trim(), link: m[3].trim(), group: m[4] ? m[4].trim() : null });
            }
        }
        groupOrder = groups.length ? groups : ['其他应用'];
        slidesData = pics;
        appItems = apps;
        renderGroups();
        if (slidesData.length) { renderCarousel(); startAutoSlide(); }
        else carouselSection.style.display = 'none';
        warningBanner.style.display = 'none';
        handleUrlAppParameter();
    }

            appsByGroup[group].push(app);
        }

                </div>

            else for (let app of apps) {

                if (icon && !icon.startsWith('http')) icon = `https://luckynum.top/${icon}`;

    function initDragSort() {
        const groupHeaders = document.querySelectorAll('.group-header.draggable');
        groupHeaders.forEach(header => {
            header.setAttribute('draggable', 'true');

            };
            header.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
            header.ondrop = async (e) => {
                e.preventDefault();
                const targetGroup = header.closest('.group-section');

                if (draggedGroupIndex !== null && draggedGroupIndex !== targetIndex) {
                    const movedGroup = groupOrder[draggedGroupIndex];
                    groupOrder.splice(draggedGroupIndex, 1);
                    groupOrder.splice(targetIndex, 0, movedGroup);
                    if (await saveToGitHub(generateFileContent())) renderGroups();

                draggedGroupIndex = null;
            };
        });
        
        const appCards = document.querySelectorAll('.app-card');

                    icon: card.dataset.appIcon,

                e.dataTransfer.effectAllowed = 'move';
                card.classList.add('dragging');
            };
            dragHandle.ondragend = () => { card.classList.remove('dragging'); draggedAppData = null; };
        });
        
        const appGrids = document.querySelectorAll('.apps-grid');
        appGrids.forEach(grid => {
            grid.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
            grid.ondrop = async (e) => {

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
    
    async function loadPointsRecords(studentId) {
        try {
            const response = await fetch(JFFI_FILE_URL + '?t=' + Date.now());
            if (!response.ok) return { records: [], total: 0 };
            const text = await response.text();
            const lines = text.split(/\r?\n/);
            const records = [];
            let total = 0;
            for (let line of lines) {
                line = line.trim();
                if (line === '') continue;
                const regex = /^(\d{4}\/\d{2}\/\d{2})\s+(\d{2}:\d{2})\s+(\d{5})\s+(.+?)\s+([+-]\d+)$/;
                const match = line.match(regex);
                if (match) {
                    const date = match[1], time = match[2], sid = match[3], event = match[4], scoreStr = match[5];
                    const score = parseInt(scoreStr);
                    if (sid === studentId) {
                        records.push({ datetime: `${date} ${time}`, event: event, score: score, isPlus: score > 0 });
                        total += score;
                    }
                }
            }
            records.sort((a, b) => new Date(b.datetime) - new Date(a.datetime));
            return { records, total };
        } catch (e) { return { records: [], total: 0 }; }
    }

    window.deleteApp = async function(name, link) { if (!isEditMode) { alert('请先点击标题3次输入Token开启编辑模式'); return; } if (confirm('确定删除这个应用吗？')) { const index = appItems.findIndex(a => a.name === name && a.link === link); if (index !== -1) appItems.splice(index, 1); if (await saveToGitHub(generateFileContent())) { renderGroups(); } } };
    
    function addApp() { if (!isEditMode) { alert('请先点击标题3次输入Token开启编辑模式'); return; } if (isAddingApp) { alert('请稍候...'); return; } const modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.innerHTML = `<div class="modal-content"><h3>添加新应用</h3><label>应用名称</label><input id="appName" placeholder="应用名称"><label>图标链接</label><input id="iconUrl" placeholder="图标链接"><label>跳转链接</label><input id="appLink" placeholder="https://..."><label>所属分组</label><select id="appGroup">${groupOrder.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')}</select><div class="modal-buttons"><button class="confirm-btn">添加</button><button class="cancel-btn">取消</button></div></div>`; document.body.appendChild(modal); modal.classList.add('show'); const confirmBtn = modal.querySelector('.confirm-btn'); const cancelBtn = modal.querySelector('.cancel-btn'); confirmBtn.onclick = async () => { const name = modal.querySelector('#appName').value.trim(); const icon = modal.querySelector('#iconUrl').value.trim() || 'null.jpg'; const link = modal.querySelector('#appLink').value.trim(); const group = modal.querySelector('#appGroup').value; if (!name || !link) { alert('请填写完整'); return; } isAddingApp = true; confirmBtn.disabled = true; confirmBtn.textContent = '保存中...'; appItems.push({ name, icon, link, group }); renderGroups(); const success = await saveToGitHub(generateFileContent()); if (success) { modal.remove(); } else { appItems.pop(); renderGroups(); alert('保存失败'); } confirmBtn.disabled = false; isAddingApp = false; }; cancelBtn.onclick = () => modal.remove(); modal.onclick = (e) => { if (e.target === modal) modal.remove(); }; };
    
    function addCarousel() { if (!isEditMode) { alert('请先点击标题3次输入Token开启编辑模式'); return; } if (isAddingCarousel) { alert('请稍候...'); return; } const modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.innerHTML = `<div class="modal-content"><h3>添加轮播图</h3><input id="imgUrl" placeholder="图片链接"><label>跳转链接</label><input id="linkUrl"><div class="modal-buttons"><button class="confirm-btn">添加</button><button class="cancel-btn">取消</button></div></div>`; document.body.appendChild(modal); modal.classList.add('show'); const confirmBtn = modal.querySelector('.confirm-btn'); const cancelBtn = modal.querySelector('.cancel-btn'); confirmBtn.onclick = async () => { const img = modal.querySelector('#imgUrl').value.trim(); const link = modal.querySelector('#linkUrl').value.trim(); if (!img) { alert('请填写图片链接'); return; } isAddingCarousel = true; confirmBtn.disabled = true; confirmBtn.textContent = '保存中...'; slidesData.push({ imgUrl: img, linkUrl: link }); renderCarousel(); const success = await saveToGitHub(generateFileContent()); if (success) { modal.remove(); } else { slidesData.pop(); renderCarousel(); alert('保存失败'); } confirmBtn.disabled = false; isAddingCarousel = false; }; cancelBtn.onclick = () => modal.remove(); modal.onclick = (e) => { if (e.target === modal) modal.remove(); }; };
    
    function addGroup() { if (!isEditMode) { alert('请先点击标题3次输入Token开启编辑模式'); return; } const newName = prompt('请输入分组名称'); if (newName && !groupOrder.includes(newName)) { groupOrder.push(newName); saveToGitHub(generateFileContent()).then(() => { renderGroups(); }); } else if (newName) alert('分组名称已存在'); }
    function generateFileContent() { let content = 'group\n'; for(let g of groupOrder) content += `[g=${g}]\n`; content += 'pic\n'; for(let s of slidesData) content += `[p=${s.imgUrl} l=${s.linkUrl}]\n`; content += 'app\n'; for(let a of appItems) content += `[n=${a.name} p=${a.icon} l=${a.link}${a.group ? ` g=${a.group}` : ''}]\n`; return content; }
    
    async function saveToGitHub(content) { if (!currentToken) { alert('请先输入Token（点击标题3次）'); return false; } try { let sha = fileSha; if (!sha) { const check = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, { headers: { 'Authorization': `Bearer ${currentToken}` } }); if (check.ok) sha = (await check.json()).sha; } const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${currentToken}` }, body: JSON.stringify({ message: '更新配置', content: btoa(unescape(encodeURIComponent(content))), branch: 'main', sha }) }); if (!res.ok) throw new Error(); fileSha = (await res.json()).content.sha; alert('保存成功！'); return true; } catch(e) { alert('保存失败: ' + e.message); return false; } }
    
    async function uploadToRoot(file) { if (!currentToken) { alert('请先输入Token'); return null; } try { const reader = new FileReader(); const base64 = await new Promise(r => { reader.onload = e => r(e.target.result.split(',')[1]); reader.readAsDataURL(file); }); const fileName = file.name; const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fileName}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${currentToken}` }, body: JSON.stringify({ message: `上传 ${fileName}`, content: base64, branch: 'main' }) }); if(!res.ok) throw new Error(); alert(`✅ 上传成功：${fileName}`); return fileName; } catch(e) { alert('上传失败'); return null; } }
    
    function uploadFileToRoot() { if (!isEditMode) { alert('请先点击标题3次输入Token开启编辑模式'); return; } const input = document.createElement('input'); input.type = 'file'; input.onchange = async (e) => { const file = e.target.files[0]; if (file) await uploadToRoot(file); }; input.click(); }
    
    async function openFileManager() { if (!isEditMode) { alert('请先点击标题3次输入Token开启编辑模式'); return; } const modal = document.createElement('div'); modal.className = 'modal-overlay'; modal.innerHTML = `<div class="modal-content" style="max-width:500px;"><div class="file-manager-header" style="display:flex; justify-content:space-between; margin-bottom:12px;"><h3>📁 文件管理器</h3><button class="cancel-btn" id="closeFileManagerBtn" style="width:auto; padding:5px 15px;">关闭</button></div><div class="current-path" id="currentPath">/</div><div id="fileList" class="file-manager" style="max-height:400px; overflow-y:auto;"></div></div>`; document.body.appendChild(modal); modal.classList.add('show'); await loadFileList(modal); modal.querySelector('#closeFileManagerBtn').onclick = () => modal.remove(); modal.onclick = (e) => { if (e.target === modal) modal.remove(); }; }
    
    async function loadFileList(modal) { const fileListDiv = modal.querySelector('#fileList'); try { const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/`, { headers: { 'Authorization': `Bearer ${currentToken}` } }); if(!res.ok) throw new Error(); const items = await res.json(); let html = ''; for(let item of items) { const name = item.name; const isFolder = item.type === 'dir'; if(!isFolder && name.toLowerCase().endsWith('.html')) continue; html += `<div class="file-item ${isFolder ? 'folder' : 'file'}"><span>${escapeHtml(name)}</span><div class="file-actions"><button class="file-action-btn" onclick="copyFileLink('${name}')">🔗</button><button class="file-action-btn delete" onclick="deleteFile('${name}')">🗑</button></div></div>`; } fileListDiv.innerHTML = html; } catch(e) { fileListDiv.innerHTML = '<div class="error-tip">加载失败</div>'; } }
    
    window.copyFileLink = function(fileName) { const innerLink = `/${fileName}`; const outerLink = `https://luckynum.top/${fileName}`; navigator.clipboard.writeText(`${innerLink}\n${outerLink}`); alert('已复制链接'); };
    
    window.deleteFile = async function(fileName) { if (!confirm(`确定删除 ${fileName} 吗？`)) return; try { const checkRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fileName}`, { headers: { 'Authorization': `Bearer ${currentToken}` } }); const data = await checkRes.json(); const sha = data.sha; const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${fileName}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${currentToken}` }, body: JSON.stringify({ message: `删除 ${fileName}`, sha, branch: 'main' }) }); if(res.ok) { alert('删除成功'); const modal = document.querySelector('.modal-overlay'); if(modal) loadFileList(modal); } else alert('删除失败'); } catch(e) { alert('删除失败'); } };
    
    document.getElementById('addAppFab')?.addEventListener('click', addApp);
    document.getElementById('addCarouselFab')?.addEventListener('click', addCarousel);
    document.getElementById('uploadOnlyBtn')?.addEventListener('click', uploadFileToRoot);
    document.getElementById('fileManagerBtn')?.addEventListener('click', openFileManager);
    document.getElementById('addGroupFab')?.addEventListener('click', addGroup);
    
    if (closeScanModal) closeScanModal.addEventListener('click', closeScanModalFunc);
    if (scanAlbumBtn) scanAlbumBtn.addEventListener('click', () => scanAlbumInput?.click());
    if (scanAlbumInput) scanAlbumInput.addEventListener('change', (e) => { if (e.target.files && e.target.files[0]) { scanFromImage(e.target.files[0]); } scanAlbumInput.value = ''; });
    if (navHomeBtn) navHomeBtn.addEventListener('click', showHome);
    if (navProfileBtn) navProfileBtn.addEventListener('click', showProfile);
    if (closePointsModal) closePointsModal.addEventListener('click', closePointsModalFunc);
    if (pointsModal) pointsModal.addEventListener('click', (e) => { if (e.target === pointsModal) closePointsModalFunc(); });
    
    async function init() {
        await Promise.all([loadConfigFile(), loadNameMapping(), loadIntegralData()]);
        if (isTargetDevice) { await checkUserAgentAndPrompt(); await showGreeting(); }
        else { await showGreeting(); }
        showHome();
        checkAndShowSubscribeModal();
    }
    init();
</script>
</body>
</html>
