<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>302</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    (function() {
      // 目标基础域名（干净，无多余斜杠）
      const targetBase = 'https://class.luckynum.top';
      
      // 拼接跳转地址：仅使用域名 + 查询参数 + 哈希，完全抹除路径
      function buildRedirectUrl() {
        try {
          let base = targetBase.replace(/\/+$/, '');
          // 只拼接 search (?参数) 和 hash (#锚点)，忽略 pathname
          return base + window.location.search + window.location.hash;
        } catch (e) {
          return targetBase;
        }
      }
      
      const redirectUrl = buildRedirectUrl();
      
      // 立即执行静默重定向
      window.location.replace(redirectUrl);
    })();
  </script>
</body>
</html>
