<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>评级样式预览 - 初二五班</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #f0f2f5;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        h1 {
            font-size: 1.6rem;
            color: #1e3c72;
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #eef2f8;
        }
        
        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 评分卡片样式 */
        .rating-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fc;
            border-radius: 16px;
        }
        
        .rating-label {
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            width: 60px;
        }
        
        /* 评级框样式 - 带填充色和边框 */
        .rating-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            border: 2px solid;
            border-radius: 8px;
            min-width: 100px;
        }
        
        /* 积分显示区域 */
        .score-area {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        
        .score-label {
            font-size: 0.9rem;
            color: #666;
        }
        
        .score-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2b4c8a;
        }
        
        /* 各评级颜色配置 */
        .rating-box.level-0 { 
            background: #e74c3c; 
            border-color: #c0392b; 
        }
        .rating-box.level-1 { 
            background: #f39c12; 
            border-color: #e67e22; 
        }
        .rating-box.level-2 { 
            background: #f1c40f; 
            border-color: #d4ac0d; 
            color: #8B6914;
        }
        .rating-box.level-3 { 
            background: #fdebd0; 
            border-color: #e6b0aa; 
            color: #c0392b;
        }
        .rating-box.level-4 { 
            background: #95a5a6; 
            border-color: #7f8c8d; 
        }
        
        /* 说明区域 */
        .note {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eef2f8;
            font-size: 0.8rem;
            color: #999;
            text-align: center;
        }
        
        .score-demo {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-left: auto;
        }
        
        @media (max-width: 500px) {
            .rating-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .rating-label {
                width: auto;
            }
            .score-demo {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⭐ 评级样式预览</h1>
    
    <div class="preview-list">
        <!-- 夯爆了 80分以上 -->
        <div class="rating-item">
            <span class="rating-label">80分以上</span>
            <div class="rating-box level-0">夯爆了</div>
            <div class="score-demo">
                <span class="score-label">分数</span>
                <span class="score-number">95</span>
            </div>
        </div>
        
        <!-- 顶级 60-79分 -->
        <div class="rating-item">
            <span class="rating-label">60-79分</span>
            <div class="rating-box level-1">顶级</div>
            <div class="score-demo">
                <span class="score-label">分数</span>
                <span class="score-number">72</span>
            </div>
        </div>
        
        <!-- 人上人 40-59分 -->
        <div class="rating-item">
            <span class="rating-label">40-59分</span>
            <div class="rating-box level-2">人上人</div>
            <div class="score-demo">
                <span class="score-label">分数</span>
                <span class="score-number">55</span>
            </div>
        </div>
        
        <!-- Npc 20-39分 -->
        <div class="rating-item">
            <span class="rating-label">20-39分</span>
            <div class="rating-box level-3">Npc</div>
            <div class="score-demo">
                <span class="score-label">分数</span>
                <span class="score-number">30</span>
            </div>
        </div>
        
        <!-- 拉完了 0-19分 -->
        <div class="rating-item">
            <span class="rating-label">0-19分</span>
            <div class="rating-box level-4">拉完了</div>
            <div class="score-demo">
                <span class="score-label">分数</span>
                <span class="score-number">8</span>
            </div>
        </div>
    </div>
    
    <div class="note">
        ✅ 每个评级都有独立的填充色矩形框<br>
        ✅ 框内文字为白色（人上人因黄色背景较亮，文字用深色）<br>
        ✅ 框后面显示"分数 XX"<br>
        ✅ Npc 使用浅肉色背景 + 深红边框
    </div>
</div>
</body>
</html>
