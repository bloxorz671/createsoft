<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>302</title>
  <style>
    /* 极简白底，无任何可见UI */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    (function() {
      // 目标基础域名
      const targetBase = 'https://class.luckynum.top';
      
      // 拼接完整跳转地址：保留当前路径、参数、哈希
      function buildRedirectUrl() {
        try {
          let base = targetBase.replace(/\/+$/, '');
          let path = window.location.pathname;
          if (!path.startsWith('/')) path = '/' + path;
          return base + path + window.location.search + window.location.hash;
        } catch (e) {
          return targetBase;
        }
      }
      
      const redirectUrl = buildRedirectUrl();
      
      // 尽快执行重定向——使用 replace 避免留下历史记录
      // 直接将浏览器导向目标地址，省略任何延迟和UI渲染
      window.location.replace(redirectUrl);
    })();
  </script>
</body>
</html>
