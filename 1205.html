    <script>
        // ========== 全局错误处理 ==========
        window.addEventListener('error', function(e) {
            console.error('全局错误:', e.message, e.filename, e.lineno, e.colno);

        // ========== 订阅通知弹窗 ==========
        function checkAndShowSubscribeModal() {
            var noRemind = localStorage.getItem('subscribe_no_remind');
            if (noRemind === 'true') return;
            var modal = document.getElementById('subscribeModal');
            if (!modal) return;
            var subscribeBtn = document.getElementById('subscribeBtn');
            var cancelBtn = document.getElementById('cancelSubscribeBtn');
            var noRemindContainer = document.getElementById('noRemindContainer');
            var noRemindCheckbox = document.getElementById('noRemindCheckbox');
            if (noRemindCheckbox) noRemindCheckbox.checked = false;
            if (localStorage.getItem('has_clicked_subscribe') === 'true') {
                if (noRemindContainer) noRemindContainer.style.display = 'block';
            } else {
                if (noRemindContainer) noRemindContainer.style.display = 'none';
            }
            setTimeout(function() { modal.classList.add('show'); }, 500);
            subscribeBtn.onclick = function() { localStorage.setItem('has_clicked_subscribe', 'true'); window.location.href = 'notwec'; };
            cancelBtn.onclick = function() { modal.classList.remove('show'); };
            modal.onclick = function(e) { if (e.target === modal) modal.classList.remove('show'); };
            if (noRemindCheckbox) {
                noRemindCheckbox.onchange = function(e) {
                    if (e.target.checked) localStorage.setItem('subscribe_no_remind', 'true');
                    else localStorage.removeItem('subscribe_no_remind');
                };
            }
        }

        // ========== 设备兼容性检测 ==========
        (function() {
            var ua = navigator.userAgent;
            var isIOS = /iPhone|iPad|iPod/i.test(ua);
            var isMac = /Macintosh/i.test(ua) && !isIOS;
            var modal = document.getElementById('deviceWarningModal');
            var icon = document.getElementById('deviceWarningIcon');
            var msg = document.getElementById('deviceWarningMessage');
            var closeBtn = document.getElementById('deviceWarningCloseBtn');
            var wm = null;
            if (isIOS) { wm = '当前设备访问本平台可能出现问题，建议更换安卓或鸿蒙设备访问'; if(icon) icon.textContent = '⚠️'; }
            else if (isMac) { wm = '当前设备访问本平台可能出现问题，建议更换Windows或Linux设备访问'; if(icon) icon.textContent = '⚠️'; }
            if (wm && modal && msg) {
                msg.textContent = wm; modal.classList.add('show');
                if(closeBtn) closeBtn.addEventListener('click', function() { modal.classList.remove('show'); });
                modal.addEventListener('click', function(e) { if (e.target === modal) modal.classList.remove('show'); });
            }
        })();

        // ========== 配置 ==========
        var CONFIG_URL = 'https://cdn.jsdelivr.net/gh/bloxorz671/createsoft@main/5app.txt';
        var GITHUB_OWNER = 'bloxorz671';
        var GITHUB_REPO = 'createsoft';
        var GITHUB_PATH = '5app.txt';
        var NAME_FILE_URL = 'https://luckynum.top/5name.txt';
        var INTEGRAL_FILE_URL = 'https://cdn.jsdelivr.net/gh/bloxorz671/5class-system@main/student-integral.txt';
        var JFFI_FILE_URL = 'https://cdn.jsdelivr.net/gh/bloxorz671/5class-system@main/jffi.txt';
        var TARGET_UA = 'ClassApp/1.0 (Grade8Class5)';
        var isTargetDevice = navigator.userAgent === TARGET_UA;

        var slidesData = [], appItems = [], groupOrder = ['其他应用'];
        var currentIndex = 0, autoInterval = null, totalSlides = 0;
        var isEditMode = false, currentToken = null, fileSha = null;
        var currentStudentId = null;
        var nameMapping = {}, integralMapping = {};
        var isAddingApp = false, isAddingCarousel = false;
        var scanCodeReader = null, scanningActive = false, lastScanTime = 0;
        var SCAN_COOLDOWN = 1000;
        var defaultCameraId = null;
        var draggedGroupIndex = null, draggedAppData = null;
        var cachedFileList = null, fileListLoading = false;

        var RATING_CONFIG = [
            { min: 12, max: Infinity, name: '夯爆了', colorClass: 'level-0' },
            { min: 9, max: 11, name: '顶级', colorClass: 'level-1' },
            { min: 5, max: 8, name: '人上人', colorClass: 'level-2' },
            { min: 1, max: 4, name: 'Npc', colorClass: 'level-3' },
            { min: -Infinity, max: 0, name: '拉完了', colorClass: 'level-4' }
        ];

        function getRatingByIntegral(integral) {
            var score = parseInt(integral);
            if (isNaN(score)) return RATING_CONFIG[4];
            for (var i = 0; i < RATING_CONFIG.length; i++) {
                if (score >= RATING_CONFIG[i].min && score <= RATING_CONFIG[i].max) return RATING_CONFIG[i];
            }
            return RATING_CONFIG[4];
        }

        function saveStudentId(id) {
            if (!id) return;
            try { localStorage.setItem('studentId', id); } catch(e) {}
            try { sessionStorage.setItem('studentId', id); } catch(e) {}
            try { document.cookie = 'studentId=' + id + '; path=/; max-age=' + (7*24*60*60); } catch(e) {}
        }

        function getStudentId() {
            var params = new URLSearchParams(window.location.search);
            var id = params.get('p');
            if (id && /^\d{5}$/.test(id)) { saveStudentId(id); return id; }
            try { id = localStorage.getItem('studentId'); if (id && /^\d{5}$/.test(id)) return id; } catch(e) {}
            try { id = sessionStorage.getItem('studentId'); if (id && /^\d{5}$/.test(id)) return id; } catch(e) {}
            try { var m = document.cookie.match(/studentId=([^;]+)/); if (m && /^\d{5}$/.test(m[1])) return m[1]; } catch(e) {}
            return null;
        }

        function clearStudentId() {
            try { localStorage.removeItem('studentId'); } catch(e) {}
            try { sessionStorage.removeItem('studentId'); } catch(e) {}
            try { document.cookie = 'studentId=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT'; } catch(e) {}
            currentStudentId = null;
        }

        function saveDefaultCamera(deviceId) { if(deviceId){ try{localStorage.setItem('scan_defaultCameraId',deviceId);}catch(e){} defaultCameraId=deviceId; } }
        function loadDefaultCamera() { try{defaultCameraId=localStorage.getItem('scan_defaultCameraId');}catch(e){} return defaultCameraId; }

        var audioContext = null;
        function playBeep() {
            try {
                if(!audioContext) audioContext = new (window.AudioContext||window.webkitAudioContext)();
                if(audioContext.state==='suspended') audioContext.resume().then(function(){ playBeepSound(); });
                else playBeepSound();
            } catch(e){}
        }
        function playBeepSound() {
            try {
                var now=audioContext.currentTime;
                var osc=audioContext.createOscillator(), gain=audioContext.createGain();
                osc.connect(gain); gain.connect(audioContext.destination);
                osc.frequency.value=600; osc.type='square';
                gain.gain.setValueAtTime(0.4,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.12);
                osc.start(now); osc.stop(now+0.12);
            } catch(e){}
        }

        function extractLastFiveDigits(fullCode) {
            var nums=fullCode.match(/\d/g);
            if(nums&&nums.length>=5) return nums.slice(-5).join('');
            var last5=fullCode.slice(-5);
            if(/^\d{5}$/.test(last5)) return last5;
            return fullCode;
        }

        function onScanSuccess(fullCode) {
            var now=Date.now();
            if(now-lastScanTime<SCAN_COOLDOWN) return;
            lastScanTime=now; playBeep();
            var sid=extractLastFiveDigits(fullCode);
            if(/^\d{5}$/.test(sid)) {
                saveStudentId(sid); stopScanCamera();
                document.getElementById('scanModal').classList.remove('show');
                window.location.href='?p='+sid;
            } else {
                document.getElementById('scanStatus').textContent='识别失败，请重试';
                setTimeout(function(){ var s=document.getElementById('scanStatus'); if(s) s.textContent='扫描中...'; },2000);
            }
        }

        async function startScanCamera() {
            if(!scanCodeReader){try{scanCodeReader=new ZXing.BrowserMultiFormatReader();}catch(e){document.getElementById('scanStatus').textContent='扫码库加载失败';return;}}
            if(document.getElementById('scanVideo').srcObject) try{stopScanCamera();}catch(e){}
            document.getElementById('scanStatus').textContent='获取摄像头列表...';
            scanningActive=true;
            try {
                var devices=[];
                try{devices=await scanCodeReader.listVideoInputDevices();}catch(e){var ts=await navigator.mediaDevices.getUserMedia({video:true});ts.getTracks().forEach(function(t){t.stop();});devices=await scanCodeReader.listVideoInputDevices();}
                if(devices.length===0) throw new Error('未找到摄像头');
                var selectedId=loadDefaultCamera();
                if(!selectedId||!devices.find(function(d){return d.deviceId===selectedId;})){var bc=devices.find(function(d){var l=(d.label||'').toLowerCase();return l.includes('back')||l.includes('rear')||l.includes('后置')||l.includes('environment');});selectedId=bc?bc.deviceId:devices[0].deviceId;saveDefaultCamera(selectedId);}
                var sel=devices.find(function(d){return d.deviceId===selectedId;});
                document.getElementById('scanStatus').textContent='使用: '+(sel?.label?.slice(0,30)||'摄像头');
                await scanCodeReader.decodeFromVideoDevice(selectedId,'scanVideo',function(result,err){if(result&&scanningActive)onScanSuccess(result.getText());if(err&&!(err instanceof ZXing.NotFoundException))console.warn(err);});
            } catch(err){document.getElementById('scanStatus').textContent='摄像头启动失败';console.error(err);}
        }

        function stopScanCamera() {
            scanningActive=false;
            if(scanCodeReader) try{scanCodeReader.reset();}catch(e){}
            var v=document.getElementById('scanVideo');
            if(v&&v.srcObject){try{var s=v.srcObject;if(s&&s.getTracks)s.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}catch(e){}}
        }

        async function scanFromImage(file) {
            if(!file) return;
            document.getElementById('scanStatus').textContent='处理图片中...';
            try {
                if(scanCodeReader) try{scanCodeReader.reset();}catch(e){}
                var v=document.getElementById('scanVideo');
                if(v&&v.srcObject){var os=v.srcObject;if(os&&os.getTracks)os.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}
                var img=new Image(); var iurl=URL.createObjectURL(file);
                await new Promise(function(r,rej){img.onload=r;img.onerror=rej;img.src=iurl;});
                var c=document.createElement('canvas');c.width=img.width;c.height=img.height;
                c.getContext('2d').drawImage(img,0,0,img.width,img.height);
                URL.revokeObjectURL(iurl);
                v.srcObject=c.captureStream(30); await v.play(); await new Promise(function(r){setTimeout(r,200);});
                document.getElementById('scanStatus').textContent='识别中...';
                var tr=null;
                try{tr=new ZXing.BrowserMultiFormatReader();}catch(e){document.getElementById('scanStatus').textContent='扫码库加载失败';alert('扫码库加载失败');startScanCamera();return;}
                var result=await tr.decodeFromVideoElement(v);
                if(result&&result.text){playBeep();var sid=extractLastFiveDigits(result.text);if(/^\d{5}$/.test(sid)){saveStudentId(sid);stopScanCamera();document.getElementById('scanModal').classList.remove('show');window.location.href='?p='+sid;}else{document.getElementById('scanStatus').textContent='未识别到有效学号';alert('识别到的内容不是5位数学号：'+sid);startScanCamera();}}
                else {document.getElementById('scanStatus').textContent='未识别到二维码';alert('未识别到二维码');startScanCamera();}
            } catch(err){console.error(err);document.getElementById('scanStatus').textContent='识别失败';alert('识别失败');startScanCamera();}
        }

        function showScanModalFunc() { document.getElementById('scanModal').classList.add('show'); setTimeout(function(){startScanCamera();},100); }
        function closeScanModalFunc() { stopScanCamera(); document.getElementById('scanModal').classList.remove('show'); }

        function encodeUrlForCopy(url) {
            try {
                if (/%[0-9A-Fa-f]{2}/.test(url)) return url;
                return url.split('/').map(function(part) {
                    if (part.includes('?')) {
                        var idx = part.indexOf('?');
                        return encodeURIComponent(decodeURIComponent(part.substring(0,idx))) + part.substring(idx);
                    }
                    return encodeURIComponent(decodeURIComponent(part));
                }).join('/');
            } catch(e) { return url; }
        }

        function copyShareLink(appName) {
            var u = window.location.origin + window.location.pathname;
            if (appName) u += '?app=' + encodeURIComponent(appName);
            u = encodeUrlForCopy(u);
            navigator.clipboard.writeText(u).then(function() {
                var t = document.createElement('div');
                t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:12px 24px;border-radius:30px;z-index:60000;font-size:14px;text-align:center;';
                t.textContent = '✅ 网址已复制';
                document.body.appendChild(t);
                setTimeout(function(){ t.remove(); }, 1500);
            }).catch(function() { alert('复制失败，请手动复制'); });
        }

        function downloadFile(url, fileName) {
            var a = document.createElement('a');
            a.href = url;
            a.download = fileName.split('?')[0];
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ========== 显示下载回退界面 ==========
        function showDownloadFallback(container, url, fileName, errorMsg) {
            var encodedUrl = encodeUrlForCopy(url || '');
            container.innerHTML = '<div style="text-align:center;padding:60px 20px;">' +
                '<div style="font-size:4rem;margin-bottom:16px;">⚠️</div>' +
                '<h2 style="font-size:1.5rem;color:#e74c3c;margin-bottom:12px;">文件预览插件加载失败</h2>' +
                '<p style="color:#666;margin-bottom:8px;font-size:0.9rem;">' + escapeHtml(fileName || '未知文件') + '</p>' +
                '<p style="color:#999;margin-bottom:20px;font-size:0.8rem;">' + escapeHtml(errorMsg || '文件可能损坏或网络不稳定') + '</p>' +
                '<button class="download-fallback-btn" onclick="downloadFile(\'' + escapeHtml(encodedUrl) + '\', \'' + escapeHtml(fileName || 'file') + '\')">📥 立即下载</button>' +
                '<p style="color:#aaa;margin-top:16px;font-size:0.75rem;">建议下载后使用本地应用打开</p>' +
                '</div>';
        }

        // ========== 文档预览器 ==========
        function openDocumentViewer(url, fileName) {
            var overlay = document.createElement('div');
            overlay.className = 'doc-viewer-overlay';
            var ext = fileName.split('.').pop().toLowerCase();
            var supportedTypes = ['pdf', 'docx', 'xlsx', 'txt'];
            var isSupported = supportedTypes.indexOf(ext) !== -1;

            var header = document.createElement('div');
            header.className = 'doc-viewer-header';
            header.innerHTML = '<div class="doc-title">' + escapeHtml(fileName) + '</div>' +
                '<div class="doc-actions">' +
                '<button id="docCopyBtn">复制链接</button>' +
                '<button id="docDownloadBtn">下载文件</button>' +
                '<button class="close-btn" id="docCloseBtn">关闭</button>' +
                '</div>';

            var body = document.createElement('div');
            body.className = 'doc-viewer-body';
            var contentDiv = document.createElement('div');
            contentDiv.className = 'doc-content';

            if (!isSupported) {
                contentDiv.innerHTML = '<div class="unsupported-content">' +
                    '<div class="icon">📄</div>' +
                    '<p>该文件类型（.' + ext + '）不支持预览</p>' +
                    '<button class="download-fallback-btn" id="unsupportedDownloadBtn">📥 立即下载</button>' +
                    '</div>';
                body.appendChild(contentDiv);
                overlay.appendChild(header);
                overlay.appendChild(body);
                document.body.appendChild(overlay);

                document.getElementById('unsupportedDownloadBtn').onclick = function() { downloadFile(url, fileName); };
                document.getElementById('docCopyBtn').onclick = function() {
                    var eu = encodeUrlForCopy(url);
                    navigator.clipboard.writeText(eu).then(function() {
                        var t = document.createElement('div');
                        t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:12px 24px;border-radius:30px;z-index:60000;font-size:14px;';
                        t.textContent = '✅ 链接已复制（中文已编码）';
                        document.body.appendChild(t);
                        setTimeout(function(){ t.remove(); }, 1500);
                    }).catch(function() { alert('复制失败'); });
                };
                document.getElementById('docDownloadBtn').onclick = function() { downloadFile(url, fileName); };
                document.getElementById('docCloseBtn').onclick = function() { overlay.remove(); };
                overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
                return;
            }

            contentDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">⏳ 加载文档中...</div>';
            body.appendChild(contentDiv);
            overlay.appendChild(header);
            overlay.appendChild(body);
            document.body.appendChild(overlay);

            // 绑定按钮事件
            document.getElementById('docCopyBtn').onclick = function() {
                var eu = encodeUrlForCopy(url);
                navigator.clipboard.writeText(eu).then(function() {
                    var t = document.createElement('div');
                    t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:white;padding:12px 24px;border-radius:30px;z-index:60000;font-size:14px;';
                    t.textContent = '✅ 链接已复制（中文已编码）';
                    document.body.appendChild(t);
                    setTimeout(function(){ t.remove(); }, 1500);
                }).catch(function() { alert('复制失败'); });
            };
            document.getElementById('docDownloadBtn').onclick = function() { downloadFile(url, fileName); };
            document.getElementById('docCloseBtn').onclick = function() { overlay.remove(); };
            overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });

            // 使用 XHR 加载文档
            loadDocumentWithXHR(url, ext, contentDiv, fileName);
        }

        function loadDocumentWithXHR(url, ext, contentDiv, fileName) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'arraybuffer';
            xhr.timeout = 120000;
            var lastProgressTime = Date.now();
            var loadFailed = false;

            xhr.onprogress = function(e) {
                if (loadFailed) return;
                var now = Date.now();
                if (now - lastProgressTime > 500) {
                    if (e.lengthComputable) {
                        var percent = Math.round((e.loaded / e.total) * 100);
                        contentDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">⏳ 加载文档中... ' + percent + '%</div>';
                    } else if (e.loaded > 0) {
                        var loadedMB = (e.loaded / 1024 / 1024).toFixed(1);
                        contentDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#666;">⏳ 加载文档中... 已下载 ' + loadedMB + 'MB</div>';
                    }
                    lastProgressTime = now;
                }
            };

            xhr.onload = function() {
                if (loadFailed) return;
                if (xhr.status === 200 || xhr.status === 304 || xhr.status === 0) {
                    var arrayBuffer = xhr.response;
                    if (!arrayBuffer || arrayBuffer.byteLength === 0) {
                        showDownloadFallback(contentDiv, url, fileName, '文件为空');
                        return;
                    }
                    console.log('文件下载成功，大小:', (arrayBuffer.byteLength / 1024).toFixed(1), 'KB');
                    try {
                        var blob = new Blob([arrayBuffer]);
                        if (ext === 'pdf') loadPDF(blob, contentDiv);
                        else if (ext === 'docx') loadDOCX(blob, contentDiv);
                        else if (ext === 'xlsx') loadXLSX(blob, contentDiv, url, fileName);
                        else if (ext === 'txt') loadTXT(blob, contentDiv);
                    } catch(err) {
                        console.error('处理文件失败:', err);
                        showDownloadFallback(contentDiv, url, fileName, err.message);
                    }
                } else {
                    showDownloadFallback(contentDiv, url, fileName, 'HTTP 状态码: ' + xhr.status);
                }
            };

            xhr.onerror = function() {
                loadFailed = true;
                console.error('XHR 请求失败');
                showDownloadFallback(contentDiv, url, fileName, '网络请求失败（可能被浏览器拦截）');
            };

            xhr.ontimeout = function() {
                loadFailed = true;
                console.error('XHR 请求超时');
                showDownloadFallback(contentDiv, url, fileName, '下载超时（文件可能过大或网络不稳定）');
            };

            xhr.send();
        }

        // ----- PDF 加载 -----
        function loadPDF(blob, container) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var data = new Uint8Array(e.target.result);
                var pdfjsLib = window.pdfjsLib;
                if (!pdfjsLib) {
                    container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>PDF.js 库未加载</p></div>';
                    return;
                }
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
                var currentPage = 1, pdfDoc = null;
                var renderPage = function(pageNum) {
                    pdfDoc.getPage(pageNum).then(function(page) {
                        var viewport = page.getViewport({ scale: 1.5 });
                        var canvas = document.createElement('canvas');
                        canvas.width = viewport.width; canvas.height = viewport.height;
                        canvas.style.width = '100%'; canvas.style.height = 'auto';
                        page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport });
                        container.innerHTML = '';
                        var controls = document.createElement('div');
                        controls.className = 'pdf-controls';
                        controls.innerHTML = '<button id="pdfPrevBtn">◀ 上一页</button><span id="pdfPageInfo">' + pageNum + ' / ' + pdfDoc.numPages + '</span><button id="pdfNextBtn">下一页 ▶</button><span style="font-size:0.8rem;color:#999;margin-left:8px;">' + pdfDoc.numPages + ' 页</span>';
                        container.appendChild(controls);
                        container.appendChild(canvas);
                        document.getElementById('pdfPrevBtn').onclick = function() { if (currentPage > 1) { currentPage--; renderPage(currentPage); } };
                        document.getElementById('pdfNextBtn').onclick = function() { if (currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); } };
                    }).catch(function() { container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>渲染页面失败</p></div>'; });
                };
                pdfjsLib.getDocument({ data: data }).promise.then(function(doc) { pdfDoc = doc; renderPage(1); }).catch(function(err) { container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>PDF 加载失败: ' + escapeHtml(err.message) + '</p></div>'; });
            };
            reader.onerror = function() { container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>文件读取失败</p></div>'; };
            reader.readAsArrayBuffer(blob);
        }

        // ----- DOCX 加载 -----
        function loadDOCX(blob, container) {
            var reader = new FileReader();
            reader.onload = function(e) {
                if (typeof mammoth === 'undefined') {
                    container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>mammoth.js 库未加载</p></div>';
                    return;
                }
                mammoth.convertToHtml({ arrayBuffer: e.target.result })
                    .then(function(result) { container.innerHTML = result.value || '<p style="color:#999;">（文档内容为空）</p>'; })
                    .catch(function(err) { container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>DOCX 解析失败: ' + escapeHtml(err.message) + '</p></div>'; });
            };
            reader.onerror = function() { container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>文件读取失败</p></div>'; };
            reader.readAsArrayBuffer(blob);
        }

        // ----- XLSX 加载 -----
        function loadXLSX(blob, container, url, fileName) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var data = new Uint8Array(e.target.result);
                if (typeof XLSX === 'undefined') {
                    container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><p>XLSX 库未加载</p></div>';
                    return;
                }
                try {
                    var workbook = XLSX.read(data, { type: 'array', cellStyles: true, cellDates: true, cellNF: true, sheetStubs: true });
                    
                    var zoomControls = document.createElement('div');
                    zoomControls.className = 'xlsx-zoom-controls';
                    zoomControls.innerHTML = '<button id="xlsxZoomOut" class="xlsx-zoom-btn">−</button>' +
                        '<span id="xlsxZoomLevel" style="margin:0 8px;font-size:0.9rem;color:#666;">100%</span>' +
                        '<button id="xlsxZoomIn" class="xlsx-zoom-btn">+</button>' +
                        '<button id="xlsxZoomReset" class="xlsx-zoom-btn" style="margin-left:8px;width:auto;padding:0 12px;border-radius:16px;">⟳ 重置</button>';
                    
                    var tableWrapper = document.createElement('div');
                    tableWrapper.className = 'xlsx-table-wrapper';
                    var currentZoom = 1;
                    var allTablesHtml = '';

                    workbook.SheetNames.forEach(function(sheetName) {
                        var sheet = workbook.Sheets[sheetName];
                        if (!sheet || !sheet['!ref']) return;
                        var range = XLSX.utils.decode_range(sheet['!ref']);
                        var merges = sheet['!merges'] || [];
                        var colWidths = sheet['!cols'] || [];
                        var rowHeights = sheet['!rows'] || [];
                        var mergeMap = {}, mergeSpanMap = {};
                        
                        merges.forEach(function(merge) {
                            var key = merge.s.r + ',' + merge.s.c;
                            mergeSpanMap[key] = { rowspan: merge.e.r - merge.s.r + 1, colspan: merge.e.c - merge.s.c + 1 };
                            for (var r = merge.s.r; r <= merge.e.r; r++) {
                                for (var c = merge.s.c; c <= merge.e.c; c++) {
                                    if (r !== merge.s.r || c !== merge.s.c) mergeMap[r + ',' + c] = true;
                                }
                            }
                        });

                        var minRow = range.s.r, maxRow = range.e.r, minCol = range.s.c, maxCol = range.e.c;

                        if (workbook.SheetNames.length > 1) {
                            allTablesHtml += '<h4 style="margin:16px 0 8px 0;color:#1e3c72;padding:0 8px;">📊 ' + escapeHtml(sheetName) + '</h4>';
                        }
                        allTablesHtml += '<div class="xlsx-table-container"><table class="xlsx-table">';
                        
                        var colgroup = '<colgroup>';
                        for (var c = minCol; c <= maxCol; c++) {
                            var colInfo = colWidths[c];
                            var width = 100;
                            if (colInfo && colInfo.wpx) width = colInfo.wpx;
                            else if (colInfo && colInfo.wch) width = Math.max(colInfo.wch * 7.5, 40);
                            colgroup += '<col style="width:' + Math.max(width,40) + 'px;min-width:' + Math.max(width,40) + 'px;">';
                        }
                        colgroup += '</colgroup>';
                        allTablesHtml += colgroup;

                        for (var r = minRow; r <= maxRow; r++) {
                            var rowInfo = rowHeights[r];
                            var rowStyle = '';
                            if (rowInfo && rowInfo.hpx) rowStyle = ' style="height:' + rowInfo.hpx + 'px;"';
                            else if (rowInfo && rowInfo.hpt) rowStyle = ' style="height:' + (rowInfo.hpt * 1.33) + 'px;"';
                            allTablesHtml += '<tr' + rowStyle + '>';
                            
                            for (var c = minCol; c <= maxCol; c++) {
                                if (mergeMap[r + ',' + c]) continue;
                                var cellRef = XLSX.utils.encode_cell({ r: r, c: c });
                                var cell = sheet[cellRef];
                                var mergeInfo = mergeSpanMap[r + ',' + c] || { rowspan: 1, colspan: 1 };
                                var cellValue = '', cellStyle = '', borderStyle = 'border:1px solid #d0d0d0;';
                                
                                if (cell) {
                                    if (cell.t === 'n') {
                                        if (cell.z && (cell.z.includes('yy')||cell.z.includes('dd')||cell.z.includes('mm')||cell.z.includes('YY')||cell.z.includes('DD')||cell.z.includes('MM'))) {
                                            try { var date = XLSX.SSF.parse_date_code(cell.v); if(date) cellValue = date.y + '-' + String(date.m).padStart(2,'0') + '-' + String(date.d).padStart(2,'0'); else cellValue = cell.v; } catch(ex) { cellValue = cell.v; }
                                        } else if (cell.z && cell.z.includes('%')) {
                                            cellValue = (cell.v * 100).toFixed(2) + '%';
                                        } else if (cell.z && cell.z !== 'General') {
                                            try { cellValue = XLSX.SSF.format(cell.z, cell.v); } catch(ex) { cellValue = cell.v; }
                                        } else { cellValue = cell.v; }
                                    } else if (cell.t === 's') { cellValue = cell.v || ''; }
                                    else if (cell.t === 'b') { cellValue = cell.v ? 'TRUE' : 'FALSE'; }
                                    else if (cell.t === 'd') { cellValue = cell.v instanceof Date ? cell.v.toLocaleDateString('zh-CN') : cell.v; }
                                    else { cellValue = cell.v !== undefined ? cell.v : ''; }
                                    
                                    var styles = [];
                                    if (cell.s) {
                                        if (cell.s.font) {
                                            if (cell.s.font.bold) styles.push('font-weight:bold');
                                            if (cell.s.font.italic) styles.push('font-style:italic');
                                            if (cell.s.font.underline) styles.push('text-decoration:underline');
                                            if (cell.s.font.color && cell.s.font.color.rgb) styles.push('color:#' + cell.s.font.color.rgb);
                                            if (cell.s.font.sz) styles.push('font-size:' + cell.s.font.sz + 'pt');
                                            if (cell.s.font.name) styles.push('font-family:"' + cell.s.font.name + '",sans-serif');
                                        }
                                        if (cell.s.fill && cell.s.fill.fgColor && cell.s.fill.fgColor.rgb) {
                                            var rgb = cell.s.fill.fgColor.rgb;
                                            if (rgb !== '00000000' && rgb !== 'FFFFFF') styles.push('background-color:#' + rgb);
                                        }
                                        if (cell.s.alignment) {
                                            var hMap = { left:'left', center:'center', right:'right', justify:'justify' };
                                            if (cell.s.alignment.horizontal) styles.push('text-align:' + (hMap[cell.s.alignment.horizontal]||'left'));
                                            var vMap = { top:'top', center:'middle', bottom:'bottom' };
                                            if (cell.s.alignment.vertical) styles.push('vertical-align:' + (vMap[cell.s.alignment.vertical]||'middle'));
                                            if (cell.s.alignment.wrapText) styles.push('white-space:normal;word-wrap:break-word;');
                                        }
                                        if (cell.s.border) {
                                            var border = cell.s.border;
                                            var bStyles = [];
                                            if (border.top && border.top.style) bStyles.push('border-top:' + border.top.style + ' solid #' + (border.top.color?.rgb||'000000'));
                                            if (border.bottom && border.bottom.style) bStyles.push('border-bottom:' + border.bottom.style + ' solid #' + (border.bottom.color?.rgb||'000000'));
                                            if (border.left && border.left.style) bStyles.push('border-left:' + border.left.style + ' solid #' + (border.left.color?.rgb||'000000'));
                                            if (border.right && border.right.style) bStyles.push('border-right:' + border.right.style + ' solid #' + (border.right.color?.rgb||'000000'));
                                            if (bStyles.length > 0) borderStyle = bStyles.join(';') + ';';
                                        }
                                    }
                                    cellStyle = styles.length > 0 ? ' style="' + styles.join(';') + ';' + borderStyle + '"' : ' style="' + borderStyle + '"';
                                } else {
                                    cellStyle = ' style="' + borderStyle + '"';
                                }
                                
                                var rowspanAttr = mergeInfo.rowspan > 1 ? ' rowspan="' + mergeInfo.rowspan + '"' : '';
                                var colspanAttr = mergeInfo.colspan > 1 ? ' colspan="' + mergeInfo.colspan + '"' : '';
                                allTablesHtml += '<td' + rowspanAttr + colspanAttr + cellStyle + '>' + escapeHtml(String(cellValue)) + '</td>';
                            }
                            allTablesHtml += '</tr>';
                        }
                        allTablesHtml += '</table></div>';
                    });

                    tableWrapper.innerHTML = allTablesHtml || '<p style="text-align:center;color:#999;padding:40px;">（表格内容为空）</p>';
                    container.innerHTML = '';
                    container.appendChild(zoomControls);
                    container.appendChild(tableWrapper);

                    var applyZoom = function(zoom) {
                        var tables = tableWrapper.querySelectorAll('.xlsx-table');
                        tables.forEach(function(table) {
                            table.style.transform = 'scale(' + zoom + ')';
                            table.style.transformOrigin = 'top left';
                            table.style.transition = 'transform 0.2s ease';
                        });
                        var containers = tableWrapper.querySelectorAll('.xlsx-table-container');
                        containers.forEach(function(cont) {
                            var table = cont.querySelector('.xlsx-table');
                            if (table) cont.style.minHeight = (table.getBoundingClientRect().height * zoom / (currentZoom || 1)) + 'px';
                        });
                        var levelEl = document.getElementById('xlsxZoomLevel');
                        if (levelEl) levelEl.textContent = Math.round(zoom * 100) + '%';
                    };

                    document.getElementById('xlsxZoomIn').onclick = function() { currentZoom = Math.min(currentZoom + 0.1, 3); applyZoom(currentZoom); };
                    document.getElementById('xlsxZoomOut').onclick = function() { currentZoom = Math.max(currentZoom - 0.1, 0.3); applyZoom(currentZoom); };
                    document.getElementById('xlsxZoomReset').onclick = function() { currentZoom = 1; applyZoom(currentZoom); };

                    tableWrapper.addEventListener('wheel', function(e) {
                        if (e.ctrlKey) { e.preventDefault(); currentZoom = e.deltaY < 0 ? Math.min(currentZoom + 0.05, 3) : Math.max(currentZoom - 0.05, 0.3); applyZoom(currentZoom); }
                    }, { passive: false });

                    var initialPinchDistance = 0, initialPinchZoom = 1;
                    tableWrapper.addEventListener('touchstart', function(e) {
                        if (e.touches.length === 2) {
                            initialPinchDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                            initialPinchZoom = currentZoom;
                        }
                    });
                    tableWrapper.addEventListener('touchmove', function(e) {
                        if (e.touches.length === 2) {
                            var newDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                            currentZoom = Math.min(Math.max(initialPinchZoom * newDistance / initialPinchDistance, 0.3), 3);
                            applyZoom(currentZoom);
                        }
                    });
                } catch(err) {
                    console.error('XLSX解析错误:', err);
                    if (url && fileName) showDownloadFallback(container, url, fileName, err.message);
                    else container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><h2>文件预览插件加载失败</h2><p>' + escapeHtml(err.message) + '</p></div>';
                }
            };
            reader.onerror = function() {
                if (url && fileName) showDownloadFallback(container, url, fileName, '文件读取失败');
                else container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><h2>文件预览插件加载失败</h2><p>文件读取失败</p></div>';
            };
            reader.readAsArrayBuffer(blob);
        }

        // ----- TXT 加载 -----
        function loadTXT(blob, container) {
            var reader = new FileReader();
            reader.onload = function(e) { container.innerHTML = '<div class="txt-content">' + escapeHtml(e.target.result) + '</div>'; };
            reader.onerror = function() { container.innerHTML = '<div class="unsupported-content"><div class="icon">❌</div><h2>文件预览插件加载失败</h2><p>文件读取失败</p></div>'; };
            reader.readAsText(blob);
        }

        // ========== 文件类型判断 ==========
        function getFileTypeFromUrl(url) {
            if (!url) return 'link';
            var fileName = url.split('/').pop().split('?')[0];
            var ext = fileName.split('.').pop().toLowerCase();
            var imageExts = ['jpg','jpeg','png','gif','webp','bmp','svg','ico'];
            var videoExts = ['mp4','webm','ogg','mov','avi','mkv'];
            var audioExts = ['mp3','m4a','wav','flac','aac'];
            var docExts = ['pdf','docx','xlsx','txt'];
            if (imageExts.indexOf(ext) !== -1) return 'image';
            if (videoExts.indexOf(ext) !== -1) return 'video';
            if (audioExts.indexOf(ext) !== -1) return 'audio';
            if (docExts.indexOf(ext) !== -1) return 'document';
            return 'unsupported';
        }

        function isFileUrl(url) {
            if (!url) return false;
            var fileName = url.split('/').pop().split('?')[0];
            var ext = fileName.split('.').pop().toLowerCase();
            var fileExts = ['jpg','jpeg','png','gif','webp','bmp','svg','ico','mp4','webm','ogg','mov','avi','mkv','mp3','m4a','wav','flac','aac','pdf','docx','xlsx','txt','apk','zip','rar','7z','exe','msi','dmg','pkg','iso','bin','dat','db','sqlite','log','ini','cfg','xml','json','yaml','yml','toml','csv','tsv','md','markdown','rst','tex','bib','sty','ppt','pptx','odt','ods','odp','rtf'];
            return fileExts.indexOf(ext) !== -1;

        async function fetchFileList() {
            if (cachedFileList) return cachedFileList;
            if (fileListLoading) { await new Promise(function(r) { setTimeout(r, 500); }); return cachedFileList; }
            fileListLoading = true;
            try {
                var res = await fetch('https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/');
                if (res.ok) { var items = await res.json(); cachedFileList = items.filter(function(i) { return i.type === 'file'; }).map(function(i) { return i.name; }); }
                else { cachedFileList = []; }
            } catch(e) { cachedFileList = []; }
            fileListLoading = false;
            return cachedFileList;
        }

        function parseEpisodeInfo(fileName) {
            var match = fileName.match(/^(.+?)-(\d+)-(.+?)\.([^.]+)$/);
            if (match) return { seriesName: match[1], episode: parseInt(match[2]), episodeName: match[3], ext: match[4] };
            return null;
        }

        async function findSeriesFiles(currentFileName, allowedExts) {
            if (!allowedExts) allowedExts = ['mp3','m4a','wav','flac','aac','mp4','webm','ogg','mov','avi','mkv'];
            var fileList = await fetchFileList();
            if (!fileList || fileList.length === 0) return [];
            var seriesName = null;
            var currentInfo = parseEpisodeInfo(currentFileName);
            if (currentInfo) seriesName = currentInfo.seriesName;
            else seriesName = currentFileName.replace(/\.(mp3|m4a|wav|flac|aac|mp4|webm|ogg|mov|avi|mkv)$/i, '');
            if (!seriesName) return [{ fileName: currentFileName, episode: 0, displayName: currentFileName, url: 'https://luckynum.top/' + encodeURIComponent(currentFileName) }];
            var seriesFiles = [];
            fileList.forEach(function(fn) {
                var info = parseEpisodeInfo(fn);
                if (info && info.seriesName === seriesName && allowedExts.indexOf(info.ext) !== -1) {
                    seriesFiles.push({ fileName: fn, episode: info.episode, displayName: info.seriesName + '-' + info.episodeName, url: 'https://luckynum.top/' + encodeURIComponent(fn) });
                }
            });
            seriesFiles.sort(function(a, b) { return a.episode - b.episode; });
            if (seriesFiles.length === 0) return [{ fileName: currentFileName, episode: 0, displayName: currentFileName, url: 'https://luckynum.top/' + encodeURIComponent(currentFileName) }];
            return seriesFiles;
        }

        function createZoomableImage(url, fileName) {
            var container = document.createElement('div'); container.className = 'image-container';
            var img = document.createElement('img'); img.src = url; img.className = 'zoomable-image';
            img.style.transform = 'translate(0px, 0px) scale(1)'; container.appendChild(img);
            var scale = 1, translateX = 0, translateY = 0;
            var updateTransform = function() { img.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')'; };
            var clampTranslate = function() {
                var rect = img.getBoundingClientRect();
                var crect = container.getBoundingClientRect();
                var maxX = Math.max(0, (rect.width * scale - crect.width) / 2);
                var maxY = Math.max(0, (rect.height * scale - crect.height) / 2);
                translateX = Math.min(maxX, Math.max(-maxX, translateX));
                translateY = Math.min(maxY, Math.max(-maxY, translateY));
            };
            var zoomIn = function() { scale = Math.min(scale + 0.25, 4); clampTranslate(); updateTransform(); };
            var zoomOut = function() { scale = Math.max(scale - 0.25, 1); if (scale === 1) { translateX = 0; translateY = 0; } else clampTranslate(); updateTransform(); };
            var resetZoom = function() { scale = 1; translateX = 0; translateY = 0; updateTransform(); };
            img.addEventListener('wheel', function(e) { e.preventDefault(); e.deltaY < 0 ? zoomIn() : zoomOut(); });
            var isDragging = false, dragStartX = 0, dragStartY = 0, startTranslateX = 0, startTranslateY = 0;
            img.addEventListener('mousedown', function(e) { if (scale > 1) { isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY; startTranslateX = translateX; startTranslateY = translateY; img.style.cursor = 'grabbing'; e.preventDefault(); } });
            document.addEventListener('mousemove', function(e) { if (isDragging && scale > 1) { translateX = startTranslateX + (e.clientX - dragStartX); translateY = startTranslateY + (e.clientY - dragStartY); clampTranslate(); updateTransform(); } });
            document.addEventListener('mouseup', function() { isDragging = false; if (scale > 1) img.style.cursor = 'grab'; });
            var getDistance = function(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); };
            var initialDistance = 0, initialScale = 1, lastTouchX = 0, lastTouchY = 0, isPanning = false;
            container.addEventListener('touchstart', function(e) {
                e.preventDefault();
                var touches = Array.from(e.touches);
                if (touches.length === 1) { isPanning = true; lastTouchX = touches[0].clientX; lastTouchY = touches[0].clientY; }
                else if (touches.length === 2) { initialDistance = getDistance(touches); initialScale = scale; var c = { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 }; lastTouchX = c.x; lastTouchY = c.y; }
            });
            container.addEventListener('touchmove', function(e) {
                e.preventDefault();
                var touches = Array.from(e.touches);
                if (touches.length === 1 && isPanning && scale > 1) { translateX += touches[0].clientX - lastTouchX; translateY += touches[0].clientY - lastTouchY; clampTranslate(); updateTransform(); lastTouchX = touches[0].clientX; lastTouchY = touches[0].clientY; }
                else if (touches.length === 2) { var nd = getDistance(touches); var ns = initialScale * (nd / initialDistance); scale = Math.min(Math.max(ns, 1), 4); if (scale === 1) { translateX = 0; translateY = 0; } else { var nc = { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 }; translateX += nc.x - lastTouchX; translateY += nc.y - lastTouchY; clampTranslate(); lastTouchX = nc.x; lastTouchY = nc.y; } updateTransform(); initialDistance = nd; initialScale = scale; }
            });
            container.addEventListener('touchend', function() { isPanning = false; });
            img.onerror = function() { container.innerHTML = '<div class="unsupported-view"><h2>🖼️ 图片加载失败</h2><button class="download-fallback-btn" id="imgErrorDownloadBtn">📥 立即下载</button></div>'; var btn = container.querySelector('#imgErrorDownloadBtn'); if (btn) btn.onclick = function() { downloadFile(url, fileName); }; };
            return { container: container, zoomIn: zoomIn, zoomOut: zoomOut, resetZoom: resetZoom };
        }

        async function handleAppClick(link, name) {
            var fullUrl = link;
            if (fullUrl && fullUrl.indexOf('http') !== 0 && fullUrl.indexOf('//') !== 0) fullUrl = 'https://luckynum.top/' + encodeURIComponent(link);
            if (isFileUrl(link)) {
                var fileName = link.split('/').pop().split('?')[0];
                var fileType = getFileTypeFromUrl(link);
                if (fileType === 'image') { openImageViewer(fullUrl, name); return; }
                if (fileType === 'video') { var sf = await findSeriesFiles(fileName, ['mp4','webm','ogg','mov','avi','mkv']); openVideoViewer(fullUrl, name, sf); return; }
                if (fileType === 'audio') { var sf = await findSeriesFiles(fileName, ['mp3','m4a','wav','flac','aac']); openAudioViewer(fullUrl, name, sf); return; }
                if (fileType === 'document') { openDocumentViewer(fullUrl, fileName); return; }
                showUnsupportedDialog(fullUrl, name); return;
            }
            window.open(fullUrl, '_blank');
        }

        async function handleUrlAppParameter() {
            var params = new URLSearchParams(window.location.search);
            var appParam = params.get('app');
            if (!appParam) return;
            try { appParam = decodeURIComponent(appParam); } catch(e) {}
            var rc = 0;
            while (appItems.length === 0 && rc < 30) { await new Promise(function(r) { setTimeout(r, 200); }); rc++; }
            var targetApp = appItems.find(function(a) { return a.name === appParam; });
            if (!targetApp) targetApp = appItems.find(function(a) { return a.name.toLowerCase().indexOf(appParam.toLowerCase()) !== -1; });
            if (targetApp) { setTimeout(function() { handleAppClick(targetApp.link, targetApp.name); }, 500); return; }
            if (isFileUrl(appParam)) {
                var ft = getFileTypeFromUrl(appParam);
                var fn = appParam.split('/').pop();
                var fu = appParam;
                if (fu.indexOf('http') !== 0) fu = 'https://luckynum.top/' + encodeURIComponent(appParam);
                if (ft === 'image') { openImageViewer(fu, fn); return; }
                if (ft === 'video') { var sf = await findSeriesFiles(fn, ['mp4','webm','ogg','mov','avi','mkv']); openVideoViewer(fu, fn, sf); return; }
                if (ft === 'audio') { var sf = await findSeriesFiles(fn, ['mp3','m4a','wav','flac','aac']); openAudioViewer(fu, fn, sf); return; }
                if (ft === 'document') { openDocumentViewer(fu, fn); return; }
                showUnsupportedDialog(fu, fn); return;
            }
            alert('❌ 应用/文件不存在或已被删除\n\n"' + appParam + '"');
        }

        function parseAppTxt(raw) {
            var lines = raw.split(/\r?\n/);
            var mode = null;
            var groups = [], pics = [], apps = [];
            lines.forEach(function(line) {
                line = line.trim();
                if (line === '') return;
                if (line.toLowerCase() === 'group') { mode = 'group'; return; }
                if (line.toLowerCase() === 'pic') { mode = 'pic'; return; }
                if (line.toLowerCase() === 'app') { mode = 'app'; return; }
                if (mode === 'group') { var m = line.match(/\[g=([^\]]+)\]/); if (m) groups.push(m[1].trim()); }
                else if (mode === 'pic') { var m = line.match(/\[p=([^\s\]]+)\s+l=([^\s\]]+)\]/); if (m) pics.push({ imgUrl: m[1].trim(), linkUrl: m[2].trim() }); }
                else if (mode === 'app') { var m = line.match(/\[n=([^\s\]]+)\s+p=([^\s\]]+)\s+l=([^\s\]]+)(?:\s+g=([^\s\]]+))?\]/); if (!m) m = line.match(/\[n=(.+?)\s+p=(.+?)\s+l=(.+?)(?:\s+g=(.+?))?\]/); if (m) apps.push({ name: m[1].trim(), icon: m[2].trim(), link: m[3].trim(), group: m[4] ? m[4].trim() : null }); }
            });
            groupOrder = groups.length ? groups : ['其他应用'];
            slidesData = pics; appItems = apps;
            renderGroups();
            if (slidesData.length) { renderCarousel(); startAutoSlide(); } else { document.getElementById('carouselSection').style.display = 'none'; }
            document.getElementById('warningBanner').style.display = 'none';
            handleUrlAppParameter();
        }

        async function loadConfigFile() {

        async function loadPointsRecords(studentId) {
            try {
                var res = await fetch(JFFI_FILE_URL + '?t=' + Date.now());
                if (!res.ok) return { records: [], total: 0 };
                var text = await res.text();
                var lines = text.split(/\r?\n/);
                var records = [];
                var total = 0;
                lines.forEach(function(line) {
                    line = line.trim();
                    if (line === '') return;
                    var regex = /^(\d{4}\/\d{2}\/\d{2})\s+(\d{2}:\d{2})\s+(\d{5})\s+(.+?)\s+([+-]\d+)$/;
                    var match = line.match(regex);
                    if (match) {
                        var date = match[1], time = match[2], sid = match[3], event = match[4], scoreStr = match[5];
                        var score = parseInt(scoreStr);
                        if (sid === studentId) {
                            records.push({ datetime: date + ' ' + time, event: event, score: score, isPlus: score > 0 });
                            total += score;
                        }
                    }
                });
                records.sort(function(a, b) { return new Date(b.datetime) - new Date(a.datetime); });
                return { records: records, total: total };
            } catch(e) { return { records: [], total: 0 }; }
        }

        document.getElementById('uploadOnlyBtn').addEventListener('click', uploadFileToRoot);
        document.getElementById('fileManagerBtn').addEventListener('click', openFileManager);
        document.getElementById('addGroupFab').addEventListener('click', addGroup);
        document.getElementById('closeScanModal').addEventListener('click', closeScanModalFunc);
        document.getElementById('scanAlbumBtn').addEventListener('click', function() { document.getElementById('scanAlbumInput').click(); });
        document.getElementById('scanAlbumInput').addEventListener('change', function(e) { if (e.target.files && e.target.files[0]) { scanFromImage(e.target.files[0]); e.target.value = ''; } });
        document.getElementById('navHomeBtn').addEventListener('click', showHome);
        document.getElementById('navProfileBtn').addEventListener('click', showProfile);
        document.getElementById('closePointsModal').addEventListener('click', closePointsModalFunc);
        document.getElementById('pointsModal').addEventListener('click', function(e) { if (e.target === document.getElementById('pointsModal')) closePointsModalFunc(); });

        async function init() {
            await Promise.all([loadConfigFile(), loadNameMapping(), loadIntegralData()]);
            if (isTargetDevice) { await checkUserAgentAndPrompt(); await showGreeting(); }
            else { await showGreeting(); }
            showHome();
            checkAndShowSubscribeModal();
        }
        init();
    </script>
</body>
