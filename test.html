<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        /* 正常页面内容 */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 { color: #333; }
        p { color: #666; }

        /* 微信遮罩层 */
        #wechat-tip {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            color: #fff;
            z-index: 9999;
            text-align: center;
            padding-top: 30%;
            font-size: 18px;
        }
        #wechat-tip .icon {
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
        }
        #wechat-tip .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 40px;
            background: #07c160;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
        }
        #wechat-tip .sub {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        
        /* 隐藏的iframe */
        #download-iframe {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 正常页面内容（普通浏览器看到） -->
    <div id="app">
        <h1>🎉 欢迎访问</h1>
        <p>这是你的正常业务页面</p>
        <button onclick="alert('正常功能')">点击操作</button>
    </div>

    <!-- 微信遮罩层 -->
    <div id="wechat-tip">
        <span class="icon">👆</span>
        <h2>请在浏览器中打开</h2>
        <p>点击右上角「<strong>···</strong>」<br>选择「<strong>在浏览器中打开</strong>」</p>
        <div class="sub">正在尝试自动跳转...</div>
    </div>

    <!-- 隐藏的iframe，用于触发下载 -->
    <iframe id="download-iframe"></iframe>

    <script>
        var ua = navigator.userAgent.toLowerCase();
        var isWechat = ua.indexOf('micromessenger') !== -1;

        if (isWechat) {
            // 显示遮罩
            document.getElementById('wechat-tip').style.display = 'block';
            // 隐藏正常内容
            document.getElementById('app').style.display = 'none';

            // ========== 核心：用 Blob 创建空文件，通过 iframe 触发 ==========
            // 创建一个空的 .txt 文件（也可以改成 .pdf .docx）
            var blob = new Blob([''], { type: 'application/octet-stream' });
            var url = URL.createObjectURL(blob);

            // 方式1：用 iframe 加载这个 blob URL（触发下载/预览）
            var iframe = document.getElementById('download-iframe');
            iframe.src = url;

            // 方式2（备选）：用 a 标签自动点击下载
            // var link = document.createElement('a');
            // link.href = url;
            // link.download = 'empty.txt';  // 文件名
            // link.click();

            // 释放内存（延迟一会再释放，确保下载触发）
            setTimeout(function() {
                URL.revokeObjectURL(url);
            }, 3000);

            console.log('✅ 已触发微信文件下载/预览机制');
        }
    </script>

</body>
</html>
