<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f0f0f0;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }

    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      /* 关键改动：容器尺寸自适应 */
      width: 100%;
      height: 100%;
      touch-action: manipulation;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .network-error-img {
      display: block;
      /* 核心逻辑：根据视口方向自适应 */
      /* 竖屏时：宽度100%，高度自动（左右贴边） */
      /* 横屏时：高度100%，宽度自动（上下贴边） */
      width: 100%;
      height: auto;
      /* 使用 object-fit: contain 确保图片完整显示且不裁剪 */
      object-fit: contain;
      /* 最大尺寸限制，确保图片不会超出容器 */
      max-width: 100%;
      max-height: 100%;
      
      touch-action: manipulation;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: auto;
      border: none;
      outline: none;
    }

    /* 横屏时的媒体查询：当宽度大于高度时（横屏） */
    @media (orientation: landscape) {
      .network-error-img {
        width: auto;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
      }
    }

    /* 竖屏时的媒体查询（默认就是竖屏逻辑，这里显式声明） */
    @media (orientation: portrait) {
      .network-error-img {
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-wrapper" id="imageTrigger">
      <img 
        src="network_error.jpg" 
        alt="" 
        class="network-error-img"
        id="errorImage"
      >
    </div>
  </div>

  <script>
    (function() {
      let isBound = false;

      function setupClickHandler() {
        if (isBound) return;
        isBound = true;

        const triggerElement = document.getElementById('imageTrigger');
        const imageElement = document.getElementById('errorImage');
        const clickTarget = triggerElement || imageElement;
        
        if (!clickTarget) {
          console.warn('未找到触发元素');
          return;
        }

        function handleClick(event) {
          event.preventDefault();
          event.stopPropagation();
          
          try {
            window.location.href = 'fiveapp://refresh';
          } catch (e) {
            console.error('跳转失败:', e);
            try {
              window.location.assign('fiveapp://refresh');
            } catch (assignError) {
              console.error('备用方案也失败:', assignError);
            }
          }
        }

        clickTarget.addEventListener('click', handleClick, { passive: false });
        
        clickTarget.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        });

        if (imageElement) {
          imageElement.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
          });
        }
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        setTimeout(setupClickHandler, 0);
      } else {
        document.addEventListener('DOMContentLoaded', setupClickHandler);
      }

      window.addEventListener('load', function() {
        if (!isBound) {
          setupClickHandler();
        }
      });

      // 立即尝试绑定
      if (document.getElementById('imageTrigger') || document.getElementById('errorImage')) {
        setupClickHandler();
      }
    })();
  </script>
</body>
</html>
