<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title></title>
  <style>
    /* 基础重置，确保页面完全无空白、无边距 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;            /* 禁止页面滚动，防止缩放干扰 */
      background-color: #f0f0f0;  /* 浅灰色背景，与网络错误氛围协调 */
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
    }

    /* 主容器：使用flex居中图片，并接管所有点击区域 */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      /* 触摸操作优化：确保点击响应不延迟 */
      touch-action: manipulation;
    }

    /* 图片容器：精确控制图片显示，不允许任何缩放行为 */
    .image-wrapper {
      /* 设置为inline-block或flex子项，让图片原始尺寸呈现 */
      display: flex;
      justify-content: center;
      align-items: center;
      /* 关键：禁止所有用户触发的缩放、拖动等操作 */
      touch-action: manipulation;
      /* 确保点击事件能正常触发，不被其他样式阻断 */
      cursor: pointer;
      /* 可选：轻微视觉反馈，但为了纯净，不加额外阴影，保留交互提示 */
      -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
      user-select: none;            /* 禁止选中图片（避免长按菜单） */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* 图片本身样式：绝对禁止缩放，保持原始尺寸 */
    .network-error-img {
      display: block;
      /* 核心：设置宽高为auto，确保图片以原始像素显示，不进行任何缩放 */
      width: auto;
      height: auto;
      max-width: none;   /* 覆盖可能的全局样式，防止被限制最大宽度 */
      max-height: none;  /* 防止高度被限制 */
      /* 禁止用户通过手势或控件缩放图片（针对某些浏览器） */
      touch-action: manipulation;
      /* 禁止图片拖拽（部分浏览器会默认允许拖拽图片） */
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      /* 保证图片可点击区域就是图片本身可见区域 */
      pointer-events: auto;
      /* 图片加载失败时，不显示默认边框或破裂图标，依靠alt属性（此处不设置alt以保持干净） */
      border: none;
      outline: none;
      /* 可选：若图片背景透明，可添加极淡的阴影仅为了区分，但遵循简洁原则不加额外样式 */
    }

    /* 针对小屏幕设备：如果图片原始尺寸大于视口，是否允许溢出？ 
       根据需求“不要被缩放，也不允许缩放”，且要求显示原图。
       如果图片过大超出屏幕，用户无法看到完整图片，但缩放被禁止。
       这符合“原始尺寸、不可缩放”的意图。为了极端情况，不添加overflow:auto，
       保持严格不缩放且无滚动条。同时父容器overflow:hidden确保无滚动条。
       如果需要始终看到完整图片但又不缩放，本身是矛盾的。
       所以严格遵循：图片多大就显示多大，不缩放，可能部分不可见，但符合指令。 */
    
    /* 如果图片尺寸小于视口，居中显示效果完美；大于视口则只显示中间部分。
       这是一种合理的设计选择。 */
  </style>
</head>
<body>
  <div class="container">
    <!-- 图片包裹层，用于更精确控制点击区域和样式隔离 -->
    <div class="image-wrapper" id="imageTrigger">
      <!-- 
        图片源：network_error.jpg
        注意：该图片应与HTML文件位于同一目录，或根据实际路径调整。
        标签alt设置为空，符合“页面标签留空”的意图（title已为空）。
        不设置width/height属性，完全依靠CSS控制原始尺寸。
      -->
      <img 
        src="network_error.jpg" 
        alt="" 
        class="network-error-img"
        id="errorImage"
      >
    </div>
  </div>

  <script>
    (function() {
      // 确保DOM完全加载后再绑定事件，避免元素未找到
      function setupClickHandler() {
        // 获取包裹元素（也可直接使用图片，但包裹层更稳定，点击区域完全覆盖图片）
        const triggerElement = document.getElementById('imageTrigger');
        // 备用：如果图片包裹层不存在，直接使用图片本身
        const imageElement = document.getElementById('errorImage');
        
        // 优先使用包裹层作为点击目标，因为其尺寸与图片一致且无额外内边距
        const clickTarget = triggerElement || imageElement;
        
        if (!clickTarget) {
          console.warn('未找到触发元素，无法绑定点击事件。');
          return;
        }

        // 定义点击处理函数：执行自定义协议跳转
        function handleClick(event) {
          // 阻止事件冒泡，避免任何可能的意外行为（如链接跳转等）
          event.preventDefault();
          event.stopPropagation();
          
          // 执行指定的协议刷新操作
          // 使用 window.location.href 直接跳转，这是最通用的方式
          try {
            // 某些环境可能需要尝试不同的方法，但 location.href 最标准
            window.location.href = 'fiveapp://refresh';
          } catch (e) {
            // 静默处理错误，但在控制台记录以便调试
            console.error('执行fiveapp://refresh时出错:', e);
            // 备用方案：在某些严格环境下，尝试使用 location.assign
            try {
              window.location.assign('fiveapp://refresh');
            } catch (assignError) {
              console.error('备用location.assign也失败:', assignError);
            }
          }
        }

        // 添加点击事件监听器
        // 使用 'click' 事件，并且不设置 passive: false 因为不需要调用 preventDefault 来阻止滚动？
        // 实际上我们调用了 preventDefault，所以需要明确设置 passive: false 以确保 preventDefault 生效。
        clickTarget.addEventListener('click', handleClick, { passive: false });
        
        // 针对移动端，同时监听 'touchend' 可以避免某些设备上点击延迟，
        // 但容易与click事件重复触发。这里只使用click并依赖 touch-action: manipulation 消除300ms延迟。
        // 同时为了防止某些浏览器在图片上长按弹出菜单（保存图片等），通过CSS已设置 user-select: none，
        // 并额外阻止 contextmenu 事件（右键菜单），提升体验。
        clickTarget.addEventListener('contextmenu', function(e) {
          // 阻止右键菜单弹出，保持页面纯净，同时避免干扰点击。
          e.preventDefault();
          e.stopPropagation();
          return false;
        });

        // 针对图片元素本身，也阻止拖拽事件（虽然CSS已处理，但JS加固）
        if (imageElement) {
          imageElement.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
          });
          // 阻止图片被拖拽的默认行为
          imageElement.addEventListener('mousedown', function(e) {
            // 对于某些浏览器，mousedown时开始拖拽，额外阻止
            if (e.button === 0) { // 左键
              // 不阻止默认，但结合CSS user-drag: none 应该足够。
              // 这里不做额外操作，保留以防万一。
            }
          });
        }

        // 额外安全措施：确保整个容器区域点击都有效，但只绑定一次。
        // 因为包裹层覆盖图片，点击图片等同于点击包裹层。
      }

      // 页面加载完成后执行设置
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        // DOM已就绪，立即执行
        setTimeout(setupClickHandler, 0); // 使用微小的延迟确保元素完全可访问
      } else {
        // 等待DOM内容加载完成
        document.addEventListener('DOMContentLoaded', function() {
          setupClickHandler();
        });
      }

      // 作为后备，如果上述事件未触发（极少数情况），使用window.onload再次尝试
      window.addEventListener('load', function() {
        // 确保设置函数只运行一次（通过检查元素是否已有监听器？简单起见，再调用一次但内部会覆盖？）
        // 为避免重复绑定，使用标志位。
        if (!window._clickHandlerBound) {
          window._clickHandlerBound = true;
          setupClickHandler();
        }
      });

      // 立即设置标志位防止load事件重复绑定（如果DOMContentLoaded已执行）
      // 但为了代码清晰，将标志位检查放在setupClickHandler内部更合适。
      // 改造setupClickHandler，使其幂等。
      const originalSetup = setupClickHandler;
      let isBound = false;
      window.setupClickHandler = function() {
        if (isBound) return;
        isBound = true;
        originalSetup();
      };
      // 替换原函数引用
      setupClickHandler = window.setupClickHandler;
      
      // 立即尝试调用一次（如果脚本在元素之后执行）
      if (document.getElementById('imageTrigger') || document.getElementById('errorImage')) {
        setupClickHandler();
      }
    })();
  </script>
</body>
</html>
