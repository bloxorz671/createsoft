<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>文件</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .top-bar {
            width: 100%;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            z-index: 50;
            flex-shrink: 0;
            min-height: 48px;
        }

        .file-name {
            font-weight: 600;
            font-size: 14px;
            color: #1e1e1e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 100px;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid #d0d0d0;
            background: white;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            color: #333;
        }

        .action-btn:hover {
            background: #f5f5f5;
        }

        .back-btn {
            padding: 6px 10px;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #555;
        }

        .back-btn:hover {
            color: #1a73e8;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #e8eaed;
        }

        .hidden {
            display: none !important;
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast-message.show {
            opacity: 1;
        }

        .loading-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #999;
            background: #f5f5f5;
        }

        .transfer-page {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        .transfer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
        }

        .section-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10vh;
        }

        .transfer-icon-wrapper {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }

        .transfer-icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .transfer-file-name {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #000;
            letter-spacing: 1px;
            text-align: center;
            word-break: break-all;
        }

        .transfer-file-size {
            font-size: 16px;
            color: #999999;
            font-weight: 400;
        }

        .spacer {
            flex: 1;
        }

        .section-bottom {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 200px;
            padding-bottom: 8vh;
        }

        .section-bottom button {
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            aspect-ratio: 4 / 1;
            outline: none;
        }

        .btn-preview {
            background-color: #1ABC64;
            color: #ffffff;
        }

        .btn-download {
            background-color: #e8e8e8;
            color: #000000;
        }

        .zoom-stage {
            flex: 1;
            overflow: hidden;
            background: #525659;
            position: relative;
            touch-action: none;
        }

        .zoom-stage.light {
            background: #e8eaed;
        }

        .zoom-content {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px;
        }

        .zoom-content img {
            display: block;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .pdf-page {
            background: white;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .pdf-page canvas {
            display: block;
        }

        .office-wrapper {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .office-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #f5f5f5;
        }

        .error-page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            padding: 30px;
            text-align: center;
        }

        .error-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .error-detail {
            background: #fff3f3;
            border: 1px solid #ffcdd2;
            color: #c62828;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            max-width: 500px;
            word-break: break-all;
        }

        .error-download-btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
        }

        @media (max-width: 400px) {
            .transfer-file-name {
                font-size: 24px;
            }
            .section-bottom button {
                font-size: 18px;
            }
            .transfer-icon-wrapper {
                width: 80px;
                height: 80px;
            }
            .section-bottom {
                max-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div id="topBar" class="top-bar hidden">
        <button class="back-btn" id="backBtn">← 返回</button>
        <span class="file-name" id="fileNameDisplay">文件名称</span>
        <button class="action-btn" id="downloadBtn">⬇️ 下载</button>
        <button class="action-btn" id="copyLinkBtn">🔗 复制链接</button>
    </div>
    <div class="main-container" id="mainContainer">
        <div class="loading-page" id="loadingPage">加载中...</div>
        <div id="previewWrapper" class="preview-wrapper hidden"></div>
    </div>
    <div id="toast" class="toast-message"></div>

    <script>
        (function() {
            const loadingPage = document.getElementById('loadingPage');
            const previewWrapper = document.getElementById('previewWrapper');
            const topBar = document.getElementById('topBar');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const backBtn = document.getElementById('backBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyLinkBtn = document.getElementById('copyLinkBtn');
            const toast = document.getElementById('toast');

            let currentFileURL = null;
            let currentFileName = '文件预览';
            let remoteSourceURL = null;

            const BASE_DOMAIN = 'https://luckynum.top';

            function toAbsoluteURL(url) {
                if (!url) return url;
                if (url.startsWith('http://') || url.startsWith('https://')) return url;
                if (url.startsWith('//')) return 'https:' + url;
                if (url.startsWith('/')) return BASE_DOMAIN + url;
                return BASE_DOMAIN + '/' + url;
            }

            function formatFileSize(bytes) {
                if (!bytes || bytes === 0) return '未知大小';
                const units = ['B', 'KB', 'MB', 'GB'];
                let i = 0;
                let size = bytes;
                while (size >= 1024 && i < units.length - 1) {
                    size /= 1024;
                    i++;
                }
                return size.toFixed(1) + units[i];
            }

            function showToast(text) {
                toast.textContent = text;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            }

            function showTopBar() {
                loadingPage.classList.add('hidden');
                previewWrapper.classList.remove('hidden');
                topBar.classList.remove('hidden');
            }

            function getExt(name) { return (name.split('.').pop() || '').toLowerCase(); }

            function getType(ext) {
                if (/^(jpg|jpeg|png|gif|bmp|webp|svg)$/i.test(ext)) return 'image';
                if (/^(mp4|webm|ogg|mov|avi|mkv)$/i.test(ext)) return 'video';
                if (/^(mp3|wav|ogg|aac|flac|m4a)$/i.test(ext)) return 'audio';
                if (ext === 'pdf') return 'pdf';
                if (ext === 'docx' || ext === 'doc') return 'docx';
                if (ext === 'xlsx' || ext === 'xls') return 'xlsx';
                if (ext === 'pptx' || ext === 'ppt') return 'ppt';
                return 'unknown';
            }

            function getIconForType(type) {
                switch (type) {
                    case 'pdf':
                        return 'pdf.jpg';
                    case 'docx':
                        return 'word.jpg';
                    case 'xlsx':
                        return 'excel.jpg';
                    case 'ppt':
                        return 'ppt.jpg';
                    default:
                        return 'null.jpg';
                }
            }

            function goBack() {
                if (document.referrer && document.referrer !== window.location.href) {
                    window.history.back();
                } else {
                    window.close();
                }
            }

            function showTransferPage(sourceURL, fileName, fileSize) {
                loadingPage.classList.add('hidden');
                previewWrapper.classList.remove('hidden');
                topBar.classList.add('hidden');

                const ext = getExt(fileName);
                const type = getType(ext);
                const iconFile = getIconForType(type);
                const decodedName = decodeURIComponent(fileName);

                document.title = decodedName;

                previewWrapper.innerHTML = `
                    <div class="transfer-page">
                        <div class="transfer-container">
                            <div class="section-top">
                                <div class="transfer-icon-wrapper">
                                    <img src="${iconFile}" alt="文件图标" onerror="this.src='null.jpg'">
                                </div>
                                <div class="transfer-file-name">${decodedName}</div>
                                <div class="transfer-file-size">文件大小：${fileSize}</div>
                            </div>
                            <div class="spacer"></div>
                            <div class="section-bottom">
                                <button class="btn-preview" id="btnTransferPreview">预览</button>
                                <button class="btn-download" id="btnTransferDownload">下载</button>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('btnTransferPreview').addEventListener('click', () => {
                    doPreview(sourceURL, fileName);
                });
                document.getElementById('btnTransferDownload').addEventListener('click', () => {
                    window.open(toAbsoluteURL(sourceURL), '_blank');
                });
            }

            function showErrorPage(errorMessage) {
                loadingPage.classList.add('hidden');
                previewWrapper.classList.remove('hidden');
                topBar.classList.remove('hidden');
                fileNameDisplay.textContent = '加载失败';
                document.title = '加载失败 - 文件';
                previewWrapper.innerHTML = `
                    <div class="error-page">
                        <div class="error-icon">⚠️</div>
                        <div class="error-title">当前文件无法预览</div>
                        <div class="error-detail">${errorMessage}</div>
                        <button class="error-download-btn" id="errorDownloadBtn">📥 下载文件</button>
                    </div>
                `;
                document.getElementById('errorDownloadBtn').addEventListener('click', () => {
                    if (remoteSourceURL) {
                        window.open(toAbsoluteURL(remoteSourceURL), '_blank');
                    }
                });
            }

            function createZoomStage(lightBg = false) {
                const stage = document.createElement('div');
                stage.className = 'zoom-stage' + (lightBg ? ' light' : '');
                const content = document.createElement('div');
                content.className = 'zoom-content';
                stage.appendChild(content);
                let scale = 1,
                    tx = 0,
                    ty = 0;
                let drag = false,
                    startX, startY, startTX, startTY;
                let pinchDist = 0,
                    pinchScale, pinchTX, pinchTY, pinchCX, pinchCY;

                function updateTransform() { content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }

                function fitToScreen() {
                    setTimeout(() => {
                        const rect = stage.getBoundingClientRect();
                        const cw = content.scrollWidth || 800;
                        scale = Math.min(1.5, (rect.width * 0.9) / cw);
                        tx = (rect.width - cw * scale) / 2;
                        ty = (rect.height - (content.scrollHeight || 600) * scale) / 2;
                        ty = Math.max(10, ty);
                        updateTransform();
                    }, 100);
                }

                stage.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        drag = true;
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                        startTX = tx;
                        startTY = ty;
                    } else if (e.touches.length === 2) {
                        drag = false;
                        pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0]
                            .clientY - e.touches[1].clientY);
                        pinchCX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                        pinchCY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                        pinchScale = scale;
                        pinchTX = tx;
                        pinchTY = ty;
                    }
                    e.preventDefault();
                }, { passive: false });

                stage.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && pinchDist > 0) {
                        const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0]
                            .clientY - e.touches[1].clientY);
                        const ns = Math.min(5, Math.max(0.3, pinchScale * (nd / pinchDist)));
                        const ratio = ns / pinchScale;
                        tx = (pinchCX - stage.getBoundingClientRect().left) - ((pinchCX - stage.getBoundingClientRect()
                            .left) - pinchTX) * ratio;
                        ty = (pinchCY - stage.getBoundingClientRect().top) - ((pinchCY - stage.getBoundingClientRect()
                            .top) - pinchTY) * ratio;
                        scale = ns;
                        updateTransform();
                    } else if (e.touches.length === 1 && drag) {
                        tx = startTX + (e.touches[0].clientX - startX);
                        ty = startTY + (e.touches[0].clientY - startY);
                        updateTransform();
                    }
                    e.preventDefault();
                }, { passive: false });

                stage.addEventListener('touchend', () => { drag = false;
                    pinchDist = 0; });
                stage.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const rect = stage.getBoundingClientRect();
                    const mx = e.clientX - rect.left,
                        my = e.clientY - rect.top;
                    const ns = Math.min(5, Math.max(0.3, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
                    const ratio = ns / scale;
                    tx = mx - (mx - tx) * ratio;
                    ty = my - (my - ty) * ratio;
                    scale = ns;
                    updateTransform();
                }, { passive: false });

                return { stage, content, fitToScreen };
            }

            async function renderImage(url) {
                const { stage, content, fitToScreen } = createZoomStage(true);
                previewWrapper.appendChild(stage);
                const img = document.createElement('img');
                img.src = url;
                img.alt = currentFileName;
                img.style.maxWidth = '90vw';
                img.style.maxHeight = '80vh';
                content.appendChild(img);
                img.onload = () => fitToScreen();
                img.onerror = () => showErrorPage('图片加载失败');
            }

            async function renderPDF(url) {
                const { stage, content, fitToScreen } = createZoomStage(false);
                previewWrapper.appendChild(stage);
                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                try {
                    const pdf = await pdfjsLib.getDocument(url).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const vp = page.getViewport({ scale: 1.5 });
                        const wrapper = document.createElement('div');
                        wrapper.className = 'pdf-page';
                        wrapper.style.width = vp.width + 'px';
                        wrapper.style.height = vp.height + 'px';
                        const canvas = document.createElement('canvas');
                        canvas.width = vp.width;
                        canvas.height = vp.height;
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                        wrapper.appendChild(canvas);
                        content.appendChild(wrapper);
                    }
                    fitToScreen();
                } catch (err) {
                    showErrorPage(err.message);
                }
            }

            function renderOfficeOnline(sourceURL) {
                const wrapper = document.createElement('div');
                wrapper.className = 'office-wrapper';
                const iframe = document.createElement('iframe');
                const absoluteURL = toAbsoluteURL(sourceURL);
                iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(absoluteURL)}`;
                iframe.allowFullscreen = true;
                wrapper.appendChild(iframe);
                previewWrapper.appendChild(wrapper);
            }

            function renderVideo(url) {
                const container = document.createElement('div');
                container.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;background:#000;';
                const video = document.createElement('video');
                video.src = url;
                video.controls = true;
                video.style.maxWidth = '95%';
                video.style.maxHeight = '80vh';
                container.appendChild(video);
                previewWrapper.appendChild(container);
            }

            function renderAudio(url) {
                const container = document.createElement('div');
                container.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;';
                container.innerHTML =
                    `<div style="background:white;padding:30px;border-radius:16px;text-align:center;"><h3>🎵 ${decodeURIComponent(currentFileName)}</h3><audio src="${url}" controls style="width:100%;margin-top:15px;"></audio></div>`;
                previewWrapper.appendChild(container);
            }

            function doPreview(sourceURL, fileName) {
                currentFileName = fileName;
                remoteSourceURL = sourceURL;
                const decodedName = decodeURIComponent(fileName);
                fileNameDisplay.textContent = decodedName;
                document.title = decodedName;
                showTopBar();
                previewWrapper.innerHTML = '';

                const type = getType(getExt(fileName));
                const absoluteURL = toAbsoluteURL(sourceURL);

                switch (type) {
                    case 'image':
                        renderImage(absoluteURL);
                        break;
                    case 'video':
                        renderVideo(absoluteURL);
                        break;
                    case 'audio':
                        renderAudio(absoluteURL);
                        break;
                    case 'pdf':
                        renderPDF(absoluteURL);
                        break;
                    case 'docx':
                    case 'xlsx':
                    case 'ppt':
                        renderOfficeOnline(sourceURL);
                        break;
                    default:
                        showErrorPage('不支持的文件格式');
                }
            }

            function renderPreview(fileURL, fileName, sourceURL) {
                currentFileURL = fileURL;
                currentFileName = fileName;
                remoteSourceURL = sourceURL || null;
                const decodedName = decodeURIComponent(fileName);
                fileNameDisplay.textContent = decodedName;
                document.title = decodedName;
                showTopBar();
                previewWrapper.innerHTML = '';

                const type = getType(getExt(fileName));
                switch (type) {
                    case 'image':
                        renderImage(fileURL);
                        break;
                    case 'video':
                        renderVideo(fileURL);
                        break;
                    case 'audio':
                        renderAudio(fileURL);
                        break;
                    case 'pdf':
                        renderPDF(sourceURL || fileURL);
                        break;
                    case 'docx':
                    case 'xlsx':
                    case 'ppt':
                        if (sourceURL) {
                            renderOfficeOnline(sourceURL);
                        } else {
                            showErrorPage('Office 文件需要远程链接才能预览');
                        }
                        break;
                    default:
                        showErrorPage('不支持的文件格式');
                }
            }

            async function getFileSize(url) {
                try {
                    const resp = await fetch(url, { method: 'HEAD' });
                    if (resp.ok) {
                        const length = resp.headers.get('content-length');
                        if (length) return formatFileSize(parseInt(length));
                    }
                } catch (e) {}

                try {
                    const resp = await fetch(url);
                    if (resp.ok) {
                        const blob = await resp.blob();
                        if (blob.size > 0) return formatFileSize(blob.size);
                    }
                } catch (e) {}

                return '未知大小';
            }

            async function loadRemote(remoteUrl) {
                try {
                    const absoluteURL = toAbsoluteURL(remoteUrl);
                    let name = remoteUrl.split('/').pop().split('?')[0] || 'file';
                    const ext = getExt(name);
                    const type = getType(ext);

                    if (type === 'image' || type === 'video' || type === 'audio') {
                        renderPreview(absoluteURL, name, remoteUrl);
                    } else {
                        const fileSize = await getFileSize(absoluteURL);
                        showTransferPage(remoteUrl, name, fileSize);
                    }
                } catch (err) {
                    showErrorPage('无法加载文件：' + err.message);
                }
            }

            backBtn.addEventListener('click', goBack);
            downloadBtn.addEventListener('click', () => {
                if (remoteSourceURL) {
                    window.open(toAbsoluteURL(remoteSourceURL), '_blank');
                }
            });
            copyLinkBtn.addEventListener('click', async () => {
                if (remoteSourceURL) {
                    await navigator.clipboard.writeText(
                        `${BASE_DOMAIN}/filereader?file=${encodeURIComponent(remoteSourceURL)}`);
                    showToast('链接已复制');
                } else {
                    showToast('无法复制链接');
                }
            });

            const p = new URL(location.href).searchParams.get('file');
            if (p) {
                loadRemote(p);
            }
        })();
    </script>
</body>
</html>
