<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>班级登录系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 { font-size: 28px; margin-bottom: 8px; }
        .sub { color: #666; margin-bottom: 30px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .message {
            padding: 12px;
            border-radius: 12px;
            margin: 16px 0;
            display: none;
            font-size: 14px;
        }
        .error { background: #fee; color: #c33; }
        .success { background: #efe; color: #3a3; }
        .info { background: #e3f2fd; color: #1976d2; }
    </style>
</head>
<body>
<div class="card">
    <h1>🏫 班级登录</h1>
    <div class="sub" id="modeText">请输入学号和密码</div>

    <div id="message" class="message"></div>

    <select id="studentSelect">
        <option value="">-- 选择你的姓名 --</option>
    </select>
    
    <input type="password" id="password" placeholder="密码">
    <input type="password" id="confirmPassword" placeholder="确认密码" style="display:none">
    
    <button id="submitBtn" onclick="handleLogin()">登录</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
    const SUPABASE_URL = 'https://cafnrcvjvqzcrcfnxqygo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_X8K1SrDtFGvDe05GR4tn0w_q6Mzm8uK';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let studentsList = [];
    let currentStudentNo = null;

    async function loadStudents() {
        const { data, error } = await supabase
            .from('students')
            .select('student_no, name, has_password')
            .order('student_no');
        
        if (error) {
            showMessage('加载学生列表失败：' + error.message, 'error');
            return;
        }
        
        studentsList = data;
        const select = document.getElementById('studentSelect');
        select.innerHTML = '<option value="">-- 选择你的姓名 --</option>';
        
        data.forEach(student => {
            const option = document.createElement('option');
            option.value = student.student_no;
            option.textContent = `${student.student_no} - ${student.name}`;
            select.appendChild(option);
        });
        
        select.onchange = function() {
            currentStudentNo = this.value;
            const student = studentsList.find(s => s.student_no === currentStudentNo);
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');
            const submitBtn = document.getElementById('submitBtn');
            
            if (student && !student.has_password) {
                // 首次登录，需要设置密码
                document.getElementById('modeText').textContent = '首次登录，请设置你的密码';
                confirmInput.style.display = 'block';
                submitBtn.textContent = '设置密码并登录';
                passwordInput.placeholder = '设置密码';
                confirmInput.placeholder = '确认密码';
            } else {
                // 已有密码，正常登录
                document.getElementById('modeText').textContent = '请输入密码登录';
                confirmInput.style.display = 'none';
                submitBtn.textContent = '登录';
                passwordInput.placeholder = '密码';
            }
            passwordInput.value = '';
            confirmInput.value = '';
        };
    }

    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = `message ${type}`;
        msgDiv.style.display = 'block';
        setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 4000);
    }

    async function handleLogin() {
        if (!currentStudentNo) {
            showMessage('请选择你的姓名', 'error');
            return;
        }
        
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const student = studentsList.find(s => s.student_no === currentStudentNo);
        
        if (!password) {
            showMessage('请输入密码', 'error');
            return;
        }
        
        // 首次设置密码的情况
        if (!student.has_password) {
            if (password !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }
            if (password.length < 4) {
                showMessage('密码至少4位', 'error');
                return;
            }
            
            // 保存密码
            const passwordHash = CryptoJS.SHA256(password).toString();
            const { error } = await supabase
                .from('student_passwords')
                .insert([{ student_no: currentStudentNo, password_hash: passwordHash }]);
            
            if (error) {
                showMessage('设置密码失败：' + error.message, 'error');
                return;
            }
            
            // 更新 has_password 标志
            await supabase
                .from('students')
                .update({ has_password: true })
                .eq('student_no', currentStudentNo);
            
            showMessage('密码设置成功！请重新登录', 'success');
            setTimeout(() => location.reload(), 1500);
            return;
        }
        
        // 正常登录验证
        const passwordHash = CryptoJS.SHA256(password).toString();
        const { data, error } = await supabase
            .from('student_passwords')
            .select('student_no')
            .eq('student_no', currentStudentNo)
            .eq('password_hash', passwordHash);
        
        if (error || !data || data.length === 0) {
            showMessage('密码错误', 'error');
            return;
        }
        
        showMessage('登录成功！', 'success');
        // 保存登录状态
        localStorage.setItem('loggedInStudent', currentStudentNo);
        const studentInfo = studentsList.find(s => s.student_no === currentStudentNo);
        localStorage.setItem('studentName', studentInfo.name);
        // 跳转到班级主页
        setTimeout(() => {
            window.location.href = '/dashboard.html';
        }, 1000);
    }

    loadStudents();
</script>
</body>
</html>
