 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级登录系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 { font-size: 28px; margin-bottom: 8px; color: #333; }
        .sub { color: #666; margin-bottom: 30px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            transition: 0.2s;
        }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 8px 0;
            transition: 0.2s;
        }
        button:hover { background: #5a67d8; transform: translateY(-1px); }
        .switch {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .switch a { color: #667eea; cursor: pointer; text-decoration: none; }
        .message {
            padding: 12px;
            border-radius: 12px;
            margin: 16px 0;
            font-size: 14px;
            display: none;
        }
        .error { background: #fee; color: #c33; border: 1px solid #fcc; }
        .success { background: #efe; color: #3a3; border: 1px solid #cfc; }
        .loading { opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>🏫 班级登录</h1>
    <div class="sub" id="modeText">登录你的账号</div>

    <div id="message" class="message"></div>

    <input type="email" id="email" placeholder="邮箱地址" autocomplete="email">
    <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    
    <button id="submitBtn" onclick="handleSubmit()">登录</button>
    
    <div class="switch">
        <span id="switchText">还没有账号？</span>
        <a id="switchLink" onclick="toggleMode()">注册</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ========== 在这里填入你的信息 ==========
    const SUPABASE_URL = 'https://cafnrcvjvqzcrcfnxqygo.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_X8K1SrDtFGvDe05GR4tn0w_q6Mzm8uK';
    // =====================================

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let isLoginMode = true;  // true=登录模式, false=注册模式

    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.textContent = msg;
        msgDiv.className = `message ${type}`;
        msgDiv.style.display = 'block';
        setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 4000);
    }

    async function handleSubmit() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            showMessage('请填写邮箱和密码', 'error');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.classList.add('loading');
        btn.textContent = isLoginMode ? '登录中...' : '注册中...';

        if (isLoginMode) {
            // 登录
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });
            btn.classList.remove('loading');
            btn.textContent = isLoginMode ? '登录' : '注册';
            
            if (error) {
                showMessage('登录失败：' + error.message, 'error');
            } else {
                showMessage('登录成功！正在跳转...', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';  // 登录成功后跳转的页面
                }, 1500);
            }
        } else {
            // 注册
            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password
            });
            btn.classList.remove('loading');
            btn.textContent = isLoginMode ? '登录' : '注册';
            
            if (error) {
                showMessage('注册失败：' + error.message, 'error');
            } else {
                showMessage('注册成功！请查收邮箱并点击确认链接', 'success');
                // 自动切换到登录模式
                setTimeout(() => {
                    if (isLoginMode === false) toggleMode();
                }, 2000);
            }
        }
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        const modeText = document.getElementById('modeText');
        const submitBtn = document.getElementById('submitBtn');
        const switchText = document.getElementById('switchText');
        const switchLink = document.getElementById('switchLink');
        
        if (isLoginMode) {
            modeText.textContent = '登录你的账号';
            submitBtn.textContent = '登录';
            switchText.textContent = '还没有账号？';
            switchLink.textContent = '注册';
        } else {
            modeText.textContent = '创建新账号';
            submitBtn.textContent = '注册';
            switchText.textContent = '已有账号？';
            switchLink.textContent = '登录';
        }
    }

    // 检查是否已经登录
    async function checkSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            window.location.href = '/dashboard.html';
        }
    }
    checkSession();
</script>
</body>
</html>
