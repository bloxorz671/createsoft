<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时麦克风音频播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(30, 30, 46, 0.7);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #4cc9f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-title i {
            margin-right: 10px;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .control-group {
            flex: 1;
            min-width: 300px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: 500;
        }
        
        select, .volume-control {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        
        select:focus, .volume-control:focus {
            border-color: #4cc9f0;
            box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2);
        }
        
        option {
            background-color: #1a1a2e;
            color: white;
        }
        
        .volume-control {
            -webkit-appearance: none;
            height: 8px;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            border-radius: 4px;
            padding: 0;
        }
        
        .volume-control::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        
        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        button {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        button i {
            margin-right: 10px;
        }
        
        #startBtn {
            background: linear-gradient(90deg, #00b09b, #96c93d);
            color: white;
        }
        
        #startBtn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }
        
        #stopBtn {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
        }
        
        #stopBtn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .visualizer-container {
            margin-top: 20px;
        }
        
        #visualizer {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .status.active {
            display: block;
            background: rgba(0, 150, 136, 0.2);
            border-left: 5px solid #009688;
        }
        
        .status.error {
            display: block;
            background: rgba(244, 67, 54, 0.2);
            border-left: 5px solid #f44336;
        }
        
        .status.warning {
            display: block;
            background: rgba(255, 193, 7, 0.2);
            border-left: 5px solid #ffc107;
        }
        
        .status.info {
            display: block;
            background: rgba(33, 150, 243, 0.2);
            border-left: 5px solid #2196f3;
        }
        
        .status p {
            margin: 0;
        }
        
        .volume-indicator {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        
        .volume-level {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin-right: 10px;
            overflow: hidden;
        }
        
        .volume-fill {
            height: 100%;
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            width: 0%;
            border-radius: 5px;
            transition: width 0.1s;
        }
        
        .volume-text {
            min-width: 60px;
            text-align: right;
            font-weight: 600;
        }
        
        .performance-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 5px;
            flex: 1;
            min-width: 150px;
        }
        
        .stat-label {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .stat-value {
            color: #4cc9f0;
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        footer {
            margin-top: 30px;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
        }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .mode-btn.active {
            background: linear-gradient(90deg, #00dbde, #fc00ff);
            border-color: transparent;
        }
        
        .permission-btn {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(90deg, #ff9800, #ff5722);
            color: white;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .permission-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.4);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .card {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            button {
                min-width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-microphone-alt"></i> 实时麦克风音频播放器</h1>
            <p class="subtitle">低延迟实时音频监控 | 自动记忆您的设置</p>
        </header>
        
        <main>
            <div class="card">
                <h2 class="card-title">
                    <span><i class="fas fa-sliders-h"></i> 音频控制</span>
                </h2>
                
                <div class="controls">
                    <div class="control-group">
                        <label for="microphoneSelect"><i class="fas fa-microphone"></i> 选择麦克风设备</label>
                        <select id="microphoneSelect">
                            <option value="">正在加载设备列表...</option>
                        </select>
                        <div style="margin-top: 10px;">
                            <a class="permission-btn" id="requestPermissionBtn" style="display: none;">
                                <i class="fas fa-key"></i> 请求麦克风权限
                            </a>
                        </div>
                    </div>
                    
                    <div class="control-group">
                        <label for="volumeControl"><i class="fas fa-volume-up"></i> 播放音量控制</label>
                        <input type="range" id="volumeControl" class="volume-control" min="0" max="100" value="50">
                        
                        <div class="volume-indicator">
                            <div class="volume-level">
                                <div class="volume-fill" id="volumeFill"></div>
                            </div>
                            <div class="volume-text" id="volumeText">50%</div>
                        </div>
                    </div>
                </div>
                
                <div class="mode-selector">
                    <label>工作模式：</label>
                    <button class="mode-btn" data-mode="direct">直接模式（推荐）</button>
                    <button class="mode-btn" data-mode="standard">标准模式</button>
                </div>
                
                <div class="performance-stats">
                    <div class="stat-item">
                        <div class="stat-label">当前模式</div>
                        <div class="stat-value" id="currentMode">加载中...</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">延迟估计</div>
                        <div class="stat-value" id="latencyEstimate">--</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">音频状态</div>
                        <div class="stat-value" id="audioState">初始化中</div>
                    </div>
                </div>
                
                <div class="button-container">
                    <button id="startBtn"><i class="fas fa-play"></i> 开始监听</button>
                    <button id="stopBtn" disabled><i class="fas fa-stop"></i> 停止监听</button>
                </div>
                
                <div class="status" id="status"></div>
            </div>
            
            <div class="card">
                <h2 class="card-title"><i class="fas fa-wave-square"></i> 音频可视化</h2>
                <div class="visualizer-container">
                    <canvas id="visualizer"></canvas>
                </div>
            </div>
        </main>
        
        <footer>
            <p>实时麦克风音频播放器 | 使用Web Audio API构建</p>
        </footer>
    </div>

    <script>
        // 获取DOM元素
        const microphoneSelect = document.getElementById('microphoneSelect');
        const volumeControl = document.getElementById('volumeControl');
        const volumeFill = document.getElementById('volumeFill');
        const volumeText = document.getElementById('volumeText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const status = document.getElementById('status');
        const visualizerCanvas = document.getElementById('visualizer');
        const currentModeElement = document.getElementById('currentMode');
        const latencyEstimateElement = document.getElementById('latencyEstimate');
        const audioStateElement = document.getElementById('audioState');
        const requestPermissionBtn = document.getElementById('requestPermissionBtn');
        
        // 存储键名
        const STORAGE_KEYS = {
            MICROPHONE_ID: 'audioMonitor_microphoneId',
            MICROPHONE_NAME: 'audioMonitor_microphoneName',
            MODE: 'audioMonitor_mode',
            VOLUME: 'audioMonitor_volume',
            LAST_USED: 'audioMonitor_lastUsed'
        };
        
        // 音频相关变量
        let audioContext = null;
        let sourceNode = null;
        let mediaStream = null;
        let isRecording = false;
        let animationId = null;
        let analyserNode = null;
        let gainNode = null;
        
        // 当前选择的模式（从存储中加载或默认）
        let currentMode = 'direct';
        
        // 保存的设置
        let savedSettings = {
            microphoneId: null,
            microphoneName: null,
            mode: null,
            volume: 50
        };
        
        // 初始化音量显示
        volumeFill.style.width = `${volumeControl.value}%`;
        volumeText.textContent = `${volumeControl.value}%`;
        
        // 加载保存的设置
        function loadSavedSettings() {
            try {
                savedSettings.microphoneId = localStorage.getItem(STORAGE_KEYS.MICROPHONE_ID);
                savedSettings.microphoneName = localStorage.getItem(STORAGE_KEYS.MICROPHONE_NAME);
                savedSettings.mode = localStorage.getItem(STORAGE_KEYS.MODE);
                savedSettings.volume = parseInt(localStorage.getItem(STORAGE_KEYS.VOLUME)) || 50;
                
                return savedSettings;
            } catch (error) {
                console.error('加载设置失败:', error);
                return null;
            }
        }
        
        // 保存设置
        function saveSettings() {
            try {
                // 保存麦克风ID和名称
                if (microphoneSelect.value) {
                    localStorage.setItem(STORAGE_KEYS.MICROPHONE_ID, microphoneSelect.value);
                    localStorage.setItem(STORAGE_KEYS.MICROPHONE_NAME, microphoneSelect.options[microphoneSelect.selectedIndex].text);
                }
                
                // 保存模式
                localStorage.setItem(STORAGE_KEYS.MODE, currentMode);
                
                // 保存音量
                localStorage.setItem(STORAGE_KEYS.VOLUME, volumeControl.value);
                
                // 保存最后使用时间
                localStorage.setItem(STORAGE_KEYS.LAST_USED, new Date().toISOString());
                
                return true;
            } catch (error) {
                console.error('保存设置失败:', error);
                return false;
            }
        }
        
        // 应用保存的设置
        function applySavedSettings() {
            // 应用音量设置
            if (savedSettings.volume) {
                volumeControl.value = savedSettings.volume;
                volumeFill.style.width = `${savedSettings.volume}%`;
                volumeText.textContent = `${savedSettings.volume}%`;
            }
            
            // 应用模式设置
            if (savedSettings.mode) {
                currentMode = savedSettings.mode;
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.mode === currentMode) {
                        btn.classList.add('active');
                    }
                });
                
                if (currentMode === 'direct') {
                    currentModeElement.textContent = '直接模式';
                    latencyEstimateElement.textContent = '10-30ms';
                } else {
                    currentModeElement.textContent = '标准模式';
                    latencyEstimateElement.textContent = '40-80ms';
                }
            }
        }
        
        // 尝试选择保存的麦克风设备
        function trySelectSavedMicrophone() {
            if (!savedSettings.microphoneId) return false;
            
            // 等待设备列表加载完成
            setTimeout(() => {
                for (let i = 0; i < microphoneSelect.options.length; i++) {
                    if (microphoneSelect.options[i].value === savedSettings.microphoneId) {
                        microphoneSelect.selectedIndex = i;
                        return true;
                    }
                }
                return false;
            }, 500);
            
            return false;
        }
        
        // 音量控制事件
        volumeControl.addEventListener('input', () => {
            const volume = volumeControl.value;
            volumeFill.style.width = `${volume}%`;
            volumeText.textContent = `${volume}%`;
            
            if (gainNode) {
                gainNode.gain.value = volume / 100;
            }
            
            // 自动保存音量设置
            saveSettings();
        });
        
        // 模式选择按钮事件
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isRecording) {
                    updateStatus('请先停止当前监听再切换模式', 'warning');
                    return;
                }
                
                // 移除所有active类
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                // 添加active类到当前按钮
                btn.classList.add('active');
                // 更新当前模式
                currentMode = btn.dataset.mode;
                
                if (currentMode === 'direct') {
                    currentModeElement.textContent = '直接模式';
                    latencyEstimateElement.textContent = '10-30ms';
                } else {
                    currentModeElement.textContent = '标准模式';
                    latencyEstimateElement.textContent = '40-80ms';
                }
                
                updateStatus(`已切换到${currentMode === 'direct' ? '直接模式（低延迟）' : '标准模式（高兼容性）'}`, 'active');
                
                // 保存模式设置
                saveSettings();
            });
        });
        
        // 麦克风选择变化时保存设置
        microphoneSelect.addEventListener('change', () => {
            if (microphoneSelect.value) {
                // 保存麦克风设置
                saveSettings();
            }
        });
        
        // 请求麦克风权限
        async function requestMicrophonePermission() {
            try {
                updateStatus('正在请求麦克风权限...', 'active');
                
                // 先尝试获取权限而不指定设备
                const testStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true,
                    video: false 
                }).catch(e => {
                    console.error('获取权限失败:', e);
                    throw e;
                });
                
                // 立即停止测试流
                testStream.getTracks().forEach(track => track.stop());
                
                updateStatus('麦克风权限已获取，正在刷新设备列表...', 'active');
                audioStateElement.textContent = '已授权';
                
                // 获取设备列表
                await getMicrophoneDevices();
                
                // 尝试选择保存的设备
                trySelectSavedMicrophone();
                
                startBtn.disabled = false;
                requestPermissionBtn.style.display = 'none';
                
            } catch (error) {
                console.error('权限请求失败:', error);
                
                let errorMessage = '无法访问麦克风：';
                
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMessage += '用户拒绝了权限请求或浏览器设置阻止了访问。';
                    errorMessage += '<br>请检查浏览器设置或点击下方按钮重新授权。';
                    requestPermissionBtn.style.display = 'inline-block';
                } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
                    errorMessage += '未找到可用的麦克风设备。';
                } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
                    errorMessage += '麦克风设备被其他程序占用。';
                } else if (error.name === 'SecurityError') {
                    errorMessage += '必须在HTTPS或localhost环境下使用。';
                } else {
                    errorMessage += error.message || '未知错误';
                }
                
                updateStatus(errorMessage, 'error');
                audioStateElement.textContent = '权限被拒绝';
                
                // 如果是因为HTTPS问题，给出提示
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                    updateStatus('提示：现代浏览器要求HTTPS环境才能使用麦克风，请在localhost或HTTPS环境下使用', 'warning');
                }
            }
        }
        
        // 请求权限按钮事件
        requestPermissionBtn.addEventListener('click', requestMicrophonePermission);
        
        // 获取麦克风设备列表
        async function getMicrophoneDevices() {
            try {
                // 检查是否支持媒体设备API
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    throw new Error('浏览器不支持媒体设备API');
                }
                
                // 先尝试请求权限，确保能获取设备标签
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e) {
                    // 即使权限被拒，仍然尝试获取设备列表
                }
                
                // 获取所有设备
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputDevices = devices.filter(device => device.kind === 'audioinput');
                
                // 清空选择框
                microphoneSelect.innerHTML = '';
                
                if (audioInputDevices.length === 0) {
                    microphoneSelect.innerHTML = '<option value="">未检测到麦克风设备</option>';
                    updateStatus('未检测到麦克风设备', 'warning');
                    return;
                }
                
                // 添加设备选项
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.textContent = '请选择麦克风设备';
                microphoneSelect.appendChild(defaultOption);
                
                audioInputDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.textContent = device.label || `麦克风 ${index + 1} (设备ID: ${device.deviceId.substring(0, 10)}...)`;
                    microphoneSelect.appendChild(option);
                });
                
                updateStatus(`检测到 ${audioInputDevices.length} 个麦克风设备`, 'active');
                
            } catch (error) {
                console.error('获取设备列表失败:', error);
                microphoneSelect.innerHTML = '<option value="">获取设备列表失败</option>';
                updateStatus(`获取设备列表失败: ${error.message}`, 'error');
            }
        }
        
        // 更新状态显示
        function updateStatus(message, className) {
            status.innerHTML = message;
            status.className = 'status ' + className;
            status.style.display = 'block';
            
            // 如果是普通状态，5秒后自动清除
            if (className === 'active' || className === 'info') {
                setTimeout(() => {
                    if ((status.className.includes('active') || status.className.includes('info')) && !isRecording) {
                        status.style.display = 'none';
                    }
                }, 5000);
            }
        }
        
        // 直接模式（最低延迟）
        async function startDirectMode() {
            try {
                // 创建音频上下文
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    latencyHint: 'interactive'
                });
                
                // 获取麦克风设备ID
                const deviceId = microphoneSelect.value;
                if (!deviceId) {
                    throw new Error('请选择麦克风设备');
                }
                
                // 获取麦克风流
                const constraints = {
                    audio: {
                        deviceId: deviceId ? { exact: deviceId } : undefined,
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        channelCount: 1
                    }
                };
                
                updateStatus('正在连接麦克风...', 'active');
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // 创建音频节点
                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                gainNode = audioContext.createGain();
                analyserNode = audioContext.createAnalyser();
                
                // 设置参数
                gainNode.gain.value = volumeControl.value / 100;
                analyserNode.fftSize = 256;
                analyserNode.smoothingTimeConstant = 0.3;
                
                // 连接节点：source -> gain -> destination（最低延迟）
                sourceNode.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // 单独连接到分析器用于可视化（不影响主音频流）
                sourceNode.connect(analyserNode);
                
                return true;
                
            } catch (error) {
                console.error('直接模式启动失败:', error);
                throw error;
            }
        }
        
        // 标准模式（更高兼容性）
        async function startStandardMode() {
            try {
                // 创建音频上下文
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // 获取麦克风设备ID
                const deviceId = microphoneSelect.value;
                if (!deviceId) {
                    throw new Error('请选择麦克风设备');
                }
                
                // 获取麦克风流
                const constraints = {
                    audio: {
                        deviceId: deviceId ? { exact: deviceId } : undefined
                    }
                };
                
                updateStatus('正在连接麦克风...', 'active');
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // 创建音频节点
                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                gainNode = audioContext.createGain();
                analyserNode = audioContext.createAnalyser();
                
                // 设置参数
                gainNode.gain.value = volumeControl.value / 100;
                analyserNode.fftSize = 256;
                analyserNode.smoothingTimeConstant = 0.3;
                
                // 连接节点
                sourceNode.connect(gainNode);
                gainNode.connect(analyserNode);
                analyserNode.connect(audioContext.destination);
                
                return true;
                
            } catch (error) {
                console.error('标准模式启动失败:', error);
                throw error;
            }
        }
        
        // 开始音频捕获
        async function startAudio() {
            if (isRecording) {
                updateStatus('音频捕获已在运行', 'warning');
                return;
            }
            
            const deviceId = microphoneSelect.value;
            
            if (!deviceId) {
                updateStatus('请选择麦克风设备', 'error');
                return;
            }
            
            try {
                updateStatus('正在启动音频监听...', 'active');
                audioStateElement.textContent = '启动中...';
                
                let success = false;
                
                // 根据当前模式启动
                if (currentMode === 'direct') {
                    success = await startDirectMode();
                } else {
                    success = await startStandardMode();
                }
                
                if (success) {
                    // 更新UI状态
                    isRecording = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    microphoneSelect.disabled = true;
                    
                    // 开始可视化
                    startVisualization();
                    
                    updateStatus(`音频监听已开始（${currentModeElement.textContent}）`, 'active');
                    audioStateElement.textContent = '运行中';
                    
                    // 保存当前设置
                    saveSettings();
                    
                    // 提示佩戴耳机
                    setTimeout(() => {
                        if (isRecording) {
                            updateStatus('提示：建议佩戴耳机以避免回声反馈', 'warning');
                        }
                    }, 2000);
                }
                
            } catch (error) {
                console.error('启动音频失败:', error);
                
                let errorMessage = '启动失败：';
                
                if (error.name === 'NotAllowedError') {
                    errorMessage += '麦克风访问被拒绝，请重新授权';
                } else if (error.name === 'NotFoundError') {
                    errorMessage += '选择的麦克风设备不可用';
                } else if (error.name === 'NotReadableError') {
                    errorMessage += '麦克风被其他程序占用';
                } else {
                    errorMessage += error.message || '未知错误';
                }
                
                updateStatus(errorMessage, 'error');
                audioStateElement.textContent = '启动失败';
                
                // 清理资源
                cleanupAudioResources();
            }
        }
        
        // 停止音频捕获
        function stopAudio() {
            if (!isRecording) return;
            
            // 立即更新UI状态，防止重复点击
            isRecording = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            stopBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 停止中...';
            
            // 使用异步清理
            setTimeout(() => {
                cleanupAudio();
                
                // 恢复按钮状态
                stopBtn.innerHTML = '<i class="fas fa-stop"></i> 停止监听';
                microphoneSelect.disabled = false;
                
                updateStatus('音频监听已停止', 'active');
                audioStateElement.textContent = '已停止';
            }, 100);
        }
        
        // 清理音频资源
        function cleanupAudio() {
            try {
                // 停止可视化
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                
                // 停止媒体流
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => {
                        try {
                            track.stop();
                            track.enabled = false;
                        } catch (e) {
                            console.log('停止音轨时出错:', e);
                        }
                    });
                    mediaStream = null;
                }
                
                // 断开音频节点连接
                if (sourceNode) {
                    try {
                        sourceNode.disconnect();
                    } catch (e) {
                        console.log('断开源节点时出错:', e);
                    }
                }
                
                if (gainNode) {
                    try {
                        gainNode.disconnect();
                    } catch (e) {
                        console.log('断开增益节点时出错:', e);
                    }
                }
                
                if (analyserNode) {
                    try {
                        analyserNode.disconnect();
                    } catch (e) {
                        console.log('断开分析器时出错:', e);
                    }
                }
                
                // 关闭音频上下文
                if (audioContext) {
                    if (audioContext.state !== 'closed') {
                        audioContext.close().catch(e => {
                            console.log('关闭音频上下文时出错:', e);
                        });
                    }
                    audioContext = null;
                }
                
                // 重置变量
                sourceNode = null;
                gainNode = null;
                analyserNode = null;
                
                // 清理可视化画布
                const canvasCtx = visualizerCanvas.getContext('2d');
                if (canvasCtx) {
                    canvasCtx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
                }
                
            } catch (error) {
                console.error('清理音频资源时出错:', error);
            }
        }
        
        // 快速清理函数
        function cleanupAudioResources() {
            try {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close();
                }
            } catch (e) {
                // 静默失败
            }
            
            sourceNode = null;
            mediaStream = null;
            analyserNode = null;
            gainNode = null;
            audioContext = null;
            isRecording = false;
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            microphoneSelect.disabled = false;
        }
        
        // 开始音频可视化
        function startVisualization() {
            const canvasCtx = visualizerCanvas.getContext('2d');
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const freqArray = new Uint8Array(bufferLength);
            
            // 设置画布尺寸
            visualizerCanvas.width = visualizerCanvas.offsetWidth;
            visualizerCanvas.height = visualizerCanvas.offsetHeight;
            
            function draw() {
                if (!isRecording) return;
                
                try {
                    animationId = requestAnimationFrame(draw);
                    
                    // 获取音频数据
                    analyserNode.getByteTimeDomainData(dataArray);
                    analyserNode.getByteFrequencyData(freqArray);
                    
                    // 清空画布
                    canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                    canvasCtx.fillRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
                    
                    // 绘制波形
                    canvasCtx.lineWidth = 2;
                    canvasCtx.strokeStyle = '#4cc9f0';
                    canvasCtx.beginPath();
                    
                    const sliceWidth = visualizerCanvas.width / bufferLength;
                    let x = 0;
                    
                    for (let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 128.0;
                        const y = v * visualizerCanvas.height / 2;
                        
                        if (i === 0) {
                            canvasCtx.moveTo(x, y);
                        } else {
                            canvasCtx.lineTo(x, y);
                        }
                        
                        x += sliceWidth;
                    }
                    
                    canvasCtx.stroke();
                    
                    // 绘制频谱
                    const barWidth = (visualizerCanvas.width / bufferLength) * 2.5;
                    let barX = 0;
                    
                    for (let i = 0; i < bufferLength / 2; i++) {
                        const barHeight = (freqArray[i] / 255) * visualizerCanvas.height;
                        
                        const gradient = canvasCtx.createLinearGradient(
                            0, visualizerCanvas.height - barHeight, 
                            0, visualizerCanvas.height
                        );
                        gradient.addColorStop(0, '#00dbde');
                        gradient.addColorStop(0.7, '#fc00ff');
                        gradient.addColorStop(1, '#ff416c');
                        
                        canvasCtx.fillStyle = gradient;
                        canvasCtx.fillRect(barX, visualizerCanvas.height - barHeight, barWidth, barHeight);
                        
                        barX += barWidth + 1;
                    }
                } catch (error) {
                    // 可视化出错时停止
                    cancelAnimationFrame(animationId);
                }
            }
            
            draw();
        }
        
        // 窗口大小改变时调整可视化画布
        window.addEventListener('resize', () => {
            if (isRecording && visualizerCanvas) {
                visualizerCanvas.width = visualizerCanvas.offsetWidth;
                visualizerCanvas.height = visualizerCanvas.offsetHeight;
            }
        });
        
        // 按钮事件监听
        startBtn.addEventListener('click', startAudio);
        stopBtn.addEventListener('click', stopAudio);
        
        // 初始化页面
        window.addEventListener('load', async () => {
            // 检查浏览器兼容性
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                updateStatus('您的浏览器不支持麦克风功能，请使用Chrome、Firefox或Edge浏览器', 'error');
                startBtn.disabled = true;
                requestPermissionBtn.disabled = true;
                return;
            }
            
            // 检查是否在安全上下文中
            if (window.isSecureContext) {
                updateStatus('页面已准备就绪', 'active');
            } else {
                updateStatus('警告：请在HTTPS或localhost环境下使用以获得最佳兼容性', 'warning');
            }
            
            // 加载保存的设置
            loadSavedSettings();
            
            // 应用保存的设置
            applySavedSettings();
            
            // 监听设备变化
            navigator.mediaDevices.addEventListener('devicechange', () => {
                getMicrophoneDevices();
                // 设备变化后重新尝试选择保存的设备
                setTimeout(() => trySelectSavedMicrophone(), 1000);
            });
            
            // 获取设备列表
            await getMicrophoneDevices();
            
            // 自动请求麦克风权限
            await requestMicrophonePermission();
            
            // 初始化模式显示
            if (currentMode === 'direct') {
                currentModeElement.textContent = '直接模式';
                latencyEstimateElement.textContent = '10-30ms';
            } else {
                currentModeElement.textContent = '标准模式';
                latencyEstimateElement.textContent = '40-80ms';
            }
        });
        
        // 页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (isRecording) {
                // 停止前保存设置
                saveSettings();
                cleanupAudio();
            }
        });
        
        // 处理页面可见性变化
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isRecording) {
                updateStatus('页面被隐藏，音频可能会被暂停', 'warning');
            }
        });
    </script>
</body>
