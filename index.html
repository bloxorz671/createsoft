  <script>
    (function() {
      "use strict";

      // ===== 检测非主流设备（非Windows/Linux电脑）=====
      function checkUnsupportedDevice() {
        // 获取用户代理字符串
        const ua = navigator.userAgent.toLowerCase();
        
        // 定义支持的设备类型
        const isWindows = /windows|win32|win64|wow32|wow64/.test(ua);
        const isLinux = /linux|ubuntu|debian|centos|redhat|fedora/.test(ua);
        const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/.test(ua);
        
        // 如果既不是Windows也不是Linux，且不是手机（手机已经处理），则显示不支持弹窗
        if (!isWindows && !isLinux && !isMobile) {
          setTimeout(() => {
            document.getElementById('unsupportedModal').classList.add('active');
          }, 100);
        }
      }

      // ===== 帮助弹窗 =====
      window.openModal = function() {
        document.getElementById('helpModal').classList.add('active');
      };
      window.closeModal = function() {
        document.getElementById('helpModal').classList.remove('active');
      };
      
      window.closeUnsupportedModal = function() {
        document.getElementById('unsupportedModal').classList.remove('active');
      };

      window.onclick = function(e) {
        const helpModal = document.getElementById('helpModal');
        if (e.target === helpModal) window.closeModal();
        
        const unsupportedModal = document.getElementById('unsupportedModal');
        if (e.target === unsupportedModal) window.closeUnsupportedModal();
      };
      
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          window.closeModal();
          window.closeUnsupportedModal();
        }
      });

      // ===== 信创版下拉框 =====
      window.toggleDropdown = function() {
        const dd = document.getElementById('linuxDropdown');
        if (dd) dd.classList.toggle('show');
      };

      // 点击外部关闭下拉框
      document.addEventListener('click', function(e) {
        const card = document.getElementById('linuxCard');
        const dd = document.getElementById('linuxDropdown');
        if (card && dd && !card.contains(e.target) && dd.classList.contains('show')) {
          dd.classList.remove('show');
        }
      });

      // 阻止下拉框内部点击冒泡
      const dropdown = document.getElementById('linuxDropdown');
      if (dropdown) {
        dropdown.addEventListener('click', function(e) {
          e.stopPropagation();
        });
      }

      // 执行设备检测
      checkUnsupportedDevice();
    })();
  </script>
