<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人机验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #d8d8d8;        /* 浅灰色背景，与矩形内浅色稍有区分 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* 极简矩形框 — 黑色边框，内部保持浅色 (比外部更亮) */
        .captcha-rect {
            border: 2px solid #000000;
            background: #f8f8f8;          /* 框内亮浅灰，与外部浅灰形成柔和对比 */
            padding: 24px 42px 24px 38px;
            display: inline-block;
            box-shadow: none;
            border-radius: 0;
        }

        /* 验证行：复选框 + 文字 */
        .verify-row {
            display: flex;
            align-items: center;
            gap: 18px;
            user-select: none;
        }

        /* 复选框包装 — 用于定位和切换显示 */
        .checkbox-wrap {
            position: relative;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        /* 原生复选框（完全透明用于点击） */
        #verifyCheckbox {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            margin: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* 自定义视觉复选框 (默认可见) */
        .checkbox-custom {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f8f8;    /* 与矩形内背景一致 */
            border: 2px solid #000000;
            border-radius: 0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            transition: opacity 0.1s;
        }

        .checkbox-custom::after {
            content: "✓";
            opacity: 0;
            color: #ffffff;
            transform: scale(0.9);
            transition: opacity 0.1s;
        }

        /* 勾选状态：背景变黑，白色勾 */
        #verifyCheckbox:checked + .checkbox-custom {
            background-color: #000000;
        }

        #verifyCheckbox:checked + .checkbox-custom::after {
            opacity: 1;
        }

        /* 隐藏复选框（验证中时使用） */
        .checkbox-custom.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 旋转器 — 完全覆盖在复选框位置 */
        .spinner-mini {
            position: absolute;
            top: 0;
            left: 0;
            width: 28px;
            height: 28px;
            border: 3px solid #aaaaaa;
            border-top: 3px solid #000000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            z-index: 5;
            display: none;
        }

        .spinner-mini.show {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 右侧提示文字 */
        .label-text {
            font-size: 1.4rem;
            font-weight: 450;
            color: #000000;
            letter-spacing: 0.3px;
            cursor: default;
        }

        /* 失败提示 (黑色边框) */
        .fail-toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
            white-space: nowrap;
            border-radius: 0;
        }

        .fail-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* 没有任何多余装饰 */
    </style>
</head>
<body>
    <!-- 黑色矩形框，内部亮浅色，外部稍暗浅灰 -->
    <div class="captcha-rect">
        <div class="verify-row">
            <div class="checkbox-wrap">
                <input type="checkbox" id="verifyCheckbox">
                <span class="checkbox-custom" id="checkboxVisual"></span>
                <!-- 迷你旋转器 (验证中显示) -->
                <div class="spinner-mini" id="miniSpinner"></div>
            </div>
            <span class="label-text">请证明你是人类</span>
        </div>
    </div>

    <!-- 失败提示框 -->
    <div id="failToast" class="fail-toast">验证失败，请重试</div>

    <script>
        (function() {
            const checkbox = document.getElementById('verifyCheckbox');
            const checkboxVisual = document.getElementById('checkboxVisual');
            const miniSpinner = document.getElementById('miniSpinner');
            const failToast = document.getElementById('failToast');

            // 页面打开时间戳
            const pageOpenTime = Date.now();

            // 标记是否正在验证中
            let isVerifying = false;
            // 标记验证结果 (用于3秒后处理)
            let verificationResult = false;

            // 初始状态：复选框未勾选，视觉正常
            checkbox.checked = false;
            checkboxVisual.classList.remove('hidden');
            miniSpinner.classList.remove('show');

            // 点击验证
            checkbox.addEventListener('click', function(e) {
                e.preventDefault();     // 阻止原生勾选

                // 如果已经在验证中，忽略
                if (isVerifying) return;

                // 获取点击坐标用于中心判定
                const rect = checkbox.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;

                // 中心点 (14,14)
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const deltaX = Math.abs(clickX - centerX);
                const deltaY = Math.abs(clickY - centerY);
                const distanceToCenter = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                // 中心判定范围 (4.5px)
                const CENTER_THRESHOLD = 4.5;
                const elapsedTime = Date.now() - pageOpenTime;
                const tooFast = elapsedTime < 1000;
                const tooCentered = distanceToCenter <= CENTER_THRESHOLD;

                // 验证结果
                const isHuman = !(tooFast || tooCentered);
                verificationResult = isHuman;

                // 开始验证流程
                isVerifying = true;

                // 1. 隐藏复选框勾选框
                checkboxVisual.classList.add('hidden');
                // 2. 显示迷你旋转器
                miniSpinner.classList.add('show');
                // 确保复选框未勾选
                checkbox.checked = false;

                // 3. 等待3秒
                setTimeout(() => {
                    // 隐藏旋转器
                    miniSpinner.classList.remove('show');

                    if (verificationResult) {
                        // 验证成功：显示打勾的复选框
                        checkboxVisual.classList.remove('hidden');
                        checkbox.checked = true;    // 打勾状态

                        // 0.5秒后跳转
                        setTimeout(() => {
                            window.location.href = 'https://brilliant-unicorn-633b63.netlify.app/';
                        }, 500);
                    } else {
                        // 验证失败：恢复复选框显示（未勾状态），并显示失败提示
                        checkboxVisual.classList.remove('hidden');
                        checkbox.checked = false;    // 确保未勾

                        // 显示失败toast
                        failToast.classList.add('show');
                        setTimeout(() => {
                            failToast.classList.remove('show');
                        }, 1500);

                        // 重置验证状态，允许再次尝试
                        isVerifying = false;
                    }
                }, 3000); // 固定3秒验证过程
            });

            // 阻止键盘操作
            checkbox.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Spacebar' || e.key === 'Space') {
                    e.preventDefault();
                    if (!isVerifying) {
                        // 键盘触发直接当作机器处理（无坐标，视为正中）
                        isVerifying = true;
                        verificationResult = false;

                        checkboxVisual.classList.add('hidden');
                        miniSpinner.classList.add('show');
                        checkbox.checked = false;

                        setTimeout(() => {
                            miniSpinner.classList.remove('show');
                            checkboxVisual.classList.remove('hidden');
                            checkbox.checked = false;

                            failToast.classList.add('show');
                            setTimeout(() => {
                                failToast.classList.remove('show');
                                isVerifying = false;
                            }, 1500);
                        }, 3000);
                    }
                }
            });

            // 设置标题
            document.title = '人机验证';
        })();
    </script>
</body>
</html>
