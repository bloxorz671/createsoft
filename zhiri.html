 <!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>页面跳转中...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 24px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0066cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            font-size: 16px;
            color: #666;
            margin: 20px 0;
        }
        
        .error-message {
            background: #fff5f5;
            border: 1px solid #f5c6c6;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .error-message h2 {
            font-size: 20px;
            color: #c62828;
            margin-bottom: 12px;
        }
        
        .error-message p {
            font-size: 16px;
            color: #666;
            margin-bottom: 16px;
        }
        
        .back-link {
            margin-top: 20px;
        }
        
        .back-link a {
            display: inline-block;
            padding: 12px 24px;
            background-color: #f1f3f5;
            color: #495057;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        
        .back-link a:hover {
            background-color: #e9ecef;
        }
        
        .redirect-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2b4c8a;
            color: white;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            margin-top: 16px;
            cursor: pointer;
            border: none;
        }
        
        .redirect-btn:hover {
            background-color: #1e3a6b;
        }
        
        .student-param {
            font-weight: 600;
            color: #0066cc;
            background-color: #e6f0ff;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
            font-size: 18px;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <div class="loading-spinner"></div>
        <div class="message">正在登录...</div>
    </div>

    <script>
        // ========== 获取URL参数 ==========
        function getStudentId() {
            const urlParams = new URLSearchParams(window.location.search);
            
            for (let [key, value] of urlParams.entries()) {
                if (key.match(/^\d+$/)) {
                    return key;
                }
            }
            if (urlParams.get('p')) return urlParams.get('p');
            if (urlParams.get('id')) return urlParams.get('id');
            return null;
        }
        
        // ========== 从路径获取参数（如） ==========
        function getPathParam() {
            const path = window.location.pathname;
            const match = path.match(/\/(\d+)$/);
            if (match) return match[1];
            return null;
        }
        
        // ========== 从 5name.txt 加载姓名映射 ==========
        async function loadNameMapping() {
            try {
                const response = await fetch('https://luckynum.top/5name.txt');
                if (response.ok) {
                    const text = await response.text();
                    const lines = text.split(/\r?\n/);
                    const mapping = {};
                    for (let line of lines) {
                        line = line.trim();
                        if (line === '') continue;
                        const firstSpace = line.indexOf(' ');
                        if (firstSpace !== -1) {
                            const id = line.substring(0, firstSpace).trim();
                            const name = line.substring(firstSpace + 1).trim();
                            if (id && name) {
                                mapping[id] = name;
                            }
                        }
                    }
                    return mapping;
                }
                return {};
            } catch (e) {
                console.log('无法加载5name.txt:', e.message);
                return {};
            }
        }
        
        // ========== 跳转到值日码页面（ezr） ==========
        function redirectToEzr(studentId) {
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="error-message">
                    <h2>⚠️ 学号未注册</h2>
                    <p>学号 <span class="student-param">${escapeHtml(studentId)}</span> 不在本班名单中</p>
                    <p>请确认学号是否正确，或联系老师添加</p>
                </div>
                <button class="redirect-btn" id="goToEzrBtn">前往值日码页面</button>
                <div class="back-link">
                    <a href="/">返回首页</a>
                </div>
            `;
            document.getElementById('goToEzrBtn').onclick = function() {
                window.location.href = 'https://luckynum.top/ezr';
            };
        }
        
        // ========== 跳转到主页面 ==========
        function redirectToMain(studentId, studentName) {
            // 存储姓名到 localStorage
            var data = {
                value: studentName,
                timestamp: Date.now()
            };
            localStorage.setItem('zhiriData', JSON.stringify(data));
            
            // 显示加载动画
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="loading-spinner"></div>
                <div class="message">登录成功</div>
            `;
            
            // 延迟后跳转到主页面
            setTimeout(function() {
                window.location.replace('/1205?p=' + encodeURIComponent(studentId));
            }, 100);
        }
        
        // ========== 无参数时直接跳转 ==========
        function redirectToMainWithoutParam() {
            window.location.replace('/1205');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // ========== 主逻辑 ==========
        async function main() {
            // 提取参数（优先级：URL参数 > 路径参数）
            let studentId = getStudentId();
            if (!studentId) {
                studentId = getPathParam();
            }
            
            // 情况1：没有参数，直接跳转到主页面
            if (!studentId) {
                redirectToMainWithoutParam();
                return;
            }
            
            // 情况2：有参数，需要验证学号
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = `
                <div class="loading-spinner"></div>
                <div class="message">正在登录 ${escapeHtml(studentId)}...</div>
            `;
            
            // 加载姓名映射
            const nameMapping = await loadNameMapping();
            
            // 检查学号是否存在
            if (nameMapping[studentId]) {
                // 学号存在，跳转到主页面
                redirectToMain(studentId, nameMapping[studentId]);
            } else {
                // 学号不存在，跳转到值日码页面
                redirectToEzr(studentId);
            }
        }
        
        main();
    </script>
</body>
</html>
