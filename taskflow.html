<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <title>TaskFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f7fa; min-height: 100vh; display: flex;
      justify-content: center; align-items: center; padding: 1rem;
      touch-action: manipulation;
    }
    .app-container {
      width: 100%; max-width: 1400px; height: 95vh; background: white;
      border-radius: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
      display: flex; flex-direction: column; overflow: hidden;
    }
    @media (max-width: 850px) or (orientation: portrait) {
      .app-container { height: 98vh; }
      .main-layout { flex-direction: column !important; }
      .timeline-panel { width: 100% !important; flex: 1 !important; border-right: none !important; border-bottom: 1px solid #eef2f6; }
      .cards-panel { max-height: 200px; }
      .cards-panel.hidden { max-height: 0; padding: 0; }
      .header-actions { gap: 0.3rem; }
      .header-actions button { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    }
    .app-header {
      padding: 1rem 1.8rem; border-bottom: 1px solid #edf2f7;
      display: flex; align-items: center; justify-content: space-between;
      background: white; flex-wrap: wrap; gap: 0.5rem;
    }
    .app-title { font-weight: 600; font-size: 1.8rem; color: #0f172a; }
    button {
      background: white; border: 1px solid #e2e8f0; padding: 0.5rem 1.2rem;
      border-radius: 2.5rem; font-size: 0.9rem; font-weight: 500; color: #334155;
      cursor: pointer; background: #f8fafc; white-space: nowrap;
      touch-action: manipulation;
    }
    button:hover { background: #f1f5f9; }
    button.primary { background: #0f172a; border-color: #0f172a; color: white; }
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    .timeline-panel {
      flex: 1; background: #f9fafb; display: flex; flex-direction: column;
      padding: 1.2rem; gap: 0.8rem; overflow-y: auto; border-right: 1px solid #eef2f6;
    }
    .cards-panel {
      width: 280px; padding: 1.2rem; background: white; overflow-y: auto;
      transition: all 0.3s; border-left: 1px solid #eef2f6;
    }
    .cards-panel.hidden { width: 0; padding: 0; overflow: hidden; border-left: none; }
    .section-title { font-weight: 600; font-size: 0.9rem; color: #64748b; margin-bottom: 0.5rem; }
    .time-slot-list { display: flex; flex-direction: column; gap: 0.8rem; }
    .time-slot-item {
      background: white; border-radius: 1rem; padding: 0.8rem;
      border: 1px solid #e9eef2; min-height: 70px; transition: all 0.2s;
    }
    .time-slot-item.drag-over { background: #eef2ff; border: 2px dashed #6366f1; }
    .time-slot-item.locked { border-left: 4px solid #f59e0b; background: #fffbeb; }
    .time-slot-item.completed { background: #f1f5f9; opacity: 0.7; border-left: 4px solid #94a3b8; }
    .slot-task-card {
      background: #f1f5f9; border-radius: 0.7rem; padding: 0.4rem 0.7rem;
      margin-top: 0.4rem; display: flex; justify-content: space-between;
      align-items: center; font-weight: 500;
    }
    .slot-task-card.locked-card { background: #fef3c7; }
    .cards-grid { display: flex; flex-wrap: wrap; gap: 0.8rem; }
    .task-card {
      width: 120px; padding: 0.7rem; border-radius: 1rem; background: #f1f5f9;
      border: 1px solid #e2e8f0; cursor: grab; font-weight: 500; font-size: 0.9rem;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .task-card:active { cursor: grabbing; }
    .task-card.locked-card { background: #fef3c7; border-color: #f59e0b; }
    .task-card.dragging { opacity: 0.5; transform: scale(0.95); }
    .custom-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #ef4444; color: white; padding: 1rem 2rem; border-radius: 2rem;
      z-index: 10002; display: none; font-weight: 500;
    }
    .custom-toast.active { display: block; }
    .custom-toast.success { background: #22c55e; }

    /* 滚动数字选择器 */
    .time-scroll { display: flex; gap: 0.5rem; align-items: center; justify-content: center; }
    .scroll-col {
      display: flex; flex-direction: column; align-items: center;
      position: relative; height: 120px; overflow: hidden;
      width: 50px; border-radius: 0.8rem; background: #f8fafc;
    }
    .scroll-btn {
      background: none; border: none; font-size: 1.2rem; cursor: pointer;
      color: #64748b; padding: 0.2rem; z-index: 2; line-height: 1;
    }
    .scroll-btn:hover { color: #0f172a; }
    .scroll-numbers {
      flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch; width: 100%;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .scroll-numbers::-webkit-scrollbar { display: none; }
    .scroll-number {
      height: 36px; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 600; color: #94a3b8; scroll-snap-align: center;
      cursor: pointer; user-select: none; -webkit-user-select: none;
    }
    .scroll-number.active {
      color: #0f172a; font-size: 1.5rem; font-weight: 700;
    }

    .flash-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      z-index: 9999; pointer-events: none; opacity: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: bold; text-align: center;
    }
    .flash-overlay.active { animation: flashBlackWhite 0.5s infinite alternate; }
    @keyframes flashBlackWhite {
      0% { background: black; color: white; opacity: 1; }
      100% { background: white; color: black; opacity: 1; }
    }
    .green-fullscreen {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: #22c55e; z-index: 10000; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      color: white; font-size: 1.5rem; text-align: center; gap: 1.5rem;
    }
    .green-fullscreen.active { display: flex; }
    .green-fullscreen button {
      background: white; color: #22c55e; border: none; padding: 1rem 2.5rem;
      border-radius: 3rem; font-size: 1.2rem; font-weight: 600; cursor: pointer;
    }
    .green-buttons { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
    .pause-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: black; z-index: 10001; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      color: white; font-size: 2rem; gap: 1rem;
    }
    .pause-overlay.active { display: flex; }
    .custom-modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .custom-modal.active { display: flex; }
    .modal-content {
      background: white; padding: 2rem; border-radius: 2rem;
      min-width: 350px; box-shadow: 0 30px 50px rgba(0,0,0,0.3);
    }
    .confirm-dialog {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 10003;
    }
    .confirm-dialog.active { display: flex; }
    .confirm-content {
      background: white; padding: 2rem; border-radius: 2rem;
      text-align: center; min-width: 300px; box-shadow: 0 30px 50px rgba(0,0,0,0.3);
    }
    .drag-ghost {
      position: fixed; pointer-events: none; z-index: 9998;
      opacity: 0.8; transform: translate(-50%, -50%);
      background: #6366f1; color: white; padding: 0.5rem 1rem;
      border-radius: 1rem; font-weight: 600; font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .file-menu { position: relative; display: inline-block; }
    .file-dropdown {
      display: none; position: fixed;
      background: white; border-radius: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 200; min-width: 180px; padding: 0.5rem; border: 1px solid #e2e8f0;
    }
    .file-dropdown.active { display: block; }
    .file-dropdown button {
      display: block; width: 100%; text-align: left; border: none;
      padding: 0.7rem 1rem; border-radius: 0.7rem; margin: 0.2rem 0;
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="app-header">
    <div class="app-title">taskflow</div>
    <div class="header-actions">
      <div class="file-menu">
        <button id="fileBtn">文件</button>
        <div class="file-dropdown" id="fileDropdown">
          <button id="saveFileBtn">保存设定</button>
          <button id="loadFileBtn">加载设定</button>
        </div>
      </div>
      <button id="addTaskBtn">添加任务</button>
      <button id="pauseBtn">上厕所</button>
      <button id="resetBtn">重置</button>
    </div>
  </div>
  <div class="main-layout">
    <div class="timeline-panel" id="timelinePanel">
      <div style="display:flex; justify-content: space-between;">
        <span class="section-title">时间段</span>
        <button id="addSlotBtn">+ 添加</button>
      </div>
      <div id="slotContainer" class="time-slot-list"></div>
    </div>
    <div class="cards-panel" id="cardsPanel">
      <div class="section-title">任务卡片库</div>
      <div id="cardsContainer" class="cards-grid"></div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".tfd" style="display:none;">

<div id="customToast" class="custom-toast"></div>
<div id="flashOverlay" class="flash-overlay"></div>

<div id="greenComplete" class="green-fullscreen">
  <div id="greenMessage" style="white-space: pre-line; line-height: 1.8;"></div>
  <div class="green-buttons" id="greenButtons"></div>
</div>

<div id="pauseOverlay" class="pause-overlay">
  <div>暂停中</div>
  <div id="pauseTimer">00:00</div>
  <button id="resumeBtn" style="background:white; color:black; padding:1rem 2rem; border-radius:2rem;">继续</button>
</div>

<div id="confirmDialog" class="confirm-dialog">
  <div class="confirm-content">
    <p id="confirmMsg"></p>
    <div style="display:flex; gap:1rem; justify-content:center; margin-top:1.5rem;">
      <button id="confirmYesBtn" class="primary">确认</button>
      <button id="confirmNoBtn">取消</button>
    </div>
  </div>
</div>

<div id="taskModal" class="custom-modal">
  <div class="modal-content">
    <h3>新建任务</h3>
    <input type="text" id="taskNameInput" placeholder="任务名称" style="width:100%; padding:0.8rem; border-radius:1rem; border:1px solid #ddd; margin:1rem 0;">
    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem;">
      <input type="checkbox" id="taskLocked"> 锁定时间段（不受推迟影响）
    </label>
    <button id="confirmTaskBtn" class="primary">确认</button>
    <button id="cancelTaskBtn">取消</button>
  </div>
</div>

<div id="slotModal" class="custom-modal">
  <div class="modal-content">
    <h3>编辑时间段</h3>
    <div class="time-scroll">
      <!-- 开始小时 -->
      <div class="scroll-col">
        <button class="scroll-btn" data-target="startHour" data-delta="-1">▲</button>
        <div class="scroll-numbers" id="startHourScroll"></div>
        <button class="scroll-btn" data-target="startHour" data-delta="1">▼</button>
      </div>
      <span>:</span>
      <!-- 开始分钟 -->
      <div class="scroll-col">
        <button class="scroll-btn" data-target="startMin" data-delta="-1">▲</button>
        <div class="scroll-numbers" id="startMinScroll"></div>
        <button class="scroll-btn" data-target="startMin" data-delta="1">▼</button>
      </div>
      <span>-</span>
      <!-- 结束小时 -->
      <div class="scroll-col">
        <button class="scroll-btn" data-target="endHour" data-delta="-1">▲</button>
        <div class="scroll-numbers" id="endHourScroll"></div>
        <button class="scroll-btn" data-target="endHour" data-delta="1">▼</button>
      </div>
      <span>:</span>
      <!-- 结束分钟 -->
      <div class="scroll-col">
        <button class="scroll-btn" data-target="endMin" data-delta="-1">▲</button>
        <div class="scroll-numbers" id="endMinScroll"></div>
        <button class="scroll-btn" data-target="endMin" data-delta="1">▼</button>
      </div>
    </div>
    <button id="saveSlotBtn" class="primary" style="margin-top:1rem;">保存</button>
    <button id="cancelSlotBtn">取消</button>
  </div>
</div>

<script>
  (() => {
    const STORAGE = 'taskflow_v13';
    let tasks = [];
    let timeSlots = [];
    let nextId = 1;
    let timers = [];
    let flashTimer = null;
    let currentCompleteTaskId = null;
    let currentCompleteIsManual = false;
    let editingSlotId = null;
    let flashedSet = new Set();
    let paused = false;
    let pauseStart = null;
    let pauseInterval = null;
    let confirmCallback = null;

    let touchDragData = null;
    let touchGhost = null;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchDragging = false;

    const toMins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
    const toTime = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

    function showToast(msg, isSuccess=false) {
      const t = document.getElementById('customToast');
      t.textContent = msg;
      t.className = 'custom-toast' + (isSuccess ? ' success' : '');
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 2000);
    }

    function showConfirm(msg, cb) {
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmDialog').classList.add('active');
      confirmCallback = cb;
    }

    function save() { localStorage.setItem(STORAGE, JSON.stringify({tasks, timeSlots, nextId})); }
    function load() {
      const d = localStorage.getItem(STORAGE);
      if(d) { try { const p = JSON.parse(d); tasks = p.tasks; timeSlots = p.timeSlots; nextId = p.nextId; } catch(e) { reset(); } }
      else reset();
    }
    function reset() { tasks=[]; timeSlots=[]; nextId=1; flashedSet.clear(); save(); renderAll(); }

    function getNow() { const n=new Date(); return n.getHours()*60+n.getMinutes(); }

    function updateCardsPanelVisibility() {
      const panel = document.getElementById('cardsPanel');
      const hasCards = tasks.some(t => !t.completed && !timeSlots.some(s => s.taskId === t.id));
      panel.classList.toggle('hidden', !hasCards);
    }

    function returnTaskToWarehouse(taskId) {
      timeSlots.forEach(s => { if(s.taskId === taskId) s.taskId = null; });
      flashedSet.delete(taskId);
      save(); renderAll();
    }

    function renderAll() { renderSlots(); renderCards(); updateCardsPanelVisibility(); scheduleReminders(); }

    function createTouchGhost(text) {
      if(touchGhost) touchGhost.remove();
      touchGhost = document.createElement('div');
      touchGhost.className = 'drag-ghost';
      touchGhost.textContent = text;
      document.body.appendChild(touchGhost);
    }
    function removeTouchGhost() { if(touchGhost) { touchGhost.remove(); touchGhost = null; } }
    function moveTouchGhost(x, y) { if(touchGhost) { touchGhost.style.left = x+'px'; touchGhost.style.top = y+'px'; } }

    function getDropTarget(x, y) {
      const el = document.elementFromPoint(x, y);
      if(!el) return null;
      const slotItem = el.closest('.time-slot-item');
      if(slotItem && !slotItem.classList.contains('completed')) return slotItem;
      return null;
    }

    function setupTouchDrag(element, taskId, taskName) {
      element.addEventListener('touchstart', function(e) {
        if(e.target.closest('button')) return;
        if(e.touches.length !== 1) return;
        touchDragData = taskId;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchDragging = false;
      }, {passive: false});

      element.addEventListener('touchmove', function(e) {
        if(!touchDragData) return;
        e.preventDefault();
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        if(!touchDragging && Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if(!touchDragging) {
          touchDragging = true;
          createTouchGhost(taskName);
          element.classList.add('dragging');
        }
        moveTouchGhost(e.touches[0].clientX, e.touches[0].clientY);
        const target = getDropTarget(e.touches[0].clientX, e.touches[0].clientY);
        document.querySelectorAll('.time-slot-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
        if(target && target.classList.contains('time-slot-item')) {
          target.classList.add('drag-over');
        }
      }, {passive: false});

      element.addEventListener('touchend', function(e) {
        if(!touchDragData) return;
        document.querySelectorAll('.time-slot-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
        if(touchDragging) {
          const target = getDropTarget(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
          if(target && target.classList.contains('time-slot-item')) {
            const task = tasks.find(t=>t.id===touchDragData);
            if(task && !task.completed && !timeSlots.some(s=>s.taskId===touchDragData)) {
              timeSlots.forEach(s=>{ if(s.taskId===touchDragData) s.taskId=null; });
              const slotId = target.dataset.slotId;
              const slot = timeSlots.find(s=>s.id==slotId || s.id===Number(slotId));
              if(slot) { slot.taskId = touchDragData; slot.locked = task.locked || false; }
              flashedSet.delete(touchDragData);
              save(); renderAll();
            }
          }
          element.classList.remove('dragging');
        }
        removeTouchGhost();
        touchDragData = null;
        touchDragging = false;
      });
    }

    function renderCards() {
      const c = document.getElementById('cardsContainer');
      c.innerHTML = '';
      tasks.filter(t=>!t.completed && !timeSlots.some(s=>s.taskId===t.id)).forEach(t=>{
        const card = document.createElement('div');
        card.className = `task-card${t.locked ? ' locked-card' : ''}`;
        card.draggable = true;
        card.dataset.id = t.id;
        card.innerHTML = `<strong>${t.name}</strong>${t.locked ? ' 🔒' : ''}`;
        card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', t.id); });
        setupTouchDrag(card, t.id, t.name);
        c.appendChild(card);
      });
    }

    function renderSlots() {
      const container = document.getElementById('slotContainer');
      container.innerHTML = '';
      const activeSlots = timeSlots.filter(s => !tasks.find(t => t.id === s.taskId)?.completed);
      const completedSlots = timeSlots.filter(s => tasks.find(t => t.id === s.taskId)?.completed);
      const allSlots = [...activeSlots.sort((a,b)=>toMins(a.start)-toMins(b.start)), ...completedSlots];
      
      allSlots.forEach(s=>{
        const div = document.createElement('div');
        const task = tasks.find(t=>t.id===s.taskId);
        const isCompleted = task?.completed;
        div.className = `time-slot-item${s.locked && !isCompleted ? ' locked' : ''}${isCompleted ? ' completed' : ''}`;
        div.dataset.slotId = s.id;
        
        if(isCompleted && task) {
          div.innerHTML = `<div style="display:flex; justify-content:space-between;"><span style="color:#94a3b8;">${task.name} (已完成) ${s.start} - ${s.end}</span><button class="delete-completed-btn">删除</button></div>`;
          div.querySelector('.delete-completed-btn').addEventListener('click', (e)=>{
            e.stopPropagation();
            tasks = tasks.filter(t => t.id !== task.id);
            timeSlots = timeSlots.filter(sl => sl.taskId !== task.id);
            save(); renderAll();
          });
        } else {
          div.innerHTML = `<div style="display:flex; justify-content:space-between;"><span><strong>${s.start} - ${s.end}</strong>${s.locked?' 🔒':''}</span><div><button class="edit-slot-btn">编辑</button><button class="delete-slot-btn">删除</button></div></div>`;
          if(s.taskId && task && !task.completed) {
            const tdiv = document.createElement('div');
            tdiv.className = `slot-task-card${task.locked ? ' locked-card' : ''}`;
            tdiv.innerHTML = `<span>${task.name}${task.locked?' 🔒':''}</span><div><button class="return-to-warehouse-btn">放回</button><button class="complete-in-slot">完成</button></div>`;
            tdiv.querySelector('.return-to-warehouse-btn').addEventListener('click', e=>{
              e.stopPropagation();
              returnTaskToWarehouse(task.id);
            });
            tdiv.querySelector('.complete-in-slot').addEventListener('click', e=>{
              e.stopPropagation();
              showConfirm(`确认完成"${task.name}"吗？`, () => handleManualComplete(task.id));
            });
            div.appendChild(tdiv);
          }
          div.addEventListener('dragover', e=>e.preventDefault());
          div.addEventListener('drop', e=>{
            e.preventDefault();
            const tid = Number(e.dataTransfer.getData('text/plain'));
            if(!tid) return;
            const draggedTask = tasks.find(t=>t.id===tid);
            if(draggedTask?.completed) return;
            if(timeSlots.some(sl=>sl.taskId===tid)) return;
            timeSlots.forEach(sl=>{ if(sl.taskId===tid) sl.taskId=null; });
            s.taskId = tid;
            s.locked = draggedTask?.locked || false;
            flashedSet.delete(tid);
            save(); renderAll();
          });
          div.querySelector('.edit-slot-btn')?.addEventListener('click', ()=>openSlotEditor(s.id));
          div.querySelector('.delete-slot-btn')?.addEventListener('click', ()=>deleteSlot(s.id));
        }
        container.appendChild(div);
      });
      
      const cardsPanel = document.getElementById('cardsContainer');
      cardsPanel.addEventListener('dragover', e=>e.preventDefault());
      cardsPanel.addEventListener('drop', e=>{
        e.preventDefault();
        const tid = Number(e.dataTransfer.getData('text/plain'));
        if(!tid) return;
        const draggedTask = tasks.find(t=>t.id===tid);
        if(draggedTask?.completed) return;
        timeSlots.forEach(s=>{ if(s.taskId===tid) s.taskId=null; });
        flashedSet.delete(tid);
        save(); renderAll();
      });
    }

    function deleteSlot(id) { timeSlots = timeSlots.filter(s=>s.id!==id); save(); renderAll(); }

    // 滚动选择器相关
    function buildScrollNumbers(containerId, max, currentVal) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      for(let i = 0; i <= max; i++) {
        const div = document.createElement('div');
        div.className = 'scroll-number';
        div.textContent = String(i).padStart(2,'0');
        div.dataset.value = i;
        div.addEventListener('click', () => {
          scrollToValue(container, i);
        });
        container.appendChild(div);
      }
      scrollToValue(container, currentVal, false);
    }

    function scrollToValue(container, value, animate = true) {
      const items = container.querySelectorAll('.scroll-number');
      items.forEach(item => {
        item.classList.toggle('active', parseInt(item.dataset.value) === value);
      });
      const target = container.querySelector(`[data-value="${value}"]`);
      if(target) {
        container.scrollTo({
          top: target.offsetTop - container.offsetHeight/2 + target.offsetHeight/2,
          behavior: animate ? 'smooth' : 'auto'
        });
      }
    }

    function getScrollValue(containerId) {
      const container = document.getElementById(containerId);
      const active = container.querySelector('.scroll-number.active');
      return active ? parseInt(active.dataset.value) : 0;
    }

    function setupScrollSnap(containerId) {
      const container = document.getElementById(containerId);
      let scrollTimeout;
      container.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          const items = container.querySelectorAll('.scroll-number');
          const containerCenter = container.scrollTop + container.offsetHeight/2;
          let closest = items[0];
          let minDist = Infinity;
          items.forEach(item => {
            const itemCenter = item.offsetTop + item.offsetHeight/2;
            const dist = Math.abs(containerCenter - itemCenter);
            if(dist < minDist) { minDist = dist; closest = item; }
          });
          if(closest) {
            items.forEach(i => i.classList.remove('active'));
            closest.classList.add('active');
          }
        }, 80);
      });
    }

    function openSlotEditor(slotId=null) {
      editingSlotId = slotId;
      const now = new Date();
      let startH = now.getHours(), startM = now.getMinutes();
      let endDate = new Date(now.getTime()+30*60000);
      let endH = endDate.getHours(), endM = endDate.getMinutes();
      
      if(slotId) {
        const s = timeSlots.find(s=>s.id===slotId);
        [startH, startM] = s.start.split(':').map(Number);
        [endH, endM] = s.end.split(':').map(Number);
      }
      
      buildScrollNumbers('startHourScroll', 23, startH);
      buildScrollNumbers('startMinScroll', 59, startM);
      buildScrollNumbers('endHourScroll', 23, endH);
      buildScrollNumbers('endMinScroll', 59, endM);
      
      document.getElementById('slotModal').classList.add('active');
    }

    function changeScrollValue(target, delta) {
      const containerId = target + 'Scroll';
      let current = getScrollValue(containerId);
      let max = target.includes('Hour') ? 23 : 59;
      let newVal = (current + delta + max + 1) % (max + 1);
      scrollToValue(document.getElementById(containerId), newVal);
    }

    function saveSlotFromEditor() {
      const sh = getScrollValue('startHourScroll'), sm = getScrollValue('startMinScroll');
      const eh = getScrollValue('endHourScroll'), em = getScrollValue('endMinScroll');
      const start = `${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}`;
      const end = `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
      if(toMins(start)>=toMins(end)) { showToast('结束时间必须晚于开始'); return; }
      if(timeSlots.some(s=>s.id!==editingSlotId && toMins(s.start)<toMins(end) && toMins(s.end)>toMins(start))) { showToast('时间段冲突'); return; }
      if(editingSlotId) { const s=timeSlots.find(s=>s.id===editingSlotId); if(s){s.start=start; s.end=end;} }
      else timeSlots.push({id:nextId++, start, end, taskId:null, locked:false});
      document.getElementById('slotModal').classList.remove('active');
      save(); renderAll();
    }

    function handleManualComplete(taskId) {
      stopFlash();
      currentCompleteTaskId = taskId;
      currentCompleteIsManual = true;
      showGreenComplete(taskId);
    }

    function completeTask(taskId) {
      const task = tasks.find(t=>t.id===taskId);
      if(!task) return;
      const slot = timeSlots.find(s=>s.taskId===taskId);
      const now = getNow();
      const actualEnd = now;
      const earlyMins = slot ? toMins(slot.end) - actualEnd : 0;
      
      task.completed = true;
      task.completedTime = toTime(actualEnd);
      
      if(slot) { slot.end = toTime(actualEnd); }
      
      flashedSet.delete(taskId);
      compactAfterComplete(taskId, earlyMins);
      document.getElementById('greenComplete').classList.remove('active');
      currentCompleteIsManual = false;
      save(); renderAll();
    }

    function compactAfterComplete(completedTaskId, earlyMins) {
      const now = getNow();
      const nextSlots = timeSlots
        .filter(s => s.taskId && s.taskId !== completedTaskId && !tasks.find(t => t.id === s.taskId)?.completed)
        .sort((a,b) => toMins(a.start) - toMins(b.start));
      
      if(nextSlots.length === 0) return;
      
      const firstNext = nextSlots[0];
      const gapToNext = toMins(firstNext.start) - now;
      
      let restMinutes = Math.min(earlyMins, 5);
      if(gapToNext < 5 && earlyMins > 0) {
        restMinutes = Math.min(earlyMins + gapToNext, 5);
      }
      
      const shiftAmount = earlyMins - restMinutes;
      
      if(shiftAmount > 0) {
        let lastEnd = now + restMinutes;
        nextSlots.forEach(s => {
          if(s.locked) return;
          const duration = toMins(s.end) - toMins(s.start);
          s.start = toTime(lastEnd);
          s.end = toTime(lastEnd + duration);
          lastEnd = toMins(s.end);
        });
      }
    }

    function shiftAfter(index, mins) {
      for(let i=index; i<timeSlots.length; i++) {
        let s = timeSlots[i];
        if(s.locked || tasks.find(t=>t.id===s.taskId)?.completed) continue;
        let gap = i>0 ? toMins(s.start) - toMins(timeSlots[i-1].end) : 0;
        if(gap >= mins) return;
        s.start = toTime(toMins(s.start)+mins);
        s.end = toTime(toMins(s.end)+mins);
      }
    }

    function delayFive() {
      if(!currentCompleteTaskId || currentCompleteIsManual) return;
      const slot = timeSlots.find(s=>s.taskId===currentCompleteTaskId);
      if(!slot) return;
      slot.end = toTime(toMins(slot.end)+5);
      flashedSet.delete(currentCompleteTaskId);
      document.getElementById('greenComplete').classList.remove('active');
      save(); renderAll();
    }

    function stopFlash() { const o=document.getElementById('flashOverlay'); o.classList.remove('active'); if(flashTimer){clearTimeout(flashTimer); flashTimer=null;} }
    function startFlash(msg) { stopFlash(); const o=document.getElementById('flashOverlay'); o.textContent=msg; o.classList.add('active'); flashTimer=setTimeout(stopFlash,5000); }

    function showGreenComplete(taskId) {
      const task = tasks.find(t=>t.id===taskId);
      if(!task) return;
      const slot = timeSlots.find(s=>s.taskId===taskId);
      const now = getNow();
      const early = slot ? toMins(slot.end) - now : 0;
      
      const nextSlot = timeSlots
        .filter(s => s.taskId && s.taskId !== taskId && !tasks.find(t => t.id === s.taskId)?.completed)
        .sort((a,b) => toMins(a.start) - toMins(b.start))
        .find(s => toMins(s.start) >= now);
      
      let msg = `"${task.name}" 已完成`;
      
      if(nextSlot) {
        const nt = tasks.find(t=>t.id===nextSlot.taskId);
        const gapToNext = toMins(nextSlot.start) - now;
        
        if(early > 0) {
          let restMinutes = Math.min(early, 5);
          if(gapToNext < 5 && early + gapToNext > 5) {
            restMinutes = 5;
          } else if(gapToNext < 5) {
            restMinutes = Math.min(early + gapToNext, 5);
          }
          
          msg = `你已超额完成"${task.name}"\n下一个任务："${nt?.name}" 开始时间 ${nextSlot.start}`;
          if(restMinutes > 0) msg += `\n你现在有${restMinutes}分钟休息时间`;
        } else {
          msg = `"${task.name}" 已完成\n下一个任务："${nt?.name}" 开始时间 ${nextSlot.start}`;
          if(gapToNext > 0 && gapToNext <= 10) msg += `\n你有${gapToNext}分钟休息时间`;
        }
      }
      
      document.getElementById('greenMessage').innerText = msg;
      
      const buttonsDiv = document.getElementById('greenButtons');
      buttonsDiv.innerHTML = '';
      const gotItBtn = document.createElement('button');
      gotItBtn.textContent = '我知道了';
      gotItBtn.addEventListener('click', ()=>{ completeTask(taskId); });
      buttonsDiv.appendChild(gotItBtn);
      
      if(!currentCompleteIsManual) {
        const completeBtn = document.createElement('button');
        completeBtn.textContent = '已完成';
        completeBtn.addEventListener('click', ()=>{ completeTask(taskId); });
        buttonsDiv.insertBefore(completeBtn, gotItBtn);
        
        const delayBtn = document.createElement('button');
        delayBtn.textContent = '推迟五分钟';
        delayBtn.addEventListener('click', delayFive);
        buttonsDiv.insertBefore(delayBtn, gotItBtn);
      }
      
      document.getElementById('greenComplete').classList.add('active');
    }

    function scheduleReminders() {
      timers.forEach(t=>clearTimeout(t)); timers=[];
      if(paused) return;
      const now = getNow();
      timeSlots.forEach(s=>{
        if(!s.taskId) return;
        const task = tasks.find(t=>t.id===s.taskId);
        if(!task || task.completed) return;
        const end = toMins(s.end), start = toMins(s.start);
        if(now >= end) { stopFlash(); currentCompleteIsManual = false; currentCompleteTaskId = s.taskId; showGreenComplete(s.taskId); return; }
        const fiveBeforeEnd = end-5;
        if(now >= fiveBeforeEnd && now < end && !flashedSet.has(s.taskId)) {
          startFlash(`"${task.name}" 即将结束`);
          flashedSet.add(s.taskId);
        } else if(fiveBeforeEnd > now && !flashedSet.has(s.taskId)) {
          timers.push(setTimeout(()=>{ startFlash(`"${task.name}" 即将结束`); flashedSet.add(s.taskId); }, (fiveBeforeEnd-now)*60000));
        }
        if(end > now) timers.push(setTimeout(()=>{ stopFlash(); currentCompleteIsManual = false; currentCompleteTaskId = s.taskId; showGreenComplete(s.taskId); }, (end-now)*60000));
        const fiveBeforeStart = start-5;
        if(now >= fiveBeforeStart && now < start && !flashedSet.has('start_'+s.taskId)) {
          startFlash(`"${task.name}" 还有5分钟开始`);
          flashedSet.add('start_'+s.taskId);
        } else if(fiveBeforeStart > now && !flashedSet.has('start_'+s.taskId)) {
          timers.push(setTimeout(()=>{ startFlash(`"${task.name}" 还有5分钟开始`); flashedSet.add('start_'+s.taskId); }, (fiveBeforeStart-now)*60000));
        }
      });
    }

    function togglePause() {
      if(!paused) {
        paused = true; pauseStart = Date.now();
        document.getElementById('pauseOverlay').classList.add('active');
        pauseInterval = setInterval(()=>{
          const sec = Math.floor((Date.now()-pauseStart)/1000);
          document.getElementById('pauseTimer').textContent = `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
        },1000);
        stopFlash();
      }
    }
    function resume() {
      if(!paused) return;
      const pausedMs = Date.now()-pauseStart;
      const pausedMins = Math.ceil(pausedMs/60000);
      paused = false; clearInterval(pauseInterval);
      document.getElementById('pauseOverlay').classList.remove('active');
      const now = getNow();
      for(let i=0; i<timeSlots.length; i++) {
        let s = timeSlots[i];
        if(!s.taskId || s.locked || tasks.find(t=>t.id===s.taskId)?.completed) continue;
        if(toMins(s.start) >= now) { shiftAfter(i, pausedMins); break; }
      }
      save(); renderAll();
    }

    function saveToFile() {
      const data = { tasks, timeSlots, nextId };
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'taskflow_config.tfd';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 100);
      showToast('设定已保存', true);
    }

    function loadFromFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if(data.tasks && data.timeSlots && data.nextId !== undefined) {
            tasks = data.tasks; timeSlots = data.timeSlots; nextId = data.nextId;
            flashedSet.clear(); save(); renderAll(); showToast('设定已加载', true);
          } else { showToast('文件格式无效'); }
        } catch(err) { showToast('文件解析失败'); }
      };
      reader.readAsText(file);
    }

    // 文件菜单
    document.getElementById('fileBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const dropdown = document.getElementById('fileDropdown');
      const btn = e.target;
      const rect = btn.getBoundingClientRect();
      dropdown.style.top = (rect.bottom + 5) + 'px';
      dropdown.style.left = (rect.left) + 'px';
      dropdown.classList.toggle('active');
    });
    document.addEventListener('click', (e) => {
      if(!e.target.closest('.file-menu')) document.getElementById('fileDropdown').classList.remove('active');
    });
    document.getElementById('saveFileBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('fileDropdown').classList.remove('active');
      saveToFile();
    });
    document.getElementById('loadFileBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('fileDropdown').classList.remove('active');
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', (e) => {
      if(e.target.files[0]) { loadFromFile(e.target.files[0]); e.target.value = ''; }
    });

    // 滚动选择器按钮事件
    document.querySelectorAll('.scroll-btn').forEach(b=>b.addEventListener('click', e=>{
      const target = e.target.dataset.target;
      const delta = parseInt(e.target.dataset.delta);
      changeScrollValue(target, delta);
    }));

    // 初始化滚动选择器的滚动捕捉
    ['startHourScroll','startMinScroll','endHourScroll','endMinScroll'].forEach(id => {
      setupScrollSnap(id);
    });

    document.getElementById('addTaskBtn').addEventListener('click', ()=>document.getElementById('taskModal').classList.add('active'));
    document.getElementById('cancelTaskBtn').addEventListener('click', ()=>document.getElementById('taskModal').classList.remove('active'));
    document.getElementById('confirmTaskBtn').addEventListener('click', ()=>{
      const name=document.getElementById('taskNameInput').value.trim();
      if(!name) return;
      const locked=document.getElementById('taskLocked').checked;
      tasks.push({id:nextId++, name, type:'task', completed:false, locked});
      document.getElementById('taskModal').classList.remove('active');
      document.getElementById('taskNameInput').value=''; document.getElementById('taskLocked').checked=false;
      save(); renderAll();
    });
    document.getElementById('addSlotBtn').addEventListener('click', ()=>openSlotEditor(null));
    document.getElementById('saveSlotBtn').addEventListener('click', saveSlotFromEditor);
    document.getElementById('cancelSlotBtn').addEventListener('click', ()=>document.getElementById('slotModal').classList.remove('active'));
    document.getElementById('pauseBtn').addEventListener('click', togglePause);
    document.getElementById('resumeBtn').addEventListener('click', resume);
    document.getElementById('confirmYesBtn').addEventListener('click', ()=>{
      document.getElementById('confirmDialog').classList.remove('active');
      if(confirmCallback) confirmCallback();
    });
    document.getElementById('confirmNoBtn').addEventListener('click', ()=>{
      document.getElementById('confirmDialog').classList.remove('active');
      confirmCallback = null;
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      showConfirm('确定要清除所有数据吗？', ()=>{ stopFlash(); reset(); });
    });

    document.addEventListener('touchmove', function(e) {
      if(touchDragging) e.preventDefault();
    }, {passive: false});

    setInterval(scheduleReminders, 10000);
    load(); renderAll();
  })();
</script>
</body>
</html>
