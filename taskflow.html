<!-- TaskFlow 任务规划工具 | 当前版本: 1.0.0 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <title>TaskFlow任务规划工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f7fa;
      touch-action: manipulation;
    }
    .app-container {
      width: 100%; height: 100%; background: white;
      display: flex; flex-direction: column; overflow: hidden;
    }
    @media (max-width: 850px) or (orientation: portrait) {
      .main-layout { flex-direction: column !important; }
      .timeline-panel { flex: 1 !important; border-right: none !important; border-bottom: 1px solid #eef2f6; }
      .cards-panel { max-height: 30%; min-height: 120px; }
      .cards-panel.hidden { max-height: 0; min-height: 0; padding: 0; }
      .header-actions { gap: 0.3rem; }
      .header-actions button { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    }
    .app-header {
      padding: 0.8rem 1.5rem; border-bottom: 1px solid #edf2f7;
      display: flex; align-items: center; justify-content: space-between;
      background: white; flex-wrap: wrap; gap: 0.5rem; flex-shrink: 0;
    }
    .app-title { font-weight: 600; font-size: clamp(1.2rem, 3vw, 1.8rem); color: #0f172a; }
    .version-badge {
      font-size: 0.7rem; color: #94a3b8; background: #f1f5f9;
      padding: 0.2rem 0.6rem; border-radius: 1rem; margin-left: 0.5rem;
      vertical-align: middle;
    }
    button {
      background: white; border: 1px solid #e2e8f0; padding: 0.5rem 1rem;
      border-radius: 2.5rem; font-size: clamp(0.75rem, 1.5vw, 0.9rem); font-weight: 500; color: #334155;
      cursor: pointer; background: #f8fafc; white-space: nowrap;
      touch-action: manipulation;
    }
    button:hover { background: #f1f5f9; }
    button.primary { background: #0f172a; border-color: #0f172a; color: white; }
    .main-layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }
    .timeline-panel {
      flex: 1; background: #f9fafb; display: flex; flex-direction: column;
      padding: 1rem; gap: 0.6rem; overflow-y: auto; border-right: 1px solid #eef2f6;
      min-width: 0;
    }
    .cards-panel {
      width: clamp(220px, 28vw, 300px); padding: 1rem; background: white; overflow-y: auto;
      transition: all 0.3s; border-left: 1px solid #eef2f6; flex-shrink: 0;
      display: flex; flex-direction: column;
    }
    .cards-panel.hidden { width: 0; padding: 0; overflow: hidden; border-left: none; }
    .section-title { font-weight: 600; font-size: clamp(0.75rem, 1.5vw, 0.9rem); color: #64748b; margin-bottom: 0.4rem; flex-shrink: 0; }
    .time-slot-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .time-slot-item {
      background: white; border-radius: 0.8rem; padding: 0.7rem;
      border: 1px solid #e9eef2; min-height: 60px; transition: all 0.2s;
    }
    .time-slot-item.drag-over { background: #eef2ff; border: 2px dashed #6366f1; }
    .time-slot-item.locked { border-left: 4px solid #f59e0b; background: #fffbeb; }
    .time-slot-item.completed { background: #f1f5f9; opacity: 0.7; border-left: 4px solid #94a3b8; }
    .slot-task-card {
      background: #f1f5f9; border-radius: 0.6rem; padding: 0.3rem 0.6rem;
      margin-top: 0.3rem; display: flex; justify-content: space-between;
      align-items: center; font-weight: 500; font-size: clamp(0.75rem, 1.5vw, 0.85rem);
    }
    .slot-task-card.locked-card { background: #fef3c7; }
    .cards-grid {
      display: flex; flex-wrap: wrap; gap: 0.5rem; align-content: flex-start;
      flex: 1; overflow-y: auto;
    }
    .task-card {
      width: calc(50% - 0.25rem); min-width: 85px; padding: 0.5rem; border-radius: 0.7rem; background: #f1f5f9;
      border: 1px solid #e2e8f0; cursor: grab; font-weight: 500; font-size: clamp(0.7rem, 1.3vw, 0.8rem);
      touch-action: none; user-select: none; -webkit-user-select: none;
      text-align: center; word-break: break-word;
    }
    .task-card:active { cursor: grabbing; }
    .task-card.locked-card { background: #fef3c7; border-color: #f59e0b; }
    .task-card.dragging { opacity: 0.5; transform: scale(0.95); }
    .custom-toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #ef4444; color: white; padding: 0.8rem 1.5rem; border-radius: 2rem;
      z-index: 10002; display: none; font-weight: 500; font-size: clamp(0.8rem, 1.5vw, 0.9rem);
    }
    .custom-toast.active { display: block; }
    .custom-toast.success { background: #22c55e; }

    .time-picker-container {
      display: flex; gap: 0.4rem; align-items: center; justify-content: center;
    }
    .picker-col {
      position: relative; width: clamp(45px, 10vw, 55px); height: clamp(100px, 18vh, 130px); overflow: hidden;
      border-radius: 0.6rem; background: #f8fafc;
    }
    .picker-highlight {
      position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
      height: clamp(32px, 6vh, 40px); background: rgba(99,102,241,0.1);
      border-top: 1px solid #c7d2fe; border-bottom: 1px solid #c7d2fe;
      pointer-events: none; z-index: 1;
    }
    .picker-scroll {
      height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; -ms-overflow-style: none;
      padding: 45px 0;
    }
    .picker-scroll::-webkit-scrollbar { display: none; }
    .picker-item {
      height: clamp(32px, 6vh, 40px); display: flex; align-items: center; justify-content: center;
      font-size: clamp(1rem, 2vw, 1.2rem); font-weight: 500; color: #cbd5e1; scroll-snap-align: center;
      cursor: pointer; user-select: none; -webkit-user-select: none;
    }
    .picker-item.active {
      color: #0f172a; font-size: clamp(1.1rem, 2.2vw, 1.4rem); font-weight: 700;
    }
    .picker-colon { font-size: clamp(1.2rem, 2.5vw, 1.5rem); font-weight: 600; color: #64748b; width: 12px; text-align: center; }
    .picker-dash { font-size: clamp(1.2rem, 2.5vw, 1.5rem); font-weight: 300; color: #94a3b8; width: 16px; text-align: center; }

    .flash-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      z-index: 9999; pointer-events: none; opacity: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: bold; text-align: center; padding: 1rem;
    }
    .flash-overlay.active { animation: flashBlackWhite 0.5s infinite alternate; }
    @keyframes flashBlackWhite {
      0% { background: black; color: white; opacity: 1; }
      100% { background: white; color: black; opacity: 1; }
    }
    .green-fullscreen {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: #22c55e; z-index: 10000; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      color: white; font-size: clamp(1rem, 3vw, 1.5rem); text-align: center; gap: 1rem; padding: 1rem;
    }
    .green-fullscreen.active { display: flex; }
    .green-fullscreen button {
      background: white; color: #22c55e; border: none; padding: 0.8rem 2rem;
      border-radius: 3rem; font-size: clamp(1rem, 2.5vw, 1.2rem); font-weight: 600; cursor: pointer;
    }
    .green-buttons { display: flex; flex-direction: column; gap: 0.8rem; align-items: center; }
    .pause-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: black; z-index: 10001; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      color: white; font-size: clamp(1.2rem, 3vw, 2rem); gap: 1rem;
    }
    .pause-overlay.active { display: flex; }
    .custom-modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .custom-modal.active { display: flex; }
    .modal-content {
      background: white; padding: clamp(1.2rem, 3vw, 2rem); border-radius: 1.5rem;
      width: clamp(300px, 80vw, 380px); box-shadow: 0 30px 50px rgba(0,0,0,0.3);
      max-height: 90vh; overflow-y: auto;
    }
    .confirm-dialog {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 10003;
    }
    .confirm-dialog.active { display: flex; }
    .confirm-content {
      background: white; padding: clamp(1.2rem, 3vw, 2rem); border-radius: 1.5rem;
      text-align: center; width: clamp(260px, 70vw, 320px); box-shadow: 0 30px 50px rgba(0,0,0,0.3);
    }
    .drag-ghost {
      position: fixed; pointer-events: none; z-index: 9998;
      opacity: 0.8; transform: translate(-50%, -50%);
      background: #6366f1; color: white; padding: 0.4rem 0.8rem;
      border-radius: 0.8rem; font-weight: 600; font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .file-menu { position: relative; display: inline-block; }
    .file-dropdown {
      display: none; position: fixed;
      background: white; border-radius: 0.8rem; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      z-index: 200; min-width: 160px; padding: 0.4rem; border: 1px solid #e2e8f0;
    }
    .file-dropdown.active { display: block; }
    .file-dropdown button {
      display: block; width: 100%; text-align: left; border: none;
      padding: 0.6rem 0.8rem; border-radius: 0.6rem; margin: 0.1rem 0;
    }

    .update-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
      z-index: 10010; display: none;
      align-items: center; justify-content: center;
    }
    .update-overlay.active { display: flex; }
    .update-dialog {
      background: white; border-radius: 2rem; padding: 2rem;
      width: clamp(300px, 80vw, 400px); text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    }
    .update-dialog h2 {
      font-size: 1.5rem; margin-bottom: 1rem; color: #0f172a;
    }
    .update-dialog .version-info {
      background: #f8fafc; border-radius: 1rem; padding: 1rem; margin: 1rem 0;
      font-size: 1rem; color: #475569;
    }
    .update-dialog .version-info span {
      font-weight: 700; color: #6366f1;
    }
    .update-dialog button {
      width: 100%; padding: 0.8rem; margin: 0.4rem 0;
    }
    /* 更新提示箭头 - 静态不晃动，位置上移 */
    .update-arrow-hint {
      position: fixed; bottom: 80px; right: 24px; z-index: 10011;
      display: none; align-items: center; gap: 0.5rem;
      color: white; font-weight: 600; font-size: 1rem;
      background: rgba(0,0,0,0.7); padding: 0.6rem 1rem; border-radius: 2rem;
    }
    .update-arrow-hint.active { display: flex; }
    .update-arrow-hint .arrow {
      font-size: 1.5rem;
    }
    .download-mask {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); z-index: 10009; display: none;
    }
    .download-mask.active { display: block; }
  </style>
</head>
<body>
<div class="app-container">
  <div class="app-header">
    <div class="app-title">
      TaskFlow任务规划工具
      <span class="version-badge" id="headerVersion">v1.0.0</span>
    </div>
    <div class="header-actions">
      <div class="file-menu">
        <button id="fileBtn">文件</button>
        <div class="file-dropdown" id="fileDropdown">
          <button id="saveFileBtn">保存设定</button>
          <button id="loadFileBtn">加载设定</button>
        </div>
      </div>
      <button id="addTaskBtn">添加任务</button>
      <button id="pauseBtn">上厕所</button>
      <button id="resetBtn">重置</button>
    </div>
  </div>
  <div class="main-layout">
    <div class="timeline-panel" id="timelinePanel">
      <div style="display:flex; justify-content: space-between; align-items:center;">
        <span class="section-title">时间段</span>
        <button id="addSlotBtn">+ 添加</button>
      </div>
      <div id="slotContainer" class="time-slot-list"></div>
    </div>
    <div class="cards-panel" id="cardsPanel">
      <div class="section-title">任务卡片库</div>
      <div id="cardsContainer" class="cards-grid"></div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".tfd" style="display:none;">

<div id="customToast" class="custom-toast"></div>
<div id="flashOverlay" class="flash-overlay"></div>

<div id="greenComplete" class="green-fullscreen">
  <div id="greenMessage" style="white-space: pre-line; line-height: 1.8;"></div>
  <div class="green-buttons" id="greenButtons"></div>
</div>

<div id="pauseOverlay" class="pause-overlay">
  <div>暂停中</div>
  <div id="pauseTimer">00:00</div>
  <button id="resumeBtn" style="background:white; color:black; padding:0.8rem 2rem; border-radius:2rem;">继续</button>
</div>

<div id="confirmDialog" class="confirm-dialog">
  <div class="confirm-content">
    <p id="confirmMsg"></p>
    <div style="display:flex; gap:1rem; justify-content:center; margin-top:1.2rem;">
      <button id="confirmYesBtn" class="primary">确认</button>
      <button id="confirmNoBtn">取消</button>
    </div>
  </div>
</div>

<div id="taskModal" class="custom-modal">
  <div class="modal-content">
    <h3>新建任务</h3>
    <input type="text" id="taskNameInput" placeholder="任务名称" style="width:100%; padding:0.7rem; border-radius:0.8rem; border:1px solid #ddd; margin:0.8rem 0; font-size:inherit;">
    <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.8rem;">
      <input type="checkbox" id="taskLocked"> 锁定时间段（不受推迟影响）
    </label>
    <button id="confirmTaskBtn" class="primary" style="width:100%;">确认</button>
    <button id="cancelTaskBtn" style="width:100%; margin-top:0.4rem;">取消</button>
  </div>
</div>

<div id="slotModal" class="custom-modal">
  <div class="modal-content">
    <h3>编辑时间段</h3>
    <div class="time-picker-container">
      <div class="picker-col" id="startHourPicker"></div>
      <div class="picker-colon">:</div>
      <div class="picker-col" id="startMinPicker"></div>
      <div class="picker-dash">-</div>
      <div class="picker-col" id="endHourPicker"></div>
      <div class="picker-colon">:</div>
      <div class="picker-col" id="endMinPicker"></div>
    </div>
    <button id="saveSlotBtn" class="primary" style="margin-top:1.2rem; width:100%;">保存</button>
    <button id="cancelSlotBtn" style="width:100%; margin-top:0.4rem;">取消</button>
  </div>
</div>

<div class="download-mask" id="downloadMask"></div>
<div class="update-overlay" id="updateOverlay">
  <div class="update-dialog">
    <h2>发现新版本</h2>
    <div class="version-info">
      <span id="currentVersion">1.0.0</span> → <span id="latestVersion">1.0.0</span>
    </div>
    <button id="updateNowBtn" class="primary">立即更新</button>
    <button id="updateLaterBtn">下次再说</button>
  </div>
</div>
<div class="update-arrow-hint" id="updateArrow">
  <span>点击下载按钮开始下载最新版本</span>
  <span class="arrow">↘</span>
</div>

<script>
  (() => {
    // ========== 版本信息 ==========
    const CURRENT_VERSION = '1.0.0';
    const VERSION_CHECK_URL = 'https://luckynum.top/taskflowver.txt';
    const UPDATE_URL_APK = 'https://luckynum.top/taskflow.apk';
    // =============================

    const STORAGE = 'taskflow_v18';
    let tasks = [];
    let timeSlots = [];
    let nextId = 1;
    let timers = [];
    let flashTimer = null;
    let currentCompleteTaskId = null;
    let currentCompleteIsManual = false;
    let editingSlotId = null;
    let flashedSet = new Set();
    let paused = false;
    let pauseStart = null;
    let pauseInterval = null;
    let confirmCallback = null;

    let touchDragData = null;
    let touchGhost = null;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchDragging = false;

    const toMins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
    const toTime = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

    document.getElementById('headerVersion').textContent = 'v' + CURRENT_VERSION;

    async function checkUpdate() {
      try {
        const response = await fetch(VERSION_CHECK_URL + '?t=' + Date.now(), { cache: 'no-cache' });
        if (!response.ok) return;
        const text = await response.text();
        const latestVer = text.trim();
        if (/^\d+\.\d+\.\d+$/.test(latestVer) && compareVersions(latestVer, CURRENT_VERSION) > 0) {
          document.getElementById('currentVersion').textContent = CURRENT_VERSION;
          document.getElementById('latestVersion').textContent = latestVer;
          document.getElementById('updateOverlay').classList.add('active');
        }
      } catch (e) {}
    }

    function compareVersions(v1, v2) {
      const p1 = v1.split('.').map(Number), p2 = v2.split('.').map(Number);
      for (let i=0; i<Math.max(p1.length, p2.length); i++) {
        if ((p1[i]||0) > (p2[i]||0)) return 1;
        if ((p1[i]||0) < (p2[i]||0)) return -1;
      }
      return 0;
    }

    function triggerUpdate() {
      document.getElementById('updateOverlay').classList.remove('active');
      document.getElementById('downloadMask').classList.add('active');
      document.getElementById('updateArrow').classList.add('active');
      const a = document.createElement('a');
      a.href = UPDATE_URL_APK;
      a.download = 'taskflow.apk';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => document.body.removeChild(a), 300);
      setTimeout(() => {
        document.getElementById('updateArrow').classList.remove('active');
        document.getElementById('downloadMask').classList.remove('active');
      }, 8000);
    }

    function showToast(msg, isSuccess=false) {
      const t = document.getElementById('customToast');
      t.textContent = msg;
      t.className = 'custom-toast' + (isSuccess ? ' success' : '');
      t.classList.add('active');
      setTimeout(() => t.classList.remove('active'), 2000);
    }

    function showConfirm(msg, cb) {
      document.getElementById('confirmMsg').textContent = msg;
      document.getElementById('confirmDialog').classList.add('active');
      confirmCallback = cb;
    }

    function save() { localStorage.setItem(STORAGE, JSON.stringify({tasks, timeSlots, nextId})); }
    function load() {
      const d = localStorage.getItem(STORAGE);
      if(d) { try { const p = JSON.parse(d); tasks = p.tasks; timeSlots = p.timeSlots; nextId = p.nextId; } catch(e) { reset(); } }
      else reset();
    }
    function reset() { tasks=[]; timeSlots=[]; nextId=1; flashedSet.clear(); save(); renderAll(); }

    function getNow() { const n=new Date(); return n.getHours()*60+n.getMinutes(); }

    function updateCardsPanelVisibility() {
      const panel = document.getElementById('cardsPanel');
      panel.classList.toggle('hidden', !tasks.some(t => !t.completed && !timeSlots.some(s => s.taskId === t.id)));
    }

    function returnTaskToWarehouse(taskId) {
      timeSlots.forEach(s => { if(s.taskId === taskId) s.taskId = null; });
      flashedSet.delete(taskId);
      save(); renderAll();
    }

    function renderAll() { renderSlots(); renderCards(); updateCardsPanelVisibility(); scheduleReminders(); }

    function createTouchGhost(text) {
      if(touchGhost) touchGhost.remove();
      touchGhost = document.createElement('div');
      touchGhost.className = 'drag-ghost';
      touchGhost.textContent = text;
      document.body.appendChild(touchGhost);
    }
    function removeTouchGhost() { if(touchGhost) { touchGhost.remove(); touchGhost = null; } }
    function moveTouchGhost(x, y) { if(touchGhost) { touchGhost.style.left = x+'px'; touchGhost.style.top = y+'px'; } }

    function getDropTarget(x, y) {
      const el = document.elementFromPoint(x, y);
      if(!el) return null;
      const slotItem = el.closest('.time-slot-item');
      if(slotItem && !slotItem.classList.contains('completed')) return slotItem;
      return null;
    }

    function setupTouchDrag(element, taskId, taskName) {
      element.addEventListener('touchstart', function(e) {
        if(e.target.closest('button')) return;
        if(e.touches.length !== 1) return;
        touchDragData = taskId;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchDragging = false;
      }, {passive: false});
      element.addEventListener('touchmove', function(e) {
        if(!touchDragData) return;
        e.preventDefault();
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        if(!touchDragging && Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
        if(!touchDragging) { touchDragging = true; createTouchGhost(taskName); element.classList.add('dragging'); }
        moveTouchGhost(e.touches[0].clientX, e.touches[0].clientY);
        const target = getDropTarget(e.touches[0].clientX, e.touches[0].clientY);
        document.querySelectorAll('.time-slot-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
        if(target) target.classList.add('drag-over');
      }, {passive: false});
      element.addEventListener('touchend', function(e) {
        if(!touchDragData) return;
        document.querySelectorAll('.time-slot-item.drag-over').forEach(el=>el.classList.remove('drag-over'));
        if(touchDragging) {
          const target = getDropTarget(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
          if(target) {
            const task = tasks.find(t=>t.id===touchDragData);
            if(task && !task.completed && !timeSlots.some(s=>s.taskId===touchDragData)) {
              timeSlots.forEach(s=>{ if(s.taskId===touchDragData) s.taskId=null; });
              const slot = timeSlots.find(s=>s.id==target.dataset.slotId || s.id===Number(target.dataset.slotId));
              if(slot) { slot.taskId = touchDragData; slot.locked = task.locked || false; }
              flashedSet.delete(touchDragData);
              save(); renderAll();
            }
          }
          element.classList.remove('dragging');
        }
        removeTouchGhost();
        touchDragData = null; touchDragging = false;
      });
    }

    function renderCards() {
      const c = document.getElementById('cardsContainer');
      c.innerHTML = '';
      tasks.filter(t=>!t.completed && !timeSlots.some(s=>s.taskId===t.id)).forEach(t=>{
        const card = document.createElement('div');
        card.className = `task-card${t.locked ? ' locked-card' : ''}`;
        card.draggable = true; card.dataset.id = t.id;
        card.innerHTML = `<strong>${t.name}</strong>${t.locked ? ' 🔒' : ''}`;
        card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', t.id); });
        setupTouchDrag(card, t.id, t.name);
        c.appendChild(card);
      });
    }

    function renderSlots() {
      const container = document.getElementById('slotContainer');
      container.innerHTML = '';
      const activeSlots = timeSlots.filter(s => !tasks.find(t => t.id === s.taskId)?.completed);
      const completedSlots = timeSlots.filter(s => tasks.find(t => t.id === s.taskId)?.completed);
      [...activeSlots.sort((a,b)=>toMins(a.start)-toMins(b.start)), ...completedSlots].forEach(s=>{
        const div = document.createElement('div');
        const task = tasks.find(t=>t.id===s.taskId);
        const isCompleted = task?.completed;
        div.className = `time-slot-item${s.locked && !isCompleted ? ' locked' : ''}${isCompleted ? ' completed' : ''}`;
        div.dataset.slotId = s.id;
        if(isCompleted && task) {
          div.innerHTML = `<div style="display:flex; justify-content:space-between;"><span style="color:#94a3b8;">${task.name} (已完成) ${s.start} - ${s.end}</span><button class="delete-completed-btn">删除</button></div>`;
          div.querySelector('.delete-completed-btn').addEventListener('click', (e)=>{ e.stopPropagation(); tasks = tasks.filter(t => t.id !== task.id); timeSlots = timeSlots.filter(sl => sl.taskId !== task.id); save(); renderAll(); });
        } else {
          div.innerHTML = `<div style="display:flex; justify-content:space-between;"><span><strong>${s.start} - ${s.end}</strong>${s.locked?' 🔒':''}</span><div><button class="edit-slot-btn">编辑</button><button class="delete-slot-btn">删除</button></div></div>`;
          if(s.taskId && task && !task.completed) {
            const tdiv = document.createElement('div');
            tdiv.className = `slot-task-card${task.locked ? ' locked-card' : ''}`;
            tdiv.innerHTML = `<span>${task.name}${task.locked?' 🔒':''}</span><div><button class="return-to-warehouse-btn">放回</button><button class="complete-in-slot">完成</button></div>`;
            tdiv.querySelector('.return-to-warehouse-btn').addEventListener('click', e=>{ e.stopPropagation(); returnTaskToWarehouse(task.id); });
            tdiv.querySelector('.complete-in-slot').addEventListener('click', e=>{ e.stopPropagation(); showConfirm(`确认完成"${task.name}"吗？`, () => handleManualComplete(task.id)); });
            div.appendChild(tdiv);
          }
          div.addEventListener('dragover', e=>e.preventDefault());
          div.addEventListener('drop', e=>{
            e.preventDefault();
            const tid = Number(e.dataTransfer.getData('text/plain'));
            if(!tid) return;
            const dt = tasks.find(t=>t.id===tid);
            if(dt?.completed || timeSlots.some(sl=>sl.taskId===tid)) return;
            timeSlots.forEach(sl=>{ if(sl.taskId===tid) sl.taskId=null; });
            s.taskId = tid; s.locked = dt?.locked || false;
            flashedSet.delete(tid); save(); renderAll();
          });
          div.querySelector('.edit-slot-btn')?.addEventListener('click', ()=>openSlotEditor(s.id));
          div.querySelector('.delete-slot-btn')?.addEventListener('click', ()=>deleteSlot(s.id));
        }
        container.appendChild(div);
      });
      const cp = document.getElementById('cardsContainer');
      cp.addEventListener('dragover', e=>e.preventDefault());
      cp.addEventListener('drop', e=>{ e.preventDefault(); const tid=Number(e.dataTransfer.getData('text/plain')); if(tid){ timeSlots.forEach(s=>{ if(s.taskId===tid) s.taskId=null; }); flashedSet.delete(tid); save(); renderAll(); } });
    }

    function deleteSlot(id) { timeSlots = timeSlots.filter(s=>s.id!==id); save(); renderAll(); }

    function buildPicker(containerId, max, currentVal) {
      const container = document.getElementById(containerId);
      container.innerHTML = `<div class="picker-highlight"></div><div class="picker-scroll">${Array.from({length:max+1}, (_,i)=>`<div class="picker-item" data-value="${i}">${String(i).padStart(2,'0')}</div>`).join('')}</div>`;
      const scroll = container.querySelector('.picker-scroll');
      let st;
      scroll.addEventListener('scroll', ()=>{ clearTimeout(st); st=setTimeout(()=>updateActiveItem(scroll),60); });
      setTimeout(()=>{ const t=scroll.querySelector(`[data-value="${currentVal}"]`); if(t){ scroll.scrollTop=t.offsetTop-scroll.offsetHeight/2+t.offsetHeight/2; updateActiveItem(scroll); } },100);
    }
    function updateActiveItem(scroll) {
      const items=scroll.querySelectorAll('.picker-item'), center=scroll.scrollTop+scroll.offsetHeight/2;
      let closest=items[0], min=Infinity;
      items.forEach(i=>{ const d=Math.abs(i.offsetTop+i.offsetHeight/2-center); if(d<min){ min=d; closest=i; } });
      items.forEach(i=>i.classList.remove('active')); if(closest) closest.classList.add('active');
    }
    function getPickerValue(id) { const a=document.getElementById(id).querySelector('.picker-item.active'); return a?parseInt(a.dataset.value):0; }

    function openSlotEditor(slotId=null) {
      editingSlotId = slotId;
      const now=new Date(); let sh=now.getHours(), sm=now.getMinutes(), eh=(new Date(now.getTime()+30*60000)).getHours(), em=(new Date(now.getTime()+30*60000)).getMinutes();
      if(slotId){ const s=timeSlots.find(s=>s.id===slotId); [sh,sm]=s.start.split(':').map(Number); [eh,em]=s.end.split(':').map(Number); }
      buildPicker('startHourPicker',23,sh); buildPicker('startMinPicker',59,sm); buildPicker('endHourPicker',23,eh); buildPicker('endMinPicker',59,em);
      document.getElementById('slotModal').classList.add('active');
    }
    function saveSlotFromEditor() {
      const sh=getPickerValue('startHourPicker'), sm=getPickerValue('startMinPicker'), eh=getPickerValue('endHourPicker'), em=getPickerValue('endMinPicker');
      const start=`${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}`, end=`${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
      if(toMins(start)>=toMins(end)){showToast('结束时间必须晚于开始');return;}
      if(timeSlots.some(s=>s.id!==editingSlotId && toMins(s.start)<toMins(end) && toMins(s.end)>toMins(start))){showToast('时间段冲突');return;}
      if(editingSlotId){const s=timeSlots.find(s=>s.id===editingSlotId); if(s){s.start=start;s.end=end;}}
      else timeSlots.push({id:nextId++,start,end,taskId:null,locked:false});
      document.getElementById('slotModal').classList.remove('active'); save(); renderAll();
    }

    function handleManualComplete(taskId) { stopFlash(); currentCompleteTaskId=taskId; currentCompleteIsManual=true; showGreenComplete(taskId); }
    function completeTask(taskId) {
      const task=tasks.find(t=>t.id===taskId); if(!task)return;
      const slot=timeSlots.find(s=>s.taskId===taskId), now=getNow(), actualEnd=now, earlyMins=slot?toMins(slot.end)-actualEnd:0;
      task.completed=true; task.completedTime=toTime(actualEnd);
      if(slot) slot.end=toTime(actualEnd);
      flashedSet.delete(taskId); compactAfterComplete(taskId, earlyMins);
      document.getElementById('greenComplete').classList.remove('active'); currentCompleteIsManual=false; save(); renderAll();
    }
    function compactAfterComplete(completedTaskId, earlyMins) {
      const now=getNow(), nextSlots=timeSlots.filter(s=>s.taskId&&s.taskId!==completedTaskId&&!tasks.find(t=>t.id===s.taskId)?.completed).sort((a,b)=>toMins(a.start)-toMins(b.start));
      if(!nextSlots.length)return;
      const gapToNext=toMins(nextSlots[0].start)-now;
      let rest=Math.min(earlyMins,5);
      if(gapToNext<5&&earlyMins>0) rest=Math.min(earlyMins+gapToNext,5);
      const shift=earlyMins-rest;
      if(shift>0){ let le=now+rest; nextSlots.forEach(s=>{ if(s.locked)return; const d=toMins(s.end)-toMins(s.start); s.start=toTime(le); s.end=toTime(le+d); le=toMins(s.end); }); }
    }
    function shiftAfter(index, mins) {
      for(let i=index;i<timeSlots.length;i++){ let s=timeSlots[i]; if(s.locked||tasks.find(t=>t.id===s.taskId)?.completed)continue; let gap=i>0?toMins(s.start)-toMins(timeSlots[i-1].end):0; if(gap>=mins)return; s.start=toTime(toMins(s.start)+mins); s.end=toTime(toMins(s.end)+mins); }
    }
    function delayFive() {
      if(!currentCompleteTaskId||currentCompleteIsManual)return;
      const slot=timeSlots.find(s=>s.taskId===currentCompleteTaskId); if(!slot)return;
      slot.end=toTime(toMins(slot.end)+5); flashedSet.delete(currentCompleteTaskId);
      document.getElementById('greenComplete').classList.remove('active'); save(); renderAll();
    }
    function stopFlash(){ const o=document.getElementById('flashOverlay'); o.classList.remove('active'); if(flashTimer){clearTimeout(flashTimer);flashTimer=null;} }
    function startFlash(msg){ stopFlash(); const o=document.getElementById('flashOverlay'); o.textContent=msg; o.classList.add('active'); flashTimer=setTimeout(stopFlash,5000); }

    function showGreenComplete(taskId) {
      const task=tasks.find(t=>t.id===taskId); if(!task)return;
      const slot=timeSlots.find(s=>s.taskId===taskId), now=getNow(), early=slot?toMins(slot.end)-now:0;
      const nextSlot=timeSlots.filter(s=>s.taskId&&s.taskId!==taskId&&!tasks.find(t=>t.id===s.taskId)?.completed).sort((a,b)=>toMins(a.start)-toMins(b.start)).find(s=>toMins(s.start)>=now);
      let msg=`"${task.name}" 已完成`;
      if(nextSlot){ const nt=tasks.find(t=>t.id===nextSlot.taskId), gap=toMins(nextSlot.start)-now;
        if(early>0){ let rest=Math.min(early,5); if(gap<5&&early+gap>5) rest=5; else if(gap<5) rest=Math.min(early+gap,5);
          msg=`你已超额完成"${task.name}"\n下一个任务："${nt?.name}" 开始时间 ${nextSlot.start}`; if(rest>0) msg+=`\n你现在有${rest}分钟休息时间`; }
        else { msg=`"${task.name}" 已完成\n下一个任务："${nt?.name}" 开始时间 ${nextSlot.start}`; if(gap>0&&gap<=10) msg+=`\n你有${gap}分钟休息时间`; }
      }
      document.getElementById('greenMessage').innerText=msg;
      const bd=document.getElementById('greenButtons'); bd.innerHTML='';
      const gb=document.createElement('button'); gb.textContent='我知道了'; gb.addEventListener('click',()=>completeTask(taskId)); bd.appendChild(gb);
      if(!currentCompleteIsManual){ const cb=document.createElement('button'); cb.textContent='已完成'; cb.addEventListener('click',()=>completeTask(taskId)); bd.insertBefore(cb,gb);
        const db=document.createElement('button'); db.textContent='推迟五分钟'; db.addEventListener('click',delayFive); bd.insertBefore(db,gb); }
      document.getElementById('greenComplete').classList.add('active');
    }

    function scheduleReminders() {
      timers.forEach(t=>clearTimeout(t)); timers=[]; if(paused)return;
      const now=getNow();
      timeSlots.forEach(s=>{ if(!s.taskId)return; const task=tasks.find(t=>t.id===s.taskId); if(!task||task.completed)return;
        const end=toMins(s.end), start=toMins(s.start);
        if(now>=end){ stopFlash(); currentCompleteIsManual=false; currentCompleteTaskId=s.taskId; showGreenComplete(s.taskId); return; }
        if(now===start&&!flashedSet.has('started_'+s.taskId)){ startFlash(`"${task.name}" 开始`); flashedSet.add('started_'+s.taskId); }
        const fbe=end-5; if(now>=fbe&&now<end&&!flashedSet.has(s.taskId)){ startFlash(`"${task.name}" 即将结束`); flashedSet.add(s.taskId); }
        else if(fbe>now&&!flashedSet.has(s.taskId)) timers.push(setTimeout(()=>{ startFlash(`"${task.name}" 即将结束`); flashedSet.add(s.taskId); },(fbe-now)*60000));
        if(end>now) timers.push(setTimeout(()=>{ stopFlash(); currentCompleteIsManual=false; currentCompleteTaskId=s.taskId; showGreenComplete(s.taskId); },(end-now)*60000));
        const fbs=start-5; if(now>=fbs&&now<start&&!flashedSet.has('start_'+s.taskId)){ startFlash(`"${task.name}" 还有5分钟开始`); flashedSet.add('start_'+s.taskId); }
        else if(fbs>now&&!flashedSet.has('start_'+s.taskId)) timers.push(setTimeout(()=>{ startFlash(`"${task.name}" 还有5分钟开始`); flashedSet.add('start_'+s.taskId); },(fbs-now)*60000));
        if(start>now&&!flashedSet.has('started_'+s.taskId)) timers.push(setTimeout(()=>{ startFlash(`"${task.name}" 开始`); flashedSet.add('started_'+s.taskId); },(start-now)*60000));
      });
    }

    function togglePause() {
      if(!paused){ paused=true; pauseStart=Date.now(); document.getElementById('pauseOverlay').classList.add('active');
        pauseInterval=setInterval(()=>{ const sec=Math.floor((Date.now()-pauseStart)/1000); document.getElementById('pauseTimer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`; },1000); stopFlash(); }
    }
    function resume() {
      if(!paused)return; const pausedMs=Date.now()-pauseStart, pausedMins=Math.ceil(pausedMs/60000); paused=false; clearInterval(pauseInterval);
      document.getElementById('pauseOverlay').classList.remove('active'); const now=getNow();
      let cs=timeSlots.find(s=>s.taskId&&!tasks.find(t=>t.id===s.taskId)?.completed&&toMins(s.start)<=now&&toMins(s.end)>now);
      if(cs){ cs.end=toTime(toMins(cs.end)+pausedMins); shiftAfter(timeSlots.indexOf(cs)+1,pausedMins); }
      else { for(let i=0;i<timeSlots.length;i++){ let s=timeSlots[i]; if(!s.taskId||s.locked||tasks.find(t=>t.id===s.taskId)?.completed)continue; if(toMins(s.start)>=now){shiftAfter(i,pausedMins);break;} } }
      save(); renderAll();
    }

    function saveToFile() {
      const data={tasks,timeSlots,nextId}, json=JSON.stringify(data,null,2), blob=new Blob([json],{type:'application/octet-stream'});
      const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='taskflow_config.tfd'; a.style.display='none';
      document.body.appendChild(a); a.click(); setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },300); showToast('设定已保存',true);
    }
    function loadFromFile(file) {
      const reader=new FileReader(); reader.onload=function(e){ try{ const data=JSON.parse(e.target.result); if(data.tasks&&data.timeSlots&&data.nextId!==undefined){ tasks=data.tasks; timeSlots=data.timeSlots; nextId=data.nextId; flashedSet.clear(); save(); renderAll(); showToast('设定已加载',true); }else showToast('文件格式无效'); }catch(err){showToast('文件解析失败');} }; reader.readAsText(file);
    }

    // 事件绑定
    document.getElementById('fileBtn').addEventListener('click',e=>{ e.stopPropagation(); const d=document.getElementById('fileDropdown'),r=e.target.getBoundingClientRect(); d.style.top=(r.bottom+5)+'px'; d.style.left=r.left+'px'; d.classList.toggle('active'); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.file-menu')) document.getElementById('fileDropdown').classList.remove('active'); });
    document.getElementById('saveFileBtn').addEventListener('click',e=>{ e.stopPropagation(); document.getElementById('fileDropdown').classList.remove('active'); saveToFile(); });
    document.getElementById('loadFileBtn').addEventListener('click',e=>{ e.stopPropagation(); document.getElementById('fileDropdown').classList.remove('active'); document.getElementById('fileInput').click(); });
    document.getElementById('fileInput').addEventListener('change',e=>{ if(e.target.files[0]){ loadFromFile(e.target.files[0]); e.target.value=''; } });
    document.getElementById('addTaskBtn').addEventListener('click',()=>document.getElementById('taskModal').classList.add('active'));
    document.getElementById('cancelTaskBtn').addEventListener('click',()=>document.getElementById('taskModal').classList.remove('active'));
    document.getElementById('confirmTaskBtn').addEventListener('click',()=>{ const n=document.getElementById('taskNameInput').value.trim(); if(!n)return; const l=document.getElementById('taskLocked').checked; tasks.push({id:nextId++,name:n,type:'task',completed:false,locked:l}); document.getElementById('taskModal').classList.remove('active'); document.getElementById('taskNameInput').value=''; document.getElementById('taskLocked').checked=false; save(); renderAll(); });
    document.getElementById('addSlotBtn').addEventListener('click',()=>openSlotEditor(null));
    document.getElementById('saveSlotBtn').addEventListener('click',saveSlotFromEditor);
    document.getElementById('cancelSlotBtn').addEventListener('click',()=>document.getElementById('slotModal').classList.remove('active'));
    document.getElementById('pauseBtn').addEventListener('click',togglePause);
    document.getElementById('resumeBtn').addEventListener('click',resume);
    document.getElementById('confirmYesBtn').addEventListener('click',()=>{ document.getElementById('confirmDialog').classList.remove('active'); if(confirmCallback)confirmCallback(); });
    document.getElementById('confirmNoBtn').addEventListener('click',()=>{ document.getElementById('confirmDialog').classList.remove('active'); confirmCallback=null; });
    document.getElementById('resetBtn').addEventListener('click',()=>{ showConfirm('确定要清除所有数据吗？',()=>{ stopFlash(); reset(); }); });
    document.getElementById('updateNowBtn').addEventListener('click',triggerUpdate);
    document.getElementById('updateLaterBtn').addEventListener('click',()=>document.getElementById('updateOverlay').classList.remove('active'));
    document.getElementById('downloadMask').addEventListener('click',()=>{ document.getElementById('downloadMask').classList.remove('active'); document.getElementById('updateArrow').classList.remove('active'); });

    document.addEventListener('touchmove',e=>{ if(touchDragging)e.preventDefault(); },{passive:false});
    window.addEventListener('resize',()=>updateCardsPanelVisibility());
    setInterval(scheduleReminders,10000);
    load(); renderAll();
    setTimeout(checkUpdate,1500);
  })();
</script>
</body>
</html>
