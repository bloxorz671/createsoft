 <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文本加密器</title>
</head>
<body>
<script>
    (function() {
        // 获取URL参数（使用 & 分隔）
        function getUrlParams() {
            let params = {};
            let query = window.location.search.substring(1);
            if (!query) return params;
            // 按 & 分割参数对
            let pairs = query.split('&');
            for (let pair of pairs) {
                let eqIndex = pair.indexOf('=');
                if (eqIndex === -1) continue;
                let key = decodeURIComponent(pair.substring(0, eqIndex));
                let value = decodeURIComponent(pair.substring(eqIndex + 1));
                params[key] = value;
            }
            return params;
        }

        // 映射表：数字字符和逗号 -> ASCII字符 (A-K)
        function digitToAsciiChar(ch) {
            if (ch >= '0' && ch <= '9') {
                return String.fromCharCode(65 + (ch.charCodeAt(0) - 48));
            }
            if (ch === ',') {
                return 'K';
            }
            return ch;
        }

        function asciiCharToDigit(c) {
            let code = c.charCodeAt(0);
            if (code >= 65 && code <= 74) {
                return String.fromCharCode(48 + (code - 65));
            }
            if (c === 'K') {
                return ',';
            }
            return c;
        }

        function encodeToLetters(numberString) {
            let result = [];
            for (let i = 0; i < numberString.length; i++) {
                result.push(digitToAsciiChar(numberString[i]));
            }
            return result.join('');
        }

        function decodeFromLetters(letterString) {
            let result = [];
            for (let i = 0; i < letterString.length; i++) {
                result.push(asciiCharToDigit(letterString[i]));
            }
            return result.join('');
        }

        function encryptToNumbers(plainText, shift) {
            if (!plainText) return "";
            const chars = Array.from(plainText);
            const numbers = [];
            for (let ch of chars) {
                let code = ch.codePointAt(0);
                if (code === undefined) continue;
                numbers.push(code + shift);
            }
            return numbers.join(',');
        }

        function encryptFull(plainText, shift) {
            let numberStr = encryptToNumbers(plainText, shift);
            if (numberStr === "") return "";
            return encodeToLetters(numberStr);
        }

        function decryptFull(cipherText, shift) {
            if (!cipherText) return "";
            let numberStr = decodeFromLetters(cipherText);
            let parts = numberStr.split(',');
            let resultChars = [];
            for (let part of parts) {
                let trimmed = part.trim();
                if (trimmed === "") continue;
                let num = Number(trimmed);
                if (isNaN(num)) {
                    throw new Error(`Invalid number: ${trimmed}`);
                }
                let originalCode = num - shift;
                if (originalCode < 0) {
                    throw new Error(`Negative code point`);
                }
                try {
                    resultChars.push(String.fromCodePoint(originalCode));
                } catch (err) {
                    throw new Error(`Invalid code point`);
                }
            }
            return resultChars.join('');
        }

        function getShiftFromPsd(psdStr) {
            if (!psdStr) return null;
            let num = Number(psdStr);
            if (isNaN(num)) return null;
            let intNum = Math.floor(num);
            // 密码超过8位数（绝对值长度大于8）视为无效
            if (Math.abs(intNum).toString().length > 8) return null;
            return intNum;
        }

        let params = getUrlParams();

        // 如果带参数，执行API模式，直接输出纯文本内容
        if (Object.keys(params).length > 0) {
            let resultText = '';
            let validRequest = true;
            
            // 解密模式: ctt=密文&psd=密码
            if (params.hasOwnProperty('ctt') && params.hasOwnProperty('psd')) {
                let cipher = params['ctt'];
                let psd = params['psd'];
                let shift = getShiftFromPsd(psd);
                if (shift === null) {
                    validRequest = false;
                } else {
                    try {
                        resultText = decryptFull(cipher, shift);
                    } catch(e) {
                        validRequest = false;
                    }
                }
            }
            // 加密模式: wrd=明文&psd=密码
            else if (params.hasOwnProperty('wrd') && params.hasOwnProperty('psd')) {
                let plain = params['wrd'];
                let psd = params['psd'];
                let shift = getShiftFromPsd(psd);
                if (shift === null) {
                    validRequest = false;
                } else {
                    try {
                        resultText = encryptFull(plain, shift);
                    } catch(e) {
                        validRequest = false;
                    }
                }
            }
            else {
                validRequest = false;
            }
            
            if (!validRequest) {
                resultText = 'Unable to convert the content.';
            }
            
            // 输出纯文本，没有任何HTML标签
            document.write(resultText);
            document.close();
            return;
        }

        // 不带参数时，显示完整界面（无原理解释）
        document.write(`

<script>

        const decryptBtn = document.getElementById('decryptBtn');

        function decryptFull(cipherText, shift) {

            let numberStr = decodeFromLetters(cipherText);

                    resultChars.push(String.fromCodePoint(originalCode));
                } catch(err) {
                    throw new Error("Invalid code point");
                }
            }

        function getShift() {
            let raw = passwordEl.value.trim();
            if (raw === "") return 0;
            let num = Number(raw);
            if (isNaN(num)) return 0;
            let intNum = Math.floor(num);
            if (Math.abs(intNum).toString().length > 8) return null;
            return intNum;

        function doEncrypt() {

            if (plain === "") {
                outputEl.value = "";

                    statusSpan.innerText = "加密完成";
