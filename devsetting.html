<script>
    (function() {
        // ---------- åºå®éç½® ----------
        const OWNER = 'bloxorz671';
        const REPO = 'createsoft';
        const BRANCH = 'main';
        
        // æä»¶æ å°è¡¨
        const FILE_DISPLAY_NAMES = {
            'homework.txt': 'Homework',
            'tools.txt': 'Tools',
            'notice.txt': 'Notice',
            'index.html': 'Homepage',
            'online.html': 'Web Version'
        };
        
        const SUPPORTED_FILES = Object.keys(FILE_DISPLAY_NAMES);

        // ---------- å¨å±åé ----------
        let currentFileSha = null;
        let currentToken = '';
        let currentFile = '';
        let isFileLoaded = false;
        let currentPath = '';
        let currentItems = [];
        let fileToDelete = null;

        // ---------- DOM åç´  ----------
        const tokenInput = document.getElementById('tokenInput');
        const loadBtn = document.getElementById('loadBtn');
        const updateBtn = document.getElementById('updateBtn');
        const fileContentArea = document.getElementById('fileContent');
        const statusDiv = document.getElementById('statusMessage');
        const currentFileBadge = document.getElementById('currentFileBadge');
        const fileSelectorSection = document.getElementById('fileSelectorSection');
        const selectedFileDisplay = document.getElementById('selectedFileDisplay');
        const fileButtons = document.querySelectorAll('.file-btn');
        const advancedToggle = document.getElementById('advancedToggle');
        const advancedSection = document.getElementById('advancedSection');
        const closeAdvanced = document.getElementById('closeAdvanced');
        const currentPathDisplay = document.getElementById('currentPath');
        const fileListDiv = document.getElementById('fileList');
        const refreshBtn = document.getElementById('refreshBtn');
        const goRootBtn = document.getElementById('goRootBtn');
        const createFileBtn = document.getElementById('createFileBtn');
        const createFolderBtn = document.getElementById('createFolderBtn');
        const newFileName = document.getElementById('newFileName');
        const deleteModal = document.getElementById('deleteModal');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');
        const deleteMessage = document.getElementById('deleteMessage');
        
        // ä¸ä¼ ç¸å³
        const fileUpload = document.getElementById('fileUpload');
        const uploadStatus = document.getElementById('uploadStatus');

        // ---------- è¾å©å½æ° ----------
        function setStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = 'status';
            if (type === 'success') {
                statusDiv.classList.add('success');
            } else if (type === 'error') {
                statusDiv.classList.add('error');
            }
        }

        // Base64 è§£ç 
        function base64Decode(base64) {
            try {
                base64 = base64.replace(/\n/g, '');
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (e) {
                console.error('Base64 decode error:', e);
                return '';
            }
        }

        // Base64 ç¼ç 
        function base64Encode(str) {
            try {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                return btoa(binary);
            } catch (e) {
                console.error('Base64 encode error:', e);
                return '';
            }
        }

        // æä»¶ä¸ä¼ 
        async function uploadFile(file) {
            if (!currentToken) {
                uploadStatus.textContent = 'Please connect first';
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                const content = e.target.result;
                const encodedContent = base64Encode(content);
                
                const path = currentPath ? `${currentPath}/${file.name}` : file.name;
                
                const body = {
                    message: `Upload ${file.name}`,
                    content: encodedContent,
                    branch: BRANCH
                };

                uploadStatus.textContent = 'Uploading...';

                try {
                    const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    if (!response.ok) {
                        throw new Error('Upload failed');
                    }

                    uploadStatus.textContent = 'Upload successful';
                    if (advancedSection.style.display === 'block') {
                        loadDirectory(currentPath);
                    }
                    
                    setTimeout(() => {
                        uploadStatus.textContent = '';
                    }, 3000);
                    
                } catch (error) {
                    uploadStatus.textContent = 'Upload failed';
                    console.error(error);
                }
            };
            reader.readAsBinaryString(file);
        }

        // ææ½ä¸ä¼ 
        const uploadArea = document.querySelector('.upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#f0f0f0';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file) {
                uploadFile(file);
            }
        });

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                uploadFile(file);
            }
        });

        // ---------- æä»¶éæ©ç¸å³ ----------
        function resetFileButtons() {
            fileButtons.forEach(btn => btn.classList.remove('active'));
        }

        function setCurrentFile(filename) {
            if (!SUPPORTED_FILES.includes(filename)) {
                console.error('Unsupported file:', filename);
                return;
            }
            
            currentFile = filename;
            isFileLoaded = false;
            currentFileSha = null;
            
            currentFileBadge.textContent = filename + ' ' + FILE_DISPLAY_NAMES[filename];
            selectedFileDisplay.innerHTML = `<strong>${filename}</strong> ${FILE_DISPLAY_NAMES[filename]}`;
            
            resetFileButtons();
            fileButtons.forEach(btn => {
                if (btn.dataset.file === filename) {
                    btn.classList.add('active');
                }
            });
            
            fileContentArea.value = '';
            
            if (currentToken) {
                loadSelectedFile();
            }
        }

        // ---------- API è°ç¨ ----------
        async function fetchFromGitHub(path = '', method = 'GET', body = null) {
            let url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
            if (method === 'GET') {
                url += `?ref=${BRANCH}`;
            }
            
            const options = {
                method: method,
                headers: {
                    'Authorization': `Bearer ${currentToken}`,
                    'Accept': 'application/vnd.github+json'
                }
            };
            
            if (body) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
            
            const response = await fetch(url, options);
            
            if (!response.ok && response.status !== 404) {
                const err = await response.json();
                throw new Error(err.message || `HTTP ${response.status}`);
            }
            
            return response;
        }

        async function loadSelectedFile() {
            if (!currentToken || !currentFile) return;

            setStatus('Loading', 'info');
            fileContentArea.disabled = true;
            updateBtn.disabled = true;

            try {
                const response = await fetchFromGitHub(currentFile);
                if (response.status === 404) {
                    setStatus('File not found', 'info');
                    fileContentArea.value = '';
                    fileContentArea.disabled = false;
                    updateBtn.disabled = false;
                    currentFileSha = null;
                    isFileLoaded = true;
                    return;
                }
                
                const data = await response.json();
                if (data.type !== 'file') {
                    throw new Error('Not a file');
                }
                
                currentFileSha = data.sha;
                fileContentArea.value = base64Decode(data.content);
                fileContentArea.disabled = false;
                updateBtn.disabled = false;
                isFileLoaded = true;
                setStatus('Loaded', 'success');
            } catch (error) {
                setStatus('Load failed', 'error');
                fileContentArea.value = '';
            }
        }

        // ---------- é«çº§æ¨¡å¼ï¼æµè§ä»åº ----------
        async function loadDirectory(path = '') {
            try {
                fileListDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Loading...</div>';
                const response = await fetchFromGitHub(path);
                
                if (response.status === 404) {
                    fileListDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Path not found</div>';
                    return;
                }
                
                const data = await response.json();
                
                if (!Array.isArray(data)) {
                    fileListDiv.innerHTML = `
                        <div class="file-item file">
                            <span>${data.name}</span>
                            <div class="file-actions">
                                <button class="file-action-btn edit" onclick="window.editFile('${data.path}')">Edit</button>
                                <button class="file-action-btn delete" onclick="window.deleteFile('${data.path}', '${data.sha}')">Delete</button>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                const items = data.sort((a, b) => {
                    if (a.type !== b.type) {
                        return a.type === 'dir' ? -1 : 1;
                    }
                    return a.name.localeCompare(b.name);
                });
                
                currentItems = items;
                
                let html = '';
                for (const item of items) {
                    const itemClass = item.type === 'dir' ? 'folder' : 'file';
                    const actions = item.type === 'file' ? `
                        <div class="file-actions">
                            <button class="file-action-btn edit" onclick="window.editFile('${item.path}')">Edit</button>
                            <button class="file-action-btn delete" onclick="window.deleteFile('${item.path}', '${item.sha}')">Delete</button>
                        </div>
                    ` : `
                        <div class="file-actions">
                            <button class="file-action-btn edit" onclick="window.openFolder('${item.path}')">Open</button>
                        </div>
                    `;
                    
                    html += `
                        <div class="file-item ${itemClass}">
                            <span>${item.name}</span>
                            ${actions}
                        </div>
                    `;
                }
                
                fileListDiv.innerHTML = html || '<div style="padding: 20px; text-align: center;">Empty directory</div>';
                currentPathDisplay.textContent = '/' + path;
                currentPath = path;
                
            } catch (error) {
                fileListDiv.innerHTML = `<div style="padding: 20px; text-align: center; color: #999;">Load failed</div>`;
            }
        }

        // ---------- é«çº§æ¨¡å¼ï¼åå»ºæä»¶/æä»¶å¤¹ ----------
        async function createItem(isFolder = false) {
            const name = newFileName.value.trim();
            if (!name) {
                setStatus('Please enter a name', 'error');
                return;
            }
            
            let path = currentPath ? `${currentPath}/${name}` : name;
            if (isFolder) {
                path += '/.gitkeep';
            }
            
            try {
                const content = isFolder ? '' : ' ';
                const body = {
                    message: `Create ${name}`,
                    content: isFolder ? '' : base64Encode(content),
                    branch: BRANCH
                };
                
                await fetchFromGitHub(path, 'PUT', body);
                setStatus('Created', 'success');
                newFileName.value = '';
                loadDirectory(currentPath);
            } catch (error) {
                setStatus('Create failed', 'error');
            }
        }

        // ---------- é«çº§æ¨¡å¼ï¼å é¤æä»¶ ----------
        async function deleteItem(path, sha) {
            try {
                const body = {
                    message: `Delete ${path}`,
                    sha: sha,
                    branch: BRANCH
                };
                
                await fetchFromGitHub(path, 'DELETE', body);
                setStatus('Deleted', 'success');
                deleteModal.style.display = 'none';
                loadDirectory(currentPath);
            } catch (error) {
                setStatus('Delete failed', 'error');
                deleteModal.style.display = 'none';
            }
        }

        // ---------- æ´é²å¨å±æ¹æ³ ----------
        window.editFile = function(path) {
            advancedToggle.checked = false;
            advancedSection.style.display = 'none';
            fileSelectorSection.style.display = 'block';
            
            const filename = path.split('/').pop();
            if (SUPPORTED_FILES.includes(filename)) {
                setCurrentFile(filename);
            } else {
                currentFile = path;
                currentFileBadge.textContent = path;
                selectedFileDisplay.innerHTML = `<strong>${path}</strong>`;
                loadSelectedFile();
            }
        };

        window.deleteFile = function(path, sha) {
            fileToDelete = { path, sha };
            deleteMessage.textContent = `Delete ${path}?`;
            deleteModal.style.display = 'flex';
        };

        window.openFolder = function(path) {
            loadDirectory(path);
        };

        // ---------- äºä»¶ç»å® ----------
        loadBtn.addEventListener('click', async () => {
            const token = tokenInput.value.trim();
            if (!token) {
                setStatus('Please enter token', 'error');
                return;
            }
            
            loadBtn.disabled = true;
            loadBtn.textContent = 'Verifying';
            
            try {
                const testResponse = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!testResponse.ok) {
                    throw new Error('Invalid token');
                }
                
                currentToken = token;
                setStatus('Connected', 'success');
                
                if (advancedToggle.checked) {
                    advancedSection.style.display = 'block';
                    fileSelectorSection.style.display = 'none';
                    loadDirectory('');
                } else {
                    advancedSection.style.display = 'none';
                    fileSelectorSection.style.display = 'block';
                    setCurrentFile('homework.txt');
                }
            } catch (error) {
                setStatus('Connection failed', 'error');
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = 'Connect';
            }
        });

        advancedToggle.addEventListener('change', function() {
            if (currentToken) {
                if (this.checked) {
                    advancedSection.style.display = 'block';
                    fileSelectorSection.style.display = 'none';
                    loadDirectory('');
                } else {
                    advancedSection.style.display = 'none';
                    fileSelectorSection.style.display = 'block';
                }
            }
        });

        closeAdvanced.addEventListener('click', () => {
            advancedToggle.checked = false;
            advancedSection.style.display = 'none';
            if (currentToken) {
                fileSelectorSection.style.display = 'block';
            }
        });

        refreshBtn.addEventListener('click', () => loadDirectory(currentPath));
        goRootBtn.addEventListener('click', () => loadDirectory(''));
        createFileBtn.addEventListener('click', () => createItem(false));
        createFolderBtn.addEventListener('click', () => createItem(true));

        cancelDelete.addEventListener('click', () => {
            deleteModal.style.display = 'none';
            fileToDelete = null;
        });

        confirmDelete.addEventListener('click', () => {
            if (fileToDelete) {
                deleteItem(fileToDelete.path, fileToDelete.sha);
            }
        });

        fileButtons.forEach(btn => {
            btn.addEventListener('click', () => setCurrentFile(btn.dataset.file));
        });

        tokenInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadBtn.click();
        });

        updateBtn.addEventListener('click', async () => {
            if (!currentToken || !currentFile) return;
            
            const content = fileContentArea.value;
            const encodedContent = base64Encode(content);
            
            const body = {
                message: `Update ${currentFile}`,
                content: encodedContent,
                branch: BRANCH
            };
            
            if (currentFileSha) {
                body.sha = currentFileSha;
            }
            
            updateBtn.disabled = true;
            updateBtn.textContent = 'Saving';
            
            try {
                await fetchFromGitHub(currentFile, 'PUT', body);
                setStatus('Saved', 'success');
            } catch (error) {
                setStatus('Save failed', 'error');
            } finally {
                updateBtn.disabled = false;
                updateBtn.textContent = 'Save';
            }
        });

        // åå§ç¶æ
        setStatus('Enter token to connect', 'info');
    })();
</script>
