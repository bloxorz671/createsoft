        .slider {
            position: absolute;

            bottom: 0;

            transition: .2s;
            border-radius: 22px;

            position: absolute;
            content: "";

            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #1976d2;
        }
        input:checked + .slider:before {

        }

<body>
<div class="container">
    <h1>luckynum.top后台</h1>

    <!-- 新增：数据大屏快捷入口 - 无需令牌即可查看 -->
    <div class="dashboard-section">
        <div class="dashboard-info">
            <div class="dashboard-icon">📊</div>
            <div class="dashboard-text">
                <h3>网站数据大屏</h3>
                <p>查看访问设备、IP归属地、流量来源等详细统计</p>
            </div>
        </div>
        <a href="dashboard.html" class="dashboard-btn" target="_blank">
            <span class="btn-icon">📈</span> 点击查看网页数据
        </a>
    </div>

    <div class="token-section">
        <div class="token-label">GitHub 访问令牌</div>
        <div class="token-input-wrapper">
            <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
            <button class="connect-btn" id="loadBtn">连接</button>
        </div>
        
        <div class="advanced-toggle">
            <label class="toggle-switch">
                <input type="checkbox" id="advancedToggle">
                <span class="slider"></span>
            </label>
            <label for="advancedToggle" class="toggle-label">高级模式</label>
        </div>
    </div>

    <!-- 上传区域 -->
    <div class="upload-section" id="uploadSection">
        <div class="upload-label">📤 上传文件</div>
        <div class="upload-area">
            <input type="file" id="fileUpload">
            <button class="upload-btn" id="uploadBtn">选择文件</button>
            <div class="file-info" id="fileInfo" style="display: none;">
                <div><span class="file-info-label">文件名：</span><span id="fileNameDisplay"></span></div>
                <div><span class="file-info-label">大小：</span><span id="fileSizeDisplay"></span></div>
            </div>
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
                <div class="progress-stats">
                    <span id="progressPercent">0%</span>
                    <span id="progressSpeed"></span>
                </div>
            </div>
            <div class="upload-status" id="uploadStatus"></div>
        </div>
    </div>

    <!-- 文件选择区域 (普通模式) -->
    <div class="file-selector-section" id="fileSelectorSection" style="display: none;">
        <div class="file-selector-label">选择文件</div>
        <div class="file-buttons">
            <button class="file-btn" data-file="homework.txt">初二五班</button>
            <button class="file-btn" data-file="tools.txt">工具</button>
            <button class="file-btn" data-file="notice.txt">公告</button>
            <button class="file-btn" data-file="index.html">主页</button>
            <button class="file-btn" data-file="online.html">网页版</button>
        </div>
        <div class="selected-file-display" id="selectedFileDisplay">未选择文件</div>
    </div>

    <!-- 高级配置区域 -->
    <div class="advanced-section" id="advancedSection" style="display: none;">
        <div class="advanced-header">
            <div class="advanced-title">文件管理器</div>
            <button class="advanced-close" id="closeAdvanced">×</button>
        </div>
        <div class="repo-browser">
            <div class="browser-header">
                <div class="path-display" id="currentPath">/</div>
                <div><button class="advanced-btn" id="refreshBtn">刷新</button></div>
            </div>
            <div id="fileList" class="file-list"></div>
            <div class="new-file-form">
                <input type="text" id="newFileName" placeholder="文件名">
                <button class="advanced-btn primary" id="createFileBtn">新建</button>
            </div>
        </div>
    </div>

    <!-- 编辑器区域 -->
    <div class="editor-header">
        <span class="file-badge" id="currentFileBadge">未选择文件</span>
        <button class="download-current-btn" id="downloadCurrentBtn" style="display: none;">
            ⬇️ 下载
        </button>
    </div>
    <textarea id="fileContent" placeholder="选择文件后编辑" disabled></textarea>

    <div class="action-bar">
        <div id="statusMessage" class="status">等待连接</div>
        <button class="save-btn" id="updateBtn" disabled>保存</button>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>确认删除</h3>
            <p id="deleteMessage"></p>
            <div class="modal-buttons">
                <button class="advanced-btn" id="cancelDelete">取消</button>
                <button class="advanced-btn danger" id="confirmDelete">删除</button>
            </div>
        </div>
    </div>

    <!-- 文件夹删除确认弹窗 -->
    <div class="modal" id="deleteFolderModal">
        <div class="modal-content">
            <h3>确认删除文件夹</h3>
            <p id="deleteFolderMessage"></p>
            <div class="modal-buttons">
                <button class="advanced-btn" id="cancelFolderDelete">取消</button>
                <button class="advanced-btn danger" id="confirmFolderDelete">删除</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const OWNER = 'bloxorz671';
        const REPO = 'createsoft';
        const BRANCH = 'main';
        const MAX_FILE_SIZE = 100 * 1024 * 1024;
        const CHUNK_SIZE = 256 * 1024;

        const FILE_DISPLAY_NAMES = {
            'homework.txt': '初二五班',
            'tools.txt': '工具',
            'notice.txt': '公告',
            'index.html': '主页',
            'online.html': '网页版'
        };
        const SUPPORTED_FILES = Object.keys(FILE_DISPLAY_NAMES);

        let currentToken = '';
        let currentFile = '';
        let currentFileSha = null;
        let currentPath = '';
        let selectedFile = null;
        let fileToDelete = null;
        let folderToDelete = null;

        const tokenInput = document.getElementById('tokenInput');
        const loadBtn = document.getElementById('loadBtn');
        const updateBtn = document.getElementById('updateBtn');
        const fileContent = document.getElementById('fileContent');
        const statusDiv = document.getElementById('statusMessage');
        const currentFileBadge = document.getElementById('currentFileBadge');
        const downloadCurrentBtn = document.getElementById('downloadCurrentBtn');
        const fileSelectorSection = document.getElementById('fileSelectorSection');
        const selectedFileDisplay = document.getElementById('selectedFileDisplay');
        const fileButtons = document.querySelectorAll('.file-btn');
        const advancedToggle = document.getElementById('advancedToggle');
        const advancedSection = document.getElementById('advancedSection');
        const closeAdvanced = document.getElementById('closeAdvanced');
        const currentPathDisplay = document.getElementById('currentPath');
        const fileListDiv = document.getElementById('fileList');
        const refreshBtn = document.getElementById('refreshBtn');
        const createFileBtn = document.getElementById('createFileBtn');
        const newFileName = document.getElementById('newFileName');
        
        const uploadBtn = document.getElementById('uploadBtn');
        const fileUpload = document.getElementById('fileUpload');
        const uploadStatus = document.getElementById('uploadStatus');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const fileSizeDisplay = document.getElementById('fileSizeDisplay');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressSpeed = document.getElementById('progressSpeed');
        
        const deleteModal = document.getElementById('deleteModal');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');
        const deleteMessage = document.getElementById('deleteMessage');
        const deleteFolderModal = document.getElementById('deleteFolderModal');
        const cancelFolderDelete = document.getElementById('cancelFolderDelete');
        const confirmFolderDelete = document.getElementById('confirmFolderDelete');
        const deleteFolderMessage = document.getElementById('deleteFolderMessage');

        function setStatus(msg, type = 'info') {
            statusDiv.textContent = msg;
            statusDiv.className = 'status';
            if (type === 'success') statusDiv.classList.add('success');
            if (type === 'error') statusDiv.classList.add('error');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        downloadCurrentBtn.addEventListener('click', () => {
            if (currentFile && fileContent.value) {
                downloadFile(fileContent.value, currentFile);
                setStatus('下载成功', 'success');
            }
        });

        async function readFileInChunks(file) {
            const chunks = [];
            let offset = 0;
            
            while (offset < file.size) {
                const chunk = file.slice(offset, offset + CHUNK_SIZE);
                const arrayBuffer = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(chunk);
                });
                
                chunks.push(arrayBuffer);
                offset += CHUNK_SIZE;
                
                const progress = (offset / file.size) * 100;
                progressFill.style.width = progress + '%';
                progressPercent.textContent = Math.round(progress) + '%';
                
                await new Promise(r => setTimeout(r, 5));
            }
            
            return chunks;
        }

        function chunksToBase64(chunks) {
            const totalLength = chunks.reduce((acc, chunk) => acc + chunk.byteLength, 0);
            const combined = new Uint8Array(totalLength);
            let offset = 0;
            
            for (const chunk of chunks) {
                combined.set(new Uint8Array(chunk), offset);
                offset += chunk.byteLength;
            }
            
            let binary = '';
            const blockSize = 1024 * 64;
            for (let i = 0; i < combined.length; i += blockSize) {
                const end = Math.min(i + blockSize, combined.length);
                for (let j = i; j < end; j++) {
                    binary += String.fromCharCode(combined[j]);
                }
                if (i % (blockSize * 10) === 0) {
                    setTimeout(() => {}, 0);
                }
            }
            
            return btoa(binary);
        }

        async function uploadFile(file) {
            if (!currentToken) {
                uploadStatus.textContent = '请先连接';
                uploadStatus.className = 'upload-status error';
                return;
            }

            uploadStatus.textContent = '读取文件中...';
            uploadStatus.className = 'upload-status';
            progressContainer.style.display = 'block';
            
            try {
                const chunks = await readFileInChunks(file);
                
                uploadStatus.textContent = '编码文件中...';
                
                const base64 = chunksToBase64(chunks);
                
                chunks.length = 0;
                
                uploadStatus.textContent = '上传中...';
                progressFill.style.width = '95%';
                progressPercent.textContent = '95%';
                
                const path = currentPath ? `${currentPath}/${file.name}` : file.name;
                
                let sha = null;
                try {
                    const checkRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                        headers: { 'Authorization': `Bearer ${currentToken}` }
                    });
                    if (checkRes.ok) {
                        const data = await checkRes.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                const body = {
                    message: `上传 ${file.name}`,
                    content: base64,
                    branch: BRANCH
                };
                if (sha) body.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || '上传失败');
                }

                progressFill.style.width = '100%';
                progressPercent.textContent = '100%';
                uploadStatus.textContent = '上传成功';
                uploadStatus.className = 'upload-status success';
                
                if (advancedToggle.checked) {
                    loadDirectory(currentPath);
                }
                
                setTimeout(resetUpload, 3000);
                
            } catch (error) {
                uploadStatus.textContent = '上传失败: ' + error.message;
                uploadStatus.className = 'upload-status error';
                console.error(error);
                resetUpload();
            }
        }

        function resetUpload() {
            setTimeout(() => {
                progressContainer.style.display = 'none';
                fileInfo.style.display = 'none';
                uploadStatus.textContent = '';
                uploadBtn.disabled = false;
                uploadBtn.textContent = '选择文件';
                selectedFile = null;
                fileUpload.value = '';
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
            }, 3000);
        }

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (file.size > MAX_FILE_SIZE) {
                alert('文件超过100MB限制');
                return;
            }
            
            selectedFile = file;
            fileNameDisplay.textContent = file.name;
            fileSizeDisplay.textContent = formatSize(file.size);
            fileInfo.style.display = 'block';
            uploadBtn.textContent = '开始上传';
            uploadBtn.disabled = false;
        });

        uploadBtn.addEventListener('click', () => {
            if (!currentToken) {
                uploadStatus.textContent = '请先连接';
                uploadStatus.className = 'upload-status error';
                return;
            }
            
            if (!selectedFile) {
                fileUpload.click();
                return;
            }
            
            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中...';
            uploadFile(selectedFile);
        });

        loadBtn.addEventListener('click', async () => {
            const token = tokenInput.value.trim();
            if (!token) {
                setStatus('请输入Token', 'error');
                return;
            }
            
            loadBtn.disabled = true;
            loadBtn.textContent = '验证中';
            
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Token无效');
                
                currentToken = token;
                setStatus('连接成功', 'success');
                
                uploadBtn.disabled = false;
                uploadBtn.textContent = '选择文件';
                
                if (advancedToggle.checked) {
                    advancedSection.style.display = 'block';
                    fileSelectorSection.style.display = 'none';
                    loadDirectory('');
                } else {
                    advancedSection.style.display = 'none';
                    fileSelectorSection.style.display = 'block';
                    setCurrentFile('homework.txt');
                }
            } catch (error) {
                setStatus('连接失败', 'error');
                uploadBtn.disabled = true;
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = '连接';
            }
        });

        function setCurrentFile(filename) {
            if (!SUPPORTED_FILES.includes(filename)) return;
            
            currentFile = filename;
            currentFileBadge.textContent = filename;
            selectedFileDisplay.innerHTML = `<strong>${filename}</strong> ${FILE_DISPLAY_NAMES[filename]}`;
            
            fileButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.file === filename);
            });
            
            fileContent.value = '';
            downloadCurrentBtn.style.display = 'none';
            loadFile();
        }

        async function loadFile() {
            if (!currentToken || !currentFile) return;
            
            fileContent.disabled = true;
            updateBtn.disabled = true;
            
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${currentFile}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                if (res.status === 404) {
                    fileContent.value = '';
                    fileContent.disabled = false;
                    updateBtn.disabled = false;
                    currentFileSha = null;
                    downloadCurrentBtn.style.display = 'none';
                    return;
                }
                
                const data = await res.json();
                currentFileSha = data.sha;
                
                const base64 = data.content.replace(/\n/g, '');
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                fileContent.value = new TextDecoder('utf-8').decode(bytes);
                
                fileContent.disabled = false;
                updateBtn.disabled = false;
                downloadCurrentBtn.style.display = 'inline-block';
                setStatus('加载成功', 'success');
            } catch (error) {
                setStatus('加载失败', 'error');
                fileContent.value = '';
                downloadCurrentBtn.style.display = 'none';
            }
        }

        updateBtn.addEventListener('click', async () => {
            if (!currentToken || !currentFile) return;
            
            const content = fileContent.value;
            const bytes = new TextEncoder().encode(content);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            
            const body = {
                message: `更新 ${currentFile}`,
                content: btoa(binary),
                branch: BRANCH
            };
            if (currentFileSha) body.sha = currentFileSha;
            
            updateBtn.disabled = true;
            updateBtn.textContent = '保存中';
            
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${currentFile}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (!res.ok) throw new Error('保存失败');
                
                const data = await res.json();
                currentFileSha = data.content.sha;
                setStatus('保存成功', 'success');
            } catch (error) {
                setStatus('保存失败', 'error');
            } finally {
                updateBtn.disabled = false;
                updateBtn.textContent = '保存';
            }
        });

        async function loadDirectory(path = '') {
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                if (!res.ok) throw new Error('加载失败');
                
                const items = await res.json();
                
                if (!Array.isArray(items)) {
                    fileListDiv.innerHTML = `
                        <div class="file-item file">
                            <span>${items.name}</span>
                            <div class="file-actions">
                                <button class="file-action-btn edit" onclick="window.editFile('${items.path}')">编辑</button>
                                <button class="file-action-btn download" onclick="window.downloadFileItem('${items.path}', '${items.sha}')">下载</button>
                                <button class="file-action-btn delete" onclick="window.deleteFile('${items.path}', '${items.sha}')">删除</button>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                for (const item of items) {
                    const itemClass = item.type === 'dir' ? 'folder' : 'file';
                    
                    if (item.type === 'dir') {
                        html += `
                            <div class="file-item ${itemClass}">
                                <span>${item.name}</span>
                                <div class="file-actions">
                                    <button class="file-action-btn edit" onclick="window.openFolder('${item.path}')">打开</button>
                                    <button class="file-action-btn delete" onclick="window.deleteFolder('${item.path}', '${item.sha}')">删除</button>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="file-item ${itemClass}">
                                <span>${item.name}</span>
                                <div class="file-actions">
                                    <button class="file-action-btn edit" onclick="window.editFile('${item.path}')">编辑</button>
                                    <button class="file-action-btn download" onclick="window.downloadFileItem('${item.path}', '${item.sha}')">下载</button>
                                    <button class="file-action-btn delete" onclick="window.deleteFile('${item.path}', '${item.sha}')">删除</button>
                                </div>
                            </div>
                        `;
                    }
                }
                fileListDiv.innerHTML = html;
                currentPathDisplay.textContent = '/' + path;
                currentPath = path;
                
            } catch (error) {
                fileListDiv.innerHTML = '加载失败';
            }
        }

        window.downloadFileItem = async function(path, sha) {
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                
                const base64 = data.content.replace(/\n/g, '');
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                const content = new TextDecoder('utf-8').decode(bytes);
                
                downloadFile(content, data.name);
                setStatus('下载成功', 'success');
            } catch (error) {
                setStatus('下载失败', 'error');
            }
        };

        window.editFile = function(path) {
            const filename = path.split('/').pop();
            if (SUPPORTED_FILES.includes(filename)) {
                advancedToggle.checked = false;
                advancedSection.style.display = 'none';
                fileSelectorSection.style.display = 'block';
                setCurrentFile(filename);
            } else {
                currentFile = path;
                currentFileBadge.textContent = path;
                selectedFileDisplay.innerHTML = `<strong>${path}</strong>`;
                loadFile();
            }
        };

        window.deleteFile = function(path, sha) {
            fileToDelete = { path, sha };
            deleteMessage.textContent = `确定要删除文件 "${path}" 吗？`;
            deleteModal.style.display = 'flex';
        };

        window.deleteFolder = function(path, sha) {
            folderToDelete = { path, sha };
            deleteFolderMessage.textContent = `确定要删除文件夹 "${path}" 吗？\n这将删除其中所有内容！`;
            deleteFolderModal.style.display = 'flex';
        };

        window.openFolder = function(path) {
            loadDirectory(path);
        };

        cancelDelete.addEventListener('click', () => {
            deleteModal.style.display = 'none';
            fileToDelete = null;
        });

        confirmDelete.addEventListener('click', async () => {
            if (!fileToDelete) return;
            
            try {
                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${fileToDelete.path}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `删除 ${fileToDelete.path}`,
                        sha: fileToDelete.sha,
                        branch: BRANCH
                    })
                });
                deleteModal.style.display = 'none';
                loadDirectory(currentPath);
                setStatus('删除成功', 'success');
            } catch (error) {
                setStatus('删除失败', 'error');
            }
        });

        cancelFolderDelete.addEventListener('click', () => {
            deleteFolderModal.style.display = 'none';
            folderToDelete = null;
        });

        confirmFolderDelete.addEventListener('click', async () => {
            if (!folderToDelete) return;
            
            try {
                async function deleteFolderRecursive(path) {
                    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                        headers: { 'Authorization': `Bearer ${currentToken}` }
                    });
                    const items = await res.json();
                    
                    if (Array.isArray(items)) {
                        for (const item of items) {
                            if (item.type === 'file') {
                                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${item.path}`, {
                                    method: 'DELETE',
                                    headers: {
                                        'Authorization': `Bearer ${currentToken}`,
                                        'Content-Type': 'application/json'
                                    },
                                    body: JSON.stringify({
                                        message: `删除 ${item.path}`,
                                        sha: item.sha,
                                        branch: BRANCH
                                    })
                                });
                            } else {
                                await deleteFolderRecursive(item.path);
                            }
                        }
                    }
                }
                
                await deleteFolderRecursive(folderToDelete.path);
                
                deleteFolderModal.style.display = 'none';
                loadDirectory(currentPath);
                setStatus('文件夹删除成功', 'success');
            } catch (error) {
                setStatus('删除失败', 'error');
            }
        });

        advancedToggle.addEventListener('change', function() {
            if (currentToken) {
                if (this.checked) {
                    advancedSection.style.display = 'block';
                    fileSelectorSection.style.display = 'none';
                    loadDirectory('');
                } else {
                    advancedSection.style.display = 'none';
                    fileSelectorSection.style.display = 'block';
                }
            }
        });

        closeAdvanced.addEventListener('click', () => {
            advancedToggle.checked = false;
            advancedSection.style.display = 'none';
            fileSelectorSection.style.display = 'block';
        });

        refreshBtn.addEventListener('click', () => loadDirectory(currentPath));
        
        createFileBtn.addEventListener('click', async () => {
            const name = newFileName.value.trim();
            if (!name) return;
            
            try {
                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${name}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `创建 ${name}`,
                        content: btoa(' '),
                        branch: BRANCH
                    })
                });
                newFileName.value = '';
                loadDirectory(currentPath);
                setStatus('创建成功', 'success');
            } catch (error) {
                setStatus('创建失败', 'error');
            }
        });

        fileButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setCurrentFile(btn.dataset.file);
            });
        });

        uploadBtn.disabled = true;
        setStatus('输入 Token 后连接', 'info');
    })();
</script>
</body>
</html>
