<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luckynum.top后台</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #f5f5f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 24px;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            color: #333;
            font-weight: 500;
        }
        
        .token-section {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .token-label {
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .token-input-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        #tokenInput {
            flex: 1;
            min-width: 250px;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            font-family: monospace;
        }
        #tokenInput:focus {
            outline: none;
            border-color: #1976d2;
        }
        .advanced-toggle {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .2s;
            border-radius: 22px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #1976d2;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .toggle-label {
            font-size: 14px;
            color: #555;
            cursor: pointer;
        }
        .file-selector-section {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .file-selector-label {
            font-weight: 500;
            color: #555;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .file-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .file-btn {
            background: white;
            border: 1px solid #ddd;
            color: #333;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 auto;
            min-width: 120px;
        }
        .file-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }
        .file-btn.active {
            background: #e6e6e6;
            border-color: #1976d2;
            color: #1976d2;
            font-weight: 500;
        }
        .selected-file-display {
            margin-top: 8px;
            padding: 8px 12px;
            background: white;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
            border: 1px solid #eee;
            display: inline-block;
        }
        .selected-file-display strong {
            color: #1976d2;
            font-family: monospace;
        }
        
        .advanced-section {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .advanced-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .advanced-title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
        }
        .advanced-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
            padding: 0 8px;
        }
        .advanced-close:hover {
            color: #666;
        }
        .repo-browser {
            background: white;
            border-radius: 4px;
            border: 1px solid #eee;
            overflow: hidden;
        }
        .browser-header {
            background: #f9f9f9;
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .path-display {
            flex: 1;
            background: white;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #eee;
            font-family: monospace;
            font-size: 13px;
            color: #333;
        }
        .browser-toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .advanced-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            transition: 0.2s;
        }
        .advanced-btn:hover {
            background: #f5f5f5;
            border-color: #999;
        }
        .advanced-btn.primary {
            background: #1976d2;
            border-color: #1976d2;
            color: white;
        }
        .advanced-btn.primary:hover {
            background: #1565c0;
        }
        .advanced-btn.danger {
            background: #d32f2f;
            border-color: #d32f2f;
            color: white;
        }
        .advanced-btn.danger:hover {
            background: #b71c1c;
        }
        .advanced-btn.success {
            background: #2e7d32;
            border-color: #2e7d32;
            color: white;
        }
        .advanced-btn.success:hover {
            background: #1b5e20;
        }
        .advanced-btn.warning {
            background: #f57c00;
            border-color: #f57c00;
            color: white;
        }
        .advanced-btn.warning:hover {
            background: #e65100;
        }
        .file-list {
            max-height: 400px;
            overflow-y: auto;
            padding: 8px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
        }
        .file-item:hover {
            background: #f9f9f9;
        }
        .file-item.folder {
            color: #1976d2;
            font-weight: 500;
        }
        .file-item.folder:before {
            content: "📁 ";
            opacity: 0.8;
        }
        .file-item.file:before {
            content: "📄 ";
            opacity: 0.8;
        }
        .file-item.selected {
            background: #e3f2fd;
            border-left: 3px solid #1976d2;
        }
        .file-item .checkbox {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #1976d2;
        }
        .file-item .item-name {
            flex: 1;
        }
        .file-actions {
            display: flex;
            gap: 8px;
        }
        .file-action-btn {
            background: none;
            border: 1px solid transparent;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            border-radius: 16px;
            color: #666;
            transition: all 0.2s;
        }
        .file-action-btn.edit {
            color: #1976d2;
        }
        .file-action-btn.edit:hover {
            background: #e3f2fd;
            border-color: #bbdefb;
        }
        .file-action-btn.rename {
            color: #f57c00;
        }
        .file-action-btn.rename:hover {
            background: #fff3e0;
            border-color: #ffcc80;
        }
        .file-action-btn.delete {
            color: #d32f2f;
        }
        .file-action-btn.delete:hover {
            background: #ffebee;
            border-color: #ffcdd2;
        }
        .file-action-btn.download {
            color: #2e7d32;
        }
        .file-action-btn.download:hover {
            background: #e8f5e9;
            border-color: #a5d6a7;
        }
        .batch-actions {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #fff8e1;
            border-bottom: 1px solid #ffe082;
            align-items: center;
            flex-wrap: wrap;
        }
        .batch-actions .count {
            font-size: 13px;
            color: #e65100;
            font-weight: 500;
        }
        .select-all-btn {
            font-size: 12px;
            cursor: pointer;
            color: #1976d2;
            background: none;
            border: none;
            text-decoration: underline;
        }
        .new-file-form {
            padding: 12px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        #newFileName {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        #newFileName:focus {
            outline: none;
            border-color: #1976d2;
        }
        .new-file-form select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            background: white;
        }
        
        .upload-section {
            background: #fafafa;
            border: 2px dashed #1976d2;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .upload-section.dragover {
            background: #e3f2fd;
            border-color: #0d47a1;
        }
        .upload-label {
            font-weight: 600;
            color: #1976d2;
            margin-bottom: 16px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #fileUpload {
            display: none;
        }
        .upload-btn {
            background: #1976d2;
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(25,118,210,0.3);
        }
        .upload-btn:hover {
            background: #1565c0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(25,118,210,0.4);
        }
        .upload-btn:disabled {
            background: #ccc;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }
        .upload-hint {
            font-size: 14px;
            color: #666;
        }
        .file-info {
            background: white;
            border-radius: 8px;
            padding: 16px;
            width: 100%;
            border: 1px solid #e0e0e0;
            margin-top: 8px;
        }
        .file-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .file-info-label {
            color: #666;
        }
        .file-info-value {
            font-weight: 500;
            color: #1976d2;
            font-family: monospace;
            font-size: 13px;
        }
        .progress-container {
            width: 100%;
            margin-top: 16px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #1976d2, #64b5f6);
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 13px;
            color: #666;
        }
        .upload-status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        .upload-status.success {
            background: #edf7ed;
            color: #1e4620;
        }
        .upload-status.error {
            background: #fdeded;
            color: #d32f2f;
        }
        .upload-status.warning {
            background: #fff4e5;
            color: #e65100;
        }
        
        .editor-header {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-badge {
            background: #f0f0f0;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 14px;
            font-family: monospace;
            border: 1px solid #ddd;
            display: inline-block;
            color: #333;
        }
        .download-current-btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .download-current-btn:hover {
            background: #1b5e20;
        }
        .download-current-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        textarea {
            width: 100%;
            padding: 16px;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fafafa;
            resize: vertical;
            white-space: pre;
            overflow-x: auto;
            min-height: 300px;
        }
        textarea:focus {
            outline: none;
            border-color: #1976d2;
            background: white;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 8px 0;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            flex: 1;
            margin-right: 15px;
            background: #f5f5f5;
            color: #666;
            border: 1px solid #eee;
        }
        .status.success {
            background: #edf7ed;
            color: #1e4620;
            border-color: #b6e0b6;
        }
        .status.error {
            background: #fdeded;
            color: #5f2120;
            border-color: #f5c6c6;
        }
        .save-btn {
            background: #1976d2;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #1565c0;
            height: 38px;
            min-width: 70px;
        }
        .save-btn:hover {
            background: #1565c0;
        }
        .save-btn:disabled {
            background: #ccc;
            border-color: #bbb;
            cursor: not-allowed;
        }
        .connect-btn {
            background: #1976d2;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #1565c0;
            height: 38px;
        }
        .connect-btn:hover {
            background: #1565c0;
        }
        .connect-btn:disabled {
            background: #ccc;
            border-color: #bbb;
            cursor: not-allowed;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #999;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 16px;
        }
        .footer-note code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            color: #666;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-content h3 {
            margin: 0 0 12px 0;
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }
        .modal-content p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-content .warning-text {
            color: #d32f2f;
            font-weight: 500;
        }
        .modal-content input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 16px;
            font-family: monospace;
        }
        .modal-content input:focus {
            outline: none;
            border-color: #1976d2;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .small-text {
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>luckynum.top后台</h1>

    <div class="token-section">
        <div class="token-label">GitHub 访问令牌</div>
        <div class="token-input-wrapper">
            <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
            <button class="connect-btn" id="loadBtn">连接</button>
        </div>
        
        <div class="advanced-toggle">
            <label class="toggle-switch">
                <input type="checkbox" id="advancedToggle">
                <span class="slider"></span>
            </label>
            <label for="advancedToggle" class="toggle-label">高级模式</label>
        </div>
    </div>

    <!-- 上传区域 -->
    <div class="upload-section" id="uploadSection">
        <div class="upload-label">📤 上传文件（支持多选）</div>
        <div class="upload-area">
            <input type="file" id="fileUpload" multiple>
            <button class="upload-btn" id="uploadBtn">选择文件（可多选）</button>
            <div class="file-info" id="fileInfo" style="display: none;"></div>
            <div class="progress-container" id="progressContainer" style="display: none;">
                <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
                <div class="progress-stats">
                    <span id="progressPercent">0%</span>
                    <span id="progressSpeed"></span>
                </div>
            </div>
            <div class="upload-status" id="uploadStatus"></div>
        </div>
    </div>

    <!-- 文件选择区域 (普通模式) -->
    <div class="file-selector-section" id="fileSelectorSection" style="display: none;">
        <div class="file-selector-label">选择文件</div>
        <div class="file-buttons">
            <button class="file-btn" data-file="homework.txt">初二五班</button>
            <button class="file-btn" data-file="tools.txt">工具</button>
            <button class="file-btn" data-file="notice.txt">公告</button>
            <button class="file-btn" data-file="index.html">主页</button>
            <button class="file-btn" data-file="online.html">网页版</button>
        </div>
        <div class="selected-file-display" id="selectedFileDisplay">未选择文件</div>
    </div>

    <!-- 高级配置区域 -->
    <div class="advanced-section" id="advancedSection" style="display: none;">
        <div class="advanced-header">
            <div class="advanced-title">文件管理器</div>
            <button class="advanced-close" id="closeAdvanced">×</button>
        </div>
        <div class="repo-browser">
            <div class="browser-header">
                <div class="path-display" id="currentPath">/</div>
                <div><button class="advanced-btn" id="refreshBtn">刷新</button></div>
            </div>
            <div class="batch-actions" id="batchActions" style="display: none;">
                <span class="count" id="batchCount">已选 0 项</span>
                <button class="select-all-btn" id="selectAllBtn">全选</button>
                <button class="select-all-btn" id="deselectAllBtn">取消全选</button>
                <button class="advanced-btn danger" id="batchDeleteBtn">🗑 删除选中</button>
            </div>
            <div id="fileList" class="file-list"></div>
            <div class="new-file-form">
                <input type="text" id="newFileName" placeholder="新建文件/文件夹名">
                <select id="newItemType">
                    <option value="file">文件</option>
                    <option value="folder">文件夹</option>
                </select>
                <button class="advanced-btn primary" id="createFileBtn">新建</button>
            </div>
        </div>
    </div>

    <!-- 编辑器区域 -->
    <div class="editor-header">
        <span class="file-badge" id="currentFileBadge">未选择文件</span>
        <button class="download-current-btn" id="downloadCurrentBtn" style="display: none;">
            ⬇️ 下载
        </button>
    </div>
    <textarea id="fileContent" placeholder="选择文件后编辑" disabled></textarea>

    <div class="action-bar">
        <div id="statusMessage" class="status">等待连接</div>
        <button class="save-btn" id="updateBtn" disabled>保存</button>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>确认删除</h3>
            <p id="deleteMessage"></p>
            <div class="modal-buttons">
                <button class="advanced-btn" id="cancelDelete">取消</button>
                <button class="advanced-btn danger" id="confirmDelete">删除</button>
            </div>
        </div>
    </div>

    <!-- 批量删除确认弹窗 -->
    <div class="modal" id="batchDeleteModal">
        <div class="modal-content">
            <h3>确认批量删除</h3>
            <p id="batchDeleteMessage"></p>
            <div class="modal-buttons">
                <button class="advanced-btn" id="cancelBatchDelete">取消</button>
                <button class="advanced-btn danger" id="confirmBatchDelete">删除全部</button>
            </div>
        </div>
    </div>

    <!-- 文件夹删除确认弹窗 -->
    <div class="modal" id="deleteFolderModal">
        <div class="modal-content">

<script>
    (function() {
        const OWNER = 'bloxorz671';
        const REPO = 'createsoft';
        const BRANCH = 'main';
        const MAX_FILE_SIZE = 100 * 1024 * 1024;
        const CHUNK_SIZE = 256 * 1024;

        const FILE_DISPLAY_NAMES = {
            'homework.txt': '初二五班',
            'tools.txt': '工具',
            'notice.txt': '公告',
            'index.html': '主页',
            'online.html': '网页版'
        };
        const SUPPORTED_FILES = Object.keys(FILE_DISPLAY_NAMES);

        let currentToken = '';
        let currentFile = '';
        let currentFileSha = null;
        let currentPath = '';
        let selectedFiles = []; // 改为数组支持多选
        let fileToDelete = null;
        let folderToDelete = null;
        let fileToRename = null;
        let batchDeleteList = [];
        let selectedFileItems = new Set(); // 多选文件集合

        const tokenInput = document.getElementById('tokenInput');
        const loadBtn = document.getElementById('loadBtn');
        const updateBtn = document.getElementById('updateBtn');
        const fileContent = document.getElementById('fileContent');
        const statusDiv = document.getElementById('statusMessage');
        const currentFileBadge = document.getElementById('currentFileBadge');
        const downloadCurrentBtn = document.getElementById('downloadCurrentBtn');
        const fileSelectorSection = document.getElementById('fileSelectorSection');
        const selectedFileDisplay = document.getElementById('selectedFileDisplay');
        const fileButtons = document.querySelectorAll('.file-btn');
        const advancedToggle = document.getElementById('advancedToggle');
        const advancedSection = document.getElementById('advancedSection');
        const closeAdvanced = document.getElementById('closeAdvanced');
        const currentPathDisplay = document.getElementById('currentPath');
        const fileListDiv = document.getElementById('fileList');
        const refreshBtn = document.getElementById('refreshBtn');
        const createFileBtn = document.getElementById('createFileBtn');
        const newFileName = document.getElementById('newFileName');
        const newItemType = document.getElementById('newItemType');
        
        const uploadBtn = document.getElementById('uploadBtn');
        const fileUpload = document.getElementById('fileUpload');
        const uploadStatus = document.getElementById('uploadStatus');
        const fileInfo = document.getElementById('fileInfo');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const progressSpeed = document.getElementById('progressSpeed');
        
        const deleteModal = document.getElementById('deleteModal');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');
        const deleteMessage = document.getElementById('deleteMessage');
        const deleteFolderModal = document.getElementById('deleteFolderModal');
        const cancelFolderDelete = document.getElementById('cancelFolderDelete');
        const confirmFolderDelete = document.getElementById('confirmFolderDelete');
        const deleteFolderMessage = document.getElementById('deleteFolderMessage');
        
        const batchDeleteModal = document.getElementById('batchDeleteModal');
        const cancelBatchDelete = document.getElementById('cancelBatchDelete');
        const confirmBatchDelete = document.getElementById('confirmBatchDelete');
        const batchDeleteMessage = document.getElementById('batchDeleteMessage');
        const batchActions = document.getElementById('batchActions');
        const batchCount = document.getElementById('batchCount');
        const batchDeleteBtn = document.getElementById('batchDeleteBtn');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        
        const renameModal = document.getElementById('renameModal');
        const cancelRename = document.getElementById('cancelRename');
        const confirmRename = document.getElementById('confirmRename');
        const renameMessage = document.getElementById('renameMessage');
        const renameInput = document.getElementById('renameInput');

        function setStatus(msg, type = 'info') {
            statusDiv.textContent = msg;
            statusDiv.className = 'status';
            if (type === 'success') statusDiv.classList.add('success');
            if (type === 'error') statusDiv.classList.add('error');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        downloadCurrentBtn.addEventListener('click', () => {
            if (currentFile && fileContent.value) {
                downloadFile(fileContent.value, currentFile.split('/').pop());
                setStatus('下载成功', 'success');
            }
        });

        async function readFileInChunks(file) {
            const chunks = [];
            let offset = 0;
            
            while (offset < file.size) {
                const chunk = file.slice(offset, offset + CHUNK_SIZE);
                const arrayBuffer = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsArrayBuffer(chunk);
                });
                
                chunks.push(arrayBuffer);
                offset += CHUNK_SIZE;
                
                await new Promise(r => setTimeout(r, 5));
            }
            
            return chunks;
        }

        function chunksToBase64(chunks) {
            const totalLength = chunks.reduce((acc, chunk) => acc + chunk.byteLength, 0);
            const combined = new Uint8Array(totalLength);
            let offset = 0;
            
            for (const chunk of chunks) {
                combined.set(new Uint8Array(chunk), offset);
                offset += chunk.byteLength;
            }
            
            let binary = '';
            const blockSize = 1024 * 64;
            for (let i = 0; i < combined.length; i += blockSize) {
                const end = Math.min(i + blockSize, combined.length);
                for (let j = i; j < end; j++) {
                    binary += String.fromCharCode(combined[j]);
                }
                if (i % (blockSize * 10) === 0) {
                    setTimeout(() => {}, 0);
                }
            }
            
            return btoa(binary);
        }

        async function uploadSingleFile(file, fileIndex, totalFiles) {
            const chunks = await readFileInChunks(file);
            const base64 = chunksToBase64(chunks);
            chunks.length = 0;
            
            const path = currentPath ? `${currentPath}/${file.name}` : file.name;
            
            let sha = null;
            try {
                const checkRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                if (checkRes.ok) {
                    const data = await checkRes.json();
                    sha = data.sha;
                }
            } catch (e) {}

            const body = {
                message: `上传 ${file.name}`,
                content: base64,
                branch: BRANCH
            };
            if (sha) body.sha = sha;

            const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${currentToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.message || '上传失败');
            }

            return { name: file.name, success: true };
        }

        async function uploadFiles(files) {
            if (!currentToken) {
                uploadStatus.textContent = '请先连接';
                uploadStatus.className = 'upload-status error';
                return;
            }

            let successCount = 0;
            let failCount = 0;
            const failList = [];

            progressContainer.style.display = 'block';
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                const fileProgress = Math.round((i / files.length) * 100);
                progressFill.style.width = fileProgress + '%';
                progressPercent.textContent = fileProgress + '% (' + (i + 1) + '/' + files.length + ')';
                
                uploadStatus.textContent = '上传中: ' + file.name;
                uploadStatus.className = 'upload-status';
                
                try {
                    await uploadSingleFile(file, i, files.length);
                    successCount++;
                } catch (error) {
                    failCount++;
                    failList.push(file.name);
                    console.error(file.name, error);
                }
                
                await new Promise(r => setTimeout(r, 100));
            }

            progressFill.style.width = '100%';
            progressPercent.textContent = '100%';
            
            if (failCount === 0) {
                uploadStatus.textContent = `全部上传成功！共 ${successCount} 个文件`;
                uploadStatus.className = 'upload-status success';
            } else {
                uploadStatus.textContent = `上传完成：${successCount} 成功，${failCount} 失败 (${failList.join(', ')})`;
                uploadStatus.className = 'upload-status warning';
            }
            
            if (advancedToggle.checked) {
                loadDirectory(currentPath);
            }
            
            resetUpload();
        }

        function resetUpload() {
            setTimeout(() => {
                progressContainer.style.display = 'none';
                fileInfo.style.display = 'none';
                uploadStatus.textContent = '';
                uploadBtn.disabled = false;
                uploadBtn.textContent = '选择文件（可多选）';
                selectedFiles = [];
                fileUpload.value = '';
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
            }, 5000);
        }

        fileUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            
            const oversizedFiles = files.filter(f => f.size > MAX_FILE_SIZE);
            if (oversizedFiles.length > 0) {
                alert('以下文件超过100MB限制：\n' + oversizedFiles.map(f => f.name).join('\n'));
                return;
            }
            
            selectedFiles = files;
            
            let infoHtml = '<div style="font-weight: 500; margin-bottom: 8px; color: #333;">已选择 ' + files.length + ' 个文件：</div>';
            let totalSize = 0;
            files.forEach(f => {
                infoHtml += `<div class="file-info-item"><span class="file-info-label">${f.name}</span><span class="file-info-value">${formatSize(f.size)}</span></div>`;
                totalSize += f.size;
            });
            infoHtml += `<div class="file-info-item" style="font-weight: 600; border-top: 2px solid #e0e0e0; padding-top: 8px; margin-top: 4px;"><span class="file-info-label">总计</span><span class="file-info-value">${files.length} 个文件 / ${formatSize(totalSize)}</span></div>`;
            
            fileInfo.innerHTML = infoHtml;
            fileInfo.style.display = 'block';
            uploadBtn.textContent = '开始上传 (' + files.length + ' 个文件)';
            uploadBtn.disabled = false;
        });

        uploadBtn.addEventListener('click', () => {
            if (!currentToken) {
                uploadStatus.textContent = '请先连接';
                uploadStatus.className = 'upload-status error';
                return;
            }
            
            if (selectedFiles.length === 0) {
                fileUpload.click();
                return;
            }
            
            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中...';
            uploadFiles(selectedFiles);
        });

        loadBtn.addEventListener('click', async () => {
            const token = tokenInput.value.trim();
            if (!token) {
                setStatus('请输入Token', 'error');
                return;
            }
            
            loadBtn.disabled = true;
            loadBtn.textContent = '验证中';
            
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Token无效');
                
                currentToken = token;
                setStatus('连接成功', 'success');
                
                uploadBtn.disabled = false;
                uploadBtn.textContent = '选择文件（可多选）';
                
                if (advancedToggle.checked) {
                    advancedSection.style.display = 'block';
                    fileSelectorSection.style.display = 'none';
                    loadDirectory('');
                } else {
                    advancedSection.style.display = 'none';
                    fileSelectorSection.style.display = 'block';
                    setCurrentFile('homework.txt');
                }
            } catch (error) {
                setStatus('连接失败', 'error');
                uploadBtn.disabled = true;
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = '连接';
            }
        });

        function setCurrentFile(filename) {
            if (!SUPPORTED_FILES.includes(filename)) return;
            
            currentFile = filename;
            currentFileBadge.textContent = filename;
            selectedFileDisplay.innerHTML = `<strong>${filename}</strong> ${FILE_DISPLAY_NAMES[filename]}`;
            
            fileButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.file === filename);
            });
            
            fileContent.value = '';
            downloadCurrentBtn.style.display = 'none';
            loadFile();
        }

        async function loadFile() {
            if (!currentToken || !currentFile) return;
            
            fileContent.disabled = true;
            updateBtn.disabled = true;
            
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${currentFile}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                if (res.status === 404) {
                    fileContent.value = '';
                    fileContent.disabled = false;
                    updateBtn.disabled = false;
                    currentFileSha = null;
                    downloadCurrentBtn.style.display = 'none';
                    return;
                }
                
                const data = await res.json();
                currentFileSha = data.sha;
                
                const base64 = data.content.replace(/\n/g, '');
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                fileContent.value = new TextDecoder('utf-8').decode(bytes);
                
                fileContent.disabled = false;
                updateBtn.disabled = false;
                downloadCurrentBtn.style.display = 'inline-block';
                setStatus('加载成功', 'success');
            } catch (error) {
                setStatus('加载失败', 'error');
                fileContent.value = '';
                downloadCurrentBtn.style.display = 'none';
            }
        }

        updateBtn.addEventListener('click', async () => {
            if (!currentToken || !currentFile) return;
            
            const content = fileContent.value;
            const bytes = new TextEncoder().encode(content);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            
            const body = {
                message: `更新 ${currentFile}`,
                content: btoa(binary),
                branch: BRANCH
            };
            if (currentFileSha) body.sha = currentFileSha;
            
            updateBtn.disabled = true;
            updateBtn.textContent = '保存中';
            
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${currentFile}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (!res.ok) throw new Error('保存失败');
                
                const data = await res.json();
                currentFileSha = data.content.sha;
                setStatus('保存成功', 'success');
            } catch (error) {
                setStatus('保存失败', 'error');
            } finally {
                updateBtn.disabled = false;
                updateBtn.textContent = '保存';
            }
        });

        async function loadDirectory(path = '') {
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                if (!res.ok) throw new Error('加载失败');
                
                const items = await res.json();
                
                if (!Array.isArray(items)) {
                    // 单个文件
                    fileListDiv.innerHTML = `
                        <div class="file-item file">
                            <span class="item-name">${items.name}</span>
                            <div class="file-actions">
                                <button class="file-action-btn rename" onclick="window.renameItem('${items.path}')">重命名</button>
                                <button class="file-action-btn edit" onclick="window.editFile('${items.path}')">编辑</button>
                                <button class="file-action-btn download" onclick="window.downloadFileItem('${items.path}')">下载</button>
                                <button class="file-action-btn delete" onclick="window.deleteFile('${items.path}', '${items.sha}')">删除</button>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                selectedFileItems.clear();
                updateBatchUI();
                
                let html = '';
                for (const item of items) {
                    const itemClass = item.type === 'dir' ? 'folder' : 'file';
                    
                    if (item.type === 'dir') {
                        html += `
                            <div class="file-item ${itemClass}" data-path="${item.path}" data-type="dir">
                                <input type="checkbox" class="checkbox" data-path="${item.path}" data-type="dir" onclick="event.stopPropagation(); toggleSelect('${item.path}', 'dir')">
                                <span class="item-name" onclick="window.openFolder('${item.path}')">${item.name}</span>
                                <div class="file-actions">
                                    <button class="file-action-btn rename" onclick="event.stopPropagation(); window.renameItem('${item.path}')">重命名</button>
                                    <button class="file-action-btn edit" onclick="event.stopPropagation(); window.openFolder('${item.path}')">打开</button>
                                    <button class="file-action-btn delete" onclick="event.stopPropagation(); window.deleteFolder('${item.path}', '${item.sha}')">删除</button>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="file-item ${itemClass}" data-path="${item.path}" data-type="file">
                                <input type="checkbox" class="checkbox" data-path="${item.path}" data-type="file" onclick="event.stopPropagation(); toggleSelect('${item.path}', 'file')">
                                <span class="item-name">${item.name}</span>
                                <div class="file-actions">
                                    <button class="file-action-btn rename" onclick="event.stopPropagation(); window.renameItem('${item.path}')">重命名</button>
                                    <button class="file-action-btn edit" onclick="event.stopPropagation(); window.editFile('${item.path}')">编辑</button>
                                    <button class="file-action-btn download" onclick="event.stopPropagation(); window.downloadFileItem('${item.path}')">下载</button>
                                    <button class="file-action-btn delete" onclick="event.stopPropagation(); window.deleteFile('${item.path}', '${item.sha}')">删除</button>
                                </div>
                            </div>
                        `;
                    }
                }
                fileListDiv.innerHTML = html;
                currentPathDisplay.textContent = '/' + path;
                currentPath = path;
                
            } catch (error) {
                fileListDiv.innerHTML = '加载失败';
            }
        }

        // 多选功能
        function toggleSelect(path, type) {
            if (selectedFileItems.has(path)) {
                selectedFileItems.delete(path);
            } else {
                selectedFileItems.add(path);
            }
            updateBatchUI();
            updateItemSelectionUI();
        }

        function updateItemSelectionUI() {
            document.querySelectorAll('.file-item').forEach(item => {
                const path = item.dataset.path;
                if (path && selectedFileItems.has(path)) {
                    item.classList.add('selected');
                    const cb = item.querySelector('.checkbox');
                    if (cb) cb.checked = true;
                } else {
                    item.classList.remove('selected');
                    const cb = item.querySelector('.checkbox');
                    if (cb) cb.checked = false;
                }
            });
        }

        function updateBatchUI() {
            if (selectedFileItems.size > 0) {
                batchActions.style.display = 'flex';
                batchCount.textContent = '已选 ' + selectedFileItems.size + ' 项';
            } else {
                batchActions.style.display = 'none';
            }
        }

        selectAllBtn.addEventListener('click', () => {
            document.querySelectorAll('.file-item .checkbox').forEach(cb => {
                selectedFileItems.add(cb.dataset.path);
            });
            updateBatchUI();
            updateItemSelectionUI();
        });

        deselectAllBtn.addEventListener('click', () => {
            selectedFileItems.clear();
            updateBatchUI();
            updateItemSelectionUI();
        });

        batchDeleteBtn.addEventListener('click', () => {
            batchDeleteList = Array.from(selectedFileItems).map(path => {
                const cb = document.querySelector(`.checkbox[data-path="${path}"]`);
                return { path, type: cb ? cb.dataset.type : 'file' };
            });
            
            const fileCount = batchDeleteList.filter(i => i.type === 'file').length;
            const folderCount = batchDeleteList.filter(i => i.type === 'dir').length;
            
            let msg = `确定要删除以下 ${batchDeleteList.length} 个项目吗？\n`;
            if (fileCount > 0) msg += `- ${fileCount} 个文件\n`;
            if (folderCount > 0) msg += `- ${folderCount} 个文件夹（将递归删除其中所有内容）\n`;
            msg += '\n此操作不可撤销！';
            
            batchDeleteMessage.textContent = msg;
            batchDeleteModal.style.display = 'flex';
        });

        cancelBatchDelete.addEventListener('click', () => {
            batchDeleteModal.style.display = 'none';
            batchDeleteList = [];
        });

        confirmBatchDelete.addEventListener('click', async () => {
            if (batchDeleteList.length === 0) return;
            
            try {
                for (const item of batchDeleteList) {
                    // 获取最新sha
                    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${item.path}`, {
                        headers: { 'Authorization': `Bearer ${currentToken}` }
                    });
                    const data = await res.json();
                    
                    if (Array.isArray(data)) {
                        // 是文件夹
                        await deleteFolderRecursive(item.path);
                    } else {
                        // 是文件
                        await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${item.path}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${currentToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `删除 ${item.path}`,
                                sha: data.sha,
                                branch: BRANCH
                            })
                        });
                    }
                }
                
                batchDeleteModal.style.display = 'none';
                batchDeleteList = [];
                selectedFileItems.clear();
                updateBatchUI();
                loadDirectory(currentPath);
                setStatus('批量删除成功', 'success');
            } catch (error) {
                setStatus('批量删除失败: ' + error.message, 'error');
            }
        });

        async function deleteFolderRecursive(path) {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                headers: { 'Authorization': `Bearer ${currentToken}` }
            });
            const items = await res.json();
            
            if (Array.isArray(items)) {
                for (const item of items) {
                    if (item.type === 'file') {
                        await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${item.path}`, {
                            method: 'DELETE',
                            headers: {
                                'Authorization': `Bearer ${currentToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `删除 ${item.path}`,
                                sha: item.sha,
                                branch: BRANCH
                            })
                        });
                    } else {
                        await deleteFolderRecursive(item.path);
                    }
                }
            }
        }

        // 重命名功能
        window.renameItem = function(path) {
            fileToRename = path;
            const name = path.split('/').pop();
            renameMessage.textContent = `重命名 "${name}"`;
            renameInput.value = name;
            renameModal.style.display = 'flex';
        };

        cancelRename.addEventListener('click', () => {
            renameModal.style.display = 'none';
            fileToRename = null;
            renameInput.value = '';
        });

        confirmRename.addEventListener('click', async () => {
            if (!fileToRename) return;
            
            const newName = renameInput.value.trim();
            if (!newName) {
                alert('请输入新名称');
                return;
            }
            
            // 构建新路径
            const pathParts = fileToRename.split('/');
            pathParts[pathParts.length - 1] = newName;
            const newPath = pathParts.join('/');
            
            if (newPath === fileToRename) {
                renameModal.style.display = 'none';
                fileToRename = null;
                return;
            }
            
            try {
                // 获取原文件内容
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${fileToRename}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                if (!res.ok) throw new Error('获取文件失败');
                
                const data = await res.json();
                const isDir = Array.isArray(data);
                
                if (isDir) {
                    // 文件夹：创建新文件夹并移动所有内容
                    await moveFolderContents(fileToRename, newPath);
                } else {
                    // 文件：在新路径创建，删除旧路径
                    await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${newPath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `重命名 ${fileToRename} -> ${newPath}`,
                            content: data.content,
                            branch: BRANCH
                        })
                    });
                    
                    // 删除原文件
                    await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${fileToRename}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `删除 ${fileToRename}`,
                            sha: data.sha,
                            branch: BRANCH
                        })
                    });
                }
                
                renameModal.style.display = 'none';
                fileToRename = null;
                renameInput.value = '';
                
                if (advancedToggle.checked) {
                    loadDirectory(currentPath);
                }
                setStatus('重命名成功', 'success');
            } catch (error) {
                setStatus('重命名失败: ' + error.message, 'error');
            }
        });

        async function moveFolderContents(oldPath, newPath) {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${oldPath}`, {
                headers: { 'Authorization': `Bearer ${currentToken}` }
            });
            const items = await res.json();
            
            if (Array.isArray(items)) {
                for (const item of items) {
                    const newItemPath = item.path.replace(oldPath, newPath);
                    
                    if (item.type === 'file') {
                        // 获取文件内容
                        const fileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${item.path}`, {
                            headers: { 'Authorization': `Bearer ${currentToken}` }
                        });
                        const fileData = await fileRes.json();
                        
                        await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${newItemPath}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `Bearer ${currentToken}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `移动 ${item.path} -> ${newItemPath}`,
                                content: fileData.content,
                                branch: BRANCH
                            })
                        });
                    } else {
                        await moveFolderContents(item.path, newItemPath);
                    }
                }
            }
            
            // 删除原文件夹（通过递归删除）
            await deleteFolderRecursive(oldPath);
        }

        // 创建文件/文件夹功能
        createFileBtn.addEventListener('click', async () => {
            const name = newFileName.value.trim();
            if (!name) return;
            
            const type = newItemType.value;
            
            try {
                if (type === 'folder') {
                    // 创建文件夹：通过创建一个 .gitkeep 文件实现
                    const folderPath = currentPath ? `${currentPath}/${name}` : name;
                    const gitkeepPath = `${folderPath}/.gitkeep`;
                    
                    await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${gitkeepPath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `创建文件夹 ${name}`,
                            content: btoa(''),
                            branch: BRANCH
                        })
                    });
                    
                    setStatus('文件夹创建成功', 'success');
                } else {
                    // 创建文件
                    const filePath = currentPath ? `${currentPath}/${name}` : name;
                    
                    await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${filePath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `创建 ${name}`,
                            content: btoa(' '),
                            branch: BRANCH
                        })
                    });
                    
                    setStatus('文件创建成功', 'success');
                }
                
                newFileName.value = '';
                loadDirectory(currentPath);
            } catch (error) {
                setStatus('创建失败: ' + error.message, 'error');
            }
        });

        window.downloadFileItem = async function(path) {
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const data = await res.json();
                
                const base64 = data.content.replace(/\n/g, '');
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                const content = new TextDecoder('utf-8').decode(bytes);
                
                downloadFile(content, data.name);
                setStatus('下载成功', 'success');
            } catch (error) {
                setStatus('下载失败', 'error');
            }
        };

        window.editFile = function(path) {
            const filename = path.split('/').pop();
            if (SUPPORTED_FILES.includes(filename)) {
                advancedToggle.checked = false;
                advancedSection.style.display = 'none';
                fileSelectorSection.style.display = 'block';
                setCurrentFile(filename);
            } else {
                currentFile = path;
                currentFileBadge.textContent = path;
                selectedFileDisplay.innerHTML = `<strong>${path}</strong>`;
                loadFile();
            }
        };

        window.deleteFile = function(path, sha) {
            fileToDelete = { path, sha };
            deleteMessage.textContent = `确定要删除文件 "${path}" 吗？`;
            deleteModal.style.display = 'flex';
        };

        window.deleteFolder = function(path, sha) {
            folderToDelete = { path, sha };
            deleteFolderMessage.textContent = `确定要删除文件夹 "${path}" 吗？\n这将删除其中所有内容！`;
            deleteFolderModal.style.display = 'flex';
        };

        window.openFolder = function(path) {
            loadDirectory(path);
        };

        cancelDelete.addEventListener('click', () => {
            deleteModal.style.display = 'none';
            fileToDelete = null;
        });

        confirmDelete.addEventListener('click', async () => {
            if (!fileToDelete) return;
            
            try {
                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${fileToDelete.path}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `删除 ${fileToDelete.path}`,
                        sha: fileToDelete.sha,
                        branch: BRANCH
                    })
                });
                deleteModal.style.display = 'none';
                loadDirectory(currentPath);
                setStatus('删除成功', 'success');
            } catch (error) {
                setStatus('删除失败', 'error');
            }
        });

        cancelFolderDelete.addEventListener('click', () => {
            deleteFolderModal.style.display = 'none';
            folderToDelete = null;
        });

        confirmFolderDelete.addEventListener('click', async () => {
            if (!folderToDelete) return;
            
            try {
                await deleteFolderRecursive(folderToDelete.path);
                
                deleteFolderModal.style.display = 'none';
                loadDirectory(currentPath);
                setStatus('文件夹删除成功', 'success');
            } catch (error) {
                setStatus('删除失败', 'error');
            }
        });

        advancedToggle.addEventListener('change', function() {
            if (currentToken) {
                if (this.checked) {
                    advancedSection.style.display = 'block';
                    fileSelectorSection.style.display = 'none';
                    loadDirectory('');
                } else {
                    advancedSection.style.display = 'none';
                    fileSelectorSection.style.display = 'block';
                }
            }
        });

        closeAdvanced.addEventListener('click', () => {
            advancedToggle.checked = false;
            advancedSection.style.display = 'none';
            fileSelectorSection.style.display = 'block';
        });

        refreshBtn.addEventListener('click', () => loadDirectory(currentPath));

        fileButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setCurrentFile(btn.dataset.file);
            });
        });

        // 支持拖拽上传
        const uploadSection = document.getElementById('uploadSection');
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            if (files.length > 0) {
                const oversizedFiles = files.filter(f => f.size > MAX_FILE_SIZE);
                if (oversizedFiles.length > 0) {
                    alert('以下文件超过100MB限制：\n' + oversizedFiles.map(f => f.name).join('\n'));
                    return;
                }
                selectedFiles = files;
                
                let infoHtml = '<div style="font-weight: 500; margin-bottom: 8px; color: #333;">已选择 ' + files.length + ' 个文件：</div>';
                let totalSize = 0;
                files.forEach(f => {
                    infoHtml += `<div class="file-info-item"><span class="file-info-label">${f.name}</span><span class="file-info-value">${formatSize(f.size)}</span></div>`;
                    totalSize += f.size;
                });
                infoHtml += `<div class="file-info-item" style="font-weight: 600; border-top: 2px solid #e0e0e0; padding-top: 8px; margin-top: 4px;"><span class="file-info-label">总计</span><span class="file-info-value">${files.length} 个文件 / ${formatSize(totalSize)}</span></div>`;
                
                fileInfo.innerHTML = infoHtml;
                fileInfo.style.display = 'block';
                uploadBtn.textContent = '开始上传 (' + files.length + ' 个文件)';
                uploadBtn.disabled = false;
            }
        });

        uploadBtn.disabled = true;
        setStatus('输入 Token 后连接', 'info');
    })();
</script>
</body>
</html>
