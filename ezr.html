<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>e值日（值日码查询系统）</title>
    <style>
        /* 极端简陋风格: 无圆角, 无阴影, 无渐变, 无复杂装饰 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: 'Courier New', Courier, '微软雅黑', monospace;
            padding: 24px 16px;
            color: #000000;
            line-height: 1.4;
        }

        /* 主容器: 简单边框, 无圆角 */
        .system-container {
            max-width: 700px;
            margin: 0 auto;
            border: 2px solid #000000;
            background: #ffffff;
            padding: 24px 20px 32px 20px;
        }

        /* 标题: 纯粹文字+下划线，取消大写转换 */
        h1 {
            font-size: 26px;
            font-weight: 700;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
            margin-bottom: 28px;
            letter-spacing: 1px;
            text-transform: none;
            font-family: inherit;
        }

        /* 标签区 */
        .input-label {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        /* 输入框: 直角, 传统风格 */
        #studentCode {
            width: 100%;
            padding: 10px 8px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid #000000;
            background: #ffffff;
            border-radius: 0;
            outline: none;
            margin-bottom: 6px;
        }

        /* 下划线蓝体字: 放在输入框下方，查询按钮上方 */
        .rule-link {
            display: inline-block;
            margin-top: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            font-family: inherit;
            color: #0000EE;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .rule-link:hover {
            color: #ff0000;
            text-decoration: underline;
        }

        /* 按钮: 黑底白字, 直角 */
        .query-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 10px 20px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            min-width: 120px;
            margin-top: 0;
            margin-bottom: 10px;
            border-radius: 0;
            transition: none;
        }
        .query-btn:hover {
            background: #222222;
        }
        .query-btn:active {
            background: #444444;
        }

        /* 规则面板 */
        .rule-panel {
            margin-top: 16px;
            border-top: 1px solid #888;
            padding-top: 14px;
            display: none;
        }
        .rule-panel.show {
            display: block;
        }

        /* 学校列表区域 */
        .school-list {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            background: #fefefe;
            padding: 10px;
            max-height: 260px;
            overflow-y: auto;
        }
        .school-item {
            padding: 6px 8px;
            border-bottom: 1px dotted #aaa;
            cursor: pointer;
            font-size: 15px;
            font-family: monospace;
            color: #0000aa;
            text-decoration: underline;
        }
        .school-item:hover {
            background-color: #f0f0f0;
            color: #000000;
        }
        .school-item:last-child {
            border-bottom: none;
        }

        /* 规则详情区域 */
        .rule-detail {
            background: #f8f8f8;
            border-left: 4px solid #000;
            padding: 12px 12px;
            font-size: 14px;
            font-family: monospace;
            margin-top: 10px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .rule-detail strong {
            font-weight: 800;
        }
        .close-detail {
            margin-top: 8px;
            background: none;
            border: 1px solid #333;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
            font-family: monospace;
            border-radius: 0;
        }
        .loading-text, .empty-text {
            font-size: 14px;
            font-family: monospace;
            padding: 6px 0;
            color: #666;
        }
        .error-text {
            font-size: 14px;
            font-family: monospace;
            padding: 6px 0;
            color: #990000;
        }

        /* 警告信息 */
        .warning-msg {
            color: #cc0000;
            font-size: 14px;
            margin: 6px 0 4px 0;
            min-height: 22px;
            font-family: monospace;
        }

        hr {
            display: none;
        }
    </style>
</head>
<body>
<div class="system-container">
    <h1>e值日（值日码查询系统）</h1>

    <div class="input-label">请输入你的码号（不同学校设置的规则不同，请点击下方按钮查询）</div>
    <input type="text" id="studentCode" placeholder="" autocomplete="off" autofocus>
    <div class="warning-msg" id="warningMsg"></div>
    
    <!-- 蓝体字超链接：放在输入框下方，查询按钮上方 -->
    <div>
        <span id="toggleRuleBtn" class="rule-link">查询码号规则</span>
    </div>
    
    <button class="query-btn" id="queryBtn">查询</button>

    <!-- 规则展示面板 -->
    <div id="rulePanel" class="rule-panel">
        <div id="schoolListContainer" class="school-list">
            <div class="loading-text">查找学校中...</div>
        </div>
        <div id="ruleDetailArea" style="display: none;">
            <!-- 动态显示学校规则详情 -->
        </div>
    </div>
</div>

<script>
    (function() {
        // DOM 元素
        const studentInput = document.getElementById('studentCode');
        const queryBtn = document.getElementById('queryBtn');
        const warningDiv = document.getElementById('warningMsg');
        const toggleRuleBtn = document.getElementById('toggleRuleBtn');
        const rulePanel = document.getElementById('rulePanel');
        const schoolListContainer = document.getElementById('schoolListContainer');
        const ruleDetailArea = document.getElementById('ruleDetailArea');

        // 全局数据
        let schoolsData = [];          // [{ name: "学校名", rule: "规则内容" }]
        let isLoading = false;
        let loadError = false;

        // 辅助函数
        function clearWarning() {
            warningDiv.innerText = '';
        }

        function setWarning(msg) {
            warningDiv.innerText = msg;
        }

        // 读取同路径下的 zrrule.txt (UTF-8)
        async function fetchRuleFile() {
            if (schoolsData.length > 0) return true;
            if (isLoading) return false;

            isLoading = true;
            schoolListContainer.innerHTML = '<div class="loading-text">查找学校中...</div>';
            try {
                const url = 'zrrule.txt?_=' + Date.now();
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const text = await response.text();
          
                const lines = text.split(/\r?\n/);
                const parsed = [];
                for (let line of lines) {
                    line = line.trim();
                    if (line === "") continue;
                    
                    const bracketPattern = /^\[([^\]]+)\]\[(.*)\]$/;
                    const match = line.match(bracketPattern);
                    
                    if (match) {
                        let schoolName = match[1].trim();
                        let ruleContent = match[2].trim();
                        if (schoolName !== "") {
                            parsed.push({ name: schoolName, rule: ruleContent || "(无具体规则文本)" });
                        }
                    } else {
                        console.warn(`跳过无效行: ${line}`);
                        continue;
                    }
                }
                
                if (parsed.length === 0) {
                    schoolListContainer.innerHTML = '<div class="empty-text">暂无支持的学校</div>';
                    loadError = true;
                    isLoading = false;
                    return false;
                }
                schoolsData = parsed;
                renderSchoolList();
                isLoading = false;
                return true;
            } catch (err) {
                console.error("读取规则文件失败: ", err);
                schoolListContainer.innerHTML = '<div class="empty-text">暂无支持的学校</div>';
                loadError = true;
                isLoading = false;
                return false;
            }
        }

        function renderSchoolList() {
            if (!schoolListContainer) return;
            if (schoolsData.length === 0) {
                schoolListContainer.innerHTML = '<div class="empty-text">暂无支持的学校</div>';
                return;
            }
            schoolListContainer.innerHTML = '';
            for (let i = 0; i < schoolsData.length; i++) {
                const school = schoolsData[i];
                const divItem = document.createElement('div');
                divItem.className = 'school-item';
                divItem.textContent = school.name;
                divItem.addEventListener('click', (function(idx) {
                    return function() { showRuleDetail(idx); };
                })(i));
                schoolListContainer.appendChild(divItem);
            }
        }

        function showRuleDetail(index) {
            if (!schoolsData[index]) return;
            const school = schoolsData[index];
            const detailHtml = `
                <div class="rule-detail">
                    <strong>${escapeHtml(school.name)}</strong><br>
                    <span style="display:inline-block; margin-top:6px;">${escapeHtml(school.rule)}</span>
                </div>
                <button id="closeDetailBtn" class="close-detail">关闭详情</button>
            `;
            ruleDetailArea.innerHTML = detailHtml;
            ruleDetailArea.style.display = 'block';
            const closeBtn = document.getElementById('closeDetailBtn');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    ruleDetailArea.style.display = 'none';
                    ruleDetailArea.innerHTML = '';
                });
            }
            ruleDetailArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function toggleRulePanel() {
            if (rulePanel.classList.contains('show')) {
                rulePanel.classList.remove('show');
                return;
            }
            rulePanel.classList.add('show');
            
            if (schoolsData.length === 0 && !loadError) {
                fetchRuleFile().catch(e => console.warn);
            } else if (schoolsData.length === 0 && loadError) {
                // 已经尝试加载过但无数据
            } else if (schoolsData.length > 0 && schoolListContainer.children.length === 0) {
                renderSchoolList();
            }
        }

        // ================= 核心：智能识别URL参数并跳转 =================
        function performSmartRedirect(inputCode) {
            if (!inputCode || inputCode.trim() === '') {
                setWarning('码号不能为空');
                return false;
            }
            
            const trimmedCode = inputCode.trim();
            const currentPath = window.location.pathname;
            
            // 无论当前路径是什么，都跳转到 /ezhiri?参数
            // 参数直接传递用户输入的码号
            const targetUrl = `https://luckynum.top/ezhiri?${encodeURIComponent(trimmedCode)}`;
            console.log(`跳转到: ${targetUrl}`);
            window.location.href = targetUrl;
            return true;
        }

        function performQuery() {
            let rawValue = studentInput.value;
            const trimmed = rawValue.trim();
            if (trimmed === '') {
                setWarning('码号不能为空');
                studentInput.focus();
                return;
            }
            clearWarning();
            performSmartRedirect(trimmed);
        }

        // ================= 页面初始化时自动从URL参数获取码号 =================
        function autoGetCodeFromUrl() {
            const currentSearch = window.location.search;
            if (currentSearch && currentSearch.length > 1) {
                // 提取 ? 后面的参数
                let queryValue = currentSearch.substring(1);
                // 解码
                try {
                    queryValue = decodeURIComponent(queryValue);
                } catch(e) {}
                
                if (queryValue) {
                    console.log(`从URL自动获取到码号: ${queryValue}`);
                    // 自动填入输入框
                    studentInput.value = queryValue;
                    // 自动执行查询跳转
                    performSmartRedirect(queryValue);
                    return true;
                }
            }
            return false;
        }

        // 绑定事件
        queryBtn.addEventListener('click', function(e) {
            e.preventDefault();
            performQuery();
        });
        
        studentInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                performQuery();
            }
        });
        
        studentInput.addEventListener('input', function() {
            if (warningDiv.innerText !== '') warningDiv.innerText = '';
        });

        toggleRuleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            toggleRulePanel();
        });

        // 页面加载时：先检查URL参数，如果没有则正常显示界面
        const hasAutoRedirect = autoGetCodeFromUrl();
        if (!hasAutoRedirect) {
            // 静默预加载规则文件
            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (schoolsData.length === 0 && !loadError && !isLoading) {
                        fetchRuleFile().catch(e => console.warn);
                    }
                }, 300);
            });
        }
    })();
</script>
</body>
</html>
