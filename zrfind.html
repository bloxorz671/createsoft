<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>值日码查询系统</title>
    <style>
        /* 极端简陋风格: 无圆角, 无阴影, 无渐变, 无复杂装饰 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: 'Courier New', Courier, '宋体', monospace;
            padding: 24px 16px;
            color: #000000;
            line-height: 1.4;
        }

        /* 主容器: 简单边框, 无圆角 */
        .system-container {
            max-width: 700px;
            margin: 0 auto;
            border: 2px solid #000000;
            background: #ffffff;
            padding: 24px 20px 32px 20px;
        }

        /* 标题: 纯粹文字+下划线 */
        h1 {
            font-size: 26px;
            font-weight: 700;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
            margin-bottom: 28px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: inherit;
        }

        /* 标签区 */
        .input-label {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        /* 输入框: 直角, 传统风格 */
        #studentCode {
            width: 100%;
            padding: 10px 8px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid #000000;
            background: #ffffff;
            border-radius: 0;
            outline: none;
            margin-bottom: 6px;
        }

        /* 下划线蓝体字: 放在输入框下方，查询按钮上方 */
        .rule-link {
            display: inline-block;
            margin-top: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            font-family: inherit;
            color: #0000EE;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .rule-link:hover {
            color: #ff0000;
            text-decoration: underline;
        }

        /* 按钮: 黑底白字, 直角 */
        .query-btn {
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 10px 20px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            min-width: 120px;
            margin-top: 0;
            margin-bottom: 10px;
            border-radius: 0;
            transition: none;
        }
        .query-btn:hover {
            background: #222222;
        }
        .query-btn:active {
            background: #444444;
        }

        /* 规则面板 */
        .rule-panel {
            margin-top: 16px;
            border-top: 1px solid #888;
            padding-top: 14px;
            display: none;
        }
        .rule-panel.show {
            display: block;
        }

        /* 学校列表区域 */
        .school-list {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            background: #fefefe;
            padding: 10px;
            max-height: 260px;
            overflow-y: auto;
        }
        .school-item {
            padding: 6px 8px;
            border-bottom: 1px dotted #aaa;
            cursor: pointer;
            font-size: 15px;
            font-family: monospace;
            color: #0000aa;
            text-decoration: underline;
        }
        .school-item:hover {
            background-color: #f0f0f0;
            color: #000000;
        }
        .school-item:last-child {
            border-bottom: none;
        }

        /* 规则详情区域 */
        .rule-detail {
            background: #f8f8f8;
            border-left: 4px solid #000;
            padding: 12px 12px;
            font-size: 14px;
            font-family: monospace;
            margin-top: 10px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .rule-detail strong {
            font-weight: 800;
        }
        .close-detail {
            margin-top: 8px;
            background: none;
            border: 1px solid #333;
            padding: 4px 12px;
            font-size: 13px;
            cursor: pointer;
            font-family: monospace;
            border-radius: 0;
        }
        .loading-text, .empty-text {
            font-size: 14px;
            font-family: monospace;
            padding: 6px 0;
            color: #666;
        }
        .error-text {
            font-size: 14px;
            font-family: monospace;
            padding: 6px 0;
            color: #990000;
        }

        /* 警告信息 */
        .warning-msg {
            color: #cc0000;
            font-size: 14px;
            margin: 6px 0 4px 0;
            min-height: 22px;
            font-family: monospace;
        }

        hr {
            display: none;
        }
    </style>
</head>
<body>
<div class="system-container">
    <h1>值日码查询系统</h1>

    <div class="input-label">请输入你的学号或码号</div>
    <input type="text" id="studentCode" placeholder="" autocomplete="off" autofocus>
    <div class="warning-msg" id="warningMsg"></div>
    
    <!-- 蓝体字超链接：放在输入框下方，查询按钮上方 -->
    <div>
        <span id="toggleRuleBtn" class="rule-link">查询值日码规则</span>
    </div>
    
    <button class="query-btn" id="queryBtn">查询</button>

    <!-- 规则展示面板 -->
    <div id="rulePanel" class="rule-panel">
        <div id="schoolListContainer" class="school-list">
            <div class="loading-text">加载规则文件中...</div>
        </div>
        <div id="ruleDetailArea" style="display: none;">
            <!-- 动态显示学校规则详情 -->
        </div>
    </div>
</div>
