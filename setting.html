<script>
    (function() {
        const OWNER = 'bloxorz671';
        const REPO = 'createsoft';
        const BRANCH = 'main';
        const ZIP_PATH = 'token.zip';  // ä»token.zipè¯»å
        
        // æä»¶æ¾ç¤ºåç§°æ å°
        const FILE_DISPLAY_NAMES = {
            'homework.txt': 'åäºäºç­',
            'tools.txt': 'å·¥å·',
            'notice.txt': 'å¬å',
            'index.html': 'ä¸»é¡µ',
            'online.html': 'ç½é¡µç'
        };
        
        const SUPPORTED_FILES = Object.keys(FILE_DISPLAY_NAMES);

        // å¨å±åé
        let currentToken = '';
        let currentFile = 'homework.txt';
        let currentFileSha = null;
        let currentPath = '';
        let fileToDelete = null;

        // DOM åç´ 
        const unlockSection = document.getElementById('unlockSection');
        const mainContent = document.getElementById('mainContent');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMessage = document.getElementById('errorMessage');
        const fileContent = document.getElementById('fileContent');
        const updateBtn = document.getElementById('updateBtn');
        const statusMessage = document.getElementById('statusMessage');
        const currentFileBadge = document.getElementById('currentFileBadge');
        const selectedFile = document.getElementById('selectedFile');
        const fileBtns = document.querySelectorAll('.file-btn');
        const advancedToggle = document.getElementById('advancedToggle');
        const advancedMode = document.getElementById('advancedMode');
        const normalMode = document.getElementById('normalMode');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileUpload = document.getElementById('fileUpload');
        const uploadStatus = document.getElementById('uploadStatus');

        // è§£éæé®ç¹å»
        unlockBtn.addEventListener('click', async () => {
            const password = passwordInput.value.trim();
            
            if (!password) {
                errorMessage.textContent = 'è¯·è¾å¥å¯ç ';
                return;
            }

            unlockBtn.disabled = true;
            unlockBtn.textContent = 'éªè¯ä¸­...';
            errorMessage.textContent = '';

            try {
                // ä¸è½½ZIPæä»¶
                const response = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${ZIP_PATH}`);
                if (!response.ok) {
                    throw new Error('token.zip ä¸å­å¨ï¼è¯·ç¡®è®¤å·²ä¸ä¼ ');
                }
                
                const zipData = await response.arrayBuffer();
                
                // ç¨å¯ç è§£å¯ZIP
                const zip = await JSZip.loadAsync(zipData, {
                    password: password
                });
                
                // æ¥æ¾token.txt
                const tokenFile = zip.file('token.txt');
                if (!tokenFile) {
                    throw new Error('ZIPä¸­æ²¡ææ¾å°token.txt');
                }
                
                // è¯»åä»¤ç
                const token = await tokenFile.async('string');
                currentToken = token.trim();
                
                if (!currentToken) {
                    throw new Error('ä»¤çåå®¹ä¸ºç©º');
                }

                // è§£éæå
                unlockSection.style.display = 'none';
                mainContent.style.display = 'block';
                
                // è®¾ç½®å½åæä»¶
                setCurrentFile('homework.txt');
                
                statusMessage.textContent = 'è§£éæå';
                statusMessage.className = 'status success';

            } catch (error) {
                console.error(error);
                if (error.message.includes('password')) {
                    errorMessage.textContent = 'å¯ç éè¯¯';
                } else {
                    errorMessage.textContent = error.message;
                }
                unlockBtn.disabled = false;
                unlockBtn.textContent = 'è§£é';
            }
        });

        // å¯ç è¾å¥æ¡åè½¦
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                unlockBtn.click();
            }
        });

        // è®¾ç½®å½åæä»¶
        function setCurrentFile(filename) {
            if (!SUPPORTED_FILES.includes(filename)) return;
            
            currentFile = filename;
            
            // æ´æ°UI
            fileBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.file === filename);
            });
            
            currentFileBadge.textContent = filename + ' ' + (FILE_DISPLAY_NAMES[filename] || '');
            selectedFile.innerHTML = `å½åéä¸­ï¼<strong>${filename}</strong> ${FILE_DISPLAY_NAMES[filename] || ''}`;
            
            // å è½½æä»¶åå®¹
            loadFileContent();
        }

        // æä»¶æé®ç¹å»
        fileBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setCurrentFile(btn.dataset.file);
            });
        });

        // å è½½æä»¶åå®¹
        async function loadFileContent() {
            if (!currentToken || !currentFile) return;
            
            fileContent.disabled = true;
            updateBtn.disabled = true;
            
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${currentFile}`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Accept': 'application/vnd.github+json'
                    }
                });
                
                if (response.status === 404) {
                    // æä»¶ä¸å­å¨
                    fileContent.value = '';
                    fileContent.disabled = false;
                    updateBtn.disabled = false;
                    currentFileSha = null;
                    statusMessage.textContent = 'æ°æä»¶';
                    statusMessage.className = 'status';
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                // è§£ç åå®¹
                const content = atob(data.content.replace(/\n/g, ''));
                fileContent.value = content;
                currentFileSha = data.sha;
                
                fileContent.disabled = false;
                updateBtn.disabled = false;
                statusMessage.textContent = 'å·²å è½½';
                statusMessage.className = 'status success';
                
            } catch (error) {
                console.error('å è½½å¤±è´¥:', error);
                statusMessage.textContent = 'å è½½å¤±è´¥';
                statusMessage.className = 'status error';
                fileContent.value = '';
            }
        }

        // ä¿å­æä»¶
        updateBtn.addEventListener('click', async () => {
            if (!currentToken || !currentFile) return;
            
            const content = fileContent.value;
            const encoded = btoa(unescape(encodeURIComponent(content)));
            
            const body = {
                message: `æ´æ° ${currentFile}`,
                content: encoded,
                branch: BRANCH
            };
            
            if (currentFileSha) {
                body.sha = currentFileSha;
            }
            
            updateBtn.disabled = true;
            updateBtn.textContent = 'ä¿å­ä¸­';
            
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${currentFile}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github+json'
                    },
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                currentFileSha = data.content.sha;
                
                statusMessage.textContent = 'ä¿å­æå';
                statusMessage.className = 'status success';
                
            } catch (error) {
                console.error('ä¿å­å¤±è´¥:', error);
                statusMessage.textContent = 'ä¿å­å¤±è´¥';
                statusMessage.className = 'status error';
            } finally {
                updateBtn.disabled = false;
                updateBtn.textContent = 'ä¿å­';
            }
        });

        // é«çº§æ¨¡å¼å¼å³
        advancedToggle.addEventListener('change', function() {
            if (this.checked) {
                advancedMode.style.display = 'block';
                normalMode.style.display = 'none';
                loadDirectory('');
            } else {

                normalMode.style.display = 'block';
            }
        });

        // å è½½ç®å½ï¼é«çº§æ¨¡å¼ï¼
        async function loadDirectory(path = '') {
            if (!currentToken) return;
            
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '<div style="padding:20px; text-align:center;">å è½½ä¸­...</div>';
            
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                if (!response.ok) throw new Error();
                
                const items = await response.json();
                
                if (!Array.isArray(items)) {
                    // å¦ææ¯åä¸ªæä»¶
                    fileList.innerHTML = `
                        <div class="file-item file">
                            <span>${items.name}</span>
                            <div class="item-actions">
                                <button class="item-btn edit" onclick="window.editFile('${items.path}')">ç¼è¾</button>
                                <button class="item-btn delete" onclick="window.deleteFile('${items.path}', '${items.sha}')">å é¤</button>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                // æåºï¼æä»¶å¤¹å¨åï¼æä»¶å¨å
                items.sort((a, b) => {
                    if (a.type !== b.type) {
                        return a.type === 'dir' ? -1 : 1;
                    }
                    return a.name.localeCompare(b.name);
                });
                
                let html = '';
                items.forEach(item => {
                    const itemClass = item.type === 'dir' ? 'folder' : 'file';
                    const actions = item.type === 'file' ? `
                        <div class="item-actions">
                            <button class="item-btn edit" onclick="window.editFile('${item.path}')">ç¼è¾</button>
                            <button class="item-btn delete" onclick="window.deleteFile('${item.path}', '${item.sha}')">å é¤</button>
                        </div>
                    ` : `
                        <div class="item-actions">
                            <button class="item-btn edit" onclick="window.openFolder('${item.path}')">æå¼</button>
                        </div>
                    `;
                    
                    html += `
                        <div class="file-item ${itemClass}">
                            <span>${item.name}</span>
                            ${actions}
                        </div>
                    `;
                });
                
                fileList.innerHTML = html || '<div style="padding:20px; text-align:center;">ç©ºç®å½</div>';
                document.getElementById('currentPath').textContent = '/' + path;
                currentPath = path;
                
            } catch (error) {
                fileList.innerHTML = '<div style="padding:20px; text-align:center; color:#d32f2f;">å è½½å¤±è´¥</div>';
            }
        }

        // å¨å±æ¹æ³
        window.editFile = function(path) {
            advancedToggle.checked = false;
            advancedMode.style.display = 'none';
            normalMode.style.display = 'block';
            
            const filename = path.split('/').pop();
            if (SUPPORTED_FILES.includes(filename)) {
                setCurrentFile(filename);
            } else {
                currentFile = path;
                currentFileBadge.textContent = path;
                selectedFile.innerHTML = `<strong>${path}</strong>`;
                loadFileContent();
            }
        };

        window.deleteFile = function(path, sha) {
            fileToDelete = { path, sha };
            document.getElementById('deleteMessage').textContent = `ç¡®å®è¦å é¤ "${path}" åï¼`;
            document.getElementById('deleteModal').style.display = 'flex';
        };

        window.openFolder = function(path) {
            loadDirectory(path);
        };

        // å·æ°
        document.getElementById('refreshBtn').addEventListener('click', () => loadDirectory(currentPath));
        document.getElementById('goRootBtn').addEventListener('click', () => loadDirectory(''));

        // æ°å»ºæä»¶
        document.getElementById('createFileBtn').addEventListener('click', async () => {
            const name = document.getElementById('newFileName').value.trim();
            if (!name) return;
            
            const path = currentPath ? `${currentPath}/${name}` : name;
            
            try {
                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `åå»º ${name}`,
                        content: btoa(' '),
                        branch: BRANCH
                    })
                });
                
                document.getElementById('newFileName').value = '';
                loadDirectory(currentPath);
                
            } catch (error) {
                alert('åå»ºå¤±è´¥');
            }
        });

        // æ°å»ºæä»¶å¤¹
        document.getElementById('createFolderBtn').addEventListener('click', async () => {
            const name = document.getElementById('newFileName').value.trim();
            if (!name) return;
            
            const path = currentPath ? `${currentPath}/${name}/.gitkeep` : `${name}/.gitkeep`;
            
            try {
                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `åå»ºæä»¶å¤¹ ${name}`,
                        content: btoa(''),
                        branch: BRANCH
                    })
                });
                
                document.getElementById('newFileName').value = '';
                loadDirectory(currentPath);
                
            } catch (error) {
                alert('åå»ºå¤±è´¥');
            }
        });

        // ä¸ä¼ æä»¶
        uploadBtn.addEventListener('click', () => {
            fileUpload.click();
        });

        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            uploadStatus.textContent = 'ä¸ä¼ ä¸­...';
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                const content = e.target.result.split(',')[1];
                
                try {
                    const path = currentPath ? `${currentPath}/${file.name}` : file.name;
                    
                    await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${currentToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `ä¸ä¼  ${file.name}`,
                            content: content,
                            branch: BRANCH
                        })
                    });
                    
                    uploadStatus.textContent = 'ä¸ä¼ æå';
                    setTimeout(() => { uploadStatus.textContent = ''; }, 3000);
                    
                    if (advancedToggle.checked) {
                        loadDirectory(currentPath);
                    }
                    
                } catch (error) {
                    uploadStatus.textContent = 'ä¸ä¼ å¤±è´¥';
                }
            };
            reader.readAsDataURL(file);
        });

        // å é¤ç¡®è®¤
        document.getElementById('cancelDelete').addEventListener('click', () => {
            document.getElementById('deleteModal').style.display = 'none';
            fileToDelete = null;
        });

        document.getElementById('confirmDelete').addEventListener('click', async () => {
            if (!fileToDelete) return;
            
            try {
                await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${fileToDelete.path}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `å é¤ ${fileToDelete.path}`,
                        sha: fileToDelete.sha,
                        branch: BRANCH
                    })
                });
                
                document.getElementById('deleteModal').style.display = 'none';
                loadDirectory(currentPath);
                
            } catch (error) {
                alert('å é¤å¤±è´¥');
            }
        });
    })();
</script>
