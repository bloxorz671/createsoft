<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>文件预览</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .top-bar {
      width: 100%;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      z-index: 50;
      flex-shrink: 0;
      min-height: 48px;
    }
    .file-name {
      font-weight: 600;
      font-size: 14px;
      color: #1e1e1e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 100px;
    }
    .action-btn {
      padding: 6px 12px;
      border-radius: 16px;
      border: 1px solid #d0d0d0;
      background: white;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      color: #333;
    }
    .action-btn:hover { background: #f5f5f5; }
    .back-btn {
      padding: 6px 10px;
      background: none;
      border: none;
      font-size: 14px;
      cursor: pointer;
      color: #555;
    }
    .back-btn:hover { color: #1a73e8; }
    .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .upload-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: white;
      margin: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
      text-align: center;
      padding: 40px 30px;
    }
    .upload-icon { font-size: 48px; }
    .upload-title { font-size: 20px; font-weight: 600; color: #333; }
    .upload-desc { color: #666; font-size: 14px; }
    .file-select-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
    }
    .file-select-btn:hover { background: #1557b0; }
    .preview-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #e8eaed; }
    .hidden { display: none !important; }
    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast-message.show { opacity: 1; }

    .error-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      padding: 30px;
      text-align: center;
    }
    .error-icon { font-size: 64px; margin-bottom: 16px; }
    .error-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .error-detail {
      background: #fff3f3;
      border: 1px solid #ffcdd2;
      color: #c62828;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      max-width: 500px;
      word-break: break-all;
    }
    .error-download-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 24px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
    }

    .zoom-stage {
      flex: 1;
      overflow: hidden;
      background: #525659;
      position: relative;
      touch-action: none;
    }
    .zoom-stage.light { background: #e8eaed; }
    .zoom-content {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 20px;
    }
    .zoom-content img {
      display: block;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    .pdf-page { background: white; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
    .pdf-page canvas { display: block; }
    .docx-a4-page {
      width: 794px;
      min-height: 1123px;
      background: white;
      padding: 96px 72px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      font-family: 'Times New Roman', '宋体', serif;
      font-size: 14px;
      line-height: 1.5;
      color: #000;
      word-wrap: break-word;
    }
    .docx-a4-page * { max-width: 100%; box-sizing: border-box; }
    .docx-a4-page table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    .docx-a4-page td, .docx-a4-page th { border: 1px solid #000; padding: 4px 6px; word-break: break-all; }
    .docx-a4-page img { max-width: 100%; height: auto; }
    .xlsx-scroll {
      flex: 1;
      overflow: auto;
      background: #f5f5f5;
      padding: 16px;
    }
    .xlsx-content {
      background: white;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      overflow-x: auto;
      display: inline-block;
      min-width: 100%;
    }
    .xlsx-content table {
      border-collapse: collapse;
      width: auto;
      margin: 0 auto;
      font-size: 13px;
    }
    .xlsx-content td, .xlsx-content th {
      border: 1px solid #ccc;
      padding: 5px 10px;
      min-width: 50px;
      white-space: nowrap;
    }
    .sheet-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: #f5f5f5;
      z-index: 5;
      padding: 5px 0;
    }
    .sheet-tab {
      padding: 6px 14px;
      background: #e0e0e0;
      border: none;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
      font-size: 13px;
    }
    .sheet-tab.active { background: #1a73e8; color: white; }

    /* PPT iframe */
    .ppt-iframe-wrapper {
      flex: 1;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .ppt-iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="topBar" class="top-bar hidden">
    <button class="back-btn" id="backBtn">← 返回</button>
    <span class="file-name" id="fileNameDisplay">文件名称</span>
    <button class="action-btn" id="downloadBtn">⬇️ 下载</button>
    <button class="action-btn" id="copyLinkBtn">🔗 复制链接</button>
  </div>
  <div class="main-container" id="mainContainer">
    <div id="uploadPanel" class="upload-panel">
      <div class="upload-icon">📂</div>
      <div class="upload-title">选择文件预览</div>
      <div class="upload-desc">图片 · 视频 · 音频 · PDF · DOCX · XLSX · PPTX</div>
      <button class="file-select-btn" id="selectFileBtn">📁 打开本地文件</button>
      <input type="file" id="fileInput" hidden accept="image/*,video/*,audio/*,.pdf,.docx,.xlsx,.pptx,.ppt">
    </div>
    <div id="previewWrapper" class="preview-wrapper hidden"></div>
  </div>
  <div id="toast" class="toast-message"></div>

  <script>
    (function() {
      const uploadPanel = document.getElementById('uploadPanel');
      const previewWrapper = document.getElementById('previewWrapper');
      const topBar = document.getElementById('topBar');
      const fileInput = document.getElementById('fileInput');
      const selectFileBtn = document.getElementById('selectFileBtn');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const backBtn = document.getElementById('backBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const copyLinkBtn = document.getElementById('copyLinkBtn');
      const toast = document.getElementById('toast');

      let currentFileURL = null;
      let currentFileName = '文件预览';
      let originalFileBlob = null;
      let remoteSourceURL = null;

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function setUIMode(preview) {
        uploadPanel.classList.toggle('hidden', preview);
        previewWrapper.classList.toggle('hidden', !preview);
        topBar.classList.toggle('hidden', !preview);
        if (!preview) previewWrapper.innerHTML = '';
      }

      function getExt(name) { return (name.split('.').pop() || '').toLowerCase(); }
      function getType(ext) {
        if (/^(jpg|jpeg|png|gif|bmp|webp|svg)$/i.test(ext)) return 'image';
        if (/^(mp4|webm|ogg|mov|avi|mkv)$/i.test(ext)) return 'video';
        if (/^(mp3|wav|ogg|aac|flac|m4a)$/i.test(ext)) return 'audio';
        if (ext === 'pdf') return 'pdf';
        if (ext === 'docx') return 'docx';
        if (ext === 'xlsx') return 'xlsx';
        if (ext === 'pptx' || ext === 'ppt') return 'ppt';
        return 'unknown';
      }

      function revokeURL() {
        if (currentFileURL && !remoteSourceURL && currentFileURL.startsWith('blob:')) URL.revokeObjectURL(currentFileURL);
      }

      function goBack() {
        revokeURL();
        if (document.referrer && document.referrer !== window.location.href) {
          window.history.back();
        } else {
          window.close();
        }
      }

      function showErrorPage(errorMessage) {
        setUIMode(true);
        previewWrapper.innerHTML = `
          <div class="error-page">
            <div class="error-icon">⚠️</div>
            <div class="error-title">当前文件无法预览</div>
            <div class="error-detail">${errorMessage}</div>
            <button class="error-download-btn" id="errorDownloadBtn">📥 下载文件</button>
          </div>
        `;
        document.getElementById('errorDownloadBtn').addEventListener('click', () => {
          if (remoteSourceURL) {
            window.open(remoteSourceURL, '_blank');
          } else if (currentFileURL) {
            const a = document.createElement('a');
            a.href = currentFileURL;
            a.download = currentFileName;
            a.click();
          }
        });
      }

      function readFileAsBinaryString(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsBinaryString(blob);
        });
      }

      function createZoomStage(lightBg = false) {
        const stage = document.createElement('div');
        stage.className = 'zoom-stage' + (lightBg ? ' light' : '');
        const content = document.createElement('div');
        content.className = 'zoom-content';
        stage.appendChild(content);
        let scale = 1, tx = 0, ty = 0;
        let drag = false, startX, startY, startTX, startTY;
        let pinchDist = 0, pinchScale, pinchTX, pinchTY, pinchCX, pinchCY;

        function updateTransform() { content.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
        function fitToScreen() {
          setTimeout(() => {
            const rect = stage.getBoundingClientRect();
            const cw = content.scrollWidth || 800;
            scale = Math.min(1.5, (rect.width * 0.9) / cw);
            tx = (rect.width - cw * scale) / 2;
            ty = (rect.height - (content.scrollHeight || 600) * scale) / 2;
            ty = Math.max(10, ty);
            updateTransform();
          }, 100);
        }

        stage.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            drag = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            startTX = tx;
            startTY = ty;
          } else if (e.touches.length === 2) {
            drag = false;
            pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            pinchCX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            pinchCY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            pinchScale = scale;
            pinchTX = tx;
            pinchTY = ty;
          }
          e.preventDefault();
        }, { passive: false });

        stage.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2 && pinchDist > 0) {
            const nd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            const ns = Math.min(5, Math.max(0.3, pinchScale * (nd / pinchDist)));
            const ratio = ns / pinchScale;
            tx = (pinchCX - stage.getBoundingClientRect().left) - ((pinchCX - stage.getBoundingClientRect().left) - pinchTX) * ratio;
            ty = (pinchCY - stage.getBoundingClientRect().top) - ((pinchCY - stage.getBoundingClientRect().top) - pinchTY) * ratio;
            scale = ns;
            updateTransform();
          } else if (e.touches.length === 1 && drag) {
            tx = startTX + (e.touches[0].clientX - startX);
            ty = startTY + (e.touches[0].clientY - startY);
            updateTransform();
          }
          e.preventDefault();
        }, { passive: false });

        stage.addEventListener('touchend', () => { drag = false; pinchDist = 0; });
        stage.addEventListener('wheel', (e) => {
          e.preventDefault();
          const rect = stage.getBoundingClientRect();
          const mx = e.clientX - rect.left, my = e.clientY - rect.top;
          const ns = Math.min(5, Math.max(0.3, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
          const ratio = ns / scale;
          tx = mx - (mx - tx) * ratio;
          ty = my - (my - ty) * ratio;
          scale = ns;
          updateTransform();
        }, { passive: false });

        return { stage, content, fitToScreen };
      }

      async function renderImage(url) {
        const { stage, content, fitToScreen } = createZoomStage(true);
        previewWrapper.appendChild(stage);
        const img = document.createElement('img');
        img.src = url;
        img.alt = currentFileName;
        img.style.maxWidth = '90vw';
        img.style.maxHeight = '80vh';
        content.appendChild(img);
        img.onload = () => fitToScreen();
      }

      async function renderPDF(url) {
        const { stage, content, fitToScreen } = createZoomStage(false);
        previewWrapper.appendChild(stage);
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        try {
          const pdf = await pdfjsLib.getDocument(url).promise;
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 1.5 });
            const wrapper = document.createElement('div');
            wrapper.className = 'pdf-page';
            wrapper.style.width = vp.width + 'px';
            wrapper.style.height = vp.height + 'px';
            const canvas = document.createElement('canvas');
            canvas.width = vp.width;
            canvas.height = vp.height;
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
            wrapper.appendChild(canvas);
            content.appendChild(wrapper);
          }
          fitToScreen();
        } catch (err) {
          showErrorPage(err.message);
        }
      }

      async function renderDocx(url, blob) {
        const { stage, content, fitToScreen } = createZoomStage(true);
        previewWrapper.appendChild(stage);
        try {
          let ab = blob ? await blob.arrayBuffer() : await (await fetch(url)).arrayBuffer();
          const result = await mammoth.convertToHtml({ arrayBuffer: ab });
          const page = document.createElement('div');
          page.className = 'docx-a4-page';
          page.innerHTML = result.value;
          page.querySelectorAll('*').forEach(el => { el.style.maxWidth = '100%'; el.style.boxSizing = 'border-box'; });
          page.querySelectorAll('table').forEach(t => { t.style.width = '100%'; t.style.tableLayout = 'fixed'; });
          page.querySelectorAll('td,th').forEach(c => { c.style.wordBreak = 'break-word'; });
          page.querySelectorAll('img').forEach(i => { i.style.maxWidth = '100%'; i.style.height = 'auto'; });
          content.appendChild(page);
          fitToScreen();
        } catch (err) {
          showErrorPage(err.message);
        }
      }

      async function renderXlsx(url, blob) {
        const container = document.createElement('div');
        container.className = 'xlsx-scroll';
        previewWrapper.appendChild(container);

        try {
          let workbook;
          if (blob) {
            const binaryString = await readFileAsBinaryString(blob);
            workbook = XLSX.read(binaryString, { type: 'binary' });
          } else {
            const resp = await fetch(url);
            const blob2 = await resp.blob();
            const binaryString = await readFileAsBinaryString(blob2);
            workbook = XLSX.read(binaryString, { type: 'binary' });
          }

          const sheetNames = workbook.SheetNames;
          const sheetHTMLCache = {};

          function buildSheetHTML(sheetName) {
            if (sheetHTMLCache[sheetName]) return sheetHTMLCache[sheetName];
            const sheet = workbook.Sheets[sheetName];
            if (!sheet || !sheet['!ref']) return '<div style="padding:20px;text-align:center;">空工作表</div>';
            const range = XLSX.utils.decode_range(sheet['!ref']);
            const rows = [];
            for (let r = range.s.r; r <= range.e.r; r++) {
              const row = [];
              for (let c = range.s.c; c <= range.e.c; c++) {
                const cell = sheet[XLSX.utils.encode_cell({ r, c })];
                row.push(cell ? (cell.w !== undefined ? String(cell.w) : String(cell.v || '')) : '');
              }
              rows.push(row);
            }
            let maxCols = 0;
            rows.forEach(row => { if (row.length > maxCols) maxCols = row.length; });
            const emptyCols = new Set();
            for (let c = 0; c < maxCols; c++) {
              let allEmpty = true;
              for (let r = 0; r < rows.length; r++) {
                if (c < rows[r].length && rows[r][c].trim() !== '') { allEmpty = false; break; }
              }
              if (allEmpty) emptyCols.add(c);
            }
            let html = '<table>';
            rows.forEach(row => {
              let hasContent = false;
              for (let c = 0; c < row.length; c++) { if (!emptyCols.has(c) && row[c].trim() !== '') { hasContent = true; break; } }
              if (!hasContent) return;
              html += '<tr>';
              for (let c = 0; c < maxCols; c++) {
                if (emptyCols.has(c)) continue;
                html += `<td>${escapeHtml(c < row.length ? row[c] : '')}</td>`;
              }
              html += '</tr>';
            });
            html += '</table>';
            sheetHTMLCache[sheetName] = html;
            return html;
          }

          const tabsDiv = document.createElement('div');
          tabsDiv.className = 'sheet-tabs';
          const contentDiv = document.createElement('div');
          contentDiv.className = 'xlsx-content';
          sheetNames.forEach((name, i) => {
            const tab = document.createElement('button');
            tab.className = 'sheet-tab' + (i === 0 ? ' active' : '');
            tab.textContent = name;
            tab.onclick = () => {
              tabsDiv.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
              tab.classList.add('active');
              contentDiv.innerHTML = buildSheetHTML(name);
            };
            tabsDiv.appendChild(tab);
          });
          container.appendChild(tabsDiv);
          container.appendChild(contentDiv);
          contentDiv.innerHTML = buildSheetHTML(sheetNames[0]);
        } catch (err) {
          showErrorPage(err.message);
        }
      }

      function renderPPT(url) {
        const wrapper = document.createElement('div');
        wrapper.className = 'ppt-iframe-wrapper';
        const iframe = document.createElement('iframe');
        iframe.src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        iframe.allowFullscreen = true;
        wrapper.appendChild(iframe);
        previewWrapper.appendChild(wrapper);
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function renderVideo(url) {
        const container = document.createElement('div');
        container.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;background:#000;';
        const video = document.createElement('video');
        video.src = url;
        video.controls = true;
        video.style.maxWidth = '95%';
        video.style.maxHeight = '80vh';
        container.appendChild(video);
        previewWrapper.appendChild(container);
      }

      function renderAudio(url) {
        const container = document.createElement('div');
        container.style.cssText = 'flex:1;display:flex;align-items:center;justify-content:center;';
        container.innerHTML = `<div style="background:white;padding:30px;border-radius:16px;text-align:center;"><h3>🎵 ${currentFileName}</h3><audio src="${url}" controls style="width:100%;margin-top:15px;"></audio></div>`;
        previewWrapper.appendChild(container);
      }

      function renderPreview(fileURL, fileName, blob, sourceURL) {
        revokeURL();
        currentFileURL = fileURL;
        currentFileName = fileName;
        originalFileBlob = blob;
        remoteSourceURL = sourceURL || null;
        fileNameDisplay.textContent = fileName;
        setUIMode(true);
        previewWrapper.innerHTML = '';

        const type = getType(getExt(fileName));
        switch (type) {
          case 'image': renderImage(fileURL); break;
          case 'video': renderVideo(fileURL); break;
          case 'audio': renderAudio(fileURL); break;
          case 'pdf': renderPDF(fileURL); break;
          case 'docx': renderDocx(fileURL, blob); break;
          case 'xlsx': renderXlsx(fileURL, blob); break;
          case 'ppt':
            if (sourceURL) {
              renderPPT(sourceURL);
            } else {
              showErrorPage('PPT/PPTX 文件需要远程链接才能预览，本地文件请先上传到服务器');
            }
            break;
          default:
            showErrorPage('不支持的文件格式');
        }
      }

      function loadFile(file) {
        if (!file) return;
        renderPreview(URL.createObjectURL(file), file.name, file, null);
      }

      async function loadRemote(remoteUrl) {
        try {
          const resp = await fetch(remoteUrl);
          if (!resp.ok) throw new Error('网络错误');
          const blob = await resp.blob();
          let name = remoteUrl.split('/').pop().split('?')[0] || 'file';
          if (!name.includes('.')) {
            const ct = resp.headers.get('content-type') || '';
            if (ct.includes('pdf')) name += '.pdf';
            else if (ct.includes('word')) name += '.docx';
            else if (ct.includes('excel')) name += '.xlsx';
            else if (ct.includes('powerpoint') || ct.includes('presentation')) name += '.pptx';
            else name += '.bin';
          }
          renderPreview(URL.createObjectURL(blob), name, blob, remoteUrl);
        } catch (err) {
          alert('加载失败');
          goBack();
        }
      }

      selectFileBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0]);
        fileInput.value = '';
      });
      backBtn.addEventListener('click', goBack);
      downloadBtn.addEventListener('click', () => {
        if (remoteSourceURL) {
          window.open(remoteSourceURL, '_blank');
        } else if (currentFileURL) {
          const a = document.createElement('a');
          a.href = currentFileURL;
          a.download = currentFileName;
          a.click();
        }
      });
      copyLinkBtn.addEventListener('click', async () => {
        if (remoteSourceURL) {
          await navigator.clipboard.writeText(`https://luckynum.top/filereader?file=${encodeURIComponent(remoteSourceURL)}`);
          showToast('链接已复制');
        } else {
          showToast('仅远程文件可复制链接');
        }
      });

      document.body.addEventListener('dragover', e => e.preventDefault());
      document.body.addEventListener('drop', e => {
        e.preventDefault();
        if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
      });

      const p = new URL(location.href).searchParams.get('file');
      if (p) loadRemote(p);
      else setUIMode(false);
    })();
  </script>
</body>
</html>
