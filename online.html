<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽号 V3.0</title>
    <style>
        /* 启动屏幕样式 - 黑底白字，无虚化 */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .splash-title {
            font-size: 72px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .splash-sub {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 40px;
        }
        .splash-footer {
            position: absolute;
            bottom: 30px;
            font-size: 20px;
            color: #ffffff;
            font-weight: 400;
        }
        /* 隐藏启动屏幕 */
        .splash-hidden {
            display: none !important;
        }
        /* 原界面样式 - 完全保留并添加标题下方小字 */
        body {
            font-family: "Microsoft YaHei", sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: none; /* 初始隐藏，启动页消失后显示 */
        }
        /* 标题区域容器，用于放置主标题和下方小字 */
        .title-container {
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 5px;  /* 减小底部间距，为小字留出空间 */
            cursor: pointer;
            font-size: 32px;     /* 保持原有标题大小 */
        }
        .sub-title {
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
            font-weight: normal;
            margin-top: 0;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: inline-block;
            width: 120px;
            text-align: right;
            margin-right: 10px;
            vertical-align: middle;
            font-weight: bold;
        }
        .number-display {
            display: inline-block;
            width: 60px;
            height: 40px;
            line-height: 40px;
            background-color: #4a90e2;
            color: white;
            font-size: 24px;
            text-align: center;
            border-radius: 5px;
            vertical-align: middle;
            margin-right: 10px;
        }
        #edit-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 6px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            vertical-align: middle;
        }
        #result {
            font-size: 48px;
            color: #333;
            margin: 30px 0;
            height: 60px;
            line-height: 60px;
            cursor: pointer;
            user-select: none;
        }
        #draw-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        #draw-btn:disabled {
            background-color: #eeeeee;
            cursor: not-allowed;
        }
        .mode-indicator {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            font-style: italic;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4a90e2;
        }
        input:checked + .slider:before {
            transform: translateX(30px);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            text-align: center;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: black;
        }
        #history-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
            text-align: left;
        }
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-info {
            display: flex;
            flex-direction: column;
        }
        .history-number {
            font-weight: bold;
            font-size: 16px;
        }
        .history-time {
            color: #666;
            font-size: 12px;
        }
        .history-actions {
            display: flex;
            gap: 5px;
        }
        .history-btn {
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .delete-btn {
            background-color: #ff6b6b;
            color: white;
        }
        .add-btn {
            background-color: #4a90e2;
            color: white;
            margin-bottom: 10px;
        }
        .clear-btn {
            background-color: #ffa726;
            color: white;
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 14px;
        }
        .setup-modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 30px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
            text-align: center;
        }
        .setup-input {
            width: 100px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
            margin: 20px 0;
            border: 2px solid #4a90e2;
            border-radius: 5px;
        }
        .setup-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        .setup-btn:hover {
            background-color: #3a7bc8;
        }
        .hint {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        .history-switch-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }
        .history-switch-label {
            margin-left: 10px;
            margin-right: 10px;
            font-size: 16px;
        }
        /* 调试弹窗样式 */
        .debug-modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 30px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
            text-align: center;
        }
        .debug-input {
            width: 150px;
            padding: 10px;
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
            border: 2px solid #4a90e2;
            border-radius: 5px;
            letter-spacing: 8px;
            font-family: monospace;
            -webkit-text-security: disc;
            text-security: disc;
        }
        .debug-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
        }
        .debug-btn:hover {
            background-color: #3a7bc8;
        }
        .debug-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .error-message {
            color: #ff4444;
            font-size: 14px;
            margin-top: 10px;
            height: 20px;
        }
        .lock-message {
            color: #ff9800;
            font-size: 14px;
            margin-top: 10px;
            height: 20px;
        }
        .add-number-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .add-number-input {
            width: 60px;
            padding: 5px;
            font-size: 16px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .attempts-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <!-- 启动屏幕：黑底白字，无虚化 -->
    <div class="splash-screen" id="splash">
        <div class="splash-title">随机抽号 V3.0</div>
        <div class="splash-sub">启动中...</div>
        <div class="splash-footer">luckynum.us.ci</div>
    </div>

    <!-- 首次使用设置弹窗 -->
    <div id="setup-modal" class="modal">
        <div class="setup-modal-content">
            <h2>欢迎使用随机抽号系统</h2>
            <p>请输入班级人数</p>
            <input type="number" id="setup-class-size" class="setup-input" min="1" max="999" placeholder="班级人数">
            <br>
            <button id="setup-save-btn" class="setup-btn">确定</button>
            <div class="hint">此设置将保存在您的浏览器中</div>
        </div>
    </div>

    <div class="container">
        <!-- 标题区域：主标题 + 下方小字 -->
        <div class="title-container">
            <h1 id="title">随机抽号 V3.0</h1>
            <div class="sub-title">luckynum.us.ci</div>
        </div>
        
        <div class="input-group">
            <label for="class-size">班级人数：</label>
            <span id="class-size-display" class="number-display">?</span>
            <button id="edit-btn">编辑</button>
            <input type="number" id="class-size-input" style="display:none; width:60px; text-align:center">
        </div>
        
        <div class="input-group">
            <div id="result">?</div>
            <button id="draw-btn">抽号</button>
            <div id="mode-indicator" class="mode-indicator"></div>
        </div>
    </div>

    <!-- 开发者调试弹窗 (密码3001) -->
    <div id="debug-modal" class="modal">
        <div class="debug-modal-content">
            <span class="debug-close">&times;</span>
            <h2>开发者调试模式</h2>
            <p>请输入调试密码</p>
            <input type="password" id="debug-password" class="debug-input" maxlength="4" placeholder="请输入">
            <br>
            <button id="debug-submit-btn" class="debug-btn">验证</button>
            <div id="debug-error" class="error-message"></div>
            <div id="debug-lock" class="lock-message"></div>
            <div id="debug-attempts" class="attempts-info"></div>
        </div>
    </div>

    <!-- 历史记录弹窗 -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>已抽取的学号</h2>
            
            <div class="history-switch-container">
                <span class="history-switch-label">不重复抽选</span>
                <label class="switch">
                    <input type="checkbox" id="history-no-repeat-switch">
                    <span class="slider"></span>
                </label>
                <span class="history-switch-label">开启</span>
            </div>
            
            <div class="add-number-container">
                <input type="number" id="add-number-input" class="add-number-input" min="1" max="999" placeholder="学号">
                <button id="add-number-btn" class="history-btn add-btn">添加</button>
            </div>
            
            <div id="history-list"></div>
            
            <button id="clear-history-btn" class="clear-btn">清空历史记录</button>
        </div>
    </div>

    <script>
        // 初始化变量
        let classSize = 0;
        let noRepeatMode = true;
        let drawnNumbers = []; 
        let clickCount = 0;
        let clickTimer = null;
        let waitingForClick = false;
        let wrongAttempts = 0; 
        let lockUntil = 0; 
        let lockTimer = null; 
        
        // 密码直接为3001
        const CORRECT_PASSWORD = "3001";
        
        // DOM 元素
        const splash = document.getElementById('splash');
        const setupModal = document.getElementById('setup-modal');
        const setupClassSizeInput = document.getElementById('setup-class-size');
        const setupSaveBtn = document.getElementById('setup-save-btn');
        const classSizeDisplay = document.getElementById('class-size-display');
        const classSizeInput = document.getElementById('class-size-input');
        const editBtn = document.getElementById('edit-btn');
        const resultDisplay = document.getElementById('result');
        const drawBtn = document.getElementById('draw-btn');
        const modeIndicator = document.getElementById('mode-indicator');
        const title = document.getElementById('title');
        const debugModal = document.getElementById('debug-modal');
        const debugPasswordInput = document.getElementById('debug-password');
        const debugSubmitBtn = document.getElementById('debug-submit-btn');
        const debugError = document.getElementById('debug-error');
        const debugLock = document.getElementById('debug-lock');
        const debugAttempts = document.getElementById('debug-attempts');
        const debugClose = document.querySelector('.debug-close');
        const modal = document.getElementById('history-modal');
        const closeBtn = document.querySelector('.close');
        const historyList = document.getElementById('history-list');
        const historyNoRepeatSwitch = document.getElementById('history-no-repeat-switch');
        const addNumberInput = document.getElementById('add-number-input');
        const addNumberBtn = document.getElementById('add-number-btn');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        
        // 页面加载完成后，延迟1.2秒隐藏启动屏幕（直接隐藏，无虚化），显示主界面
        window.addEventListener('load', function() {
            setTimeout(function() {
                // 直接添加隐藏类，无过渡效果
                splash.classList.add('splash-hidden');
                document.querySelector('.container').style.display = 'block';
                // 启动后检查首次使用
                checkFirstTimeUse();
            }, 1200); // 启动屏显示1.2秒
        });

        // 从localStorage加载数据
        function loadFromLocalStorage() {
            try {
                const sizeData = localStorage.getItem('randomDraw_classSize');
                if (sizeData) {
                    classSize = parseInt(sizeData);
                }
                
                const drawnData = localStorage.getItem('randomDraw_drawnNumbers');
                if (drawnData) {
                    const parsedData = JSON.parse(drawnData);
                    if (Array.isArray(parsedData)) {
                        if (parsedData.length > 0 && typeof parsedData[0] === 'object') {
                            drawnNumbers = parsedData;
                        } else {
                            drawnNumbers = parsedData.map(number => ({
                                number: number,
                                timestamp: Date.now()
                            }));
                            saveToLocalStorage();
                        }
                    } else {
                        drawnNumbers = [];
                    }
                }
                
                const repeatData = localStorage.getItem('randomDraw_noRepeatMode');
                if (repeatData) {
                    noRepeatMode = repeatData === 'true';
                    historyNoRepeatSwitch.checked = noRepeatMode;
                }
            } catch (error) {
                console.error('从localStorage加载数据时出错:', error);
                classSize = 0;
                drawnNumbers = [];
                noRepeatMode = true;
                historyNoRepeatSwitch.checked = noRepeatMode;
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem('randomDraw_classSize', classSize);
                localStorage.setItem('randomDraw_drawnNumbers', JSON.stringify(drawnNumbers));
                localStorage.setItem('randomDraw_noRepeatMode', noRepeatMode);
            } catch (error) {
                console.error('保存数据到localStorage时出错:', error);
                alert('保存数据时出错，请检查浏览器设置。');
            }
        }

        // 检查首次使用
        function checkFirstTimeUse() {
            if (!classSize || classSize <= 0) {
                setupModal.style.display = 'block';
                setupClassSizeInput.focus();
            }
        }

        // 锁定相关函数
        function isLocked() {
            return Date.now() < lockUntil;
        }

        function updateLockMessage() {
            if (isLocked()) {
                const remainingSeconds = Math.ceil((lockUntil - Date.now()) / 1000);
                debugLock.textContent = `系统已锁定，请等待${remainingSeconds}秒`;
                debugSubmitBtn.disabled = true;
                debugPasswordInput.disabled = true;
            } else {
                debugLock.textContent = '';
                debugSubmitBtn.disabled = false;
                debugPasswordInput.disabled = false;
            }
        }

        function startLockTimer() {
            if (lockTimer) {
                clearInterval(lockTimer);
            }
            lockTimer = setInterval(function() {
                if (!isLocked()) {
                    clearInterval(lockTimer);
                    updateLockMessage();
                    updateAttemptsInfo();
                } else {
                    updateLockMessage();
                }
            }, 1000);
        }

        function loadLockState() {
            try {
                const attemptsData = localStorage.getItem('randomDraw_wrongAttempts');
                const lockData = localStorage.getItem('randomDraw_lockUntil');
                if (attemptsData) {
                    wrongAttempts = parseInt(attemptsData);
                }
                if (lockData) {
                    lockUntil = parseInt(lockData);
                    if (isLocked()) {
                        startLockTimer();
                    }
                }
            } catch (error) {
                console.error('加载锁定状态时出错:', error);
            }
        }

        function saveLockState() {
            try {
                localStorage.setItem('randomDraw_wrongAttempts', wrongAttempts);
                localStorage.setItem('randomDraw_lockUntil', lockUntil);
            } catch (error) {
                console.error('保存锁定状态时出错:', error);
            }
        }

        function updateAttemptsInfo() {
            if (wrongAttempts > 0) {
                debugAttempts.textContent = `错误尝试: ${wrongAttempts}/5`;
            } else {
                debugAttempts.textContent = '';
            }
        }

        // 显示调试弹窗
        function showDebugModal() {
            if (isLocked()) {
                updateLockMessage();
            }
            debugModal.style.display = 'block';
            debugPasswordInput.focus();
            updateAttemptsInfo();
            updateLockMessage();
        }

        // 显示历史记录
        function showHistory() {
            historyNoRepeatSwitch.checked = noRepeatMode;
            historyList.innerHTML = '';
            if (drawnNumbers.length === 0) {
                historyList.innerHTML = '<div class="history-item">暂无抽取记录</div>';
            } else {
                drawnNumbers.slice().reverse().forEach((item, index) => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'history-info';
                    
                    const numberSpan = document.createElement('span');
                    numberSpan.className = 'history-number';
                    numberSpan.textContent = '学号: ' + item.number;
                    
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'history-time';
                    timeSpan.textContent = formatDateTime(item.timestamp);
                    
                    infoDiv.appendChild(numberSpan);
                    infoDiv.appendChild(timeSpan);
                    
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'history-actions';
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'history-btn delete-btn';
                    deleteBtn.textContent = '删除';
                    deleteBtn.onclick = function() {
                        const actualIndex = drawnNumbers.length - 1 - index;
                        drawnNumbers.splice(actualIndex, 1);
                        saveToLocalStorage();
                        showHistory();
                    };
                    
                    actionsDiv.appendChild(deleteBtn);
                    historyItem.appendChild(infoDiv);
                    historyItem.appendChild(actionsDiv);
                    historyList.appendChild(historyItem);
                });
            }
            modal.style.display = 'block';
        }

        function formatDateTime(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 事件监听器设置
        function setupEventListeners() {
            setupSaveBtn.addEventListener('click', function() {
                const newSize = parseInt(setupClassSizeInput.value);
                if (isNaN(newSize) || newSize < 1 || newSize > 999) {
                    alert('请输入有效的班级人数（1-999）！');
                    setupClassSizeInput.focus();
                    return;
                }
                classSize = newSize;
                saveToLocalStorage();
                setupModal.style.display = 'none';
                updateDisplay();
            });

            setupClassSizeInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') setupSaveBtn.click();
            });

            editBtn.addEventListener('click', toggleEditMode);

            classSizeInput.addEventListener('blur', saveClassSize);
            classSizeInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') saveClassSize();
            });

            drawBtn.addEventListener('click', drawNumber);

            historyNoRepeatSwitch.addEventListener('change', function() {
                noRepeatMode = this.checked;
                saveToLocalStorage();
                updateDisplay();
                if (!noRepeatMode) {
                    drawnNumbers = [];
                    saveToLocalStorage();
                }
            });

            // 标题点击十次进入调试 (点击主标题区域，包含h1)
            title.addEventListener('click', function() {
                clickCount++;
                if (clickTimer) clearTimeout(clickTimer);
                clickTimer = setTimeout(() => {
                    clickCount = 0;
                    waitingForClick = false;
                }, 5000);
                
                if (clickCount >= 10) {
                    waitingForClick = true;
                    clickCount = 0;
                }
            });

            document.addEventListener('click', function(event) {
                if (waitingForClick && event.target !== title) {
                    showDebugModal();
                    waitingForClick = false;
                }
            });

            // 调试弹窗提交
            debugSubmitBtn.addEventListener('click', function() {
                if (isLocked()) {
                    updateLockMessage();
                    return;
                }

                const password = debugPasswordInput.value;

                if (password === CORRECT_PASSWORD) {
                    wrongAttempts = 0;
                    saveLockState();
                    debugModal.style.display = 'none';
                    debugPasswordInput.value = '';
                    debugError.textContent = '';
                    debugLock.textContent = '';
                    showHistory();
                } else {
                    wrongAttempts++;
                    if (wrongAttempts >= 5) {
                        lockUntil = Date.now() + 60 * 1000;
                        saveLockState();
                        startLockTimer();
                    }
                    saveLockState();
                    updateAttemptsInfo();
                    debugError.textContent = '密码错误';
                    debugPasswordInput.value = '';
                    debugPasswordInput.focus();
                    updateLockMessage();
                }
            });

            debugPasswordInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '');
                if (this.value.length > 4) this.value = this.value.slice(0, 4);
            });

            debugPasswordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') debugSubmitBtn.click();
            });

            debugClose.addEventListener('click', function() {
                debugModal.style.display = 'none';
                debugPasswordInput.value = '';
                debugError.textContent = '';
                debugLock.textContent = '';
            });

            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });

            addNumberBtn.addEventListener('click', function() {
                const number = parseInt(addNumberInput.value);
                if (isNaN(number) || number < 1 || number > classSize) {
                    alert('请输入有效的学号（1-' + classSize + '）！');
                    addNumberInput.focus();
                    return;
                }
                if (noRepeatMode) {
                    const existing = drawnNumbers.find(item => item.number === number);
                    if (existing) {
                        alert('该学号已经在历史记录中！');
                        addNumberInput.focus();
                        return;
                    }
                }
                drawnNumbers.push({
                    number: number,
                    timestamp: Date.now()
                });
                saveToLocalStorage();
                addNumberInput.value = '';
                showHistory();
            });

            addNumberInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addNumberBtn.click();
            });

            clearHistoryBtn.addEventListener('click', function() {
                if (confirm('确定要清空所有历史记录吗？')) {
                    drawnNumbers = [];
                    saveToLocalStorage();
                    showHistory();
                }
            });

            window.addEventListener('click', function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
                if (event.target === setupModal) {
                    setupClassSizeInput.focus();
                }
                if (event.target === debugModal) {
                    debugPasswordInput.focus();
                }
            });

            window.addEventListener('beforeunload', function() {
                if (clickTimer) clearTimeout(clickTimer);
                if (lockTimer) clearInterval(lockTimer);
            });
        }

        function toggleEditMode() {
            if (classSizeInput.style.display === 'none') {
                classSizeInput.style.display = 'inline-block';
                classSizeDisplay.style.display = 'none';
                editBtn.textContent = '保存';
                classSizeInput.value = classSize;
                classSizeInput.focus();
                drawBtn.disabled = true;
            } else {
                saveClassSize();
            }
        }

        function saveClassSize() {
            let newSize = parseInt(classSizeInput.value);
            if (isNaN(newSize) || newSize < 1) {
                alert('请输入有效的班级人数！');
                classSizeInput.value = classSize;
                return;
            }
            classSize = newSize;
            if (noRepeatMode && drawnNumbers.length > 0) {
                drawnNumbers = drawnNumbers.filter(item => item.number <= classSize);
            }
            classSizeInput.style.display = 'none';
            classSizeDisplay.style.display = 'inline-block';
            editBtn.textContent = '编辑';
            drawBtn.disabled = false;
            saveToLocalStorage();
            updateDisplay();
        }

        function updateDisplay() {
            if (classSize > 0) {
                classSizeDisplay.textContent = classSize;
                if (noRepeatMode && drawnNumbers.length >= classSize) {
                    drawnNumbers = [];
                    saveToLocalStorage();
                }
                drawBtn.disabled = false;
                if (noRepeatMode) {
                    modeIndicator.textContent = "不重复抽选已开启";
                } else {
                    modeIndicator.textContent = "";
                }
            } else {
                classSizeDisplay.textContent = '?';
                drawBtn.disabled = true;
                modeIndicator.textContent = "";
            }
        }

        function drawNumber() {
            if (classSize === 0) {
                alert('请先设置班级人数！');
                setupModal.style.display = 'block';
                setupClassSizeInput.focus();
                return;
            }
            let number;
            if (noRepeatMode && drawnNumbers.length < classSize) {
                const drawnNumberList = drawnNumbers.map(item => item.number);
                const availableNumbers = [];
                for (let i = 1; i <= classSize; i++) {
                    if (!drawnNumberList.includes(i)) {
                        availableNumbers.push(i);
                    }
                }
                if (availableNumbers.length === 0) {
                    drawnNumbers = [];
                    for (let i = 1; i <= classSize; i++) availableNumbers.push(i);
                }
                number = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
                drawnNumbers.push({
                    number: number,
                    timestamp: Date.now()
                });
                saveToLocalStorage();
            } else {
                number = Math.floor(Math.random() * classSize) + 1;
                if (!noRepeatMode) {
                    drawnNumbers = [{
                        number: number,
                        timestamp: Date.now()
                    }];
                    saveToLocalStorage();
                }
            }
            resultDisplay.textContent = number;
        }

        // 初始化
        loadFromLocalStorage();
        loadLockState();
        setupEventListeners();
        updateDisplay();
    </script>
</body>
</html>
