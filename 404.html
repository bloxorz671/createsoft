<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        /* 彻底重置边距，保证全屏布满无多余效果 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #f2f4f8;  /* 干净背景，无装饰 */
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* 全屏居中容器 */
        .full-center {
            width: 100%;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 水平排列的内容区：图片 + 右侧文字组 */
        .content-row {
            display: flex;
            align-items: center;      /* 图片和文字组垂直居中 */
            justify-content: center;
            gap: 1.2rem;              /* 图片与右侧文字的间距，更紧凑 */
            flex-wrap: wrap;           /* 小屏时自动换行 */
        }

        /* 左侧图片：404.png (缩小一点) */
        .alien-img {
            width: 80px;               /* 缩小图片尺寸 */
            height: auto;
            max-width: 15vw;           /* 小屏自适应进一步缩小 */
            display: block;
            flex-shrink: 0;            /* 防止图片被压缩 */
        }

        /* 右侧文字组：404 + 中间描述 + 按钮（保持垂直排列） */
        .text-group {
            display: flex;
            flex-direction: column;
            align-items: center;        /* 内部文字水平居中 */
            justify-content: center;
            gap: 0.6rem;                /* 文字之间紧凑 */
        }

        /* 大红 404 — 保持醒目 */
        .four-oh-four {
            font-size: clamp(5rem, 15vw, 8rem);
            font-weight: 800;
            color: #d32f2f;
            line-height: 1;
            letter-spacing: -0.02em;
            text-shadow: 0 8px 25px rgba(211, 47, 47, 0.15);
            margin: 0;
        }

        /* 中间文字：网页被外星人偷走了 */
        .alien-message {
            font-size: clamp(1.3rem, 4vw, 2rem);
            font-weight: 450;
            color: #222;
            line-height: 1.3;
            margin: 0;
            white-space: nowrap;
        }

        /* 返回主页按钮 */
        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #d32f2f;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            padding: 0.5rem 2rem;
            border-radius: 60px;
            box-shadow: 0 12px 24px -12px rgba(211, 47, 47, 0.4);
            border: none;
            cursor: pointer;
            margin-top: 0.2rem;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .home-link:hover {
            background: #b71c1c;
            box-shadow: 0 18px 30px -12px #b71c1c;
            text-decoration: none;
        }

        .home-link:active {
            transform: translateY(2px);
            box-shadow: 0 8px 16px -8px #b71c1c;
        }

        /* 移除所有可能的小符号、伪元素、多余的装饰 */
        .home-link::after,
        .home-link::before {
            display: none !important;
            content: none !important;
        }

        body, div, p, span, a, h1, h2, h3, h4 {
            &::before, &::after {
                content: none !important;
            }
        }

        /* 小屏友好：允许文字换行 */
        @media (max-width: 500px) {
            .content-row {
                gap: 1rem;
            }
            .alien-img {
                width: 60px;
            }
            .alien-message {
                white-space: normal;
            }
        }

        @media (max-width: 380px) {
            .alien-img {
                width: 50px;
            }
            .home-link {
                padding: 0.4rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="full-center">
        <!-- 内容行：左边图片 + 右边文字组 -->
        <div class="content-row">
            <!-- 左侧图片：404.png (位于同一目录，已缩小) -->
            <img src="404.png" alt="外星人" class="alien-img">

            <!-- 右侧文字组 (404 + 外星人话 + 返回主页) 整体居中 -->
            <div class="text-group">
                <div class="four-oh-four">404</div>
                <div class="alien-message">网页被外星人偷走了</div>
                <a href="https://luckynum.top" class="home-link">返回主页</a>
            </div>
        </div>
        <!-- 没有其他任何内容、脚注、装饰符号 -->
    </div>
</body>
</html>
