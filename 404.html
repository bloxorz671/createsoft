<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        /* 彻底重置边距，保证全屏布满无多余效果 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #f2f4f8;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* 全屏居中容器 - 使用flex列方向，确保内容垂直居中 */
        .full-center {
            width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 主要内容区域 - 使用flex列，让图片单独一行在上方 */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 图片容器 - 单独一行，位于404上方 */
        .image-row {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 1rem;
        }

        /* 图片 - 大一点，在404上面 */
        .alien-img {
            width: 180px;           /* 图片调大 */
            height: auto;
            max-width: 40vw;         /* 小屏自适应 */
            display: block;
        }

        /* 文字和按钮容器 - 保证404、提示文字和按钮居中 */
        .center-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 1.2rem;            /* 元素之间的间距 */
        }

        /* 大红 404 — 保持醒目，绝对居中 */
        .four-oh-four {
            font-size: clamp(6rem, 18vw, 10rem);
            font-weight: 800;
            color: #d32f2f;
            line-height: 1;
            letter-spacing: -0.02em;
            text-shadow: 0 8px 25px rgba(211, 47, 47, 0.15);
            margin: 0;
        }

        /* 新增无底黑字: 页面被外星人偷走了 */
        .alien-message {
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 450;
            color: #222222;           /* 纯黑字 */
            line-height: 1.3;
            margin: 0;
            background: transparent;
            border: none;
            box-shadow: none;
            text-shadow: none;
            padding: 0;
            white-space: nowrap;
        }

        /* 返回主页按钮 - 无圆角矩形，蓝底白字 */
        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #1e6df2;        /* 鲜明蓝色 */
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            padding: 0.7rem 3rem;
            border-radius: 0;            /* 无圆角，直角矩形 */
            box-shadow: 0 8px 20px -8px rgba(30, 109, 242, 0.5);
            border: none;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
            /* 确保没有任何伪元素符号 */
        }

        .home-link:hover {
            background: #1552c4;        /* 深一点的蓝色 */
            box-shadow: 0 12px 28px -10px #1552c4;
            text-decoration: none;
        }

        .home-link:active {
            transform: translateY(2px);
            box-shadow: 0 5px 12px -6px #1552c4;
        }

        /* 移除所有可能的小符号、伪元素、多余的装饰 */
        .home-link::after,
        .home-link::before {
            display: none !important;
            content: none !important;
        }

        body, div, p, span, a, h1, h2, h3, h4 {
            &::before, &::after {
                content: none !important;
            }
        }

        /* 小屏友好：允许文字换行，图片稍微调小 */
        @media (max-width: 600px) {
            .alien-img {
                width: 150px;
            }
            .alien-message {
                white-space: normal;    /* 小屏允许换行 */
            }
            .home-link {
                padding: 0.6rem 2.5rem;
            }
        }

        @media (max-width: 400px) {
            .alien-img {
                width: 120px;
            }
            .four-oh-four {
                font-size: 5rem;
            }
            .alien-message {
                font-size: 1.4rem;
            }
            .home-link {
                padding: 0.5rem 2rem;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="full-center">
        <!-- 主要内容区域：图片单独一行在上，404、提示文字和按钮居中 -->
        <div class="main-content">
            <!-- 图片单独一行，在404上方 -->
            <div class="image-row">
                <img src="404.png" alt="外星人" class="alien-img">
            </div>
            
            <!-- 404、提示文字和按钮居中区域 -->
            <div class="center-group">
                <div class="four-oh-four">404</div>
                <div class="alien-message">页面被外星人偷走了</div>
                <a href="https://luckynum.top" class="home-link">返回主页</a>
            </div>
        </div>
        <!-- 没有其他任何内容、脚注、装饰符号 -->
    </div>
</body>
</html>
