<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面跳转</title>
    <style>
        body { font-family: system-ui; text-align: center; padding: 50px; background: #f5f7fc; }
        .spinner { width: 40px; height: 40px; margin: 20px auto; border: 3px solid #ddd; border-top-color: #2b4c8a; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .error-code { font-size: 80px; color: #ddd; margin-bottom: 20px; }
        .home-link { color: #2b4c8a; text-decoration: none; margin-top: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div id="content">
        <div class="spinner"></div>
        <div>加载中...</div>
    </div>

    <script>
        (function() {
            const currentPath = window.location.pathname;
            const urlParams = new URLSearchParams(window.location.search);
            
            // 判断是否是值日码请求（精确匹配 /zhiri 路径）
            const isZhiriPath = (currentPath === '/zhiri' || currentPath === '/zhiri/');
            
            // 提取学号
            let studentId = null;
            
            if (isZhiriPath) {
                // 从参数获取: ?20517 或 ?p=20517
                if (urlParams.get('p')) studentId = urlParams.get('p');
                if (!studentId) {
                    for (let [key, value] of urlParams.entries()) {
                        if (key.match(/^\d+$/)) {
                            studentId = key;
                            break;
                        }
                    }
                }
            }
            
            const contentDiv = document.getElementById('content');
            
            if (isZhiriPath) {
                // 值日码请求：跳转到班级页面，学号通过 URL 参数传递
                if (studentId) {
                    contentDiv.innerHTML = `
                        <div class="spinner"></div>
                        <div>正在为学号 <strong>${escapeHtml(studentId)}</strong> 跳转...</div>
                    `;
                    setTimeout(() => {
                        window.location.replace(`/1205?p=${studentId}`);
                    }, 100);
                } else {
                    contentDiv.innerHTML = `
                        <div class="spinner"></div>
                        <div>正在跳转到班级页面...</div>
                    `;
                    setTimeout(() => {
                        window.location.replace('/1205');
                    }, 100);
                }
            } else {
                // 真正的 404：返回主页
                contentDiv.innerHTML = `
                    <div class="error-box">
                        <div class="error-code">404</div>
                        <div class="error-message">
                            <p>抱歉，您访问的页面不存在</p>
                            <p style="font-size: 14px; color: #999;">${escapeHtml(currentPath)}</p>
                        </div>
                        <a href="/" class="home-link">← 返回首页</a>
                    </div>
                `;
            }
            
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
        })();
    </script>
</body>
</html>
