<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        /* 彻底重置边距，让页面完全布满 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #f2f4f8;  /* 干净基底 */
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
        }

        /* 绝对全屏居中，没有任何卡片/突出效果 */
        .full-center {
            width: 100%;
            padding: 2rem 1.5rem;  /* 仅保留小边距防止小屏贴边 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 大红 404 — 布满感由大字体撑起 */
        .four-oh-four {
            font-size: clamp(8rem, 30vw, 20rem);
            font-weight: 800;
            color: #d32f2f;
            line-height: 1;
            letter-spacing: -0.02em;
            text-shadow: 0 8px 25px rgba(211, 47, 47, 0.15);
            margin: 0 0 0.2rem 0;
            transform: scale(1);
            transition: none;
        }

        /* File not found — 不大不小，刚好配合布满氛围 */
        .file-not-found {
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-weight: 400;
            color: #2e405b;
            margin: 0 0 0.4rem 0;
            letter-spacing: 0.3px;
            word-break: keep-all;
        }

        /* 新增提示行：无框黑字，符合要求 */
        .hint-message {
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            font-weight: 400;
            color: #222222;           /* 纯黑字，无框 */
            margin: 0.5rem 0 1.2rem 0;  /* 与上下保持舒适距离 */
            letter-spacing: 0.3px;
            word-break: keep-all;
            opacity: 0.85;             /* 极轻微柔和，依然保持无框黑字感 */
            background: transparent;    /* 绝对无框 */
            border: none;
            box-shadow: none;
            text-shadow: none;
            padding: 0;
            line-height: 1.4;
        }

        /* 按钮: 干净、无右箭头、无任何装饰符号 */
        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #d32f2f;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: clamp(1.4rem, 5vw, 2rem);
            padding: 0.7rem 2.8rem;
            border-radius: 60px;
            box-shadow: 0 12px 24px -12px rgba(211, 47, 47, 0.4);
            border: none;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .home-link:hover {
            background: #b71c1c;
            box-shadow: 0 18px 30px -12px #b71c1c;
            text-decoration: none;
        }

        .home-link:active {
            transform: translateY(2px);
            box-shadow: 0 8px 16px -8px #b71c1c;
        }

        /* 移除所有可能的小符号 —— 包括之前箭头、装饰点，以及所有“·” */
        .home-link::after,
        .home-link::before {
            display: none !important;
            content: none !important;
        }

        /* 确保没有任何多余的装饰文本或点 */
        .no-glow, .glow, .extra-decoration {
            display: none;
        }

        /* 小屏完美适配 */
        @media (max-width: 480px) {
            .full-center {
                padding: 1rem;
            }
            .home-link {
                padding: 0.6rem 2rem;
                border-radius: 50px;
                margin-top: 0.5rem;
            }
            .hint-message {
                margin: 0.3rem 0 1rem 0;
            }
        }

        /* 极高屏幕也完美居中 */
        @media (min-height: 900px) {
            .full-center {
                justify-content: center;
            }
        }

        /* 确保没有任何一个多余的“·”出现 — 连伪元素也清除 */
        body, div, p, span, a, h1, h2, h3, h4 {
            &::before, &::after {
                content: none !important;
            }
        }

        /* 额外保险：移除所有·相关的unicode符号或内容（如果有隐藏元素） */
        [class*="glow"], [class*="dot"], [class*="separator"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="full-center">
        <!-- 中央大红 404 -->
        <div class="four-oh-four">404</div>

        <!-- 小一点：File not found (无任何多余符号) -->
        <div class="file-not-found">File not found</div>

        <!-- 新增无框黑字提示行：完全符合要求 -->
        <div class="hint-message">请检查网址是否正确，或者功能可能已删除</div>

        <!-- 返回首页按钮，无箭头无符号，直接文字，跳转至根目录 luckynum.top -->
        <a href="https://luckynum.top" class="home-link">
            返回首页
        </a>
    </div>

    <!-- 没有任何脚本生成额外符号。简而又简 -->
</body>
</html>
