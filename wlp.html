    <script>
        function basicSanitize(html) {
            if (typeof html !== 'string') return '';
            return html
                .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                .replace(/\s*on\w+\s*=\s*["'][^"']*["']/gi, '')
                .replace(/javascript\s*:/gi, '');
        }

        window.toggleDropdown = function(id) {
            var menu = document.getElementById(id + 'Menu');
            if (!menu) return;
            var isOpen = menu.classList.contains('show');
            var allMenus = document.querySelectorAll('.dropdown-menu');
            for (var i = 0; i < allMenus.length; i++) {
                allMenus[i].classList.remove('show');
            }
            if (!isOpen) {
                menu.classList.add('show');
            }
        };

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown')) {
                var allMenus = document.querySelectorAll('.dropdown-menu');
                for (var i = 0; i < allMenus.length; i++) {
                    allMenus[i].classList.remove('show');
                }
            }
        });

        (function() {
            'use strict';

            var answerMap = new Map();
            var currentFileId = null;
            var currentDocSize = null;
            var activeInput = null;
            var isShifted = false;
            var isSymbolPage = false;
            var docLoaded = false;
            var dynamicMinScale = 0.5;
            var confirmYesCallback = null;
            var deleteRepeatTimer = null;
            var deleteRepeatInterval = null;
            var noIndividualCheck = false;
            var isCheckingAll = false;
            var isReceivedFile = false;

            var broadcastAbort = null;
            var broadcastToken = '';
            var isBroadcasting = false;
            var broadcastCount = 0;
            var isReceiving = false;

            var isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

            function vibrate(ms) {
                if (navigator.vibrate) navigator.vibrate(ms || 6);
            }

            var PAGE_SIZES = {
                'A4': { width: 210, height: 297 },
                'A4横向': { width: 297, height: 210 },
                'A4横': { width: 297, height: 210 },
                'A3': { width: 297, height: 420 },
                'A3横向': { width: 420, height: 297 },
                'A3横': { width: 420, height: 297 },
                'A5': { width: 148, height: 210 },
                'A5横向': { width: 210, height: 148 },
                'A5横': { width: 210, height: 148 },
                'B4': { width: 257, height: 364 },
                'B5': { width: 182, height: 257 },
                'letter': { width: 215.9, height: 279.4 },
                'legal': { width: 215.9, height: 355.6 }
            };

            var docScale = 1,
                docTx = 0,
                docTy = 0;
            var MAX_SCALE = 5.0,
                SCALE_STEP = 0.1;
            var dragging = false,
                dragStart = { x: 0, y: 0 },
                dragStartTrans = { x: 0, y: 0 };
            var lastDist = 0,
                lastCtr = { x: 0, y: 0, sx: 0, sy: 0 };
            var userScale = null,
                userTrans = null;
            var keyboardVisible = false,
                lastKnownH = window.innerHeight;

            function setZoomEnabled(enabled) {
                document.getElementById('btnZoomIn').disabled = !enabled;
                document.getElementById('btnZoomOut').disabled = !enabled;
                document.getElementById('viewport').classList.toggle('interactive', enabled);
            }
            setZoomEnabled(false);

            function updateTransform() {
                document.getElementById('docStage').style.transform =
                    'translate(' + docTx + 'px,' + docTy + 'px) scale(' + docScale + ')';
            }

            function updateZoomDisplay() {
                document.getElementById('zoomLevel').textContent = Math.round(docScale * 100) + '%';
            }

            function setDocScale(s) {
                var c = Math.min(MAX_SCALE, Math.max(dynamicMinScale, Math.round(s * 100) / 100));
                if (c !== docScale) {
                    docScale = c;
                    updateTransform();
                    updateZoomDisplay();
                }
            }

            function saveUserTransform() {
                userScale = docScale;
                userTrans = { x: docTx, y: docTy };
            }

            function clampTranslate() {
                var vp = document.getElementById('viewport');
                var vw = vp.clientWidth,
                    vh = vp.clientHeight;
                var docEl = document.getElementById('docViewer');
                var dw = docEl.offsetWidth * docScale;
                var dh = docEl.offsetHeight * docScale;
                if (dw <= vw) docTx = (vw - dw) / 2;
                else docTx = Math.min(0, Math.max(vw - dw, docTx));
                if (dh <= vh) docTy = 0;
                else docTy = Math.min(0, Math.max(vh - dh, docTy));
            }

            window.zoomIn = function() {
                if (!docLoaded) return;
                var ns = docScale + SCALE_STEP;
                if (ns > MAX_SCALE) return;
                setDocScale(ns);
                clampTranslate();
                saveUserTransform();
                updateTransform();
            };

            window.zoomOut = function() {
                if (!docLoaded) return;
                var ns = docScale - SCALE_STEP;
                if (ns < dynamicMinScale) return;
                setDocScale(ns);
                clampTranslate();
                saveUserTransform();
                updateTransform();
            };

            var viewportEl = document.getElementById('viewport');

            function getDist(a, b) {
                return Math.sqrt((a.clientX - b.clientX) * (a.clientX - b.clientX) + (a.clientY - b.clientY) * (a.clientY -
                    b.clientY));
            }

            function getCtr(a, b) {
                return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
            }

            viewportEl.addEventListener('touchstart', function(e) {
                if (!docLoaded) return;
                if (e.target.closest('.fill-blank-input,.check-btn,.inline-check-btn,.kb-key,.custom-keyboard'))
                    return;
                var t = e.touches;
                if (t.length === 1) {
                    dragging = true;
                    dragStart.x = t[0].clientX;
                    dragStart.y = t[0].clientY;
                    dragStartTrans.x = docTx;
                    dragStartTrans.y = docTy;
                } else if (t.length === 2) {
                    dragging = false;
                    lastDist = getDist(t[0], t[1]);
                    lastCtr = getCtr(t[0], t[1]);
                    lastCtr.sx = (lastCtr.x - docTx) / docScale;
                    lastCtr.sy = (lastCtr.y - docTy) / docScale;
                }
            }, { passive: false });

            viewportEl.addEventListener('touchmove', function(e) {
                if (!docLoaded) return;
                e.preventDefault();
                var t = e.touches;
                if (t.length === 1 && dragging) {
                    docTx = dragStartTrans.x + (t[0].clientX - dragStart.x);
                    docTy = dragStartTrans.y + (t[0].clientY - dragStart.y);
                    clampTranslate();
                    updateTransform();
                    saveUserTransform();
                } else if (t.length === 2) {
                    var nd = getDist(t[0], t[1]);
                    var nc = getCtr(t[0], t[1]);
                    if (lastDist > 0) {
                        var ns = Math.min(MAX_SCALE, Math.max(dynamicMinScale, docScale * (nd / lastDist)));
                        docTx = nc.x - lastCtr.sx * ns;
                        docTy = nc.y - lastCtr.sy * ns;
                        docScale = Math.round(ns * 100) / 100;
                        clampTranslate();
                        updateTransform();
                        updateZoomDisplay();
                        saveUserTransform();
                    }
                    lastDist = nd;
                    lastCtr = nc;
                    lastCtr.sx = (nc.x - docTx) / docScale;
                    lastCtr.sy = (nc.y - docTy) / docScale;
                }
            }, { passive: false });

            viewportEl.addEventListener('touchend', function(e) {
                if (e.touches.length === 0) {
                    dragging = false;
                    lastDist = 0;
                }
            });

            viewportEl.addEventListener('wheel', function(e) {
                if (!docLoaded) return;
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    var d = e.deltaY > 0 ? -SCALE_STEP : SCALE_STEP;
                    var ns = docScale + d;
                    if (ns < dynamicMinScale || ns > MAX_SCALE) return;
                    var r = viewportEl.getBoundingClientRect();
                    var mx = e.clientX - r.left;
                    var my = e.clientY - r.top;
                    var sx = (mx - docTx) / docScale;
                    var sy = (my - docTy) / docScale;
                    var cns = Math.min(MAX_SCALE, Math.max(dynamicMinScale, ns));
                    docTx = mx - sx * cns;
                    docTy = my - sy * cns;
                    docScale = Math.round(cns * 100) / 100;
                    clampTranslate();
                    updateTransform();
                    updateZoomDisplay();
                    saveUserTransform();
                }
            }, { passive: false });

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function() {
                    var h = window.visualViewport.height;
                    if (h < lastKnownH - 80) keyboardVisible = true;
                    else if (h >= lastKnownH - 30) {
                        keyboardVisible = false;
                        lastKnownH = h;
                    }
                    if (!keyboardVisible) lastKnownH = Math.max(lastKnownH, h);
                });
            }

            function updateViewportTop() {
                var top = document.getElementById('headerBar').offsetHeight;
                var bb = document.getElementById('broadcastBar');
                if (bb.classList.contains('show')) top += bb.offsetHeight;
                document.getElementById('viewport').style.top = top + 'px';
            }
            updateViewportTop();
            window.addEventListener('resize', updateViewportTop);

            window.openFileDialog = function() {
                isReceivedFile = false;
                document.getElementById('fileInput').click();
            };

            window.downloadCurrentFile = function() {
                if (!currentFileId) {
                    alert('⚠️ 请先打开一个文件再下载');
                    return;
                }
                var file = document.getElementById('fileInput').files[0];
                if (isReceivedFile || !file) {
                    showSecurityConfirm(function(confirmed) {
                        if (confirmed) {
                            doDownloadFile(file);
                        }
                    });
                    return;
                }
                doDownloadFile(file);
            };

            function doDownloadFile(file) {
                if (!file) {
                    var viewer = document.getElementById('docViewer');
                    var text = viewer.textContent || '';
                    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = (document.title || '题目') + '.txt';
                    a.click();
                    URL.revokeObjectURL(url);
                    return;
                }
                var url = URL.createObjectURL(file);
                var a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                a.click();
                URL.revokeObjectURL(url);
            }

            // ========== 安全确认弹窗（修复版） ==========
            function showSecurityConfirm(callback) {
                var overlay = document.getElementById('confirmOverlay');
                var msgP = document.getElementById('confirmMsg');
                var yesBtn = document.getElementById('btnConfirmYes');
                var noBtn = document.getElementById('btnConfirmNo');

                document.getElementById('confirmInput').style.display = 'none';

                msgP.innerHTML =
                    '<div style="text-align:left;font-size:13px;line-height:1.7;">' +
                    '<div style="text-align:center;font-size:18px;margin-bottom:8px;">⚠️ 安全提示</div>' +
                    '<p>本文件由发送端上传，同一口令下可能存在多人传输导致文件串台。</p>' +
                    '<p>本服务仅提供文件传输通道，不进行任何安全检测。</p>' +
                    '<p style="color:#e91e63;font-weight:500;">请在确认文件来源可靠后再下载，因下载文件造成的任何问题本站概不负责。</p>' +
                    '</div>' +
                    '<div class="security-checkbox-wrapper" id="securityCheckboxWrapper">' +
                    '<input type="checkbox" id="securityCheckbox" onchange="window._onSecurityCheckboxChange()">' +
                    '<label for="securityCheckbox">我已阅读并确认下载</label>' +
                    '</div>';

                yesBtn.className = 'btn-yes btn-yes-disabled';
                yesBtn.textContent = '确认下载';
                yesBtn.disabled = true;

                noBtn.textContent = '取消下载';
                noBtn.className = 'btn-no';

                overlay.classList.add('show');

                // 用全局函数处理复选框变化
                window._onSecurityCheckboxChange = function() {
                    var cb = document.getElementById('securityCheckbox');
                    var yb = document.getElementById('btnConfirmYes');
                    if (cb && yb) {
                        if (cb.checked) {
                            yb.disabled = false;
                            yb.className = 'btn-yes btn-yes-ready';
                        } else {
                            yb.disabled = true;
                            yb.className = 'btn-yes btn-yes-disabled';
                        }
                    }
                };

                // 点击wrapper切换复选框
                var wrapper = document.getElementById('securityCheckboxWrapper');
                if (wrapper) {
                    wrapper.onclick = function(e) {
                        if (e.target.tagName !== 'INPUT') {
                            var cb = document.getElementById('securityCheckbox');
                            if (cb) {
                                cb.checked = !cb.checked;
                                window._onSecurityCheckboxChange();
                            }
                        }
                    };
                }

                // 确认按钮
                var newYesBtn = yesBtn.cloneNode(true);
                yesBtn.parentNode.replaceChild(newYesBtn, yesBtn);
                var newNoBtn = noBtn.cloneNode(true);
                noBtn.parentNode.replaceChild(newNoBtn, noBtn);

                newYesBtn.onclick = function() {
                    var cb = document.getElementById('securityCheckbox');
                    if (!cb || !cb.checked) {
                        alert('请先勾选"我已阅读并确认下载"');
                        return;
                    }
                    overlay.classList.remove('show');
                    if (callback) callback(true);
                };

                newNoBtn.onclick = function() {
                    overlay.classList.remove('show');
                    if (callback) callback(false);
                };
            }

            function showConfirm(msg, onYes, showInput, btnClass) {
                document.getElementById('confirmMsg').innerHTML = basicSanitize(msg.replace(/\n/g, '<br>'));
                confirmYesCallback = onYes;
                var inputDiv = document.getElementById('confirmInput');
                var yesBtn = document.getElementById('btnConfirmYes');
                if (showInput) {
                    inputDiv.style.display = 'block';
                    document.getElementById('confirmInputField').value = '';
                } else {
                    inputDiv.style.display = 'none';
                }
                yesBtn.className = btnClass || 'btn-yes';
                document.getElementById('confirmOverlay').classList.add('show');
            }

            document.getElementById('btnConfirmYes').onclick = function() {
                var val = document.getElementById('confirmInputField').value.trim();
                var cb = confirmYesCallback;
                document.getElementById('confirmOverlay').classList.remove('show');
                confirmYesCallback = null;
                if (cb) cb(val);
            };

            document.getElementById('btnConfirmNo').onclick = function() {
                document.getElementById('confirmOverlay').classList.remove('show');
                confirmYesCallback = null;
            };

            window.confirmReset = function() {
                showConfirm('🔄 确定要重置所有答案吗？\n（已填写的答案将被清空）', function() {
                    resetAllAnswers();
                });
            };

            window.confirmClearData = function() {
                showConfirm('🗑️ 确定要清除所有数据吗？\n（包括答案、错误记录和统计数据）', function() {
                    clearExerciseData();
                });
            };

            function updateBroadcastBar(text, type) {
                var bar = document.getElementById('broadcastBar');
                bar.textContent = text;
                bar.className = 'broadcast-bar show';
                if (type === 'receiving') bar.classList.add('receiving');
                else bar.classList.remove('receiving');
                updateViewportTop();
            }

            function hideBroadcastBar() {
                document.getElementById('broadcastBar').classList.remove('show');
                updateViewportTop();
            }

            window.stopBroadcast = function() {
                if (broadcastAbort) {
                    broadcastAbort.abort();
                    broadcastAbort = null;
                }
                isBroadcasting = false;
                hideBroadcastBar();
                document.getElementById('btnBroadcast').textContent = '📡 广播题目';
                document.getElementById('btnReceive').style.display = '';
            };

            window.stopReceive = function() {
                if (broadcastAbort) {
                    broadcastAbort.abort();
                    broadcastAbort = null;
                }
                isReceiving = false;
                hideBroadcastBar();
                document.getElementById('btnReceive').textContent = '📥 接收广播';
                document.getElementById('btnBroadcast').style.display = '';
            };

            window.startBroadcast = function() {
                if (!currentFileId) {
                    alert('⚠️ 请先打开一个文件再进行广播');
                    return;
                }
                if (isBroadcasting) {
                    stopBroadcast();
                    return;
                }
                showConfirm('📡 请输入广播口令：\n\n⚠️ 关闭或刷新页面后广播会被停止', function(token) {
                    if (!token) {
                        alert('请输入口令');
                        return;
                    }
                    doBroadcast(token);
                }, true, 'btn-bc');
            };

            async function doBroadcast(token) {
                if (broadcastAbort) {
                    broadcastAbort.abort();
                    broadcastAbort = null;
                }
                broadcastAbort = new AbortController();
                broadcastToken = token;
                isBroadcasting = true;
                broadcastCount = 0;

                document.getElementById('btnBroadcast').textContent = '⏹ 终止广播';
                document.getElementById('btnReceive').style.display = 'none';

                var file = document.getElementById('fileInput').files[0];
                if (!file) {
                    alert('请重新选择文件后再广播');
                    stopBroadcast();
                    return;
                }

                var ext = file.name.split('.').pop() || 'docx';
                var safeName = 'file.' + ext;

                updateBroadcastBar('📡 广播中: ' + token + ' | 已接收 0 次', 'broadcast');

                while (isBroadcasting && !broadcastAbort.signal.aborted) {
                    try {
                        var resp = await fetch('https://ppng.io/' + token, {
                            method: 'PUT',
                            body: file,
                            signal: broadcastAbort.signal,
                            headers: {
                                'Content-Disposition': 'attachment; filename="' + safeName + '"'
                            }
                        });
                        if (resp.ok) {
                            broadcastCount++;
                            var displayCount = Math.max(0, broadcastCount - 1);
                            updateBroadcastBar('📡 广播中: ' + token + ' | 已接收 ' + displayCount + ' 次', 'broadcast');
                        }
                    } catch (err) {
                        if (err.name === 'AbortError') break;
                    }
                    if (isBroadcasting && !broadcastAbort.signal.aborted) {
                        await new Promise(function(r) { setTimeout(r, 100); });
                    }
                }
                stopBroadcast();
            }

            window.startReceive = function() {
                showConfirm('📥 请输入接收口令：', function(token) {
                    if (!token) {
                        alert('请输入口令');
                        return;
                    }
                    doReceive(token);
                }, true, 'btn-rc');
            };

            async function tryLoadWithFallback(blob, originalName) {
                var exts = ['docx', 'xlsx', 'txt'];
                var origExt = originalName.split('.').pop().toLowerCase();
                var tryExts = [origExt];
                for (var i = 0; i < exts.length; i++) {
                    if (exts[i] !== origExt) tryExts.push(exts[i]);
                }
                var lastErr = null;
                for (var i = 0; i < tryExts.length; i++) {
                    var ext = tryExts[i];
                    if (!ext) continue;
                    var fn = originalName.replace(/\.[^.]+$/, '') + '.' + ext;
                    try {
                        var file = new File([blob], fn, { type: 'application/octet-stream' });
                        var dt = new DataTransfer();
                        dt.items.add(file);
                        document.getElementById('fileInput').files = dt.files;
                        isReceivedFile = true;
                        await loadFile(file);
                        return true;
                    } catch (err) {
                        lastErr = err;
                    }
                }
                throw lastErr || new Error('无法识别文件类型');
            }

            async function doReceive(token) {
                if (broadcastAbort) {
                    broadcastAbort.abort();
                    broadcastAbort = null;
                }
                broadcastAbort = new AbortController();
                broadcastToken = token;
                isReceiving = true;

                updateBroadcastBar('📥 正在接收广播: ' + token + ' ...', 'receiving');
                document.getElementById('btnReceive').textContent = '⏹ 停止接收';
                document.getElementById('btnBroadcast').style.display = 'none';

                var fileReceived = false;

                while (isReceiving && !broadcastAbort.signal.aborted && !fileReceived) {
                    try {
                        var resp = await fetch('https://ppng.io/' + token, {
                            method: 'GET',
                            signal: broadcastAbort.signal
                        });
                        if (!resp.ok) {
                            updateBroadcastBar('📥 等待广播: ' + token + ' ...', 'receiving');
                            await new Promise(function(r) { setTimeout(r, 1000); });
                            continue;
                        }
                        var cd = resp.headers.get('Content-Disposition') || '';
                        var fn = 'received.docx';
                        var m = cd.match(/filename="?([^"]+)"?/);
                        if (m) fn = m[1];

                        updateBroadcastBar('📥 正在下载: ' + fn + ' ...', 'receiving');
                        var blob = await resp.blob();
                        await tryLoadWithFallback(blob, fn);

                        fileReceived = true;
                        isReceiving = false;
                        document.getElementById('btnReceive').textContent = '📥 接收广播';
                        document.getElementById('btnBroadcast').style.display = '';
                        hideBroadcastBar();
                        updateBroadcastBar('✅ 接收完成', 'receiving');
                        setTimeout(hideBroadcastBar, 2000);
                        break;
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            hideBroadcastBar();
                            break;
                        }
                        updateBroadcastBar('📥 连接失败，1秒后重试...', 'receiving');
                        await new Promise(function(r) { setTimeout(r, 1000); });
                    }
                }

                if (!fileReceived) {
                    stopReceive();
                }
            }

            window.addEventListener('beforeunload', function() {
                if (broadcastAbort) broadcastAbort.abort();
                if (currentFileId) saveToHistory();
            });

            function parseDocSize(text) {
                for (var key in PAGE_SIZES) {
                    if (PAGE_SIZES.hasOwnProperty(key)) {
                        var regex = new RegExp('\\[' + key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\]', 'i');
                        if (regex.test(text)) return PAGE_SIZES[key];
                    }
                }
                var cm = text.match(/\[(\d+\.?\d*)\s*:\s*(\d+\.?\d*)\]/);
                if (cm) {
                    var w = parseFloat(cm[1]);
                    var h = parseFloat(cm[2]);
                    if (w < 50 && h < 50) {
                        return { width: 210, height: 210 * (h / w) };
                    }
                    return { width: w, height: h };
                }
                return PAGE_SIZES['A4'];
            }

            function centerDocument(respectUser) {
                if (keyboardVisible) return;
                if (respectUser && userScale) {
                    docScale = Math.max(dynamicMinScale, userScale);
                    docTx = userTrans.x;
                    docTy = userTrans.y;
                    clampTranslate();
                    updateTransform();
                    updateZoomDisplay();
                    return;
                }
                var vp = document.getElementById('viewport');
                var v = document.getElementById('docViewer');
                if (!currentDocSize) currentDocSize = PAGE_SIZES['A4'];
                var mm = 3.779527559;
                var dw = currentDocSize.width * mm;
                var dh = currentDocSize.height * mm;
                var vw = vp.clientWidth;
                var vh = vp.clientHeight;
                var minW = Math.max(dw, vw);
                v.style.width = minW + 'px';
                v.style.minHeight = dh + 'px';
                var fitScale = vw / minW;
                dynamicMinScale = Math.round(fitScale * 100) / 100;
                if (dynamicMinScale > 1.0) dynamicMinScale = 1.0;
                docScale = dynamicMinScale;
                docTx = (vw - minW * docScale) / 2;
                docTy = 0;
                userScale = null;
                userTrans = null;
                clampTranslate();
                updateTransform();
                updateZoomDisplay();
            }

            function getUrlParam(name) {
                return new URL(window.location.href).searchParams.get(name);
            }

            async function loadFromUrl(fileUrl) {
                if (!fileUrl.startsWith('http')) {
                    fileUrl = new URL(fileUrl, window.location.href).href;
                }
                try {
                    var r = await fetch(fileUrl);
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    var blob = await r.blob();
                    var fn = fileUrl.split('/').pop().split('?')[0] || 'doc';
                    await tryLoadWithFallback(blob, fn);
                } catch (err) {}
            }

            async function loadFile(file) {
                var ext = file.name.split('.').pop().toLowerCase();
                currentFileId = 'file_' + file.name + '_' + file.size + '_' + file.lastModified;
                userScale = null;
                userTrans = null;
                keyboardVisible = false;
                lastKnownH = window.innerHeight;
                docLoaded = false;
                setZoomEnabled(false);
                noIndividualCheck = false;
                isCheckingAll = false;
                dynamicMinScale = 0.5;

                var viewer = document.getElementById('docViewer');
                viewer.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><div>加载中...</div></div>';

                try {
                    var rawText = '';

                    if (ext === 'docx') {
                        var ab = await file.arrayBuffer();
                        var mr = await mammoth.extractRawText({ arrayBuffer: ab });
                        rawText = mr.value;
                        currentDocSize = parseDocSize(rawText);
                        parseQATags(rawText);
                        parseExtraTags(rawText);
                        viewer.innerHTML = '';
                        var wrapper = document.createElement('div');
                        wrapper.className = 'docx-wrapper';
                        viewer.appendChild(wrapper);
                        await docx.renderAsync(ab, wrapper, null, {
                            className: 'docx-content',
                            inWrapper: true,
                            ignoreWidth: false,
                            ignoreHeight: false,
                            ignoreFonts: false,
                            breakPages: true,
                            ignoreLastRenderedPageBreak: true,
                            experimental: false
                        });
                        processRenderedDOM(viewer);
                        finishLoad();

                    } else if (ext === 'txt') {
                        rawText = await file.text();
                        currentDocSize = parseDocSize(rawText);
                        parseQATags(rawText);
                        parseExtraTags(rawText);
                        viewer.innerHTML = '<div class="txt-content">' + processTextContent(rawText) + '</div>';
                        finishLoad();

                    } else if (ext === 'xlsx') {
                        var ab2 = await file.arrayBuffer();
                        var wb = XLSX.read(ab2, { type: 'array' });
                        rawText = '';
                        wb.SheetNames.forEach(function(n) {
                            var s = wb.Sheets[n];
                            if (!s || !s['!ref']) return;
                            var rng = XLSX.utils.decode_range(s['!ref']);
                            for (var r = rng.s.r; r <= rng.e.r; r++) {
                                var rt = '';
                                for (var c = rng.s.c; c <= rng.e.c; c++) {
                                    var cr = XLSX.utils.encode_cell({ r: r, c: c });
                                    var cell = s[cr];
                                    if (cell) {
                                        rt += (String(cell.w || cell.v || '').replace(/\n/g, ' ')) + ' ';
                                    }
                                }
                                rawText += rt.trim() + '\n';
                            }
                        });
                        currentDocSize = parseDocSize(rawText);
                        parseQATags(rawText);
                        parseExtraTags(rawText);
                        viewer.innerHTML = '<div class="xlsx-content">' + xlsxToHTML(wb) + '</div>';
                        handleCheancTagsInHTML(viewer);
                        cleanupXlsxEmptyRowsCols(viewer);
                        cleanupXlsxTagText(viewer);
                        finishLoad();

                    } else {
                        throw new Error('不支持的文件格式: .' + ext);
                    }

                } catch (err) {
                    viewer.innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>加载失败: ' +
                        escHtml(err.message) + '</p></div>';
                    throw err;
                }
            }

            function finishLoad() {
                centerDocument(false);
                bindEvents();
                docLoaded = true;
                setZoomEnabled(true);

                var h = getHistoryData(currentFileId);
                if (h.answers && Object.keys(h.answers).length > 0) {
                    setTimeout(function() {
                        restoreHistory(currentFileId);
                    }, 300);
                }
                updateViewportTop();

                var file = document.getElementById('fileInput').files[0];
                if (file) {
                    document.title = file.name + ' - 交互式填空题';
                }
            }

            function cleanupXlsxTagText(container) {
                var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                var nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(function(n) {
                    var t = n.textContent;
                    for (var k in PAGE_SIZES) {
                        if (PAGE_SIZES.hasOwnProperty(k)) {
                            t = t.replace(new RegExp('\\[' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\]', 'gi'), '');
                        }
                    }
                    t = t.replace(/\[noet\]/gi, '').replace(/\[webpage\]/gi, '');
                    if (t !== n.textContent) n.textContent = t;
                });
            }

            function parseQATags(text) {
                answerMap.clear();
                var sw = loadWrongCounts(currentFileId);

                var matches = text.matchAll(/A(\d+)\[([\s\S]*?)\]/gi);
                for (var m of matches) {
                    var qKey = 'Q' + m[1];
                    answerMap.set(qKey, {
                        answer: m[2].replace(/\n/g, '').trim(),
                        checked: false,
                        wrongCount: sw[qKey] || 0
                    });
                }

                var matches2 = text.matchAll(/Q(\d+)\[([\s\S]*?)\]/gi);
                for (var m2 of matches2) {
                    var key = 'Q' + m2[1];
                    if (!answerMap.has(key)) {
                        answerMap.set(key, {
                            answer: '',
                            checked: false,
                            wrongCount: sw[key] || 0
                        });
                    }
                }
            }

            function parseExtraTags(text) {
                if (/\[noet\]/i.test(text)) {
                    noIndividualCheck = true;
                }
            }

            function parseCheancTag(match) {
                var inner = match[1] || '';
                var parts = inner.split(',');
                return {
                    label: (parts[0] || '').trim() || '检查答案',
                    size: Math.max(8, Math.min(200, parseInt(parts[1]) || 14)),
                    centered: (parts[2] || '').trim().toLowerCase() === 'middle'
                };
            }

            function renderCheancBtn(cfg) {
                return '<button class="inline-check-btn' + (cfg.centered ? ' centered' : '') +
                    '" style="font-size:' + cfg.size + 'px;">' +
                    escHtml(cfg.label) +
                    '</button>';
            }

            function processTextContent(text) {
                text = text.replace(/\[dpstart\][\s\S]*?\[dpend\]/gi, '')
                    .replace(/\[dpstart\]/gi, '')
                    .replace(/\[dpend\]/gi, '')
                    .replace(/\[noet\]/gi, '');

                for (var k in PAGE_SIZES) {
                    if (PAGE_SIZES.hasOwnProperty(k)) {
                        text = text.replace(new RegExp('\\[' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\]', 'gi'), '');
                    }
                }
                text = text.replace(/\[\d+\.?\d*\s*:\s*\d+\.?\d*\]/g, '');

                text = text.replace(/cheanc\[([\s\S]*?)\]/gi, function(m, inner) {
                    var cfg = parseCheancTag([null, inner]);
                    return renderCheancBtn(cfg);
                });

                text = text.replace(/Q(\d+)\[([\s\S]*?)\]/gi, function(m, num, content) {
                    var q = 'Q' + num;
                    var a = answerMap.get(q);
                    var isChinese = a && a.answer && /[\u4e00-\u9fff]/.test(a.answer);
                    return '<span class="fill-blank-wrapper" data-q="' + q + '">' +
                        (content.trim() ? '<span style="color:#888;">' + escHtml(content) + '</span>' : '') +
                        '<input type="text" class="fill-blank-input' + (isChinese ? ' native-input' : '') +
                        '" data-q="' + q + '" data-ans="' + (a ? a.answer : '') +
                        '" placeholder="' + (content.trim() || '答案') +
                        '" style="min-width:80px;" ' + (isChinese ? '' : 'inputmode="none"') +
                        ' autocomplete="off">' +
                        (noIndividualCheck ? '' : '<button class="check-btn" data-q="' + q + '">检查</button>') +
                        '<span class="result-icon" data-q="' + q + '"></span>' +
                        '<span class="answer-display" data-q="' + q + '"></span>' +
                        '</span>';
                });

                return text.replace(/A\d+\[[\s\S]*?\]/gi, '');
            }

            function xlsxToHTML(wb) {
                var sheetsData = [];
                wb.SheetNames.forEach(function(name) {
                    var s = wb.Sheets[name];
                    if (!s || !s['!ref']) return;
                    var rng = XLSX.utils.decode_range(s['!ref']);
                    var rows = [];
                    for (var r = rng.s.r; r <= rng.e.r; r++) {
                        var row = [];
                        for (var c = rng.s.c; c <= rng.e.c; c++) {
                            var cr = XLSX.utils.encode_cell({ r: r, c: c });
                            var cell = s[cr];
                            var v = '';
                            if (cell) v = String(cell.w || cell.v || '').trim();
                            row.push(v);
                        }
                        rows.push(row);
                    }
                    sheetsData.push(rows);
                });

                var maxCols = 0;
                sheetsData.forEach(function(rows) {
                    rows.forEach(function(row) { maxCols = Math.max(maxCols, row.length); });
                });

                var emptyCols = new Set();
                for (var c = 0; c < maxCols; c++) {
                    var allEmpty = true;
                    sheetsData.forEach(function(rows) {
                        rows.forEach(function(row) {
                            if (c < row.length && row[c].trim() !== '') allEmpty = false;
                        });
                    });
                    if (allEmpty) emptyCols.add(c);
                }

                var h = '';
                var cbh = '';
                var hc = false;

                sheetsData.forEach(function(rows) {
                    h += '<table>';
                    rows.forEach(function(row) {
                        var rowHasContent = false;
                        for (var c = 0; c < row.length; c++) {
                            if (!emptyCols.has(c) && row[c].trim() !== '') { rowHasContent = true; break; }
                        }
                        if (!rowHasContent) return;

                        var rh = '';
                        for (var c = 0; c < maxCols; c++) {
                            if (emptyCols.has(c)) continue;
                            var v = c < row.length ? row[c] : '';

                            if (/cheanc\[.*,.*middle.*\]/i.test(v)) {
                                hc = true;
                                cbh = v.replace(/cheanc\[([\s\S]*?)\]/gi, function(m, inner) {
                                    return renderCheancBtn(parseCheancTag([null, inner]));
                                });
                                v = v.replace(/cheanc\[[\s\S]*?\]/gi, '');
                            }

                            v = v.replace(/Q(\d+)\[([\s\S]*?)\]/gi, function(m, num, ct) {
                                var q = 'Q' + num;
                                var a = answerMap.get(q);
                                var isChinese = a && a.answer && /[\u4e00-\u9fff]/.test(a.answer);
                                return '<span class="fill-blank-wrapper" data-q="' + q + '">' +
                                    (ct.trim() ? '<span style="color:#888;">' + escHtml(ct) + '</span>' : '') +
                                    '<input type="text" class="fill-blank-input' + (isChinese ? ' native-input' : '') +
                                    '" data-q="' + q + '" data-ans="' + (a ? a.answer : '') +
                                    '" placeholder="' + (ct.trim() || '答案') +
                                    '" style="min-width:80px;" ' + (isChinese ? '' : 'inputmode="none"') +
                                    ' autocomplete="off">' +
                                    (noIndividualCheck ? '' : '<button class="check-btn" data-q="' + q + '">检查</button>') +
                                    '<span class="result-icon" data-q="' + q + '"></span>' +
                                    '<span class="answer-display" data-q="' + q + '"></span></span>';
                            });

                            v = v.replace(/\[dpstart\]/gi, '').replace(/\[dpend\]/gi, '');
                            for (var k in PAGE_SIZES) {
                                if (PAGE_SIZES.hasOwnProperty(k)) {
                                    v = v.replace(new RegExp('\\[' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\]', 'gi'), '');
                                }
                            }
                            v = v.replace(/\[noet\]/gi, '').replace(/\[webpage\]/gi, '');
                            v = v.replace(/A\d+\[[\s\S]*?\]/gi, '');
                            rh += '<td>' + v + '</td>';
                        }
                        h += '<tr>' + rh + '</tr>';
                    });
                    h += '</table><br>';
                });

                if (hc) h += cbh;
                return h;
            }

            function cleanupXlsxEmptyRowsCols(container) {
                container.querySelectorAll('table').forEach(function(table) {
                    table.querySelectorAll('tr').forEach(function(tr) {
                        var hasContent = false;
                        tr.querySelectorAll('td').forEach(function(td) {
                            if ((td.textContent || '').replace(/\s/g, '') !== '' || td.querySelector('.fill-blank-input,.inline-check-btn'))
                                hasContent = true;
                        });
                        if (!hasContent) tr.remove();
                    });
                    if (table.querySelectorAll('tr').length === 0) table.remove();
                });
            }

            function handleCheancTagsInHTML(container) {
                var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                var nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(function(n) {
                    if (/cheanc\[/i.test(n.textContent)) {
                        var s = document.createElement('span');
                        s.innerHTML = n.textContent.replace(/cheanc\[([\s\S]*?)\]/gi, function(m, inner) {
                            return renderCheancBtn(parseCheancTag([null, inner]));
                        });
                        n.parentElement.replaceChild(s, n);
                    }
                });
            }

            document.getElementById('fileInput').addEventListener('change', async function(e) {
                if (e.target.files[0]) {
                    isReceivedFile = false;
                    await loadFile(e.target.files[0]);
                }
            });

            function processRenderedDOM(container) {
                markDpRegionsInText(container);
                replaceQTags(container);
                removeATags(container);
                removeSizeTags(container);
                handleCheancTags(container);
            }

            function markDpRegionsInText(container) {
                var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                var allNodes = [];
                while (walker.nextNode()) allNodes.push(walker.currentNode);

                var dpRanges = [];
                var startIdx = -1;
                for (var i = 0; i < allNodes.length; i++) {
                    var t = allNodes[i].textContent;
                    if (/\[dpstart\]/i.test(t) && startIdx < 0) startIdx = i;
                    if (/\[dpend\]/i.test(t) && startIdx >= 0) {
                        dpRanges.push({ start: startIdx, end: i });
                        startIdx = -1;
                    }
                }
                if (startIdx >= 0) dpRanges.push({ start: startIdx, end: allNodes.length - 1 });

                dpRanges.forEach(function(range) {
                    for (var i = range.start; i <= range.end; i++) {
                        var node = allNodes[i];
                        var text = node.textContent;
                        text = text.replace(/\[dpstart\]/gi, '').replace(/\[dpend\]/gi, '');
                        if (i > range.start && i < range.end) text = '';
                        node.textContent = text;
                    }
                });
            }

            function handleCheancTags(container) {
                var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                var nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(function(n) {
                    if (/cheanc\[/i.test(n.textContent)) {
                        var s = document.createElement('span');
                        s.innerHTML = n.textContent.replace(/cheanc\[([\s\S]*?)\]/gi, function(m, inner) {
                            return renderCheancBtn(parseCheancTag([null, inner]));
                        });
                        n.parentElement.replaceChild(s, n);
                    }
                });
            }

            function replaceQTags(container) {
                var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                var nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(function(n) {
                    if (!n.parentElement || n.parentElement.closest('.fill-blank-wrapper')) return;
                    if (/\[noet\]/i.test(n.textContent)) {
                        n.textContent = n.textContent.replace(/\[noet\]/gi, '');
                        return;
                    }
                    if (!/Q\d+\[/i.test(n.textContent)) return;

                    var html = n.textContent.replace(/Q(\d+)\[([\s\S]*?)\]/gi, function(m, num, content) {
                        var q = 'Q' + num;
                        var a = answerMap.get(q);
                        var isChinese = a && a.answer && /[\u4e00-\u9fff]/.test(a.answer);
                        return '<span class="fill-blank-wrapper" data-q="' + q + '">' +
                            (content.trim() ? '<span style="color:#888;">' + escHtml(content) + '</span>' : '') +
                            '<input type="text" class="fill-blank-input' + (isChinese ? ' native-input' : '') +
                            '" data-q="' + q + '" data-ans="' + (a ? a.answer : '') +
                            '" placeholder="' + (content.trim() || '答案') + '" style="min-width:' +
                            (content.trim() ? '60px' : '80px') + ';" ' + (isChinese ? '' : 'inputmode="none"') +
                            ' autocomplete="off">' +
                            (noIndividualCheck ? '' : '<button class="check-btn" data-q="' + q + '">检查</button>') +
                            '<span class="result-icon" data-q="' + q + '"></span>' +
                            '<span class="answer-display" data-q="' + q + '"></span></span>';
                    });

                    if (html !== n.textContent) {
                        var s = document.createElement('span');
                        s.innerHTML = html;
                        n.parentElement.replaceChild(s, n);
                    }
                });
            }

            function removeATags(container) {
                var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                var nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(function(n) {
                    if (!n.parentElement || !n.parentElement.closest('.fill-blank-wrapper')) {
                        n.textContent = n.textContent.replace(/A\d+\[[\s\S]*?\]/gi, '');
                    }
                });
            }

            function removeSizeTags(container) {
                var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
                var nodes = [];
                while (walker.nextNode()) nodes.push(walker.currentNode);
                nodes.forEach(function(n) {
                    var t = n.textContent;
                    for (var k in PAGE_SIZES) {
                        if (PAGE_SIZES.hasOwnProperty(k)) {
                            t = t.replace(new RegExp('\\[' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\]', 'gi'), '');
                        }
                    }
                    t = t.replace(/\[noet\]/gi, '').replace(/\[webpage\]/gi, '');
                    n.textContent = t.replace(/\[\d+\.?\d*\s*:\s*\d+\.?\d*\]/g, '');
                });
            }

            function escHtml(str) {
                var d = document.createElement('div');
                d.textContent = str;
                return d.innerHTML;
            }

            function getAnswerType(ans) {
                if (!ans) return 'text';
                if (/[\u4e00-\u9fff]/.test(ans)) return 'text';
                if (/^[\d\s\.\,\+\-\*\/\=\(\)\[\]\{\}\%]+$/.test(ans)) return 'number';
                if (/^[a-zA-Z0-9\s\.\,\!\?\-\'\"\(\)\[\]\{\}\+\-\*\/\=\@\#\$\%\&\*\_\:\;]+$/.test(ans)) return 'english';
                return 'text';
            }

            function buildKeyboard(type) {
                var kb = document.getElementById('customKeyboard');
                if (type === 'text') {
                    kb.innerHTML = '';
                    kb.classList.remove('show');
                    return;
                }

                var rows = [];
                if (type === 'number') {
                    rows = [
                        ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
                        ['-', '+', '*', '/', '=', '.', ',', '(', ')', '⌫'],
                        [{ t: 'space', l: '空格' }, { t: 'done', l: '完成' }]
                    ];
                } else if (type === 'english') {
                    if (isSymbolPage) {
                        rows = [
                            ["'", '"', '!', '?', '-', '_', '.', '@', '#', '$'],
                            ['%', '^', '&', '*', '(', ')', '[', ']', '{', '}'],
                            [{ t: 'abc', l: 'ABC' }, ':', ';', '<', '>', '/', '\\', '~', '⌫'],
                            [{ t: 'num', l: '123' }, ',', '.', { t: 'space', l: '空格' }, '?', '!', "'", { t: 'done', l: '完成' }]
                        ];
                    } else {
                        var l1 = isShifted ? ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'] : ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'];
                        var l2 = isShifted ? ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'] : ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'];
                        var l3 = [{ t: 'shift', l: '⇧' }].concat(isShifted ? ['Z', 'X', 'C', 'V', 'B', 'N', 'M'] : ['z', 'x', 'c', 'v', 'b', 'n', 'm']).concat(['⌫']);
                        var l4 = [{ t: 'num', l: '123' }, { t: 'sym', l: '#+=' }, '.', { t: 'space', l: '空格' }, ',', '!', '?', { t: 'done', l: '完成' }];
                        rows = [l1, l2, l3, l4];
                    }
                } else if (type === 'num_from_eng') {
                    rows = [
                        ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
                        ['-', '+', '*', '/', '=', '.', ',', '(', ')', '⌫'],
                        [{ t: 'abc', l: 'ABC' }, { t: 'space', l: '空格' }, { t: 'done', l: '完成' }]
                    ];
                }

                kb.innerHTML = rows.map(function(r, ri) {
                    var pad = ri * 8;
                    return '<div class="kb-row" style="padding:0 ' + pad + 'px;">' +
                        r.map(function(k) {
                            if (typeof k === 'object') {
                                var cls = k.t === 'space' ? 'space' : k.t === 'done' ? 'done' : k.t === 'delete' ? 'delete' :
                                    k.t === 'shift' ? (isShifted ? 'shift active' : 'shift') : k.t === 'sym' ? 'symbol' : 'num-switch';
                                return '<button class="kb-key ' + cls + '" data-action="' + k.t + '">' + k.l + '</button>';
                            }
                            if (k === '⌫') return '<button class="kb-key delete" data-action="backspace">⌫</button>';
                            if (k === "'") return '<button class="kb-key" data-key="\'">\'</button>';
                            return '<button class="kb-key" data-key="' + k + '">' + k + '</button>';
                        }).join('') + '</div>';
                }).join('');
                kb.classList.add('show');
            }

            function hideKeyboard() {
                document.getElementById('customKeyboard').classList.remove('show');
                stopDeleteRepeat();
                activeInput = null;
                isShifted = false;
                isSymbolPage = false;
            }

            function stopDeleteRepeat() {
                if (deleteRepeatTimer) { clearTimeout(deleteRepeatTimer);
                    deleteRepeatTimer = null; }
                if (deleteRepeatInterval) { clearInterval(deleteRepeatInterval);
                    deleteRepeatInterval = null; }
            }

            function doDelete() {
                if (!activeInput) return;
                activeInput.value = activeInput.value.slice(0, -1);
                activeInput.dispatchEvent(new Event('input', { bubbles: true }));
                clearMarkOnEdit(activeInput);
            }

            function startDeleteRepeat() {
                doDelete();
                vibrate(5);
                deleteRepeatTimer = setTimeout(function() {
                    deleteRepeatInterval = setInterval(function() { doDelete();
                        vibrate(3); }, 50);
                }, 400);
            }

            function handleKeyAction(action, key) {
                if (!activeInput) return;
                vibrate(6);
                if (action === 'done') { hideKeyboard(); return; }
                if (action === 'backspace') { startDeleteRepeat(); return; }
                if (action === 'shift') { isShifted = !isShifted;
                    isSymbolPage = false;
                    buildKeyboard('english'); return; }
                if (action === 'num') { isShifted = false;
                    isSymbolPage = false;
                    buildKeyboard('num_from_eng'); return; }
                if (action === 'abc') { isShifted = false;
                    isSymbolPage = false;
                    buildKeyboard('english'); return; }
                if (action === 'sym') { isSymbolPage = !isSymbolPage;
                    buildKeyboard('english'); return; }
                if (action === 'space') { activeInput.value += ' ';
                    activeInput.dispatchEvent(new Event('input', { bubbles: true }));
                    clearMarkOnEdit(activeInput); return; }
                if (key) { activeInput.value += key;
                    activeInput.dispatchEvent(new Event('input', { bubbles: true }));
                    clearMarkOnEdit(activeInput); }
            }

            document.getElementById('customKeyboard').addEventListener('pointerdown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                var btn = e.target.closest('.kb-key');
                if (!btn || !activeInput) return;
                btn.classList.add('pressed');
                setTimeout(function() { btn.classList.remove('pressed'); }, 40);
                handleKeyAction(btn.dataset.action, btn.dataset.key);
            });

            document.getElementById('customKeyboard').addEventListener('pointerup', stopDeleteRepeat);
            document.getElementById('customKeyboard').addEventListener('pointerleave', stopDeleteRepeat);
            document.getElementById('customKeyboard').addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
            });

            function clearMarkOnEdit(input) {
                var q = input.dataset.q;
                var ic = document.querySelector('.result-icon[data-q="' + q + '"]');
                var dp = document.querySelector('.answer-display[data-q="' + q + '"]');
                if (ic && (ic.classList.contains('wrong') || ic.classList.contains('correct'))) {
                    ic.className = 'result-icon';
                    ic.textContent = '';
                    input.style.borderBottomColor = '#667eea';
                    input.style.color = 'inherit';
                    if (dp) { dp.classList.remove('show');
                        dp.textContent = ''; }
                    var a = answerMap.get(q);
                    if (a) { a.checked = false;
                        answerMap.set(q, a); }
                }
            }

            function bindEvents() {
                var checkBtns = document.querySelectorAll('.check-btn');
                for (var i = 0; i < checkBtns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function(e) { e.stopPropagation();
                            checkAnswer(this.dataset.q); });
                    })(checkBtns[i]);
                }

                var inlineBtns = document.querySelectorAll('.inline-check-btn');
                for (var i = 0; i < inlineBtns.length; i++) {
                    (function(btn) {
                        btn.onclick = function(e) { e.stopPropagation();
                            checkAllAnswers(); };
                    })(inlineBtns[i]);
                }

                var inputs = document.querySelectorAll('.fill-blank-input');
                for (var i = 0; i < inputs.length; i++) {
                    (function(input) {
                        var isNative = input.classList.contains('native-input');
                        input.addEventListener('keydown', function(e) {
                            if (e.key !== 'Enter' && e.key !== 'Tab') clearMarkOnEdit(input);
                            if (!isNative && isTouchDevice && activeInput === input && getAnswerType(input.dataset.ans || '') !==
                                'text') {
                                e.preventDefault();
                            }
                        });
                        input.addEventListener('focus', function() {
                            if (!isTouchDevice) return;
                            var t = getAnswerType(this.dataset.ans || '');
                            if (t === 'text') { hideKeyboard(); } else { activeInput = this;
                                isShifted = false;
                                isSymbolPage = false;
                                buildKeyboard(t); }
                        });
                        input.addEventListener('touchstart', function(e) {
                            e.stopPropagation();
                            if (isTouchDevice) {
                                var t = getAnswerType(this.dataset.ans || '');
                                if (t !== 'text') {
                                    e.preventDefault();
                                    if (activeInput !== this) { hideKeyboard();
                                        activeInput = this;
                                        isShifted = false;
                                        isSymbolPage = false;
                                        buildKeyboard(t);
                                        this.focus(); }
                                }
                            }
                        });
                        input.addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.stopPropagation();
                                checkAnswer(this.dataset.q); } });
                        input.addEventListener('blur', function() {
                            setTimeout(function() { if (document.querySelector('.kb-key.pressed') && activeInput === input)
                                    input.focus(); }, 100);
                            if (currentFileId) saveToHistory();
                        });
                    })(inputs[i]);
                }

                document.getElementById('docViewer').addEventListener('pointerdown', function(e) {
                    if (!e.target.closest('.fill-blank-input') && !e.target.closest('.custom-keyboard') &&
                        !e.target.closest('.check-btn') && !e.target.closest('.inline-check-btn')) {
                        hideKeyboard();
                    }
                });
            }

            function loadWrongCounts(fid) { var s = localStorage.getItem('wrong_' + fid); return s ? (JSON.parse(s) || {}) : {}; }

            function saveWrongCounts(fid) { var c = {};
                answerMap.forEach(function(a, k) { if (a.wrongCount > 0) c[k] = a.wrongCount; });
                localStorage.setItem('wrong_' + fid, JSON.stringify(c)); }

            function clearWrongCounts(fid) { localStorage.removeItem('wrong_' + fid); }

            function checkAnswer(qKey) {
                var a = answerMap.get(qKey);
                if (!a || !a.answer) return 'noanswer';
                var i = document.querySelector('.fill-blank-input[data-q="' + qKey + '"]');
                var ic = document.querySelector('.result-icon[data-q="' + qKey + '"]');
                var dp = document.querySelector('.answer-display[data-q="' + qKey + '"]');
                if (!i) return 'noinput';
                var u = i.value.trim();
                a.checked = true;
                var ok = false;
                var nu = u.replace(/\s+/g, ' ').trim();
                var pa = a.answer.split('|').map(function(x) { return x.replace(/\s+/g, ' ').trim(); });
                for (var j = 0; j < pa.length; j++) {
                    if (nu === pa[j] || nu.toLowerCase() === pa[j].toLowerCase() || nu.replace(/\s+/g, '').toLowerCase() === pa[j]
                        .replace(/\s+/g, '').toLowerCase()) {
                        ok = true;
                        break;
                    }
                }
                if (!ok) { a.wrongCount = (a.wrongCount || 0) + 1;
                    a.lastWrongAnswer = u;
                    saveWrongCounts(currentFileId); }
                answerMap.set(qKey, a);
                if (ic) { ic.className = 'result-icon ' + (ok ? 'correct' : 'wrong');
                    ic.textContent = ok ? '✓' : '✗'; }
                i.style.borderBottomColor = ok ? '#4caf50' : '#f44336';
                i.style.color = ok ? '#4caf50' : '#f44336';
                if (dp && !ok) { dp.textContent = '答案: ' + a.answer;
                    dp.classList.add('show'); }
                if (currentFileId) saveToHistory();
                return ok ? 'correct' : 'wrong';
            }

            function saveToHistory() {
                if (!currentFileId) return;
                var h = getHistoryData(currentFileId);
                var ans = {},
                    chk = {},
                    wa = {};
                answerMap.forEach(function(a, k) {
                    var i = document.querySelector('.fill-blank-input[data-q="' + k + '"]');
                    if (i && i.value.trim()) ans[k] = i.value;
                    if (a.checked) chk[k] = true;
                    if (a.lastWrongAnswer) wa[k] = a.lastWrongAnswer;
                });
                h.fileName = document.title;
                h.date = new Date().toISOString();
                h.answers = ans;
                h.checked = chk;
                h.wrongAnswers = wa;
                localStorage.setItem('quiz_' + currentFileId, JSON.stringify(h));
            }

            function getHistoryData(fid) {
                var s = localStorage.getItem('quiz_' + fid);
                return s ? (JSON.parse(s) || {}) : { fileName: '', date: '', answers: {}, checked: {}, wrongAnswers: {} };
            }

            function getAllHistory() {
                var h = [];
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k.startsWith('quiz_')) {
                        try { var d = JSON.parse(localStorage.getItem(k));
                            d.fileId = k.replace('quiz_', '');
                            h.push(d); } catch (e) {}
                    }
                }
                return h.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
            }

            function deleteHistory(fid) { localStorage.removeItem('quiz_' + fid);
                localStorage.removeItem('wrong_' + fid); }

            function restoreHistory(fid) {
                var h = getHistoryData(fid);
                var keys = Object.keys(h.answers);
                for (var i = 0; i < keys.length; i++) {
                    var k = keys[i];
                    var input = document.querySelector('.fill-blank-input[data-q="' + k + '"]');
                    if (input) { input.value = h.answers[k]; if (h.checked[k]) checkAnswerSilent(k, h.answers[k]); }
                }
            }

            function checkAnswerSilent(qKey, ua) {

                var i = document.querySelector('.fill-blank-input[data-q="' + qKey + '"]');
                var ic = document.querySelector('.result-icon[data-q="' + qKey + '"]');
                var dp = document.querySelector('.answer-display[data-q="' + qKey + '"]');
                if (!i) return;
                a.checked = true;
                var ok = false;
                var nu = ua.replace(/\s+/g, ' ').trim();
                var pa = a.answer.split('|').map(function(x) { return x.replace(/\s+/g, ' ').trim(); });
                for (var j = 0; j < pa.length; j++) {
                    if (nu === pa[j] || nu.toLowerCase() === pa[j].toLowerCase() || nu.replace(/\s+/g, '').toLowerCase() === pa[j]
                        .replace(/\s+/g, '').toLowerCase()) {
                        ok = true;
                        break;
                    }
                }
                if (!ok) { a.wrongCount = (a.wrongCount || 0) + 1;
                    a.lastWrongAnswer = ua;
                    saveWrongCounts(currentFileId); }
                answerMap.set(qKey, a);
                if (ic) { ic.className = 'result-icon ' + (ok ? 'correct' : 'wrong');
                    ic.textContent = ok ? '✓' : '✗'; }
                i.style.borderBottomColor = ok ? '#4caf50' : '#f44336';
                i.style.color = ok ? '#4caf50' : '#f44336';
                if (dp && !ok) { dp.textContent = '答案: ' + a.answer;
                    dp.classList.add('show'); }
            }

            setInterval(function() { if (currentFileId && answerMap.size > 0) saveToHistory(); }, 30000);

            window.checkAllAnswers = function() {
                if (isCheckingAll) return;
                isCheckingAll = true;
                var t = 0,
                    c = 0,
                    w = 0,
                    na = 0,
                    e = 0;
                answerMap.forEach(function(a, k) {
                    t++;
                    if (!a.answer) { na++; return; }
                    var i = document.querySelector('.fill-blank-input[data-q="' + k + '"]');
                    if (!i || i.value.trim() === '') { e++; return; }

                    '<h2>📡 广播功能</h2>' +
                    '<div class="step"><strong>广播题目</strong><p>点击 "文件" -> "广播题目"，输入口令后开始广播当前文件。</p><p>广播会持续循环发送，直到你点击 "终止广播"。</p></div>' +
                    '<div class="step"><strong>接收广播</strong><p>点击 "文件" -> "接收广播"，输入相同的口令即可接收文件。</p><p>收到文件后会自动加载，并标记为"接收的文件"。</p>' +
                    '<div class="warning"><strong>⚠️ 安全提醒：</strong> 接收广播文件后下载时会弹出安全确认弹窗，需阅读提示并勾选确认后方可下载。</div></div>' +
                    '<h2>📜 历史记录</h2>' +
                    '<div class="step"><p>点击 "文件" -> "历史记录" 可查看所有答题记录。</p><p>点击记录可恢复当时的答题状态，点击 "详情" 可查看错题统计。</p></div>' +
                    '<h2>🔍 其他功能</h2>' +
                    '<ul><li><strong>缩放：</strong> 使用右上角的 + 和 - 按钮，或 Ctrl+滚轮 缩放文档。</li>' +
                    '<li><strong>拖拽：</strong> 在文档上拖拽可移动视图。</li>' +
                    '<li><strong>自定义键盘：</strong> 在手机/平板上，点击输入框会自动弹出优化后的虚拟键盘（支持数字和英文）。</li>' +
                    '<li><strong>下载：</strong> 点击 "文件" -> "下载文件" 可导出当前文件（接收的文件需先通过安全确认）。</li></ul>' +
                    '<div class="note"><strong>💡 提示：</strong> 所有答题记录和错题统计都会自动保存在浏览器本地，关闭页面后重新打开仍然可以恢复。</div>';

                document.getElementById('guideContent').innerHTML = content;
                document.getElementById('guidePanel').classList.add('show');
                document.getElementById('guideOverlay').classList.add('show');
            };

            window.hideGuide = function() {
                document.getElementById('guidePanel').classList.remove('show');
                document.getElementById('guideOverlay').classList.remove('show');
            };

            updateTransform();
            updateZoomDisplay();

            var urlFile = getUrlParam('file');
            if (urlFile) {
                setTimeout(function() { loadFromUrl(urlFile); }, 500);
            }

        })();
    </script>
</body>
</html>
