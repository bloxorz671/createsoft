 <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>交互式填空题系统</title>
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.0/dist/docx-preview.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f0f0f0; overscroll-behavior: none;
            height: 100vh; height: 100dvh; overflow: hidden;
            position: fixed; width: 100%;
            -webkit-user-select: none; user-select: none;
        }
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 6px 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            z-index: 100; display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
        }
        .file-label {
            padding: 7px 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-radius: 16px; font-size: 12px;
            font-weight: 500; cursor: pointer; white-space: nowrap;
        }
        .file-label:active { transform: scale(0.95); }
        .btn {
            padding: 7px 10px; border: none; border-radius: 16px;
            font-size: 12px; cursor: pointer; transition: all 0.2s;
            white-space: nowrap; font-weight: 500;
        }
        .btn:active { transform: scale(0.95); }
        .btn-guide { background: #00bcd4; color: white; }
        .btn-history { background: #9c27b0; color: white; }
        .btn-reset { background: #ff9800; color: white; }
        .btn-stats { background: #2196f3; color: white; }
        .btn-clear-mark { background: #607d8b; color: white; }
        .btn-clear-wrong { background: #f44336; color: white; }
        .btn-check-all { background: #4caf50; color: white; }
        .zoom-controls {
            display: flex; align-items: center; gap: 3px;
            margin-left: auto; background: #f5f5f5;
            border-radius: 16px; padding: 2px;
        }
        .zoom-btn {
            width: 26px; height: 26px; border-radius: 50%;
            border: none; background: white; font-size: 14px;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; color: #333;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .zoom-btn:active { background: #e0e0e0; }
        .zoom-text { font-size: 11px; color: #666; min-width: 34px; text-align: center; font-weight: 500; }
        .viewport {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; background: #e8e8e8; touch-action: none;
        }
        .doc-stage {
            position: absolute; top: 0; left: 0;
            transform-origin: 0 0; transition: none;
        }
        .doc-viewer {
            background: white; box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            overflow: hidden; position: relative;
        }
        .docx-wrapper { background: white; }
        .docx-wrapper>section {
            border-bottom: 1px dashed #d0d0d0;
            padding-bottom: 12px; margin-bottom: 12px;
        }
        .docx-wrapper>section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .fill-blank-wrapper { display: inline; }
        .fill-blank-input {
            display: inline-block; border: none;
            border-bottom: 2px solid #667eea; padding: 1px 4px;
            font-size: inherit; font-family: inherit; outline: none;
            background: rgba(102,126,234,0.03); min-width: 60px;
            margin: 0 2px; vertical-align: baseline; color: inherit;
            caret-color: #667eea; cursor: text;
            -webkit-user-select: text; user-select: text;
        }
        .fill-blank-input:focus { border-bottom-color: #764ba2; background: rgba(102,126,234,0.08); }
        .check-btn {
            display: inline-block; margin-left: 3px;
            padding: 1px 6px; background: #667eea;
            color: white; border: none; border-radius: 10px;
            font-size: 11px; cursor: pointer;
            vertical-align: baseline; white-space: nowrap;
        }
        .check-btn:active { background: #764ba2; }
        .result-icon { display: inline-block; margin-left: 2px; font-size: 13px; vertical-align: baseline; }
        .result-icon.correct { color: #4caf50; }
        .result-icon.wrong { color: #f44336; }
        .answer-display { display: none; margin-left: 3px; color: #4caf50; font-weight: bold; font-size: 12px; }
        .answer-display.show { display: inline; }
        .custom-keyboard {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #d1d3d9; padding: 6px 4px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 200; display: none;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
            user-select: none; -webkit-user-select: none;
        }
        .custom-keyboard.show { display: block; }
        .kb-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .kb-key {
            flex: 1; max-width: 42px; height: 44px;
            background: white; border: none; border-radius: 6px;
            font-size: 16px; cursor: pointer; color: #333;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .kb-key:active { background: #b0b0b0; }
        .kb-key.space { flex: 2; max-width: none; }
        .kb-key.done { background: #667eea; color: white; font-weight: bold; font-size: 13px; max-width: 60px; }
        .kb-key.done:active { background: #4a56c8; }
        .kb-key.delete { background: #e0e0e0; font-size: 14px; max-width: 50px; }
        .kb-key.shift { background: #e0e0e0; font-size: 12px; }
        .kb-key.shift.active { background: #667eea; color: white; }
        .kb-key.num-switch { background: #e8ecf0; font-size: 13px; }
        .panel-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); z-index: 999; display: none;
        }
        .panel-overlay.show { display: block; }
        .panel {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 1000; display: none;
            min-width: 280px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
        }
        .panel.show { display: block; }
        .stat-item { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 15px; }
        .stat-item:last-child { border-bottom: none; }
        .panel-close { margin-top: 12px; width: 100%; padding: 10px; background: #f0f0f0; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .history-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .history-item:hover { background: #f5f5f5; }
        .history-item:last-child { border-bottom: none; }
        .history-item-info { flex: 1; min-width: 0; }
        .history-item-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-item-meta { font-size: 11px; color: #999; }
        .history-item-delete { margin-left: 10px; padding: 4px 8px; background: #f44336; color: white; border: none; border-radius: 10px; font-size: 11px; cursor: pointer; flex-shrink: 0; }
        .history-empty { text-align: center; padding: 30px; color: #999; font-size: 14px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state .icon { font-size: 60px; margin-bottom: 15px; }
        .guide-content { font-size: 13px; line-height: 1.7; }
        .guide-content h3 { margin: 18px 0 8px; color: #333; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
        .guide-content h3:first-child { margin-top: 0; }
        .guide-content p { margin: 4px 0; }
        .guide-content code { background: #fff3e0; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #e65100; font-family: 'Courier New', monospace; }
        .guide-content pre { background: #f5f5f5; padding: 10px 14px; border-radius: 8px; font-size: 12px; overflow-x: auto; margin: 6px 0; }
        .guide-content table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
        .guide-content td, .guide-content th { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
        .guide-content th { background: #f5f5f5; font-weight: 600; }
        .guide-content ul { margin: 4px 0 4px 20px; }
        .guide-content li { margin: 2px 0; }
        @media (min-width: 768px) { .custom-keyboard { display: none !important; } }
        @media (max-width: 480px) {
            .header { padding: 4px 5px; gap: 3px; }
            .file-label { padding: 5px 8px; font-size: 11px; }
            .btn { padding: 5px 7px; font-size: 10px; border-radius: 12px; }
            .zoom-btn { width: 24px; height: 24px; font-size: 13px; }
            .zoom-text { font-size: 10px; min-width: 30px; }
            .kb-key { height: 34px; font-size: 14px; max-width: 28px; }
            .kb-row { gap: 3px; margin-bottom: 3px; }
            .panel { padding: 16px; }
            .guide-content { font-size: 12px; }
            .guide-content h3 { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="header" id="headerBar">
        <label class="file-label" for="fileInput">打开文件</label>
        <input type="file" id="fileInput" accept=".docx" hidden>
        <button class="btn btn-guide" onclick="showGuide()">指南</button>
        <button class="btn btn-history" onclick="showHistory()">历史</button>
        <button class="btn btn-check-all" onclick="checkAllAnswers()">全部检查</button>
        <button class="btn btn-clear-mark" onclick="clearAllMarks()">清除批改</button>
        <button class="btn btn-clear-wrong" onclick="clearWrongAnswers()">清除错误</button>
        <button class="btn btn-reset" onclick="resetAllAnswers()">重置</button>
        <button class="btn btn-stats" onclick="showStats()">统计</button>
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomOut()">−</button>
            <span class="zoom-text" id="zoomLevel">100%</span>
            <button class="zoom-btn" onclick="zoomIn()">+</button>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <div class="doc-stage" id="docStage">
            <div class="doc-viewer" id="docViewer">
                <div class="empty-state"><div class="icon">📃</div><div>点击「打开文件」选择 DOCX 文件<br>或通过URL参数 <code>?file=地址</code> 加载</div></div>
            </div>
        </div>
    </div>

    <div class="custom-keyboard" id="customKeyboard"></div>

    <div class="panel-overlay" id="guideOverlay" onclick="hideGuide()"></div>
    <div class="panel" id="guidePanel" style="max-width:650px;">
        <h3 style="margin-bottom:8px;">用户指南</h3>
        <div class="guide-content" id="guideContent"></div>
        <button class="panel-close" onclick="hideGuide()">关闭</button>
    </div>

    <div class="panel-overlay" id="statsOverlay" onclick="hideStats()"></div>
    <div class="panel" id="statsPanel">
        <h3 style="margin-bottom:15px;">答题统计</h3>
        <div id="statsContent"></div>
        <button class="panel-close" onclick="hideStats()">关闭</button>
    </div>

    <div class="panel-overlay" id="historyOverlay" onclick="hideHistory()"></div>
    <div class="panel" id="historyPanel">
        <h3 style="margin-bottom:15px;">历史记录</h3>
        <div id="historyContent"></div>
        <button class="panel-close" onclick="hideHistory()">关闭</button>
    </div>

    <script>
    (function(){
        let answerMap = new Map();
        let currentFileId = null, currentDocSize = null;
        let activeInput = null, isShifted = false;
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        const PAGE_SIZES = {
            'A4':{width:210,height:297},'A4横向':{width:297,height:210},'A4横':{width:297,height:210},
            'A3':{width:297,height:420},'A3横向':{width:420,height:297},'A3横':{width:420,height:297},
            'A5':{width:148,height:210},'A5横向':{width:210,height:148},'A5横':{width:210,height:148},
            'B4':{width:257,height:364},'B5':{width:182,height:257},'letter':{width:215.9,height:279.4},'legal':{width:215.9,height:355.6},
        };

        let docScale=1, docTx=0, docTy=0;
        const MIN_SCALE=0.3, MAX_SCALE=5.0, SCALE_STEP=0.1;
        let dragging=false, dragStart={x:0,y:0}, dragStartTrans={x:0,y:0};
        let lastDist=0, lastCtr={x:0,y:0,sx:0,sy:0};
        let userScale=null, userTrans=null;
        let keyboardVisible=false, lastKnownH=window.innerHeight;

        function updateViewportTop(){
            const header = document.getElementById('headerBar');
            document.getElementById('viewport').style.top = header.offsetHeight + 'px';
        }
        updateViewportTop();
        window.addEventListener('resize', updateViewportTop);

        function updateTransform(){
            document.getElementById('docStage').style.transform = `translate(${docTx}px,${docTy}px) scale(${docScale})`;
        }
        function updateZoomDisplay(){
            document.getElementById('zoomLevel').textContent = Math.round(docScale*100)+'%';
        }
        function setDocScale(s){
            docScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.round(s*100)/100));
            updateTransform(); updateZoomDisplay();
        }
        function saveUserTransform(){ userScale=docScale; userTrans={x:docTx,y:docTy}; }
        window.zoomIn = function(){ setDocScale(docScale+SCALE_STEP); saveUserTransform(); };
        window.zoomOut = function(){ setDocScale(docScale-SCALE_STEP); saveUserTransform(); };

        const viewportEl = document.getElementById('viewport');
        viewportEl.addEventListener('touchstart',function(e){
            if(e.target.closest('.fill-blank-input,.check-btn,.kb-key,.custom-keyboard')) return;
            const t=e.touches;
            if(t.length===1){ dragging=true; dragStart.x=t[0].clientX; dragStart.y=t[0].clientY; dragStartTrans.x=docTx; dragStartTrans.y=docTy; }
            else if(t.length===2){ dragging=false; lastDist=getDist(t[0],t[1]); lastCtr=getCtr(t[0],t[1]); lastCtr.sx=(lastCtr.x-docTx)/docScale; lastCtr.sy=(lastCtr.y-docTy)/docScale; }
        },{passive:false});
        viewportEl.addEventListener('touchmove',function(e){
            e.preventDefault(); const t=e.touches;
            if(t.length===1&&dragging){ docTx=dragStartTrans.x+(t[0].clientX-dragStart.x); docTy=dragStartTrans.y+(t[0].clientY-dragStart.y); updateTransform(); saveUserTransform(); }
            else if(t.length===2){ const nd=getDist(t[0],t[1]),nc=getCtr(t[0],t[1]); if(lastDist>0){ const ns=Math.min(MAX_SCALE,Math.max(MIN_SCALE,docScale*(nd/lastDist))); docTx=nc.x-lastCtr.sx*ns; docTy=nc.y-lastCtr.sy*ns; docScale=Math.round(ns*100)/100; updateTransform(); updateZoomDisplay(); saveUserTransform(); } lastDist=nd; lastCtr=nc; lastCtr.sx=(nc.x-docTx)/docScale; lastCtr.sy=(nc.y-docTy)/docScale; }
        },{passive:false});
        viewportEl.addEventListener('touchend',function(e){ if(e.touches.length===0){ dragging=false; lastDist=0; } });
        viewportEl.addEventListener('wheel',function(e){
            if(e.ctrlKey||e.metaKey){ e.preventDefault(); const d=e.deltaY>0?-SCALE_STEP:SCALE_STEP; const r=viewportEl.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top; const sx=(mx-docTx)/docScale,sy=(my-docTy)/docScale; const ns=Math.min(MAX_SCALE,Math.max(MIN_SCALE,docScale+d)); docTx=mx-sx*ns; docTy=my-sy*ns; docScale=Math.round(ns*100)/100; updateTransform(); updateZoomDisplay(); saveUserTransform(); }
        },{passive:false});
        function getDist(a,b){ return Math.sqrt((a.clientX-b.clientX)**2+(a.clientY-b.clientY)**2); }
        function getCtr(a,b){ return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}; }

        if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){const h=window.visualViewport.height;if(h<lastKnownH-80)keyboardVisible=true;else if(h>=lastKnownH-30){keyboardVisible=false;lastKnownH=h;}if(!keyboardVisible)lastKnownH=Math.max(lastKnownH,h);});}

        function parseDocSize(text){
            for(const [n,s] of Object.entries(PAGE_SIZES)){ const esc=n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); if(new RegExp('\\['+esc+'\\]','i').test(text)) return s; }
            const cm=text.match(/\[(\d+\.?\d*)\s*:\s*(\d+\.?\d*)\]/);
            if(cm){ const w=parseFloat(cm[1]),h=parseFloat(cm[2]); return (w<50&&h<50)?{width:210,height:210*(h/w)}:{width:w,height:h}; }
            return PAGE_SIZES['A4'];
        }

        function centerDocument(respectUser){
            if(keyboardVisible) return;
            if(respectUser&&userScale){ docScale=userScale; docTx=userTrans.x; docTy=userTrans.y; updateTransform(); updateZoomDisplay(); return; }
            const vp=document.getElementById('viewport'),v=document.getElementById('docViewer');
            const vw=vp.clientWidth,vh=vp.clientHeight;
            if(!currentDocSize) currentDocSize=PAGE_SIZES['A4'];
            const mm=3.779527559,dw=currentDocSize.width*mm,dh=currentDocSize.height*mm;
            v.style.width=dw+'px'; v.style.minHeight=dh+'px';
            const fs=Math.min((vw-24)/dw,(vh-24)/dh,1.0);
            docScale=Math.round(fs*100)/100; docTx=(vw-dw*docScale)/2; docTy=Math.max(8,(vh-dh*docScale)/2);
            userScale=null; userTrans=null; updateTransform(); updateZoomDisplay();
        }

        function getUrlParam(name){
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        async function loadFromUrl(fileUrl){
            const viewer = document.getElementById('docViewer');
            viewer.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><div>正在从网络加载...</div></div>';
            viewer.style.width = ''; viewer.style.minHeight = '';
            try {
                const response = await fetch(fileUrl);
                if(!response.ok) throw new Error('HTTP '+response.status);
                const blob = await response.blob();
                const fileName = fileUrl.split('/').pop().split('?')[0] || 'document.docx';
                const file = new File([blob], fileName, {type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
                await loadFile(file);
            } catch(err) {
                console.error('URL加载失败:', err);
                viewer.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div style="color:red;">加载失败<br><small>'+escHtml(err.message)+'</small></div></div>';
            }
        }

        async function loadFile(file){
            currentFileId = 'file_'+file.name+'_'+file.size+'_'+file.lastModified;
            userScale=null; userTrans=null; keyboardVisible=false; lastKnownH=window.innerHeight;
            const viewer = document.getElementById('docViewer');
            viewer.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><div>加载中...</div></div>';
            viewer.style.width = ''; viewer.style.minHeight = '';
            try {
                const ab = await file.arrayBuffer();
                const mr = await mammoth.extractRawText({arrayBuffer:ab});
                currentDocSize = parseDocSize(mr.value);
                answerMap.clear();
                for(const m of mr.value.matchAll(/A(\d+)\[(.*?)\]/gi)) answerMap.set('Q'+m[1],{answer:m[2],checked:false});
                for(const m of mr.value.matchAll(/Q(\d+)\[(.*?)\]/gi)){ const k='Q'+m[1]; if(!answerMap.has(k)) answerMap.set(k,{answer:'',checked:false}); }
                viewer.innerHTML = '';
                const wrapper = document.createElement('div'); wrapper.className = 'docx-wrapper'; viewer.appendChild(wrapper);
                await docx.renderAsync(ab, wrapper, null, {className:'docx-content',inWrapper:true,ignoreWidth:false,ignoreHeight:false,ignoreFonts:false,breakPages:true,ignoreLastRenderedPageBreak:false,experimental:false});
                setTimeout(function(){
                    processRenderedDOM(viewer);
                    centerDocument(false);
                    bindEvents();
                    const h = getHistoryData(currentFileId);
                    if(h.answers && Object.keys(h.answers).length>0) setTimeout(function(){ restoreHistory(currentFileId); },300);
                    document.title = file.name;
                },300);
            } catch(err) {
                console.error(err);
                viewer.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div style="color:red;">加载失败</div></div>';
            }
        }

        document.getElementById('fileInput').addEventListener('change',async function(e){
            const file = e.target.files[0];
            if(!file) return;
            await loadFile(file);
        });

        function processRenderedDOM(container){
            hideDpRegions(container);
            replaceQTags(container);
            removeATags(container);
            removeSizeTags(container);
        }

        function hideDpRegions(container){
            const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
            const allTextNodes = [];
            while(walker.nextNode()) allTextNodes.push(walker.currentNode);
            let dpRegions = [], currentStart = null;
            allTextNodes.forEach(function(node){
                const text = node.textContent;
                const dsIdx = text.search(/\[dpstart\]/i);
                const deIdx = text.search(/\[dpend\]/i);
                if(dsIdx >= 0 && !currentStart){ currentStart = { allNodes: [] }; }
                if(currentStart) currentStart.allNodes.push(node);
                if(deIdx >= 0 && currentStart){ dpRegions.push(currentStart); currentStart = null; }
            });
            dpRegions.forEach(function(region){
                region.allNodes.forEach(function(n){ n.textContent = n.textContent.replace(/\[dpstart\]/gi,'').replace(/\[dpend\]/gi,''); });
                const blockElements = new Set();
                region.allNodes.forEach(function(node){
                    let el = node.parentElement, found = false;
                    while(el && el !== container && el !== document.body){
                        const tag = (el.tagName||'').toLowerCase();
                        const isBlock = ['p','div','section','table','tr','td','th','li','h1','h2','h3','h4','h5','h6','blockquote'].includes(tag);
                        if(isBlock && !found){ blockElements.add(el); found = true; }
                        if(tag === 'td' || tag === 'th'){ const table = el.closest('table'); if(table) blockElements.add(table); }
                        el = el.parentElement;
                    }
                    if(!found && node.parentElement) blockElements.add(node.parentElement);
                });
                const finalBlocks = new Set();
                blockElements.forEach(function(el){
                    let hasParentInSet = false, p = el.parentElement;
                    while(p && p !== container){ if(blockElements.has(p)){ hasParentInSet = true; break; } p = p.parentElement; }
                    if(!hasParentInSet) finalBlocks.add(el);
                });
                finalBlocks.forEach(function(el){
                    if(el && el.parentElement && el !== container && el !== document.body){
                        if(!el.querySelector('.fill-blank-input') && !el.querySelector('.check-btn')) el.remove();

        function cleanAllEmptyBlocks(container){
            for(let pass=0; pass<3; pass++){
                let removed = false;
                ['p','div','span','section','td','th','tr'].forEach(function(tag){
                    container.querySelectorAll(tag).forEach(function(el){
                        if(el.querySelector('.fill-blank-input,.check-btn,img,table,svg,input,button,select,textarea')) return;
                        const text = (el.textContent||'').replace(/[\s\u200B]/g,'');
                        if(text === ''){
                            const cs = window.getComputedStyle(el);
                            const hasBg = cs.backgroundColor !== 'rgba(0, 0, 0, 0)' && cs.backgroundColor !== 'transparent';
                            const hasBorder = cs.borderTopWidth!=='0px' || cs.borderBottomWidth!=='0px' || cs.borderLeftWidth!=='0px' || cs.borderRightWidth!=='0px';
                            const hasMinSize = parseFloat(cs.minHeight)>0 || parseFloat(cs.minWidth)>0;
                            if((tag==='td'||tag==='th') && el.closest('table')?.querySelector('td:not(:empty),th:not(:empty),img')) return;
                            if(!hasBg && !hasBorder && !hasMinSize && el.children.length===0){ el.remove(); removed = true; }
                        }
                    });
                });
                if(!removed) break;
            }
            container.querySelectorAll('table').forEach(function(table){
                const hasContent = table.querySelector('img,svg,.fill-blank-input') || (table.textContent||'').replace(/[\s\u200B]/g,'').length > 0;
                if(!hasContent) table.remove();
            });
        }

        function replaceQTags(container){
            const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,null,false);
            const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(function(node){
                const parent=node.parentElement;
                if(!parent||parent.closest('.fill-blank-wrapper')) return;
                if(!/Q\d+\[/i.test(node.textContent)) return;
                const html=node.textContent.replace(/Q(\d+)\[(.*?)\]/gi,function(m,num,content){
                    const qKey='Q'+num, hasAns=answerMap.get(qKey)?.answer;
                    return '<span class="fill-blank-wrapper" data-q="'+qKey+'">'+
                        (content.trim()?'<span style="color:#888;">'+escHtml(content)+'</span>':'')+
                        '<input type="text" class="fill-blank-input" data-q="'+qKey+'" data-ans="'+(hasAns||'')+'" placeholder="'+(content.trim()||'答案')+'" style="min-width:'+(content.trim()?'60px':'80px')+';" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'+
                        '<button class="check-btn" data-q="'+qKey+'">检查</button>'+
                        '<span class="result-icon" data-q="'+qKey+'"></span>'+
                        '<span class="answer-display" data-q="'+qKey+'"></span></span>';
                });
                if(html!==node.textContent){ const span=document.createElement('span'); span.innerHTML=html; parent.replaceChild(span,node); }
            });
        }

        function removeATags(container){
            const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,null,false);
            const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(function(node){ if(!node.parentElement?.closest('.fill-blank-wrapper')) node.textContent=node.textContent.replace(/A\d+\[.*?\]/gi,''); });
        }

        function removeSizeTags(container){
            const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,null,false);
            const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
            nodes.forEach(function(node){
                let t=node.textContent;
                for(const n of Object.keys(PAGE_SIZES)) t=t.replace(new RegExp('\\['+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]','gi'),'');
                t=t.replace(/\[\d+\.?\d*\s*:\s*\d+\.?\d*\]/g,''); node.textContent=t;
            });
        }

        function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

        function getAnswerType(ans){
            if(!ans) return 'text';
            if(/^[\d\s\.\,\+\-\*\/\=\(\)\[\]\{\}\%]+$/.test(ans)) return 'number';
            if(/^[a-zA-Z0-9\s\.\,\!\?\-\'\"\(\)\[\]\{\}\+\-\*\/\=\@\#\$\%\&\*\_\:\;]+$/.test(ans)) return 'english';
            return 'text';
        }

        function buildKeyboard(type){
            const kb=document.getElementById('customKeyboard');
            if(type==='text'){ kb.innerHTML=''; kb.classList.remove('show'); return; }
            let rows=[];
            if(type==='number'){rows=[['1','2','3','4','5','6','7','8','9','0'],['-','+','*','/','=','.',',','(',')','⌫'],[{t:'space',l:'空格'},{t:'done',l:'完成'}]];}
            else if(type==='english'){
                const l1=isShifted?['Q','W','E','R','T','Y','U','I','O','P']:['q','w','e','r','t','y','u','i','o','p'];
                const l2=isShifted?['A','S','D','F','G','H','J','K','L']:['a','s','d','f','g','h','j','k','l'];
                const l3=[{t:'shift',l:'⇧'}].concat(isShifted?['Z','X','C','V','B','N','M']:['z','x','c','v','b','n','m']).concat(['⌫']);
                const l4=[{t:'num',l:'123'},'-','.',{t:'space',l:'空格'},',','!','?',{t:'done',l:'完成'}]; rows=[l1,l2,l3,l4];}
            else if(type==='num_from_eng'){rows=[['1','2','3','4','5','6','7','8','9','0'],['-','+','*','/','=','.',',','(',')','⌫'],[{t:'abc',l:'ABC'},{t:'space',l:'空格'},{t:'done',l:'完成'}]];}
            kb.innerHTML=rows.map(function(row){return '<div class="kb-row">'+row.map(function(k){if(typeof k==='object'){var cls=k.t==='space'?'space':k.t==='done'?'done':k.t==='shift'?(isShifted?'shift active':'shift'):'num-switch';return '<button class="kb-key '+cls+'" data-action="'+k.t+'">'+k.l+'</button>';}if(k==='⌫') return '<button class="kb-key delete" data-action="backspace">⌫</button>';return '<button class="kb-key" data-key="'+k+'">'+k+'</button>';}).join('')+'</div>';}).join('');
            kb.classList.add('show');
        }

        function hideKeyboard(){ document.getElementById('customKeyboard').classList.remove('show'); activeInput=null; isShifted=false; }
        document.getElementById('customKeyboard').addEventListener('pointerdown',function(e){
            e.preventDefault(); e.stopPropagation();
            const btn=e.target.closest('.kb-key'); if(!btn||!activeInput) return;
            const action=btn.dataset.action, key=btn.dataset.key;
            if(action==='done'){ hideKeyboard(); return; }
            if(action==='backspace'){ activeInput.value=activeInput.value.slice(0,-1); fireInputEvent(); return; }
            if(action==='shift'){ isShifted=!isShifted; buildKeyboard('english'); return; }
            if(action==='num'){ isShifted=false; buildKeyboard('num_from_eng'); return; }
            if(action==='abc'){ isShifted=false; buildKeyboard('english'); return; }
            if(action==='space'){ activeInput.value+=' '; fireInputEvent(); return; }
            if(key){ activeInput.value+=key; fireInputEvent(); if(isShifted&&action!=='shift'){ isShifted=false; buildKeyboard('english'); } }
        });
        document.getElementById('customKeyboard').addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); });

        function fireInputEvent(){ if(!activeInput) return; activeInput.dispatchEvent(new Event('input',{bubbles:true})); activeInput.dispatchEvent(new Event('change',{bubbles:true})); }

        function bindEvents(){
            document.querySelectorAll('.check-btn').forEach(function(btn){ btn.addEventListener('click',function(e){ e.stopPropagation(); checkAnswer(this.dataset.q); }); });
            document.querySelectorAll('.fill-blank-input').forEach(function(input){
                input.addEventListener('keydown',function(e){ if(isTouchDevice&&activeInput===input){ if(getAnswerType(input.dataset.ans||'')!=='text') e.preventDefault(); } });
                input.addEventListener('focus',function(){ if(!isTouchDevice) return; var t=getAnswerType(this.dataset.ans||''); if(t!=='text'){ activeInput=this; isShifted=false; buildKeyboard(t); } else hideKeyboard(); });
                input.addEventListener('touchstart',function(e){ e.stopPropagation(); if(isTouchDevice){ var t=getAnswerType(this.dataset.ans||''); if(t!=='text'){ e.preventDefault(); if(activeInput!==this){ hideKeyboard(); activeInput=this; isShifted=false; buildKeyboard(t); this.focus(); } } } });
                input.addEventListener('keypress',function(e){ if(e.key==='Enter'){ e.stopPropagation(); checkAnswer(this.dataset.q); } });
                input.addEventListener('blur',function(){ setTimeout(function(){ if(document.querySelector('.kb-key:active')&&activeInput===input) input.focus(); },150); if(currentFileId) saveToHistory({name:document.title},currentFileId); });
            });
            document.getElementById('docViewer').addEventListener('pointerdown',function(e){ if(!e.target.closest('.fill-blank-input')&&!e.target.closest('.custom-keyboard')&&!e.target.closest('.check-btn')) hideKeyboard(); });
        }

        function checkAnswer(qKey){
            var ad=answerMap.get(qKey); if(!ad||!ad.answer){ if(!ad)return; return 'noanswer'; }
            var input=document.querySelector('.fill-blank-input[data-q="'+qKey+'"]'), icon=document.querySelector('.result-icon[data-q="'+qKey+'"]'), disp=document.querySelector('.answer-display[data-q="'+qKey+'"]');
            if(!input) return 'noinput';
            var ua=input.value.trim(); ad.checked=true; var ok=false, nu=ua.replace(/\s+/g,' ').trim(), pa=ad.answer.split('|').map(function(a){return a.replace(/\s+/g,' ').trim();});
            for(var i=0;i<pa.length;i++){ if(nu===pa[i]||nu.toLowerCase()===pa[i].toLowerCase()||nu.replace(/\s+/g,'').toLowerCase()===pa[i].replace(/\s+/g,'').toLowerCase()){ ok=true; break; } }
            if(icon){ icon.className='result-icon '+(ok?'correct':'wrong'); icon.textContent=ok?'✓':'✗'; }
            input.style.borderBottomColor=ok?'#4caf50':'#f44336'; input.style.color=ok?'#4caf50':'#f44336';
            if(disp){ disp.textContent='答案: '+ad.answer; disp.classList.add('show'); }
            return ok?'correct':'wrong';
        }

            if(!input) return; ad.checked=true; var ok=false, nu=ua.replace(/\s+/g,' ').trim(), pa=ad.answer.split('|').map(function(a){return a.replace(/\s+/g,' ').trim();});
            for(var i=0;i<pa.length;i++){ if(nu===pa[i]||nu.toLowerCase()===pa[i].toLowerCase()||nu.replace(/\s+/g,'').toLowerCase()===pa[i].replace(/\s+/g,'').toLowerCase()){ ok=true; break; } }
            if(icon){ icon.className='result-icon '+(ok?'correct':'wrong'); icon.textContent=ok?'✓':'✗'; }
            input.style.borderBottomColor=ok?'#4caf50':'#f44336'; input.style.color=ok?'#4caf50':'#f44336';
            if(disp){ disp.textContent='答案: '+ad.answer; disp.classList.add('show'); }

        function saveToHistory(file,fid){ var h=getHistoryData(fid),ans={},chk={}; answerMap.forEach(function(d,k){ var inp=document.querySelector('.fill-blank-input[data-q="'+k+'"]'); if(inp&&inp.value.trim()) ans[k]=inp.value; if(d.checked) chk[k]=true; }); h.fileName=file.name; h.date=new Date().toISOString(); h.answers=ans; h.checked=chk; localStorage.setItem('quiz_'+fid,JSON.stringify(h)); }
        function getHistoryData(fid){ var s=localStorage.getItem('quiz_'+fid); if(s){ try{return JSON.parse(s);}catch(e){} } return {fileName:'',date:'',answers:{},checked:{}}; }
        function getAllHistory(){ var h=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k.startsWith('quiz_')){ try{var d=JSON.parse(localStorage.getItem(k));d.fileId=k.replace('quiz_','');h.push(d);}catch(e){} } } return h.sort(function(a,b){return new Date(b.date)-new Date(a.date);}); }
        function deleteHistory(fid){ localStorage.removeItem('quiz_'+fid); }

        window.checkAllAnswers = function(){
            var total=0, correct=0, wrong=0, noanswer=0, empty=0;
            answerMap.forEach(function(d, qKey){
                total++;
                if(!d.answer){ noanswer++; return; }
                var input = document.querySelector('.fill-blank-input[data-q="'+qKey+'"]');
                if(!input || input.value.trim()===''){ empty++; return; }
                var result = checkAnswer(qKey);
                if(result==='correct') correct++;
                else if(result==='wrong') wrong++;
            });
            if(currentFileId) saveToHistory({name:document.title}, currentFileId);
            var msg = '全部检查完成：\n';
            msg += '共 '+total+' 题，已填 '+ (total-empty-noanswer) +' 题\n';
            msg += '正确 '+correct+' 题，错误 '+wrong+' 题\n';
            if(empty>0) msg += '未填写 '+empty+' 题\n';
            if(noanswer>0) msg += '无答案 '+noanswer+' 题';
            alert(msg);

                '<li>但其中包含的 <b>A标签答案仍然会被读取</b></li>'+
                '<li>适用于：将试题和答案放在同一个文档，答案部分用隐藏区域包裹</li>'+

                '</ul>'+
                ''+
                '<h3>七、按钮功能详解</h3>'+
                '<table><tr><th>按钮</th><th>功能</th></tr>'+
                '<tr><td>打开文件</td><td>选择本地 .docx 文件</td></tr>'+
                '<tr><td>指南</td><td>显示本使用说明</td></tr>'+
                '<tr><td>历史</td><td>查看和管理历史答题记录</td></tr>'+
                '<tr><td>全部检查</td><td>一键批改所有已填写的题目</td></tr>'+
                '<tr><td>清除批改</td><td>只清除对错标记，<b>保留填写内容</b></td></tr>'+
                '<tr><td>清除错误</td><td>清空标记为错误的题目内容和标记</td></tr>'+
                '<tr><td>重置</td><td>清空全部内容和标记</td></tr>'+
                '<tr><td>统计</td><td>显示答题统计：正确/错误/未检查等</td></tr>'+
                '<tr><td>+ / −</td><td>缩放文档（50%~300%）</td></tr>'+
                '</table>'+
                ''+
                '<h3>八、操作手势</h3>'+
                '<ul>'+
                '<li><b>双指捏合/扩张：</b>缩放文档</li>'+
                '<li><b>单指拖动：</b>移动文档位置</li>'+
                '<li><b>桌面端 Ctrl+滚轮：</b>缩放文档</li>'+
                '<li><b>点击输入框：</b>弹出对应的自定义键盘（触屏设备）</li>'+
                '<li><b>回车键：</b>在输入框中按回车触发检查</li>'+
                '</ul>'+
                ''+
                '<h3>九、自定义键盘</h3>'+
                '<p>系统根据答案类型自动选择键盘：</p>'+
                '<ul>'+
                '<li><b>纯数字答案：</b>弹出数字键盘（含数学符号）</li>'+
                '<li><b>英文答案：</b>弹出英文键盘（支持大小写切换、数字符号切换）</li>'+
                '<li><b>含中文答案：</b>使用系统原生输入法</li>'+
                '<li>非触屏设备（电脑）不弹出自定义键盘，使用系统键盘</li>'+

                '</ul>'+
                ''+
                '<h3>十、历史记录</h3>'+
                '<ul>'+
                '<li>答题进度自动保存在浏览器本地存储中</li>'+

                '<li>清除浏览器数据会导致历史记录丢失</li>'+

                '';
            document.getElementById('guideContent').innerHTML = guideHTML;
            document.getElementById('guidePanel').classList.add('show');
            document.getElementById('guideOverlay').classList.add('show');
        };
        window.hideGuide = function(){
            document.getElementById('guidePanel').classList.remove('show');
            document.getElementById('guideOverlay').classList.remove('show');
        };

        updateTransform(); updateZoomDisplay();

        var urlFile = getUrlParam('file');
        if(urlFile){
            console.log('URL参数 file='+urlFile);
            setTimeout(function(){ loadFromUrl(urlFile); }, 500);
        }
    })();
