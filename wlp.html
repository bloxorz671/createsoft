<html>

    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#f0f0f0;overscroll-behavior:none;height:100vh;height:100dvh;overflow:hidden;position:fixed;width:100%;-webkit-user-select:none;user-select:none}
        .header{position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 10px;box-shadow:0 2px 12px rgba(0,0,0,0.08);z-index:100;display:flex;align-items:center;gap:8px}

        .guide-content pre{background:#f8f8f8;padding:12px 16px;border-radius:8px;font-size:12px;overflow-x:auto;margin:8px 0;border:1px solid #e0e0e0;line-height:1.6}

        .guide-content td,.guide-content th{border:1px solid #ddd;padding:8px 12px;text-align:left}.guide-content th{background:#f5f5f5;font-weight:600}

        .empty-state .btn-open{display:inline-block;padding:12px 30px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:22px;font-size:15px;font-weight:500;cursor:pointer}
        @media(min-width:768px){.custom-keyboard{display:none!important}}
    </style>
</head>
<body>
    <div class="header" id="headerBar">
        <div class="header-left"><div class="dropdown" id="dropdownFile"><button class="dropdown-btn" onclick="toggleDropdown('dropdownFile')">文件 ▾</button><div class="dropdown-menu" id="dropdownFileMenu"><button onclick="openFileDialog()">打开文件</button><button onclick="showHistory()">历史记录</button><div class="divider"></div><button onclick="confirmReset()">重置</button><button onclick="confirmClearData()">清除数据</button></div></div><div class="dropdown" id="dropdownAnswer"><button class="dropdown-btn" onclick="toggleDropdown('dropdownAnswer')">答题 ▾</button><div class="dropdown-menu" id="dropdownAnswerMenu"><button onclick="checkAllAnswers()">全部检查</button><button onclick="clearAllMarks()">清除批改</button><button onclick="clearWrongAnswers()">清除错误</button><div class="divider"></div><button onclick="showStats()">统计</button></div></div><button class="btn-plain" onclick="showGuide()">使用说明</button></div>

    </div>
    <div class="viewport" id="viewport"><div class="doc-stage" id="docStage"><div class="doc-viewer" id="docViewer"><div class="empty-state"><div class="icon">📃</div><p>选择文件开始练习</p><button class="btn-open" onclick="openFileDialog()">打开文件</button><p>支持 .docx / .xlsx / .txt</p></div></div></div></div>

    <div class="panel-overlay" id="statsOverlay" onclick="hideStats()"></div><div class="panel" id="statsPanel"><h3>答题统计</h3><div id="statsContent"></div><button class="panel-close" onclick="hideStats()">关闭</button></div>

    <div class="panel-overlay" id="wrongDetailOverlay" onclick="hideWrongDetail()"></div><div class="panel" id="wrongDetailPanel"><h3>错误详情</h3><div id="wrongDetailContent"></div><button class="panel-close" onclick="hideWrongDetail()">关闭</button></div>
    <input type="file" id="fileInput" accept=".docx,.xlsx,.txt" hidden>

    <script>
    (function(){
        let answerMap=new Map(),currentFileId=null,currentDocSize=null,activeInput=null,isShifted=false,isSymbolPage=false,docLoaded=false,dynamicMinScale=0.5,confirmYesCallback=null,deleteRepeatTimer=null,deleteRepeatInterval=null,noIndividualCheck=false,isCheckingAll=false;
        const isTouchDevice='ontouchstart' in window||navigator.maxTouchPoints>0;
        function vibrate(ms){if(navigator.vibrate)navigator.vibrate(ms||6)}
        const PAGE_SIZES={'A4':{width:210,height:297},'A4横向':{width:297,height:210},'A4横':{width:297,height:210},'A3':{width:297,height:420},'A3横向':{width:420,height:297},'A3横':{width:420,height:297},'A5':{width:148,height:210},'A5横向':{width:210,height:148},'A5横':{width:210,height:148},'B4':{width:257,height:364},'B5':{width:182,height:257},'letter':{width:215.9,height:279.4},'legal':{width:215.9,height:355.6}};
        let docScale=1,docTx=0,docTy=0;const MAX_SCALE=5.0,SCALE_STEP=0.1;
        let dragging=false,dragStart={x:0,y:0},dragStartTrans={x:0,y:0},lastDist=0,lastCtr={x:0,y:0,sx:0,sy:0},userScale=null,userTrans=null,keyboardVisible=false,lastKnownH=window.innerHeight;

        function setZoomEnabled(e){document.getElementById('btnZoomIn').disabled=!e;document.getElementById('btnZoomOut').disabled=!e;document.getElementById('viewport').classList.toggle('interactive',e)}setZoomEnabled(false);
        window.toggleDropdown=function(id){var m=document.getElementById(id+'Menu'),o=m.classList.contains('show');document.querySelectorAll('.dropdown-menu').forEach(function(x){x.classList.remove('show')});if(!o)m.classList.add('show')};
        document.addEventListener('click',function(e){if(!e.target.closest('.dropdown'))document.querySelectorAll('.dropdown-menu').forEach(function(m){m.classList.remove('show')})});
        window.openFileDialog=function(){document.getElementById('fileInput').click()};
        function showConfirm(msg,onYes){document.getElementById('confirmMsg').innerHTML=msg.replace(/\n/g,'<br>');confirmYesCallback=onYes;document.getElementById('confirmOverlay').classList.add('show')}
        document.getElementById('btnConfirmYes').onclick=function(){vibrate(8);var cb=confirmYesCallback;document.getElementById('confirmOverlay').classList.remove('show');confirmYesCallback=null;if(cb)cb()};
        document.getElementById('btnConfirmNo').onclick=function(){vibrate(5);document.getElementById('confirmOverlay').classList.remove('show');confirmYesCallback=null};
        window.confirmReset=function(){showConfirm('确定要重置吗？',function(){resetAllAnswers()})};
        window.confirmClearData=function(){showConfirm('确定要清除数据吗？',function(){clearExerciseData()})};
        function updateViewportTop(){document.getElementById('viewport').style.top=document.getElementById('headerBar').offsetHeight+'px'}updateViewportTop();window.addEventListener('resize',updateViewportTop);
        function updateTransform(){document.getElementById('docStage').style.transform=`translate(${docTx}px,${docTy}px) scale(${docScale})`}
        function updateZoomDisplay(){document.getElementById('zoomLevel').textContent=Math.round(docScale*100)+'%'}
        function setDocScale(s){var c=Math.min(MAX_SCALE,Math.max(dynamicMinScale,Math.round(s*100)/100));if(c!==docScale){docScale=c;updateTransform();updateZoomDisplay()}}
        function saveUserTransform(){userScale=docScale;userTrans={x:docTx,y:docTy}}
        function clampTranslate(){var vp=document.getElementById('viewport'),vw=vp.clientWidth,vh=vp.clientHeight,docEl=document.getElementById('docViewer'),dw=docEl.offsetWidth*docScale,dh=docEl.offsetHeight*docScale;if(dw<=vw)docTx=(vw-dw)/2;else docTx=Math.min(0,Math.max(vw-dw,docTx));if(dh<=vh)docTy=0;else docTy=Math.min(0,Math.max(vh-dh,docTy))}
        window.zoomIn=function(){if(!docLoaded)return;var ns=docScale+SCALE_STEP;if(ns>MAX_SCALE)return;setDocScale(ns);clampTranslate();saveUserTransform();updateTransform()};
        window.zoomOut=function(){if(!docLoaded)return;var ns=docScale-SCALE_STEP;if(ns<dynamicMinScale)return;setDocScale(ns);clampTranslate();saveUserTransform();updateTransform()};
        const viewportEl=document.getElementById('viewport');
        viewportEl.addEventListener('touchstart',function(e){if(!docLoaded)return;if(e.target.closest('.fill-blank-input,.check-btn,.inline-check-btn,.kb-key,.custom-keyboard'))return;var t=e.touches;if(t.length===1){dragging=true;dragStart.x=t[0].clientX;dragStart.y=t[0].clientY;dragStartTrans.x=docTx;dragStartTrans.y=docTy}else if(t.length===2){dragging=false;lastDist=getDist(t[0],t[1]);lastCtr=getCtr(t[0],t[1]);lastCtr.sx=(lastCtr.x-docTx)/docScale;lastCtr.sy=(lastCtr.y-docTy)/docScale}},{passive:false});
        viewportEl.addEventListener('touchmove',function(e){if(!docLoaded)return;e.preventDefault();var t=e.touches;if(t.length===1&&dragging){docTx=dragStartTrans.x+(t[0].clientX-dragStart.x);docTy=dragStartTrans.y+(t[0].clientY-dragStart.y);clampTranslate();updateTransform();saveUserTransform()}else if(t.length===2){var nd=getDist(t[0],t[1]),nc=getCtr(t[0],t[1]);if(lastDist>0){var ns=Math.min(MAX_SCALE,Math.max(dynamicMinScale,docScale*(nd/lastDist)));docTx=nc.x-lastCtr.sx*ns;docTy=nc.y-lastCtr.sy*ns;docScale=Math.round(ns*100)/100;clampTranslate();updateTransform();updateZoomDisplay();saveUserTransform()}lastDist=nd;lastCtr=nc;lastCtr.sx=(nc.x-docTx)/docScale;lastCtr.sy=(nc.y-docTy)/docScale}},{passive:false});
        viewportEl.addEventListener('touchend',function(e){if(e.touches.length===0){dragging=false;lastDist=0}});
        viewportEl.addEventListener('wheel',function(e){if(!docLoaded)return;if(e.ctrlKey||e.metaKey){e.preventDefault();var d=e.deltaY>0?-SCALE_STEP:SCALE_STEP,ns=docScale+d;if(ns<dynamicMinScale||ns>MAX_SCALE)return;var r=viewportEl.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,sx=(mx-docTx)/docScale,sy=(my-docTy)/docScale,cns=Math.min(MAX_SCALE,Math.max(dynamicMinScale,ns));docTx=mx-sx*cns;docTy=my-sy*cns;docScale=Math.round(cns*100)/100;clampTranslate();updateTransform();updateZoomDisplay();saveUserTransform()}},{passive:false});
        function getDist(a,b){return Math.sqrt((a.clientX-b.clientX)**2+(a.clientY-b.clientY)**2)}
        function getCtr(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
        if(window.visualViewport){window.visualViewport.addEventListener('resize',function(){var h=window.visualViewport.height;if(h<lastKnownH-80)keyboardVisible=true;else if(h>=lastKnownH-30){keyboardVisible=false;lastKnownH=h}if(!keyboardVisible)lastKnownH=Math.max(lastKnownH,h)})}
        function parseDocSize(text){for(const[n,s]of Object.entries(PAGE_SIZES)){if(new RegExp('\\['+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\]','i').test(text))return s}var cm=text.match(/\[(\d+\.?\d*)\s*:\s*(\d+\.?\d*)\]/);if(cm){var w=parseFloat(cm[1]),h=parseFloat(cm[2]);return(w<50&&h<50)?{width:210,height:210*(h/w)}:{width:w,height:h}}return PAGE_SIZES['A4']}
        function centerDocument(respectUser){if(keyboardVisible)return;if(respectUser&&userScale){docScale=Math.max(dynamicMinScale,userScale);docTx=userTrans.x;docTy=userTrans.y;clampTranslate();updateTransform();updateZoomDisplay();return}var vp=document.getElementById('viewport'),v=document.getElementById('docViewer');if(!currentDocSize)currentDocSize=PAGE_SIZES['A4'];var mm=3.779527559,dw=currentDocSize.width*mm,dh=currentDocSize.height*mm,vw=vp.clientWidth,vh=vp.clientHeight,minW=Math.max(dw,vw);v.style.width=minW+'px';v.style.minHeight=dh+'px';var fitScale=vw/minW;dynamicMinScale=Math.round(fitScale*100)/100;if(dynamicMinScale>1.0)dynamicMinScale=1.0;docScale=dynamicMinScale;docTx=(vw-minW*docScale)/2;docTy=0;userScale=null;userTrans=null;clampTranslate();updateTransform();updateZoomDisplay()}
        function getUrlParam(name){return new URL(window.location.href).searchParams.get(name)}

        async function loadFromUrl(fileUrl){if(!fileUrl.startsWith('http'))fileUrl=new URL(fileUrl,window.location.href).href;try{var r=await fetch(fileUrl);if(!r.ok)throw new Error('HTTP '+r.status);await loadFile(new File([await r.blob()],fileUrl.split('/').pop().split('?')[0]||'doc'))}catch(err){}}

        async function loadFile(file){
            var ext=file.name.split('.').pop().toLowerCase();currentFileId='file_'+file.name+'_'+file.size+'_'+file.lastModified;
            userScale=null;userTrans=null;keyboardVisible=false;lastKnownH=window.innerHeight;
            docLoaded=false;setZoomEnabled(false);noIndividualCheck=false;isCheckingAll=false;dynamicMinScale=0.5;

                        v=v.replace(/A\d+\[[\s\S]*?\]/gi,'');
                        rh+='<td>'+v+'</td>';

                });

        function deleteHistory(fid){localStorage.removeItem('quiz_'+fid);localStorage.removeItem('wrong_'+fid)}
        function restoreHistory(fid){var h=getHistoryData(fid);Object.keys(h.answers).forEach(function(k){var i=document.querySelector('.fill-blank-input[data-q="'+k+'"]');if(i){i.value=h.answers[k];if(h.checked[k])checkAnswerSilent(k,h.answers[k])}})}
        function checkAnswerSilent(qKey,ua){var a=answerMap.get(qKey);if(!a||!a.answer)return;var i=document.querySelector('.fill-blank-input[data-q="'+qKey+'"]'),ic=document.querySelector('.result-icon[data-q="'+qKey+'"]'),dp=document.querySelector('.answer-display[data-q="'+qKey+'"]');if(!i)return;a.checked=true;var ok=false,nu=ua.replace(/\s+/g,' ').trim(),pa=a.answer.split('|').map(function(x){return x.replace(/\s+/g,' ').trim()});for(var j=0;j<pa.length;j++){if(nu===pa[j]||nu.toLowerCase()===pa[j].toLowerCase()||nu.replace(/\s+/g,'').toLowerCase()===pa[j].replace(/\s+/g,'').toLowerCase()){ok=true;break}}if(!ok){a.wrongCount=(a.wrongCount||0)+1;a.lastWrongAnswer=ua;saveWrongCounts(currentFileId)}answerMap.set(qKey,a);if(ic){ic.className='result-icon '+(ok?'correct':'wrong');ic.textContent=ok?'✓':'✗'}i.style.borderBottomColor=ok?'#4caf50':'#f44336';i.style.color=ok?'#4caf50':'#f44336';if(dp&&!ok){dp.textContent='答案: '+a.answer;dp.classList.add('show')}}
        window.addEventListener('beforeunload',function(){if(currentFileId)saveToHistory()});
        setInterval(function(){if(currentFileId&&answerMap.size>0)saveToHistory()},30000);

        window.checkAllAnswers=function(){if(isCheckingAll)return;isCheckingAll=true;var t=0,c=0,w=0,na=0,e=0;answerMap.forEach(function(a,k){t++;if(!a.answer){na++;return}var i=document.querySelector('.fill-blank-input[data-q="'+k+'"]');if(!i||i.value.trim()===''){e++;return}if(checkAnswer(k)==='correct')c++;else w++});if(currentFileId)saveToHistory();alert('共'+t+'题\n已填'+(t-e-na)+'题\n正确'+c+'题\n错误'+w+'题');isCheckingAll=false};
        window.clearAllMarks=function(){document.querySelectorAll('.result-icon').forEach(function(i){i.className='result-icon';i.textContent=''});document.querySelectorAll('.answer-display').forEach(function(d){d.classList.remove('show');d.textContent=''});document.querySelectorAll('.fill-blank-input').forEach(function(i){i.style.borderBottomColor='#667eea';i.style.color='inherit'});answerMap.forEach(function(a,k){a.checked=false;answerMap.set(k,a)});if(currentFileId)saveToHistory()};
        window.clearWrongAnswers=function(){document.querySelectorAll('.fill-blank-input').forEach(function(i){var q=i.dataset.q,ic=document.querySelector('.result-icon[data-q="'+q+'"]'),dp=document.querySelector('.answer-display[data-q="'+q+'"]');if(ic&&ic.classList.contains('wrong')){i.value='';i.style.borderBottomColor='#667eea';i.style.color='inherit';ic.className='result-icon';ic.textContent='';if(dp){dp.classList.remove('show');dp.textContent=''}var a=answerMap.get(q);if(a){a.checked=false;answerMap.set(q,a)}}});if(currentFileId)saveToHistory()};
        function resetAllAnswers(){document.querySelectorAll('.fill-blank-input').forEach(function(i){i.value='';i.style.borderBottomColor='#667eea';i.style.color='inherit'});document.querySelectorAll('.result-icon').forEach(function(i){i.className='result-icon';i.textContent=''});document.querySelectorAll('.answer-display').forEach(function(d){d.classList.remove('show');d.textContent=''});answerMap.forEach(function(a,k){a.checked=false;answerMap.set(k,a)});if(currentFileId)saveToHistory()}
        function clearExerciseData(){document.querySelectorAll('.fill-blank-input').forEach(function(i){i.value='';i.style.borderBottomColor='#667eea';i.style.color='inherit'});document.querySelectorAll('.result-icon').forEach(function(i){i.className='result-icon';i.textContent=''});document.querySelectorAll('.answer-display').forEach(function(d){d.classList.remove('show');d.textContent=''});answerMap.forEach(function(a,k){a.checked=false;a.wrongCount=0;a.lastWrongAnswer=null;answerMap.set(k,a)});if(currentFileId){saveToHistory();clearWrongCounts(currentFileId)}}
        window.showStats=function(){var t=answerMap.size,c=0,ok=0,na=0;answerMap.forEach(function(a,k){if(!a.answer)na++;if(a.checked){c++;var i=document.querySelector('.fill-blank-input[data-q="'+k+'"]');if(i&&a.answer){var u=i.value.replace(/\s+/g,' ').trim(),pa=a.answer.split('|').map(function(x){return x.replace(/\s+/g,' ').trim()});if(pa.some(function(x){return u===x||u.toLowerCase()===x.toLowerCase()||u.replace(/\s+/g,'').toLowerCase()===x.replace(/\s+/g,'').toLowerCase()}))ok++}}});document.getElementById('statsContent').innerHTML='<div class="stat-item"><span>总题数</span><strong>'+t+'</strong></div><div class="stat-item"><span>已检查</span><strong>'+c+'</strong></div><div class="stat-item"><span>正确</span><strong style="color:#4caf50;">'+ok+'</strong></div><div class="stat-item"><span>错误</span><strong style="color:#f44336;">'+(c-ok)+'</strong></div><div class="stat-item"><span>未检查</span><strong style="color:#999;">'+(t-c)+'</strong></div><div class="stat-item"><span>无答案</span><strong style="color:#ff9800;">'+na+'</strong></div>';document.getElementById('statsPanel').classList.add('show');document.getElementById('statsOverlay').classList.add('show')};
        window.hideStats=function(){document.getElementById('statsPanel').classList.remove('show');document.getElementById('statsOverlay').classList.remove('show')};
        window.showHistory=function(){var hs=getAllHistory(),ct=document.getElementById('historyContent');if(hs.length===0)ct.innerHTML='<div class="history-empty">暂无历史记录</div>';else ct.innerHTML=hs.map(function(h){var d=new Date(h.date);return'<div class="history-item"><div class="history-item-info" onclick="loadHistoryFile(\''+h.fileId+'\')"><div class="history-item-name">'+(h.fileName||'未命名')+'</div><div class="history-item-meta">'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' · '+Object.keys(h.answers||{}).length+'题已填</div></div><button class="history-item-detail" onclick="event.stopPropagation();showWrongDetail(\''+h.fileId+'\')">详情</button><button class="history-item-delete" onclick="event.stopPropagation();deleteHistoryItem(\''+h.fileId+'\')">删除</button></div>'}).join('');document.getElementById('historyPanel').classList.add('show');document.getElementById('historyOverlay').classList.add('show')};
        window.hideHistory=function(){document.getElementById('historyPanel').classList.remove('show');document.getElementById('historyOverlay').classList.remove('show')};
        window.deleteHistoryItem=function(fid){deleteHistory(fid);showHistory()};
        window.loadHistoryFile=function(fid){currentFileId=fid;restoreHistory(fid);hideHistory()};
        window.showWrongDetail=function(fid){var ws=loadWrongCounts(fid),h=getHistoryData(fid),wa=h.wrongAnswers||{},ht='';var es=Object.entries(ws).sort(function(a,b){return a[0].localeCompare(b[0])});if(es.length===0)ht='<div style="text-align:center;color:#999;padding:20px;">暂无错误记录</div>';else es.forEach(function(e){var q=e[0],wc=e[1],qn=q.replace('Q',''),ca='',wr=wa[q]||'';if(currentFileId===fid&&answerMap.has(q))ca=answerMap.get(q).answer;if(!ca){var sa=localStorage.getItem('answers_'+fid);if(sa){try{var am=JSON.parse(sa);ca=am[q]||''}catch(ex){}}}ht+='<div class="wrong-detail-item"><div class="q-label">Q'+qn+'（错误 '+wc+' 次）</div><div>正确答案：<span class="correct-ans">'+(ca||'未知')+'</span></div>'+(wr?'<div>错误回答：<span class="wrong-ans">'+escHtml(wr)+'</span></div>':'')+'</div>'});document.getElementById('wrongDetailContent').innerHTML=ht;document.getElementById('wrongDetailPanel').classList.add('show');document.getElementById('wrongDetailOverlay').classList.add('show')};
        window.hideWrongDetail=function(){document.getElementById('wrongDetailPanel').classList.remove('show');document.getElementById('wrongDetailOverlay').classList.remove('show')};
        function saveAnswersMap(fid){var a={};answerMap.forEach(function(d,k){if(d.answer)a[k]=d.answer});localStorage.setItem('answers_'+fid,JSON.stringify(a))}
        var origSave=saveToHistory;saveToHistory=function(){origSave();if(currentFileId)saveAnswersMap(currentFileId)};

        window.showGuide=function(){document.getElementById('guideContent').innerHTML='<h2>一、这是什么？</h2><p>把Word/Excel/文本变成<strong>自动批改的填空练习</strong>。</p><div class="note">手机电脑都能用。手机支持双指缩放、单指拖动，自动弹出英文/数字键盘。</div><h2>二、怎么用？（三步）</h2><div class="step"><strong>第1步：打开文件</strong><br>点<b>文件→打开文件</b>选文档。</div><div class="step"><strong>第2步：填写答案</strong><br>在输入框打字。</div><div class="step"><strong>第3步：检查对错</strong><br>点<b>检查</b>或按回车。</div><h2>三、怎么准备文档？</h2><p><b>题目：</b><code>Q1[]</code>或<code>Q1[提示]</code> <b>答案：</b><code>A1[答案]</code>（<code>|</code>分隔多答案）</p><p><b>隐藏答案：</b><code>[dpstart]...[dpend]</code>包裹</p><p><b>其他：</b><code>[A4]</code>尺寸 <code>[noet]</code>隐藏逐题检查 <code>cheanc[提交,100,middle]</code>自定义按钮</p><h2>四、按钮说明</h2><table><tr><th>按钮</th><th>功能</th></tr><tr><td>文件→打开文件</td><td>选.docx/.xlsx/.txt</td></tr><tr><td>文件→历史记录</td><td>查看/恢复/删除</td></tr><tr><td>文件→重置</td><td>清空答案和批改</td></tr><tr><td>文件→清除数据</td><td>清空含错误计数</td></tr><tr><td>答题→全部检查</td><td>一键批改</td></tr><tr><td>答题→清除批改</td><td>只清标记</td></tr><tr><td>答题→清除错误</td><td>清空做错的题</td></tr><tr><td>答题→统计</td><td>正确/错误/未检查</td></tr></table>';document.getElementById('guidePanel').classList.add('show');document.getElementById('guideOverlay').classList.add('show')};
        window.hideGuide=function(){document.getElementById('guidePanel').classList.remove('show');document.getElementById('guideOverlay').classList.remove('show')};

        updateTransform();updateZoomDisplay();
        var urlFile=getUrlParam('file');if(urlFile){setTimeout(function(){loadFromUrl(urlFile)},500)}
    })();
    </script>
</body>
