<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>值日登记系统</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: #1a2634;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .aspect-4-3 {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 4 / 3;
            background: #f0f4f8;
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        
        .container {
            height: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }
        
        #video-container {
            width: 100%;
            border-radius: 2rem;
            overflow: hidden;
            background: #1e293b;
            margin: 0.8rem 0;
            position: relative;
            display: none;
            flex-shrink: 0;
            max-height: 35vh;
        }
        
        #scanner-video {
            width: 100%;
            height: auto;
            display: block;
            max-height: 35vh;
            object-fit: contain;
        }
        
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
            margin: 0 0 0.8rem 0;
            padding-bottom: 0.8rem;
            border-bottom: 3px solid #e2e8f0;
            flex-shrink: 0;
        }
        
        .main-btn {
            background: #2c3e50;
            color: white;
            border: none;
            width: 100%;
            padding: 1.5rem 1rem;
            font-size: 2.2rem;
            font-weight: 700;
            border-radius: 3rem;
            cursor: pointer;
            transition: 0.2s;
            margin: 0.3rem 0;
            letter-spacing: 2px;
            box-shadow: 0 10px 15px -5px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        
        .main-btn:hover {
            background: #1e2b3a;
            transform: translateY(-2px);
        }
        
        .main-btn:active {
            transform: translateY(0);
        }
        
        .scan-panel {
            background: #f8fafc;
            border-radius: 2rem;
            padding: 1.2rem;
            margin: 0.5rem 0;
            border: 2px solid #e9eef2;
            flex-shrink: 0;
        }
        
        .flex-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        
        input {
            flex: 1;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            border: 2px solid #dde3ea;
            border-radius: 3rem;
            outline: none;
            font-family: monospace;
        }
        
        input:focus {
            border-color: #2c3e50;
        }
        
        button {
            background: #eef2f6;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 3rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid #cdd9e6;
        }
        
        button.primary {
            background: #2c3e50;
            color: white;
            border: none;
        }
        
        button.primary:hover {
            background: #1e2b3a;
        }
        
        button.warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fbbf24;
        }
        
        button.warning:hover {
            background: #fde68a;
        }
        
        button.danger {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        
        button.danger:hover {
            background: #fecaca;
        }
        
        button.success {
            background: #22c55e;
            color: white;
            border: none;
        }
        
        button.success:hover {
            background: #16a34a;
        }
        
        .card-item {
            background: #f1f5f9;
            border-radius: 2rem;
            padding: 0.6rem 1.2rem;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: monospace;
            font-size: 1.1rem;
            word-break: break-all;
        }
        
        .badge {
            background: #2c3e50;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            display: inline-block;
        }
        
        .badge.success {
            background: #22c55e;
        }
        
        .badge.warning {
            background: #f59e0b;
        }
        
        .badge.voice-on {
            background: #8b5cf6;
        }
        
        .badge.voice-off {
            background: #9ca3af;
        }
        
        .top-message {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 1rem 3rem;
            border-radius: 3rem;
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.5);
            z-index: 1000;
            animation: slideDown 0.3s ease;
            text-align: center;
            white-space: nowrap;
            border: 3px solid white;
        }
        
        .top-message.error {
            background: #ef4444;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5);
        }
        
        @keyframes slideDown {
            from {
                top: -100px;
                opacity: 0;
            }
            to {
                top: 30px;
                opacity: 1;
            }
        }
        
        .history-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1.2rem;
            padding: 0.5rem 1rem;
            margin: 0.3rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .history-item .info {
            flex: 1;
            display: flex;
            gap: 1rem;
        }
        
        .history-item .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            cursor: pointer;
        }
        
        .history-item .delete-btn:hover {
            background: #fecaca;
        }
        
        .records-panel {
            background: #f8fafc;
            border-radius: 2rem;
            padding: 1rem 1.2rem;
            margin: 0.5rem 0;
            border: 2px solid #e9eef2;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        
        .records-panel h3 {
            margin-bottom: 0.5rem;
            color: #1e293b;
            font-size: 1.1rem;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .records-panel .record-count {
            background: #2c3e50;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
        }
        
        .records-container {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        
        .record-item {
            padding: 0.4rem 0.6rem;
            border-bottom: 1px dashed #dde3ea;
            font-size: 0.9rem;
            color: #475569;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .record-item:last-child {
            border-bottom: none;
        }
        
        .record-item .student-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .record-item .student-code {
            font-weight: 500;
            color: #1e293b;
        }
        
        .record-item .count-badge {
            background: #e2e8f0;
            color: #1e293b;
            padding: 0.1rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.8rem;
        }
        
        .record-item .time {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        
        .hidden {
            display: none !important;
        }
        
        .scan-region {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 160px;
            border: 4px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 0 0 500px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { border-color: #ffd700; }
            50% { border-color: #ffaa00; }
            100% { border-color: #ffd700; }
        }
        
        .close-camera {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            cursor: pointer;
            z-index: 10;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .close-camera:hover {
            background: #dc2626;
        }
        
        .camera-select {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 2rem;
            margin: 0.8rem 0;
        }
        
        .camera-select select {
            width: 100%;
            padding: 0.8rem;
            border-radius: 2rem;
            border: 2px solid #dde3ea;
            margin-bottom: 0.8rem;
            font-size: 1rem;
            background: white;
        }
        
        .voice-settings {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 2rem;
            margin: 0.8rem 0;
        }
        
        .voice-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        
        .voice-switch {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 26px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #8b5cf6;
        }
        
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        
        .voice-select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 2rem;
            border: 2px solid #dde3ea;
            margin-bottom: 0.5rem;
            background: white;
        }
        
        .voice-test {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .voice-test input {
            flex: 1;
            padding: 0.5rem 1rem;
        }
        
        .voice-rate {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        
        .voice-rate input[type="range"] {
            flex: 1;
            padding: 0;
        }
        
        .password-field {
            -webkit-text-security: disc;
            text-security: disc;
        }
        
        .error-message {
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.8rem;
            border-radius: 1rem;
            margin: 0.5rem 0;
            text-align: center;
        }
        
        .status-badge {
            background: #f1f5f9;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            display: inline-block;
            margin: 0.3rem 0;
        }
        
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 1.5rem;
            font-size: 1rem;
        }
        
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding-right: 4px;
        }
        
        .card-list {
            max-height: 120px;
            overflow-y: auto;
        }
        
        .footer-fixed {
            flex-shrink: 0;
            margin-top: 0.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .backup-status {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 0.2rem;
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
        
        .backup-status span {
            background: #e2e8f0;
            padding: 0.1rem 0.4rem;
            border-radius: 1rem;
        }
        
        .backup-status .success {
            background: #22c55e;
            color: white;
        }
        
        .backup-status .warning {
            background: #f59e0b;
            color: white;
        }
        
        .camera-info {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .default-camera-badge {
            background: #22c55e;
            color: white;
            padding: 0.1rem 0.4rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            margin-left: 0.5rem;
        }
        
        .voice-led {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #44af69;
            margin-right: 0.5rem;
            box-shadow: 0 0 0 2px #44af6940;
        }
        
        .voice-led.speaking {
            animation: pulse-voice 1s infinite;
        }
        
        @keyframes pulse-voice {
            0% { box-shadow: 0 0 0 2px #8b5cf640; }
            50% { box-shadow: 0 0 0 4px #8b5cf680; }
            100% { box-shadow: 0 0 0 2px #8b5cf640; }
        }
        
        .voice-led.disabled {
            background: #9ca3af;
            box-shadow: 0 0 0 2px #9ca3af40;
        }
        
        .camera-name-badge {
            background: #e2e8f0;
            color: #1e293b;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            margin-left: 0.3rem;
        }
        
        .beep-test {
            margin-top: 0.5rem;
            text-align: center;
        }
        
        .beep-test button {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 0.4rem 1rem;
            font-size: 0.9rem;
        }
        
        .beep-label {
            display: inline-block;
            background: #e2e8f0;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            color: #1e293b;
            margin-left: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .main-btn {
                font-size: 1.8rem;
                padding: 1rem;
            }
            
            .record-item {
                font-size: 0.8rem;
            }
        }
        
        /* 新增记录闪烁动画 */
        @keyframes highlight {
            0% { background-color: rgba(34, 197, 94, 0.3); }
            100% { background-color: transparent; }
        }
        
        .record-item.highlight {
            animation: highlight 1s ease;
        }
        
        /* 值日卡名称管理 */
        .card-name-input {
            width: 100%;
            padding: 0.4rem;
            border: 1px solid #dde3ea;
            border-radius: 1rem;
            margin-top: 0.3rem;
        }
        
        .card-name-display {
            font-size: 0.9rem;
            color: #64748b;
            margin-left: 0.5rem;
        }
        
        .filter-select {
            width: 100%;
            padding: 0.6rem;
            border-radius: 2rem;
            border: 2px solid #dde3ea;
            margin-bottom: 0.8rem;
            background: white;
        }
        
        /* 扫码录入按钮 */
        .scan-input-btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .scan-input-btn:hover {
            background: #3a7bc8;
        }
        
        /* 输入提示 */
        .input-hint {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 0.3rem;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }
    </style>
    <!-- 使用 ZXing 库 -->
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
</head>
<body>
    <div class="aspect-4-3">
        <div class="container">
            <h1>值日登记系统</h1>

            <!-- 顶部提示消息 -->
            <div id="topMessage" class="top-message hidden"></div>

            <!-- 主界面 -->
            <div id="mainInterface" style="height: 100%; display: flex; flex-direction: column;">
                <button class="main-btn" id="bigButton">请扫值日卡</button>
                
                <!-- 摄像头实时扫描区域 -->
                <div id="video-container">
                    <video id="scanner-video" autoplay playsinline></video>
                    <div class="scan-region"></div>
                    <button class="close-camera" id="closeCameraBtn">✕ 关闭摄像头</button>
                </div>

                <!-- 状态信息 -->
                <div id="statusInfo" class="status-badge hidden"></div>

                <!-- 摄像头错误提示 -->
                <div id="cameraError" class="error-message hidden">
                    <p>⚠️ 无法启动摄像头</p>
                    <p id="cameraErrorDetail"></p>
                    <button id="retryCameraBtn" class="primary">重试</button>
                    <button id="useManualOnlyBtn">仅使用手动输入</button>
                </div>

                <!-- 手动输入备用 -->
                <div class="scan-panel" style="padding: 0.8rem;">
                    <div style="font-weight:600; margin-bottom:0.3rem;">📝 手动输入条码</div>
                    <div class="flex-row">
                        <input type="text" id="manualBarcodeInput" placeholder="输入条码内容">
                        <button id="submitManualBarcode">确认</button>
                    </div>
                </div>

                <!-- 值日卡筛选下拉框 -->
                <div class="scan-panel" style="padding: 0.8rem;">
                    <div style="font-weight:600; margin-bottom:0.3rem;">🔍 筛选值日记录</div>
                    <select id="frontCardFilter" class="filter-select">
                        <option value="">全部值日卡</option>
                    </select>
                </div>

                <!-- 值日记录 - 新增记录会自动刷新显示 -->
                <div class="records-panel">
                    <h3>
                        值日记录
                        <span id="recordCount" class="record-count">0</span>
                    </h3>
                    <div id="allRecords" class="records-container">
                        <div class="empty-state">暂无值日记录</div>
                    </div>
                </div>
                
                <div class="footer-fixed">
                    <span id="stepIndicator" class="badge">当前: 请扫值日卡</span>
                    <button id="enterAdminBtn" class="warning">⚙️ 管理员后台</button>
                </div>
                
                <!-- 语音状态提示 -->
                <div id="voiceStatusBar" class="backup-status" style="margin-top:0.3rem; justify-content: flex-start;">
                    <span id="voiceStatusLed" class="voice-led"></span>
                    <span id="voiceStatusText">语音提示 检测中...</span>
                    <span class="beep-label">🔊 600Hz 蜂鸣</span>
                </div>
            </div>

            <!-- 管理员后台 -->
            <div id="adminPanel" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
                <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-shrink: 0;">
                    <h2 style="margin:0; font-size:1.3rem;">管理员后台</h2>
                    <button id="backFromAdmin">← 返回</button>
                </div>

                <div class="scroll-content">
                    <!-- 修改管理员密码 -->
                    <div class="scan-panel" style="padding: 0.8rem;">
                        <div style="font-weight:600; margin-bottom:0.5rem;">🔐 修改管理员密码</div>
                        <div class="flex-row" style="margin-bottom: 0.3rem;">
                            <input type="password" id="currentAdminPwd" placeholder="当前密码" class="password-field">
                        </div>
                        <div class="flex-row" style="margin-bottom: 0.3rem;">
                            <input type="password" id="newAdminPwd" placeholder="新密码" class="password-field">
                        </div>
                        <div class="flex-row">
                            <input type="password" id="confirmAdminPwd" placeholder="确认新密码" class="password-field">
                            <button id="changeAdminPwdBtn" class="primary">修改</button>
                        </div>
                    </div>

                    <!-- 增删值日卡 - 支持扫码录入和手动输入 -->
                    <div class="scan-panel" style="padding: 0.8rem;">
                        <div style="font-weight:600; margin-bottom:0.5rem;">➕ 增加值日卡</div>
                        <div class="flex-row" style="margin-bottom: 0.3rem;">
                            <input type="text" id="newDutyCardInput" placeholder="值日卡条码（可手动输入或扫码）">
                            <button id="scanDutyCardBtn" class="scan-input-btn">📷 扫码录入</button>
                        </div>
                        <div class="flex-row" style="margin-bottom: 0.3rem;">
                            <input type="text" id="dutyCardNameInput" placeholder="值日卡名称（可选）">
                            <button id="addDutyCardBtn" class="primary">添加</button>
                        </div>
                        <div class="input-hint">支持手动输入条码，或点击扫码录入快速扫描</div>
                        <div style="margin:0.8rem 0 0.3rem;">📋 已授权值日卡列表</div>
                        <div id="dutyCardListContainer" class="card-list">
                            <div class="empty-state">暂无值日卡，请添加</div>
                        </div>
                    </div>

                    <!-- 语音提示设置 -->
                    <div class="voice-settings">
                        <div class="voice-header">
                            <div style="font-weight:600;">🔊 语音提示</div>
                            <div class="voice-switch">
                                <span class="badge" id="voiceStatus">检测中</span>
                                <label class="switch">
                                    <input type="checkbox" id="voiceSwitch" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                        
                        <select id="voiceSelect" class="voice-select"></select>
                        
                        <div class="voice-test">
                            <input type="text" id="testVoiceText" placeholder="测试语音输入" value="1234">
                            <button id="testVoiceBtn" class="primary">测试</button>
                        </div>
                        
                        <div class="voice-rate">
                            <span>语速</span>
                            <input type="range" id="voiceRate" min="0.5" max="2" value="1" step="0.1">
                            <span id="rateValue">1.0</span>
                        </div>
                        
                        <div class="beep-test">
                            <button id="testBeepBtn">🔊 测试蜂鸣声 (600Hz 方波)</button>
                            <button id="testErrorBeepBtn">🔊 测试错误提示 (三连滴)</button>
                        </div>
                        
                        <div style="font-size:0.8rem; color:#64748b; margin-top:0.5rem;" id="voiceSupportInfo">
                            ⚡ 数字会逐个念出：1234 → 1-2-3-4<br>
                            🔊 成功: 单声滴 · 失败: 三连滴 (600Hz)
                        </div>
                    </div>

                    <!-- 查看和管理记录 - 显示值日卡名称 -->
                    <div class="scan-panel" style="padding: 0.8rem;">
                        <div style="font-weight:600; margin-bottom:0.5rem;">📜 管理值日记录</div>
                        <div style="margin-bottom: 0.5rem;">
                            <select id="historyCardSelector" style="width:100%; padding:0.6rem; border-radius:3rem; margin-bottom:0.3rem;">
                                <option value="">全部值日卡</option>
                            </select>
                            <button id="clearAllRecordsBtn" class="danger" style="width:100%; margin-top:0.3rem; padding:0.5rem;">🗑️ 清空所有记录</button>
                        </div>
                        <div id="historyRecords" class="records-container" style="max-height: 200px;"></div>
                    </div>

                    <!-- 摄像头设置 -->
                    <div class="camera-select">
                        <div style="font-weight:600; margin-bottom:0.5rem;">📷 选择默认摄像头 <span class="camera-name-badge">名称优先</span></div>
                        <div id="cameraStatus" class="camera-info">检测摄像头中...</div>
                        <select id="cameraSelector" size="3" style="height: auto; min-height: 120px;">
                            <option value="">正在加载摄像头列表...</option>
                        </select>
                        <div class="flex-row" style="margin-top:0.8rem;">
                            <button id="testCameraBtn" style="flex:1;">测试</button>
                            <button id="saveDefaultCamera" class="primary" style="flex:1;">保存默认</button>
                        </div>
                        <div id="defaultCameraInfo" style="font-size:0.9rem; color:#1e293b; margin-top:0.5rem; padding:0.3rem; background:#e2e8f0; border-radius:1rem; text-align:center;"></div>
                        <div id="cameraDebug" style="font-size:0.8rem; color:#64748b; margin-top:0.3rem; text-align:center;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 扫码录入模态框 -->
    <div id="scanModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem;">📷 扫码录入值日卡</h3>
            <div style="width: 100%; border-radius: 1rem; overflow: hidden; background: #000; margin-bottom: 1rem;">
                <video id="modalScannerVideo" autoplay playsinline style="width: 100%;"></video>
            </div>
            <div id="scanModalResult" style="text-align: center; margin-bottom: 1rem; min-height: 2rem;"></div>
            <div class="flex-row" style="justify-content: center;">
                <button id="scanModalCancel" class="danger">取消</button>
            </div>
        </div>
    </div>

<script>
(function() {
    // ==================== 存储键常量 ====================
    const STORAGE_KEYS = {
        ADMIN: 'duty_adminCode',
        DUTY_CARDS: 'duty_cards',
        DUTY_CARD_NAMES: 'duty_card_names',
        RECORDS: 'duty_records',
        CAMERA_NAME: 'duty_defaultCameraName',
        CAMERA_ID: 'duty_defaultCameraId',
        CAMERA_POSITION: 'duty_cameraPosition',
        VOICE_ENABLED: 'duty_voiceEnabled',
        VOICE_RATE: 'duty_voiceRate',
        VOICE_URI: 'duty_voiceURI'
    };
    
    const DEFAULT_ADMIN = 'admin888';

    // ==================== 数据存储模块 ====================
    let classData = {
        adminCode: DEFAULT_ADMIN,
        dutyCards: [],           // 值日卡条码列表
        dutyCardNames: {},       // 值日卡名称映射 {条码: 名称}
        records: [],
        defaultCameraName: '',
        defaultCameraId: '',
        defaultCameraPosition: '',
        voiceEnabled: true,
        voiceRate: 1.0,
        voiceURI: ''
    };

    // 从localStorage加载数据
    function loadFromLocalStorage() {
        try {
            const adminData = localStorage.getItem(STORAGE_KEYS.ADMIN);
            if (adminData) classData.adminCode = adminData;
            
            const cardsData = localStorage.getItem(STORAGE_KEYS.DUTY_CARDS);
            if (cardsData) {
                try {
                    classData.dutyCards = JSON.parse(cardsData);
                } catch {
                    classData.dutyCards = [];
                }
            }
            
            const cardNamesData = localStorage.getItem(STORAGE_KEYS.DUTY_CARD_NAMES);
            if (cardNamesData) {
                try {
                    classData.dutyCardNames = JSON.parse(cardNamesData);
                } catch {
                    classData.dutyCardNames = {};
                }
            }
            
            const recordsData = localStorage.getItem(STORAGE_KEYS.RECORDS);
            if (recordsData) {
                try {
                    classData.records = JSON.parse(recordsData);
                } catch {
                    classData.records = [];
                }
            }
            
            const cameraNameData = localStorage.getItem(STORAGE_KEYS.CAMERA_NAME);
            if (cameraNameData) classData.defaultCameraName = cameraNameData;
            
            const cameraIdData = localStorage.getItem(STORAGE_KEYS.CAMERA_ID);
            if (cameraIdData) classData.defaultCameraId = cameraIdData;
            
            const cameraPosData = localStorage.getItem(STORAGE_KEYS.CAMERA_POSITION);
            if (cameraPosData) classData.defaultCameraPosition = cameraPosData;
            
            const voiceEnabledData = localStorage.getItem(STORAGE_KEYS.VOICE_ENABLED);
            if (voiceEnabledData !== null) {
                classData.voiceEnabled = voiceEnabledData === 'true';
            }
            
            const voiceRateData = localStorage.getItem(STORAGE_KEYS.VOICE_RATE);
            if (voiceRateData !== null) {
                classData.voiceRate = parseFloat(voiceRateData);
            }
            
            const voiceURIData = localStorage.getItem(STORAGE_KEYS.VOICE_URI);
            if (voiceURIData !== null) {
                classData.voiceURI = voiceURIData;
            }
            
        } catch (error) {
            console.error('加载数据出错:', error);
            resetToDefaults();
        }
    }

    function resetToDefaults() {
        classData = {
            adminCode: DEFAULT_ADMIN,
            dutyCards: [],
            dutyCardNames: {},
            records: [],
            defaultCameraName: '',
            defaultCameraId: '',
            defaultCameraPosition: '',
            voiceEnabled: true,
            voiceRate: 1.0,
            voiceURI: ''
        };
    }

    function saveToLocalStorage() {
        try {
            localStorage.setItem(STORAGE_KEYS.ADMIN, classData.adminCode);
            localStorage.setItem(STORAGE_KEYS.DUTY_CARDS, JSON.stringify(classData.dutyCards));
            localStorage.setItem(STORAGE_KEYS.DUTY_CARD_NAMES, JSON.stringify(classData.dutyCardNames));
            localStorage.setItem(STORAGE_KEYS.RECORDS, JSON.stringify(classData.records));
            localStorage.setItem(STORAGE_KEYS.CAMERA_NAME, classData.defaultCameraName);
            localStorage.setItem(STORAGE_KEYS.CAMERA_ID, classData.defaultCameraId);
            localStorage.setItem(STORAGE_KEYS.CAMERA_POSITION, classData.defaultCameraPosition);
            localStorage.setItem(STORAGE_KEYS.VOICE_ENABLED, classData.voiceEnabled);
            localStorage.setItem(STORAGE_KEYS.VOICE_RATE, classData.voiceRate);
            localStorage.setItem(STORAGE_KEYS.VOICE_URI, classData.voiceURI);
            
            updateStorageStatus();
        } catch (error) {
            console.error('保存数据出错:', error);
            alert('保存数据时出错，请检查浏览器设置。');
        }
    }

    function updateStorageStatus() {
        const storageStatus = document.getElementById('storageLocalStatus');
        if (storageStatus) {
            storageStatus.textContent = '📦 已保存 ' + new Date().toLocaleTimeString();
        }
    }

    // ==================== 数据访问接口 ====================
    function getAdminCode() { return classData.adminCode; }
    function setAdminCode(code) { classData.adminCode = code; saveToLocalStorage(); }

    function getDutyCards() { return classData.dutyCards || []; }
    
    function getDutyCardName(cardCode) {
        return classData.dutyCardNames[cardCode] || cardCode;
    }
    
    function setDutyCardName(cardCode, name) {
        if (name && name.trim()) {
            classData.dutyCardNames[cardCode] = name.trim();
        } else {
            delete classData.dutyCardNames[cardCode];
        }
        saveToLocalStorage();
    }
    
    function addDutyCard(card, name) {
        if (!classData.dutyCards.includes(card)) {
            classData.dutyCards.push(card);
            if (name && name.trim()) {
                classData.dutyCardNames[card] = name.trim();
            }
            saveToLocalStorage();
        }
    }

    function removeDutyCard(card) {
        classData.dutyCards = classData.dutyCards.filter(c => c !== card);
        delete classData.dutyCardNames[card];
        saveToLocalStorage();
    }

    function getRecords() { return classData.records || []; }
    function setRecords(records) { classData.records = records; saveToLocalStorage(); }

    function getDefaultCameraName() { return classData.defaultCameraName; }
    function getDefaultCameraId() { return classData.defaultCameraId; }
    
    function setDefaultCamera(name, id, position) { 
        classData.defaultCameraName = name || ''; 
        classData.defaultCameraId = id || '';
        classData.defaultCameraPosition = position || '';
        saveToLocalStorage(); 
    }
    
    function isVoiceEnabled() { return classData.voiceEnabled; }
    function setVoiceEnabled(enabled) { 
        classData.voiceEnabled = enabled; 
        saveToLocalStorage();
        updateVoiceUI();
    }
    
    function getVoiceRate() { return classData.voiceRate; }
    function setVoiceRate(rate) { 
        classData.voiceRate = rate; 
        saveToLocalStorage(); 
    }
    
    function getVoiceURI() { return classData.voiceURI; }
    function setVoiceURI(uri) { 
        classData.voiceURI = uri; 
        saveToLocalStorage(); 
    }

    // 辅助函数
    function addRecord(record) {
        classData.records.push(record);
        saveToLocalStorage();
        updateAllRecordsDisplay();
        updateFrontFilter();
        highlightNewRecord(record);
    }

    function deleteRecord(index) {
        if (index >= 0 && index < classData.records.length) {
            classData.records.splice(index, 1);
            saveToLocalStorage();
        }
    }

    function clearRecords() {
        classData.records = [];
        saveToLocalStorage();
    }

    // ==================== 高亮新记录 ====================
    function highlightNewRecord(record) {
        setTimeout(() => {
            const recordItems = document.querySelectorAll('#allRecords .record-item');
            if (recordItems.length > 0) {
                const newestItem = recordItems[0];
                newestItem.classList.add('highlight');
                const recordsContainer = document.getElementById('allRecords');
                if (recordsContainer) {
                    recordsContainer.scrollTop = 0;
                }
            }
        }, 100);
    }

    // ==================== 提示音模块 ====================
    let audioContext = null;
    
    function playBeep() {
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    playBeepSound();
                });
            } else {
                playBeepSound();
            }
        } catch (e) {
            console.warn('音频不支持:', e);
        }
    }
    
    function playBeepSound() {
        try {
            const now = audioContext.currentTime;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 600;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.4, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            
            oscillator.start(now);
            oscillator.stop(now + 0.12);
            
        } catch (e) {
            console.warn('播放提示音失败:', e);
        }
    }
    
    // 播放三连滴错误提示音
    function playErrorBeep() {
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    playErrorBeepSound();
                });
            } else {
                playErrorBeepSound();
            }
        } catch (e) {
            console.warn('音频不支持:', e);
        }
    }
    
    function playErrorBeepSound() {
        try {
            const now = audioContext.currentTime;
            
            // 第一声
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            osc1.connect(gain1);
            gain1.connect(audioContext.destination);
            osc1.frequency.value = 600;
            osc1.type = 'square';
            gain1.gain.setValueAtTime(0.4, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc1.start(now);
            osc1.stop(now + 0.1);
            
            // 第二声 (间隔0.1秒)
            const osc2 = audioContext.createOscillator();
            const gain2 = audioContext.createGain();
            osc2.connect(gain2);
            gain2.connect(audioContext.destination);
            osc2.frequency.value = 600;
            osc2.type = 'square';
            gain2.gain.setValueAtTime(0.4, now + 0.2);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc2.start(now + 0.2);
            osc2.stop(now + 0.3);
            
            // 第三声 (间隔0.1秒)
            const osc3 = audioContext.createOscillator();
            const gain3 = audioContext.createGain();
            osc3.connect(gain3);
            gain3.connect(audioContext.destination);
            osc3.frequency.value = 600;
            osc3.type = 'square';
            gain3.gain.setValueAtTime(0.4, now + 0.4);
            gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc3.start(now + 0.4);
            osc3.stop(now + 0.5);
            
        } catch (e) {
            console.warn('播放错误提示音失败:', e);
        }
    }

    // ==================== 语音提示模块 ====================
    let synth = window.speechSynthesis;
    let availableVoices = [];
    let currentUtterance = null;
    let voiceSupported = false;
    
    const voiceStatusLed = document.getElementById('voiceStatusLed');
    const voiceStatusText = document.getElementById('voiceStatusText');
    const voiceSwitch = document.getElementById('voiceSwitch');
    const voiceSelect = document.getElementById('voiceSelect');
    const voiceRate = document.getElementById('voiceRate');
    const rateValue = document.getElementById('rateValue');
    const testVoiceBtn = document.getElementById('testVoiceBtn');
    const testVoiceText = document.getElementById('testVoiceText');
    const voiceStatus = document.getElementById('voiceStatus');
    const voiceSupportInfo = document.getElementById('voiceSupportInfo');
    const testBeepBtn = document.getElementById('testBeepBtn');
    const testErrorBeepBtn = document.getElementById('testErrorBeepBtn');
    
    function checkVoiceSupport() {
        if (!window.speechSynthesis) {
            voiceSupported = false;
            voiceStatusLed.className = 'voice-led disabled';
            voiceStatusText.textContent = '语音提示 不支持';
            if (voiceStatus) {
                voiceStatus.textContent = '不支持';
                voiceStatus.className = 'badge voice-off';
            }
            if (voiceSwitch) voiceSwitch.disabled = true;
            if (voiceSupportInfo) voiceSupportInfo.textContent = '❌ 当前浏览器不支持语音提示，但蜂鸣声仍可用 (600Hz)';
            return false;
        }
        
        voiceSupported = true;
        return true;
    }
    
    function formatNumberForSpeech(text) {
        let result = '';
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char >= '0' && char <= '9') {
                result += char + ' ';
            } else {
                result += char;
            }
        }
        return result.trim();
    }
    
    function loadVoices() {
        if (!synth) return;
        
        availableVoices = synth.getVoices();
        
        if (availableVoices.length === 0) {
            setTimeout(loadVoices, 200);
            return;
        }
        
        if (!voiceSelect) return;
        
        const selectedURI = getVoiceURI();
        
        voiceSelect.innerHTML = '';
        
        let hasChinese = false;
        availableVoices.forEach(voice => {
            const option = document.createElement('option');
            option.value = voice.voiceURI;
            let label = `${voice.name} (${voice.lang})`;
            if (voice.default) label += ' [默认]';
            if (voice.localService) label += ' 📍';
            option.textContent = label;
            
            if (voice.lang.startsWith('zh') || voice.lang.startsWith('cmn')) {
                hasChinese = true;
            }
            
            voiceSelect.appendChild(option);
        });
        
        if (selectedURI && [...voiceSelect.options].some(opt => opt.value === selectedURI)) {
            voiceSelect.value = selectedURI;
        } else if (hasChinese) {
            for (let opt of voiceSelect.options) {
                const voice = availableVoices.find(v => v.voiceURI === opt.value);
                if (voice && (voice.lang.startsWith('zh') || voice.lang.startsWith('cmn'))) {
                    voiceSelect.value = voice.voiceURI;
                    setVoiceURI(voice.voiceURI);
                    break;
                }
            }
        }
        
        if (!voiceSelect.value && voiceSelect.options.length > 0) {
            voiceSelect.value = voiceSelect.options[0].value;
            setVoiceURI(voiceSelect.value);
        }
    }
    
    function speak(text) {
        playBeep();
        
        if (!voiceSupported) {
            console.warn('当前浏览器不支持语音');
            return;
        }
        if (!isVoiceEnabled()) return;
        if (!text || text.trim() === '') return;
        if (!synth) return;
        
        if (synth.speaking) {
            synth.cancel();
        }
        
        const processedText = formatNumberForSpeech(text);
        
        const utterance = new SpeechSynthesisUtterance(processedText);
        
        const selectedURI = getVoiceURI();
        if (selectedURI && availableVoices.length > 0) {
            const selectedVoice = availableVoices.find(v => v.voiceURI === selectedURI);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
        }
        
        utterance.rate = getVoiceRate();
        
        utterance.onstart = function() {
            voiceStatusLed.classList.add('speaking');
            voiceStatusText.textContent = '语音播报中...';
        };
        
        utterance.onend = function() {
            voiceStatusLed.classList.remove('speaking');
            voiceStatusText.textContent = isVoiceEnabled() ? '语音提示 已开启' : '语音提示 已关闭';
        };
        
        utterance.onerror = function(event) {
            console.warn('语音错误:', event);
            voiceStatusLed.classList.remove('speaking');
            voiceStatusText.textContent = isVoiceEnabled() ? '语音提示 可用' : '语音提示 已关闭';
        };
        
        setTimeout(() => {
            try {
                synth.speak(utterance);
            } catch (e) {
                console.warn('语音播放失败:', e);
            }
        }, 120);
        
        currentUtterance = utterance;
    }
    
    function updateVoiceUI() {
        const enabled = isVoiceEnabled() && voiceSupported;
        
        if (voiceSwitch) voiceSwitch.checked = isVoiceEnabled();
        if (voiceStatus) {
            if (!voiceSupported) {
                voiceStatus.textContent = '不支持';
                voiceStatus.className = 'badge voice-off';
            } else {
                voiceStatus.textContent = isVoiceEnabled() ? '已开启' : '已关闭';
                voiceStatus.className = isVoiceEnabled() ? 'badge voice-on' : 'badge voice-off';
            }
        }
        if (voiceStatusText) {
            if (!voiceSupported) {
                voiceStatusText.textContent = '语音提示 不支持';
                voiceStatusLed.className = 'voice-led disabled';
            } else {
                voiceStatusText.textContent = isVoiceEnabled() ? '语音提示 已开启' : '语音提示 已关闭';
                voiceStatusLed.className = isVoiceEnabled() ? 'voice-led' : 'voice-led disabled';
            }
        }
        if (voiceSelect) voiceSelect.disabled = !enabled;
        if (voiceRate) voiceRate.disabled = !enabled;
        if (testVoiceBtn) testVoiceBtn.disabled = !enabled;
        if (testVoiceText) testVoiceText.disabled = !enabled;
    }
    
    function speakDutyCardScanned() {
        speak('值日卡扫描完成，请扫描你的学生卡');
    }
    
    function speakStudentRegistered(studentCode) {
        speak(`已成功登记${studentCode}同学的值日信息`);
    }

    // ==================== 前台筛选 ====================
    let currentFrontFilter = '';
    
    function updateFrontFilter() {
        const filterSelect = document.getElementById('frontCardFilter');
        const cards = getDutyCards();
        
        filterSelect.innerHTML = '<option value="">全部值日卡</option>';
        cards.forEach(card => {
            const opt = document.createElement('option');
            opt.value = card;
            opt.textContent = getDutyCardName(card);
            filterSelect.appendChild(opt);
        });
    }
    
    document.getElementById('frontCardFilter').addEventListener('change', (e) => {
        currentFrontFilter = e.target.value;
        updateFilteredRecords();
    });
    
    function updateFilteredRecords() {
        const records = getRecords();
        const studentCounts = getStudentDutyCounts();
        updateRecordCount();
        
        let filteredRecords = records;
        if (currentFrontFilter) {
            filteredRecords = records.filter(r => r.card === currentFrontFilter);
        }
        
        if (filteredRecords.length === 0) {
            allRecords.innerHTML = '<div class="empty-state">暂无值日记录</div>';
            return;
        }
        
        const sorted = [...filteredRecords].reverse();
        let html = '';
        sorted.forEach(rec => {
            const count = studentCounts[rec.studentCode] || 0;
            const cardName = getDutyCardName(rec.card);
            html += `<div class="record-item">
                <div class="student-info">
                    <span class="student-code">${rec.studentCode}</span>
                    <span class="count-badge">${count}次</span>
                    <span class="card-name-display"> ${cardName}</span>
                </div>
                <span class="time">${rec.time}</span>
            </div>`;
        });
        allRecords.innerHTML = html;
    }

    // ==================== 状态变量 ====================
    let currentStep = 'SCAN_DUTY';
    let currentDutyCard = null;
    let codeReader = null;
    let camerasList = [];
    let lastScanTime = 0;
    let modalCodeReader = null;
    const SCAN_COOLDOWN = 1000;

    // ==================== UI元素 ====================
    const mainDiv = document.getElementById('mainInterface');
    const adminDiv = document.getElementById('adminPanel');
    const bigButton = document.getElementById('bigButton');
    const stepIndicator = document.getElementById('stepIndicator');
    const videoContainer = document.getElementById('video-container');
    const closeCameraBtn = document.getElementById('closeCameraBtn');
    const manualInput = document.getElementById('manualBarcodeInput');
    const submitManual = document.getElementById('submitManualBarcode');
    const cameraError = document.getElementById('cameraError');

    function formatDateTime(timestamp) {
        const date = new Date(timestamp);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    function processDutyCard(card) {
        const cards = getDutyCards();
        if (!cards.includes(card)) {
            showTopMessage('未授权的值日卡', false);
            return;
        }
        currentDutyCard = card;
        currentStep = 'SCAN_STUDENT';
        updateStepDisplay();
        showTopMessage('值日卡有效，请扫学生证', true);
        speakDutyCardScanned();
    }

    function processStudentCard(studentCode) {
        if (!currentDutyCard) {
            showTopMessage('请先扫描值日卡', false);
            currentStep = 'SCAN_DUTY';
            updateStepDisplay();
            return;
        }

        if (studentCode === currentDutyCard) {
            showTopMessage('学生证不能与值日卡相同', false);
            return;
        }

        const records = getRecords();
        records.push({
            card: currentDutyCard,
            studentCode: studentCode,
            time: new Date().toLocaleString('zh-CN', {hour12: false})
        });
        setRecords(records);
        
        showTopMessage(`登记成功`, true);
        speakStudentRegistered(studentCode);
        
        currentDutyCard = null;
        currentStep = 'SCAN_DUTY';
        updateStepDisplay();
        
        stopScanner();
    }

    // 启动扫码
    async function startScanner() {
        if (!codeReader) {
            showTopMessage('扫码库加载失败', false);
            return;
        }

        stopScanner();
        cameraError.classList.add('hidden');
        statusInfo.classList.remove('hidden');
        statusInfo.textContent = '正在启动摄像头...';

        try {
            const videoInputDevices = await codeReader.listVideoInputDevices();
            console.log('可用摄像头:', videoInputDevices);
            
            if (videoInputDevices.length === 0) {
                throw new Error('未找到摄像头');
            }

            const savedName = getDefaultCameraName();
            const savedId = getDefaultCameraId();
            
            let selectedDeviceId = null;
            let matchMethod = '';
            
            if (savedName && savedName.length > 0) {
                const nameMatch = videoInputDevices.find(d => 
                    d.label && d.label.trim() === savedName.trim()
                );
                if (nameMatch) {
                    selectedDeviceId = nameMatch.deviceId;
                    matchMethod = '名称精确匹配';
                    if (cameraDebug) cameraDebug.textContent = `✅ 名称匹配: ${savedName}`;
                }
            }
            
            if (!selectedDeviceId && savedName && savedName.length > 0) {
                const containsMatch = videoInputDevices.find(d => 
                    d.label && d.label.includes(savedName)
                );
                if (containsMatch) {
                    selectedDeviceId = containsMatch.deviceId;
                    matchMethod = '名称包含匹配';
                    if (cameraDebug) cameraDebug.textContent = `📌 名称包含: ${savedName}`;
                }
            }
            
            if (!selectedDeviceId && savedId && savedId.length > 0) {
                const idMatch = videoInputDevices.find(d => d.deviceId === savedId);
                if (idMatch) {
                    selectedDeviceId = savedId;
                    matchMethod = 'ID匹配';
                    if (cameraDebug) cameraDebug.textContent = `🔧 ID匹配: ${savedId.substring(0,8)}...`;
                }
            }
            
            if (!selectedDeviceId) {
                selectedDeviceId = videoInputDevices[0].deviceId;
                matchMethod = '默认第一个';
                if (cameraDebug) cameraDebug.textContent = `🔄 使用第一个摄像头`;
            }

            const selectedCamera = videoInputDevices.find(d => d.deviceId === selectedDeviceId);
            statusInfo.textContent = `使用摄像头: ${selectedCamera?.label || '未知'} (${matchMethod})`;
            
            if (defaultCameraInfo) {
                defaultCameraInfo.textContent = `当前默认: ${savedName || '未设置'}`;
            }

            await codeReader.decodeFromVideoDevice(selectedDeviceId, 'scanner-video', (result, err) => {
                if (result) {
                    const now = Date.now();
                    if (now - lastScanTime > SCAN_COOLDOWN) {
                        lastScanTime = now;
                        const text = result.getText();
                        console.log('扫码成功:', text);
                        handleBarcode(text);
                    }
                }
                if (err && !(err instanceof ZXing.NotFoundException)) {
                    console.warn('扫码错误:', err);
                }
            });

            videoContainer.style.display = 'block';

        } catch (err) {
            console.error('扫码启动失败:', err);
            cameraErrorDetail.textContent = err.message || '无法启动摄像头';
            cameraError.classList.remove('hidden');
            statusInfo.classList.add('hidden');
        }
    }

    function renderAllHistoryRecords() {

            return;

        let html = '';
        reversed.forEach((rec, index) => {
            const cardName = getDutyCardName(rec.card);
            html += `<div class="history-item" data-index="${index}">
                <div class="info">
                    <span>${rec.studentCode}</span>
                    <span>${cardName} (${rec.card})</span>
                    <span style="color:#64748b;">${rec.time}</span>
                </div>
                <div class="actions">
                    <button class="delete-btn" onclick="window.deleteRecord(${records.length - 1 - index})">删除</button>
                </div>
            </div>`;
        });
        historyRecords.innerHTML = html;
    }

    window.deleteRecord = function(index) {
        const records = getRecords();
        if (index >= 0 && index < records.length) {
            records.splice(index, 1);

            renderAllHistoryRecords();
            updateAllRecordsDisplay();

    async function enumerateCameras() {
        try {
            const statusEl = document.getElementById('cameraStatus');
            statusEl.textContent = '正在请求摄像头权限...';
            
            if (codeReader) {
                try {
                    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    tempStream.getTracks().forEach(track => track.stop());
                } catch (e) {
                    statusEl.textContent = '需要摄像头权限';
                }
                
                const devices = await codeReader.listVideoInputDevices();
                camerasList = devices;
                
                if (camerasList.length === 0) {
                    statusEl.textContent = '未检测到摄像头';
                    cameraSelector.innerHTML = '<option value="">无可用摄像头</option>';
                    return;
                }
                
                statusEl.textContent = `找到 ${camerasList.length} 个摄像头`;
                
                cameraSelector.innerHTML = '';
                
                const savedName = getDefaultCameraName();
                const savedId = getDefaultCameraId();
                
                let selectedIndex = -1;
                
                camerasList.forEach((cam, index) => {
                    const opt = document.createElement('option');
                    opt.value = cam.deviceId;
                    
                    let displayName = cam.label || `摄像头 ${index + 1}`;
                    let rawName = cam.label || '';
                    
                    let typeIcon = '';
                    if (rawName.toLowerCase().includes('back') || rawName.toLowerCase().includes('rear')) {
                        typeIcon = '📱 ';
                    } else if (rawName.toLowerCase().includes('front') || rawName.toLowerCase().includes('face')) {
                        typeIcon = '📱 ';
                    } else if (rawName.toLowerCase().includes('usb') || rawName.toLowerCase().includes('外接')) {
                        typeIcon = '🔌 ';
                    } else if (rawName.toLowerCase().includes('visualizer') || rawName.toLowerCase().includes('展台')) {
                        typeIcon = '🎥 ';
                    }
                    
                    opt.textContent = typeIcon + displayName;
                    opt.setAttribute('data-raw-name', rawName);
                    
                    if (savedName && savedName.length > 0 && rawName === savedName) {
                        opt.textContent += ' ⭐ 默认';
                        opt.selected = true;
                        selectedIndex = index;
                        if (cameraDebug) cameraDebug.textContent = `默认摄像头: ${savedName}`;
                    }
                    
                    cameraSelector.appendChild(opt);
                });
                
                if (selectedIndex === -1 && savedId) {
                    for (let i = 0; i < cameraSelector.options.length; i++) {
                        if (cameraSelector.options[i].value === savedId) {
                            cameraSelector.options[i].selected = true;
                            cameraSelector.options[i].textContent += ' ⭐ 默认(ID)';
                            selectedIndex = i;
                            if (cameraDebug) cameraDebug.textContent = `默认摄像头(ID): ${savedId.substring(0,8)}...`;
                            break;
                        }
                    }
                }
                
                if (selectedIndex === -1 && cameraSelector.options.length > 0) {
                    cameraSelector.options[0].selected = true;
                }
                
                if (defaultCameraInfo) {
                    if (savedName) {
                        defaultCameraInfo.textContent = `📌 默认名称: ${savedName}`;
                    } else if (savedId) {
                        defaultCameraInfo.textContent = `🔧 默认ID: ${savedId.substring(0,8)}...`;
                    } else {
                        defaultCameraInfo.textContent = `未设置默认摄像头`;
                    }
                }
            }
        } catch (e) { 
            console.warn('摄像头枚举失败', e);
            document.getElementById('cameraStatus').textContent = '无法获取摄像头列表';
        }
    }

    function getCameraPosition(label) {
        label = label.toLowerCase();
        if (label.includes('back') || label.includes('rear') || label.includes('后置')) {
            return 'back';
        } else if (label.includes('front') || label.includes('face') || label.includes('前置')) {
            return 'front';
        } else if (label.includes('usb') || label.includes('external') || label.includes('展台')) {
            return 'external';
        }
        return 'unknown';
    }

            });
        }
        
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }
        loadVoices();
    } else {
        updateVoiceUI();
    }

    loadFromLocalStorage();
    
    updateStepDisplay();
    updateAllRecordsDisplay();
    updateStorageStatus();
    updateVoiceUI();
    updateFrontFilter();
    
    setTimeout(() => {
        enumerateCameras();
    }, 1000);

    if (voiceRate && rateValue) {
        voiceRate.value = getVoiceRate();
        rateValue.textContent = getVoiceRate().toFixed(1);
    }

    window.addEventListener('beforeunload', function() {});
})();
</script>
</body>
</html>
