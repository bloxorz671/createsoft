<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更多工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1280px;
            width: 100%;
        }

        .page-title {
            font-size: 2.8rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #1a1e24;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(0,0,0,0.05);
        }

        .sub-title {
            font-size: 1.2rem;
            font-weight: 400;
            color: #5e6f8d;
            margin-bottom: 2.2rem;
            margin-top: 0.2rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }

        .tool-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 1.6rem 1.4rem 1.5rem 1.4rem;
            transition: border 0.2s, background 0.2s;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .tool-card:hover {
            border-color: #b0c4de;
            background: #fdfdfd;
        }

        .icon-area {
            width: 56px;
            height: 56px;
            margin-bottom: 1rem;
            border-radius: 16px;
            background: #f1f4f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0;
        }
        .icon-area img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 14px;
            object-fit: contain;
        }

        /* 标题行：名称 + type 标签 */
        .title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 0.25rem;
            width: 100%;
        }

        .tool-name {
            font-size: 1.5rem;
            font-weight: 520;
            line-height: 1.3;
            color: #0b1e2e;
        }

        /* 类型标签 */
        .type-badge {
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            white-space: nowrap;
            display: inline-block;
            background-color: #e2e8f0; /* 默认灰 */
            color: #1e293b;
        }

        .tool-intro {
            font-size: 0.9rem;
            color: #5e6f8d;
            line-height: 1.45;
            margin-bottom: 1.2rem;
            width: 100%;
        }

        /* 按钮组 */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-top: 0.5rem;
            width: 100%;
        }

        .tool-btn {
            display: inline-block;
            padding: 0.55rem 1.2rem;
            background: transparent;
            border: 1px solid #dde3ed;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 450;
            color: #1e2b3f;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
            cursor: pointer;
        }

        .tool-btn:hover {
            background: #eaf0f8;
            border-color: #9fb0cc;
            color: #0a1a2a;
        }

        .btn-disabled {
            opacity: 0.6;
            pointer-events: none;
            background: #f1f5f9;
            border-color: #d1d9e6;
            color: #6b7a93;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3.5rem;
            background: #f1f5f9;
            border-radius: 30px;
            color: #2d3a4f;
            font-size: 1.15rem;
            border: 1px solid #d9e2ef;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">更多工具</h1>
        <div class="sub-title">我们开发的其他小工具</div>
        <div id="toolsGrid" class="tools-grid">
            <div class="status-message">🔍 正在加载工具列表……</div>
        </div>
    </div>

    <script>
        (function() {
            const DATA_URL = 'https://luckynum.top/tools.txt';

            // 解析 type_colour[R,G,B] 格式，返回 [r,g,b] 数组
            function parseTypeColour(str) {
                const match = str.match(/type_colour\[(\d+),\s*(\d+),\s*(\d+)\]/);
                if (match) {
                    return [parseInt(match[1]), parseInt(match[2]), parseInt(match[3])];
                }
                return null;
            }

            // 计算亮度 (0-255)
            function getLuminance(r, g, b) {
                return 0.2126 * r + 0.7152 * g + 0.0722 * b;
            }

            // 根据背景色生成合适的文字颜色
            function getTextColorForBg(r, g, b) {
                const lum = getLuminance(r, g, b);
                
                // 纯白或纯黑
                if ((r === 255 && g === 255 && b === 255) || (r === 0 && g === 0 && b === 0)) {
                    return '#6b7280'; // 灰色
                }
                
                // 浅色背景 -> 深色文字
                if (lum > 180) {
                    return `rgb(${Math.max(0, r-80)}, ${Math.max(0, g-80)}, ${Math.max(0, b-80)})`;
                } 
                // 深色背景 -> 浅色文字
                else {
                    return `rgb(${Math.min(255, r+80)}, ${Math.min(255, g+80)}, ${Math.min(255, b+80)})`;
                }
            }

            function parseToolEntry(block) {
                const lines = block.split('\n').map(line => line.trim()).filter(line => line !== '');
                let tool = {
                    name: '',
                    icon: '',
                    link: '',
                    introduction: '',
                    type: '',
                    typeColour: null,
                    download: '',
                    downloadLink: ''
                };

                for (let line of lines) {
                    // 处理 type_colour[R,G,B] 特殊格式
                    if (line.includes('type_colour[')) {
                        const colourMatch = line.match(/type_colour\[(\d+,\s*\d+,\s*\d+)\]/);
                        if (colourMatch) {
                            tool.typeColour = colourMatch[1].split(',').map(Number);
                        }
                        continue;
                    }

                    const match = line.match(/^(name|icon|link|introduction|type|download|download_link)\s*=\s*(.*)$/);
                    if (match) {
                        const field = match[1];
                        const value = match[2].trim();
                        if (field === 'name') tool.name = value;
                        else if (field === 'icon') tool.icon = value;
                        else if (field === 'link') tool.link = value;
                        else if (field === 'introduction') tool.introduction = value;
                        else if (field === 'type') tool.type = value;
                        else if (field === 'download') tool.download = value;
                        else if (field === 'download_link') tool.downloadLink = value;
                    }
                }

                // 只有至少有一个有效字段才返回
                return (tool.name || tool.icon || tool.link || tool.introduction || tool.type || tool.download || tool.downloadLink) ? tool : null;
            }

            // 强制下载文件
            function downloadFile(filename) {
                // 构建完整路径（同目录）
                const baseUrl = DATA_URL.substring(0, DATA_URL.lastIndexOf('/') + 1);
                const fileUrl = baseUrl + filename;
                
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = filename; // 强制下载
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            async function loadAndRenderTools() {
                const grid = document.getElementById('toolsGrid');
                if (!grid) return;

                try {
                    const response = await fetch(DATA_URL, {
                        method: 'GET',
                        headers: { 'Cache-Control': 'no-cache' },
                        mode: 'cors'
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} — 无法获取工具数据`);
                    }

                    const text = await response.text();

                    const tripleQuoteRegex = /"""(.*?)"""/gs;
                    let matches = [];
                    let match;
                    while ((match = tripleQuoteRegex.exec(text)) !== null) {
                        if (match[1].trim().length > 0) {
                            matches.push(match[1].trim());
                        }
                    }

                    let tools = [];
                    if (matches.length === 0) {
                        console.warn('未找到三引号包裹的数据块，尝试按空行分割处理（兼容模式）');
                        const blocks = text.split(/\n\s*\n\s*\n/).filter(b => b.trim().length > 0);
                        for (let blk of blocks) {
                            const tool = parseToolEntry(blk);
                            if (tool) tools.push(tool);
                        }
                    } else {
                        for (let content of matches) {
                            const tool = parseToolEntry(content);
                            if (tool) tools.push(tool);
                        }
                    }

                    if (tools.length === 0) {
                        grid.innerHTML = `<div class="status-message">📋 暂无有效工具数据，请检查 tools.txt 格式</div>`;
                        return;
                    }

                    let cardsHtml = '';
                    for (let t of tools) {
                        const safeName = escapeHtml(t.name || '未命名工具');
                        const safeIntro = escapeHtml(t.introduction || ' ');
                        const safeIcon = t.icon ? escapeHtml(t.icon) : '';
                        
                        // 构建按钮组
                        let buttons = [];
                        
                        // link 按钮
                        if (t.link) {
                            buttons.push(`<a href="${escapeHtml(t.link)}" class="tool-btn" target="_blank" rel="noopener noreferrer">立即打开</a>`);
                        }
                        
                        // download 按钮
                        if (t.download) {
                            // 使用 onclick 触发下载，不能直接用 href
                            buttons.push(`<button class="tool-btn" onclick="downloadFile('${escapeHtml(t.download)}')">立即下载</button>`);
                        } else if (t.downloadLink) {
                            buttons.push(`<a href="${escapeHtml(t.downloadLink)}" class="tool-btn" target="_blank" rel="noopener noreferrer">立即下载</a>`);
                        }
                        
                        // 如果没有按钮
                        if (buttons.length === 0) {
                            buttons.push(`<span class="tool-btn btn-disabled">暂未开放</span>`);
                        }

                        // 处理 type 标签样式
                        let typeBadgeHtml = '';
                        if (t.type) {
                            let bgColor = '#e2e8f0';
                            let textColor = '#1e293b';
                            
                            if (t.typeColour && Array.isArray(t.typeColour) && t.typeColour.length === 3) {
                                const [r, g, b] = t.typeColour;
                                bgColor = `rgb(${r}, ${g}, ${b})`;
                                textColor = getTextColorForBg(r, g, b);
                            }
                            
                            typeBadgeHtml = `<span class="type-badge" style="background-color: ${bgColor}; color: ${textColor};">${escapeHtml(t.type)}</span>`;
                        }

                        cardsHtml += `
                            <div class="tool-card">
                                <div class="icon-area">
                                    ${safeIcon ? `<img src="${safeIcon}" alt="${safeName} icon" loading="lazy" onerror="this.style.display='none'">` : ''}
                                </div>
                                <div class="title-row">
                                    <span class="tool-name">${safeName}</span>
                                    ${typeBadgeHtml}
                                </div>
                                <div class="tool-intro">${safeIntro}</div>
                                <div class="button-group">
                                    ${buttons.join('')}
                                </div>
                            </div>
                        `;
                    }

                    grid.innerHTML = cardsHtml;

                } catch (error) {
                    console.error('加载或解析失败:', error);
                    let errorMsg = `加载失败: ${error.message}。请确保：<br>1. 地址 ${DATA_URL} 可访问且允许跨域<br>2. 文件内容严格遵循格式：每对"""包裹一个工具，包含 name= icon= link= introduction= type= type_colour[R,G,B] download= download_link=`;
                    grid.innerHTML = `<div class="status-message" style="color:#5f4b3a; background:#fef4f0;">⚠️ ${errorMsg}</div>`;
                }
            }

            function escapeHtml(unsafe) {
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // 将 downloadFile 挂载到全局，以便 onclick 调用
            window.downloadFile = function(filename) {
                const baseUrl = DATA_URL.substring(0, DATA_URL.lastIndexOf('/') + 1);
                const fileUrl = baseUrl + filename;
                
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            loadAndRenderTools();
        })();
    </script>
</body>
</html>
